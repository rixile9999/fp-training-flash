# Template project for the Gleam runner. Learner files are written to src/, exercise test files to test/.
# Dependencies are pinned to exact versions; the Docker image pre-downloads and pre-compiles them.
name = "fp_runner"
version = "1.0.0"
target = "erlang"

[dependencies]
gleam_stdlib = "== 1.0.5"
gleeunit = "== 1.11.0"
qcheck = "== 1.0.5"
