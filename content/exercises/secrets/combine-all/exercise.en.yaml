title: Combine a list of secret operations into one
tests:
  combine_all_test: Applies the functions in the list in order, from the front
  combine_all_single_test: With a single function, it behaves the same as that function
  combine_all_empty_test: An empty list becomes a function that returns its input unchanged
  repeat_test: Applies the same function the given number of times
  repeat_once_test: Repeating once applies the function once
  repeat_zero_test: Repeating 0 times returns the input unchanged
  repeat_negative_test: A negative count also returns the input unchanged
requirements:
  R1: secret_combine_all applies the functions in list order, and an empty list gives the identity function
  R2: secret_repeat applies f as many times as times says, and gives the identity function when times is 0 or less
hints:
  1: "When there are no functions at all, what does \"a function that does nothing\" look like? What do you get if you chain another function onto it?"
  2: "`list.fold` starts from an initial value and accumulates the elements one by one. The accumulator can be a function instead of a number. The existing `secret_combine` is the operation that combines two functions."
  3: "Start from `fn(x) { x }` and chain the functions in the list on one at a time with `secret_combine`. Check which should be applied first: the accumulated function or the new one. `secret_repeat` can make a list holding `times` copies of the same function and reuse what you already have."
  4: |
    ```gleam
    pub fn secret_combine_all(fns: List(fn(Int) -> Int)) -> fn(Int) -> Int {
      list.fold(fns, fn(x) { x }, fn(acc, f) { todo })
    }

    pub fn secret_repeat(f: fn(Int) -> Int, times: Int) -> fn(Int) -> Int {
      list.repeat(f, todo)
      |> secret_combine_all
    }
    ```
  5: "You can now open the full explanation. After viewing it, mastery is checked with a new exercise."
