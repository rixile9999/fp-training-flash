kind: implement
format: drill
module: secrets
title: 비밀 연산 목록을 하나로 합치기
difficulty: 1450
estimatedMinutes: 6
tests:
  - fn: combine_all_test
    name: 목록의 함수를 앞에서부터 차례로 적용한다
    visibility: public
    errorTag: reverses_order
    requirements: [R1]
  - fn: combine_all_single_test
    name: 함수가 하나면 그 함수와 같다
    visibility: public
    requirements: [R1]
  - fn: combine_all_empty_test
    name: 빈 목록은 입력을 그대로 돌려주는 함수가 된다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R1]
  - fn: repeat_test
    name: 같은 함수를 지정한 횟수만큼 적용한다
    visibility: public
    requirements: [R2]
  - fn: repeat_once_test
    name: 한 번 반복은 함수를 한 번 적용한다
    visibility: hidden
    errorTag: off_by_one
    requirements: [R2]
  - fn: repeat_zero_test
    name: 0번 반복은 입력을 그대로 돌려준다
    visibility: hidden
    errorTag: off_by_one
    requirements: [R2]
  - fn: repeat_negative_test
    name: 음수 횟수도 입력을 그대로 돌려준다
    visibility: hidden
    errorTag: infinite_recursion_on_negative
    requirements: [R2]
requirements:
  - id: R1
    description: secret_combine_all은 목록 순서대로 적용하고 빈 목록은 항등 함수다
  - id: R2
    description: secret_repeat는 times번 적용하고 0 이하이면 항등 함수다
hints:
  - level: 1
    kind: question
    text: 함수가 하나도 없을 때 "아무것도 하지 않는 함수"는 어떻게 생겼을까요? 그 함수에 다른 함수를 이어 붙이면 무엇이 될까요?
  - level: 2
    kind: concept
    text: "`list.fold`는 초기값에서 시작해 원소를 하나씩 누적합니다. 누적값이 숫자가 아니라 함수여도 됩니다. 이미 있는 `secret_combine`이 두 함수를 합치는 연산입니다."
  - level: 3
    kind: approach
    text: "`fn(x) { x }`에서 시작해 목록의 함수를 하나씩 `secret_combine`으로 이어 붙이세요. 누적 함수와 새 함수 중 어느 쪽이 먼저 적용되어야 하는지 확인하세요. `secret_repeat`는 같은 함수를 `times`개 담은 목록을 만들어 재사용할 수 있습니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn secret_combine_all(fns: List(fn(Int) -> Int)) -> fn(Int) -> Int {
        list.fold(fns, fn(x) { x }, fn(acc, f) { todo })
      }

      pub fn secret_repeat(f: fn(Int) -> Int, times: Int) -> fn(Int) -> Int {
        list.repeat(f, todo)
        |> secret_combine_all
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: fold-reversed
    mustFail: [combine_all_test]
    errorTag: reverses_order
  - key: repeat-off-by-one
    mustFail: [repeat_zero_test, repeat_negative_test]
    errorTag: off_by_one
