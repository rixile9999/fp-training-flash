title: 把秘密运算列表合成一个
tests:
  combine_all_test: 从前往后依次应用列表中的函数
  combine_all_single_test: 只有一个函数时，结果与该函数相同
  combine_all_empty_test: 空列表得到原样返回输入的函数
  repeat_test: 把同一个函数应用指定的次数
  repeat_once_test: 重复一次就应用函数一次
  repeat_zero_test: 重复 0 次时原样返回输入
  repeat_negative_test: 次数为负数时也原样返回输入
requirements:
  R1: secret_combine_all 按列表顺序应用，空列表得到恒等函数
  R2: secret_repeat 应用 times 次，times 小于等于 0 时得到恒等函数
hints:
  1: "一个函数都没有的时候，“什么都不做的函数”长什么样？在它后面接上另一个函数会得到什么？"
  2: "`list.fold` 从初始值开始逐个累积元素。累加器不一定是数字，也可以是函数。已有的 `secret_combine` 就是把两个函数合起来的运算。"
  3: "从 `fn(x) { x }` 开始，用 `secret_combine` 把列表中的函数一个个接上去。确认累积的函数和新函数哪个应该先应用。`secret_repeat` 可以生成一个装有 `times` 个同一函数的列表，复用现有的函数。"
  4: |
    ```gleam
    pub fn secret_combine_all(fns: List(fn(Int) -> Int)) -> fn(Int) -> Int {
      list.fold(fns, fn(x) { x }, fn(acc, f) { todo })
    }

    pub fn secret_repeat(f: fn(Int) -> Int, times: Int) -> fn(Int) -> Int {
      list.repeat(f, todo)
      |> secret_combine_all
    }
    ```
  5: "现在可以打开完整讲解。看完讲解后，将用一道新题确认掌握程度。"
