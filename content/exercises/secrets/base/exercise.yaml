kind: implement
format: drill
module: secrets
difficulty: 1150
estimatedMinutes: 5
tests:
  - fn: add_test
    name: 더하기 함수는 비밀 값을 더한다
    visibility: public
    requirements: [R1]
  - fn: subtract_test
    name: 빼기 함수는 입력에서 비밀 값을 뺀다
    visibility: public
    errorTag: swaps_operand_order
    requirements: [R1]
  - fn: subtract_goes_negative_test
    name: 비밀 값이 더 크면 빼기 결과는 음수다
    visibility: hidden
    errorTag: swaps_operand_order
    requirements: [R1]
  - fn: multiply_test
    name: 곱하기 함수는 비밀 값을 곱한다
    visibility: public
    requirements: [R1]
  - fn: divide_test
    name: 나누기 함수는 입력을 비밀 값으로 정수 나눗셈한다
    visibility: public
    requirements: [R1]
  - fn: divide_operand_order_test
    name: 나누기는 입력이 피제수이고 비밀 값이 제수다
    visibility: hidden
    errorTag: swaps_operand_order
    requirements: [R1]
  - fn: combine_test
    name: 두 함수를 이어 붙인 함수를 돌려준다
    visibility: public
    requirements: [R2]
  - fn: combine_order_test
    name: 첫 번째 함수를 먼저 적용하고 그 결과에 두 번째 함수를 적용한다
    visibility: hidden
    errorTag: wrong_composition_order
    requirements: [R2]
requirements:
  - id: R1
    description: 네 연산은 비밀 값을 캡처한 함수를 돌려준다
  - id: R2
    description: secret_combine은 첫 함수, 둘째 함수 순서로 적용하는 함수를 돌려준다
hints:
  - level: 1
    kind: question
    text: "`secret_add(2)`의 결과는 숫자가 아니라 함수입니다. 그 함수는 무엇을 입력으로 받고, 무엇을 기억하고 있어야 할까요?"
  - level: 2
    kind: concept
    text: "`fn(x) { ... }`로 만든 익명 함수는 바깥 함수의 인자를 본문에서 그대로 쓸 수 있습니다(클로저). 함수를 돌려주려면 이 익명 함수를 마지막 식으로 두면 됩니다."
  - level: 3
    kind: approach
    text: "빼기와 나누기는 `x`와 `secret` 중 무엇이 왼쪽에 오는지 예시로 확인하세요. `secret_combine`은 `x`를 받아 첫 번째 함수의 결과를 두 번째 함수에 넘기는 함수를 돌려주면 됩니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn secret_add(secret: Int) -> fn(Int) -> Int {
        fn(x) { todo }
      }

      pub fn secret_combine(
        secret_function1: fn(Int) -> Int,
        secret_function2: fn(Int) -> Int,
      ) -> fn(Int) -> Int {
        fn(x) { todo }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: subtract-swapped
    mustFail: [subtract_test, subtract_goes_negative_test]
    errorTag: swaps_operand_order
  - key: combine-reversed
    mustFail: [combine_order_test]
    errorTag: wrong_composition_order
