tests:
  add_test: 加法函数加上秘密值
  subtract_test: 减法函数从输入中减去秘密值
  subtract_goes_negative_test: 秘密值更大时，减法结果为负数
  multiply_test: 乘法函数乘以秘密值
  divide_test: 除法函数用秘密值对输入做整数除法
  divide_operand_order_test: 除法中输入是被除数，秘密值是除数
  combine_test: 返回把两个函数连接起来的函数
  combine_order_test: 先应用第一个函数，再对其结果应用第二个函数
requirements:
  R1: 四种运算都返回捕获了秘密值的函数
  R2: secret_combine 返回按第一个函数、第二个函数的顺序应用的函数
