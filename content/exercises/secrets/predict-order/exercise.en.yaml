title: Predict the result from the composition order
hints:
  1: "`f` and `g` are made from the same two functions. Where is the difference?"
  2: "`secret_combine(a, b)` returns a function that applies `a` to the input first and `b` to that result afterwards."
  3: "Split `f(5)` and `g(5)` each into two steps and write down the intermediate values."
  4: |
    ```text
    f(5): 5 -> add3 -> ? -> double -> ?
    g(5): 5 -> double -> ? -> add3 -> ?
    ```
  5: "You can now open the full explanation. After viewing it, mastery is checked with a new exercise."
