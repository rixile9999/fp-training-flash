kind: predict
format: drill
title: 합성 순서에 따른 결과 예측하기
difficulty: 1200
estimatedMinutes: 3
hints:
  - level: 1
    kind: question
    text: "`f`와 `g`는 같은 두 함수로 만들었습니다. 차이는 어디에 있나요?"
  - level: 2
    kind: concept
    text: "`secret_combine(a, b)`는 입력에 `a`를 먼저, 그 결과에 `b`를 나중에 적용하는 함수를 돌려줍니다."
  - level: 3
    kind: approach
    text: "`f(5)`와 `g(5)`를 각각 두 단계로 나눠 중간 값을 적어 보세요."
  - level: 4
    kind: partial_code
    text: |
      ```text
      f(5): 5 -> add3 -> ? -> double -> ?
      g(5): 5 -> double -> ? -> add3 -> ?
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
predict:
  code: |
    let add3 = secret_add(3)
    let double = secret_multiply(2)
    let f = secret_combine(add3, double)
    let g = secret_combine(double, add3)
    #(f(5), g(5))
  acceptedAnswers:
    - "#(16, 13)"
    - "#(16,13)"
