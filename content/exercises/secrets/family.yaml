rubric:
  - id: R-03
    title: 함수를 값으로 다룸
    description: 필요한 값을 캡처한 익명 함수를 돌려주고, 받은 함수를 호출만 해서 조합한다.
  - id: R-05
    title: 작은 함수를 재사용
    description: 새 연산은 이미 만든 조합 함수를 재사용해 만들고, 같은 규칙을 다시 쓰지 않는다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
