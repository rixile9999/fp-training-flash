title: Functions that build secret operations
rubric:
  R-03:
    title: Functions are treated as values
    description: Return anonymous functions that capture the values they need, and combine received functions only by calling them.
  R-05:
    title: Small functions are reused
    description: New operations are built by reusing the combining functions you already made, without rewriting the same rules.
  R-09:
    title: No let assert or panic
    description: The possibility of failure is expressed in the types.
    message: let assert or panic was used.
