tests:
  get_int_reads_number_test: get_int 把键对应的值读成整数
  get_int_missing_key_test: 键不存在时返回装着该键的 MissingKey
  get_port_reads_port_test: get_port 把 port 的值作为整数返回
  get_int_not_a_number_test: 不是整数的值应为 NotAnInt，而不是 MissingKey
  get_port_keeps_parse_error_test: get_port 原样传递 get_int 的错误
  get_port_too_large_test: 大于 65535 的端口是 OutOfRange
  get_port_zero_test: 端口 0 是 OutOfRange
  get_port_upper_bound_test: 允许端口 65535
requirements:
  R1: get_int 用不同的错误区分键不存在和值不是整数
  R2: get_port 接着 get_int 的结果检查 1..65535 的范围
