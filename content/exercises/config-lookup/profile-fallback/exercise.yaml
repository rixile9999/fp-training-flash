kind: implement
format: drill
module: config
title: 프로필 설정에서 기본 프로필로 대체하기
difficulty: 1550
estimatedMinutes: 6
tests:
  - fn: resolve_own_value_test
    name: 프로필에 있는 값을 그대로 반환한다
    visibility: public
    errorTag: wrong_precedence
    requirements: [R2]
  - fn: resolve_falls_back_to_default_test
    name: 프로필에 없는 키는 default 프로필에서 찾는다
    visibility: public
    requirements: [R2]
  - fn: unknown_profile_test
    name: 없는 프로필은 UnknownProfile이다
    visibility: public
    requirements: [R1]
  - fn: unknown_profile_does_not_fall_back_test
    name: 없는 프로필은 default에 키가 있어도 UnknownProfile이다
    visibility: hidden
    errorTag: falls_back_on_unknown_profile
    requirements: [R1]
  - fn: missing_everywhere_test
    name: 두 프로필 모두에 없는 키는 MissingKey이다
    visibility: hidden
    errorTag: wrong_error_variant
    requirements: [R2]
  - fn: works_without_default_profile_test
    name: default 프로필이 없어도 MissingKey를 반환한다
    visibility: hidden
    errorTag: wrong_error_variant
    requirements: [R2]
  - fn: resolve_int_uses_fallback_test
    name: resolve_int도 default 대체 규칙을 따른다
    visibility: hidden
    requirements: [R3]
    errorTag: duplicates_lookup_rules
  - fn: invalid_value_does_not_fall_back_test
    name: 프로필의 값이 정수가 아니면 default로 대체하지 않고 NotAnInt를 반환한다
    visibility: hidden
    errorTag: falls_back_on_invalid_value
    requirements: [R3]
requirements:
  - id: R1
    description: 프로필이 없으면 다른 검사 없이 UnknownProfile
  - id: R2
    description: 키는 프로필, default 순으로 찾고, 둘 다 없으면 MissingKey
  - id: R3
    description: resolve_int는 resolve로 찾은 값을 정수로 변환
hints:
  - level: 1
    kind: question
    text: "`prod` 프로필의 `port`가 `\"54x2\"`이고 default의 `port`가 `\"5432\"`일 때, 5432를 돌려주는 것은 친절한 걸까요, 위험한 걸까요?"
  - level: 2
    kind: concept
    text: "`result.lazy_or(r, fn() { 다른 결과 })`는 `r`이 `Error`일 때만 함수를 실행해 그 결과를 씁니다. `r`이 `Ok`이면 그대로 둡니다."
  - level: 3
    kind: approach
    text: "`resolve`는 먼저 프로필을 찾고(없으면 바로 오류), 그 안에서 키를 찾다가 없으면 default에서 찾으세요. `resolve_int`는 대체 규칙을 다시 쓰지 말고 `resolve`의 결과에 정수 변환만 이어 붙이세요."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      use settings <- result.try(
        dict.get(profiles, profile)
        |> result.replace_error(todo),
      )
      dict.get(settings, key)
      |> result.lazy_or(fn() { todo })
      |> result.replace_error(MissingKey(key))
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: default-wins
    mustFail: [resolve_own_value_test]
    errorTag: wrong_precedence
  - key: unknown-profile-as-empty
    mustFail: [unknown_profile_test, unknown_profile_does_not_fall_back_test]
    errorTag: falls_back_on_unknown_profile
  - key: fallback-after-parse
    mustFail: [invalid_value_does_not_fall_back_test]
    errorTag: falls_back_on_invalid_value
