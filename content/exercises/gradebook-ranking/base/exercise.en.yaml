  ranks_by_score_test: Assign ranks 1, 2, 3 starting from the highest score
  single_student_test: A single student is ranked 1st
  tie_broken_by_name_test: On equal scores, the name that comes first alphabetically gets the higher rank
  many_ties_test: Even with many ties, ranks continue in name order
  result_does_not_depend_on_input_order_test: The same ranking comes out regardless of input order
requirements:
