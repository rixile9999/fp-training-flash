kind: implement
format: drill
module: gradebook
difficulty: 1350
estimatedMinutes: 6
tests:
  - fn: empty_class_test
    name: 학생이 없으면 빈 목록을 반환한다
    visibility: public
  - fn: ranks_by_score_test
    name: 점수가 높은 학생부터 1, 2, 3 순위를 붙인다
    visibility: public
    errorTag: wrong_sort_direction
    requirements: [R1, R2]
  - fn: single_student_test
    name: 학생이 한 명이면 1위다
    visibility: hidden
    errorTag: off_by_one
    requirements: [R2]
  - fn: tie_broken_by_name_test
    name: 점수가 같으면 이름 가나다순으로 앞 순위를 준다
    visibility: hidden
    errorTag: ignores_tie_break
    requirements: [R3]
  - fn: many_ties_test
    name: 동점자가 여럿이어도 이름순으로 이어서 순위를 매긴다
    visibility: hidden
    errorTag: ignores_tie_break
    requirements: [R3]
  - fn: result_does_not_depend_on_input_order_test
    name: 입력 순서가 달라도 같은 순위표가 나온다
    visibility: hidden
    errorTag: ignores_tie_break
    requirements: [R1, R3]
requirements:
  - id: R1
    description: 점수 내림차순으로 정렬한다
  - id: R2
    description: 순위는 1부터 차례로 붙인다
  - id: R3
    description: 동점이면 이름 오름차순이 앞선다
hints:
  - level: 1
    kind: question
    text: 순위를 붙이기 전에 학생들이 어떤 순서로 놓여 있어야 할까요? 두 학생의 점수가 같을 때 그 순서는 무엇이 정하나요?
  - level: 2
    kind: concept
    text: "`list.sort`는 비교 함수를 받습니다. `int.compare(b, a)`처럼 인자 순서를 바꾸면 내림차순이 되고, `order.break_tie`는 첫 비교가 `Eq`일 때만 두 번째 비교를 씁니다. `list.index_map`은 0부터 시작하는 위치를 줍니다."
  - level: 3
    kind: approach
    text: 비교 함수 하나에 "점수 내림차순, 같으면 이름 오름차순"을 담아 정렬한 뒤, 위치에 1을 더해 순위로 씁니다.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      fn by_rank_order(a: Student, b: Student) -> Order {
        int.compare(b.score, a.score)
        |> order.break_tie(todo)
      }

      pub fn rank(students: List(Student)) -> List(#(Int, String)) {
        students
        |> list.sort(by_rank_order)
        |> list.index_map(fn(student, index) { todo })
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: ascending
    mustFail: [ranks_by_score_test]
    errorTag: wrong_sort_direction
  - key: zero-based
    mustFail: [ranks_by_score_test, single_student_test]
    errorTag: off_by_one
  - key: no-tiebreak
    mustFail: [tie_broken_by_name_test, many_ties_test]
    errorTag: ignores_tie_break
