title: Fix the greedy change calculator
tests:
  canonical_coins_test: Counts the fewest coins for ordinary denominations
  greedy_is_not_optimal_test: Counts the fewest coins even when picking the largest coin first uses more
  greedy_dead_end_test: Makes amounts where picking the largest coin first gets stuck
  impossible_target_test: An amount that cannot be made is ImpossibleTarget
  zero_target_test: An amount of 0 needs 0 coins
  large_target_test: An amount of 9999 is computed within the time limit
requirements:
  R1: The fewest number of coins
  R2: Error(ImpossibleTarget) if the amount cannot be made
  R3: Time proportional to amount x number of coin types
hints:
  1: "When making 6 from `[1, 3, 4]`, which coins does the current code pick? What happens if you pick 3 instead of 4 as the first coin?"
  2: "Don't commit to a single first coin; consider every coin as a candidate. The fewest coins for amount a is the smallest of 1 + (the fewest coins for a - c) over each coin c, and since the answers for small amounts are used many times, store them in a table."
  3: "Throw away the `greedy` function, start a `Dict(Int, Int)` with 0 → 0 coins, and fill it for every amount from 1 up to target. If you leave unreachable amounts out of the table, `dict.get` returns `Error(Nil)` for them."
  4: |
    ```gleam
    let table =
      int.range(from: 1, to: target + 1, with: dict.from_list([#(0, 0)]), run: fn(table, amount) {
        let candidates =
          list.filter_map(coins, fn(coin) {
            dict.get(table, amount - coin) |> result.map(fn(count) { todo })
          })
        case list.reduce(candidates, int.min) {
          Ok(best) -> todo
          Error(Nil) -> table
        }
      })
    ```
  5: "You can now open the full explanation. After viewing it, mastery is checked with a new exercise."
