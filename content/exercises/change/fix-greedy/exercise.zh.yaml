title: 修复贪心找零计算器
tests:
  canonical_coins_test: 常见面额下数出最少枚数
  greedy_is_not_optimal_test: 先选最大硬币会用得更多时，也能数出最少枚数
  greedy_dead_end_test: 先选最大硬币会卡住的金额也能凑出
  impossible_target_test: 凑不出的金额是 ImpossibleTarget
  zero_target_test: 金额为 0 时需要 0 枚硬币
  large_target_test: 金额 9999 也能在时间限制内算完
requirements:
  R1: 最少的硬币枚数
  R2: 凑不出时返回 Error(ImpossibleTarget)
  R3: 运行时间与“金额 × 硬币种类数”成正比
hints:
  1: "用 `[1, 3, 4]` 凑 6 时，现在的代码会选哪些硬币？如果第一枚选 3 而不是 4，会怎样？"
  2: "不要把第一枚硬币定死，而要把所有硬币都当作候选。金额 a 的最少枚数是对每枚硬币 c 求 1 + (a - c 的最少枚数) 后的最小值；小金额的答案会被多次用到，所以要存进表里。"
  3: "丢掉 `greedy` 函数，用 0 → 0 枚初始化一个 `Dict(Int, Int)`，从 1 到 target 依次填表。凑不出的金额不放进表里，`dict.get` 就会返回 `Error(Nil)`。"
  4: |
    ```gleam
    let table =
      int.range(from: 1, to: target + 1, with: dict.from_list([#(0, 0)]), run: fn(table, amount) {
        let candidates =
          list.filter_map(coins, fn(coin) {
            dict.get(table, amount - coin) |> result.map(fn(count) { todo })
          })
        case list.reduce(candidates, int.min) {
          Ok(best) -> todo
          Error(Nil) -> table
        }
      })
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
