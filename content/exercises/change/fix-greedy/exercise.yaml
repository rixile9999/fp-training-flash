kind: fix
format: drill
module: change
title: 탐욕법 거스름돈 계산기 고치기
difficulty: 1450
estimatedMinutes: 6
limits: { timeMs: 6000, memoryMb: 256 }
tests:
  - fn: canonical_coins_test
    name: 일반적인 액면에서는 가장 적은 개수를 센다
    visibility: public
    requirements: [R1]
  - fn: greedy_is_not_optimal_test
    name: 큰 동전부터 고르면 더 많아지는 경우에도 가장 적은 개수를 센다
    visibility: public
    errorTag: greedy_choice
    requirements: [R1]
  - fn: greedy_dead_end_test
    name: 큰 동전부터 고르면 막히는 금액도 만든다
    visibility: hidden
    errorTag: greedy_choice
    requirements: [R1]
  - fn: impossible_target_test
    name: 만들 수 없는 금액은 ImpossibleTarget이다
    visibility: hidden
    errorTag: treats_unreachable_as_zero
    requirements: [R2]
  - fn: zero_target_test
    name: 0원은 동전 0개다
    visibility: hidden
    errorTag: wrong_base_case
    requirements: [R1]
  - fn: large_target_test
    name: 9999원도 시간 제한 안에 계산한다
    visibility: hidden
    errorTag: exponential_recursion
    requirements: [R3]
requirements:
  - id: R1
    description: 가장 적은 동전 개수
  - id: R2
    description: 만들 수 없으면 Error(ImpossibleTarget)
  - id: R3
    description: 금액 x 동전 종류 수에 비례하는 시간
hints:
  - level: 1
    kind: question
    text: "`[1, 3, 4]`로 6원을 만들 때 지금 코드는 어떤 동전을 고르나요? 첫 동전으로 4 대신 3을 고르면 어떻게 되나요?"
  - level: 2
    kind: concept
    text: "첫 동전을 하나로 정하지 말고 모든 동전을 후보로 봐야 합니다. 금액 a의 최소 개수는 각 동전 c에 대한 1 + (a - c의 최소 개수) 중 가장 작은 값이고, 작은 금액의 답은 여러 번 쓰이므로 표에 저장해 둡니다."
  - level: 3
    kind: approach
    text: "`greedy` 함수를 버리고, 0원 → 0개로 시작하는 `Dict(Int, Int)`를 1원부터 target까지 차례로 채우세요. 만들 수 없는 금액은 표에 넣지 않으면 `dict.get`이 `Error(Nil)`을 돌려줍니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      let table =
        int.range(from: 1, to: target + 1, with: dict.from_list([#(0, 0)]), run: fn(table, amount) {
          let candidates =
            list.filter_map(coins, fn(coin) {
              dict.get(table, amount - coin) |> result.map(fn(count) { todo })
            })
          case list.reduce(candidates, int.min) {
            Ok(best) -> todo
            Error(Nil) -> table
          }
        })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: recursion-without-table
    mustFail: [large_target_test]
    errorTag: exponential_recursion
  - key: unreachable-as-zero
    mustFail: [greedy_dead_end_test]
    errorTag: treats_unreachable_as_zero
