rubric:
  - id: R-02
    title: 탐색 상태가 드러남
    description: 사슬의 첫 수, 지금 끝의 수, 남은 돌을 재귀 인자로 명시해 한 단계에서 무엇이 바뀌는지 보인다.
  - id: R-05
    title: 후보 만들기 분리
    description: 지금 끝에 이을 수 있는 돌(과 뒤집은 방향)을 고르는 일을 이름 있는 함수로 분리한다.
  - id: R-06
    title: 같은 돌은 하나만 소비
    description: 돌을 쓸 때 같은 모양의 다른 돌까지 지우지 않는다. 값으로 거르지 말고 위치로 하나만 뺀다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
