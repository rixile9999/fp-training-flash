kind: implement
format: drill
module: dominoes
difficulty: 1500
estimatedMinutes: 7
limits: { timeMs: 10000, memoryMb: 256 }
tests:
  - fn: singleton_double_test
    name: 양쪽 수가 같은 돌 하나는 사슬이 된다
    visibility: public
    requirements: [R2]
  - fn: three_elements_test
    name: 세 돌을 순서를 바꿔 한 바퀴로 이을 수 있다
    visibility: public
    requirements: [R1]
  - fn: cant_be_chained_test
    name: 양 끝 수가 맞지 않으면 사슬이 되지 않는다
    visibility: public
    errorTag: ignores_chain_closure
    requirements: [R2]
  - fn: empty_input_test
    name: 돌이 없으면 사슬이 된다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R3]
  - fn: singleton_that_cant_close_test
    name: 양쪽 수가 다른 돌 하나는 사슬이 되지 않는다
    visibility: hidden
    errorTag: ignores_chain_closure
    requirements: [R2]
  - fn: can_reverse_stones_test
    name: 돌을 뒤집어서 이을 수 있다
    visibility: hidden
    errorTag: ignores_stone_flip
    requirements: [R1]
  - fn: disconnected_loops_test
    name: 따로 떨어진 두 고리는 하나의 사슬이 되지 않는다
    visibility: hidden
    errorTag: ignores_chain_closure
    requirements: [R1, R2]
  - fn: needs_backtracking_test
    name: 먼저 고른 돌이 막다른 길이면 다른 돌로 다시 시도한다
    visibility: hidden
    errorTag: greedy_without_backtracking
    requirements: [R4]
requirements:
  - id: R1
    description: 모든 돌을 한 번씩 쓰고, 이웃한 돌의 맞닿은 수가 같다(돌은 뒤집을 수 있다)
  - id: R2
    description: 첫 돌의 바깥 수와 마지막 돌의 바깥 수가 같다
  - id: R3
    description: 빈 입력은 True
  - id: R4
    description: 막히면 되돌아가 다른 선택을 시도한다
hints:
  - level: 1
    kind: question
    text: 사슬은 고리이므로 어떤 돌에서 시작해도 됩니다. 첫 돌을 정했다면, 이어 붙이는 동안 어떤 정보를 들고 다녀야 할까요?
  - level: 2
    kind: concept
    text: 백트래킹은 한 번에 하나씩 선택을 늘리다가 막히면 직전 선택을 바꿉니다. `list.any`에 "이 선택으로 끝까지 갈 수 있는가"를 묻는 함수를 넘기면, 참이 나오는 순간 멈추고 거짓이면 다음 선택을 시도합니다.
  - level: 3
    kind: approach
    text: "`extend(first, end, remaining)`를 만드세요. `remaining`이 비면 `first == end`인지 봅니다. 아니면 `end`와 맞는 수를 가진 돌을 하나 골라(뒤집기 포함) 그 돌 하나만 뺀 나머지로 재귀합니다. `selections`가 \"돌 하나와 나머지\" 쌍을 모두 만들어 줍니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      fn extend(first: Int, end: Int, remaining: List(#(Int, Int))) -> Bool {
        case remaining {
          [] -> first == end
          _ ->
            next_steps(end, remaining)
            |> list.any(fn(step) {
              let #(new_end, rest) = step
              todo
            })
        }
      }

      // end에 이을 수 있는 돌마다 #(이은 뒤의 끝 수, 그 돌 하나를 뺀 나머지)
      fn next_steps(end: Int, stones: List(#(Int, Int))) -> List(#(Int, List(#(Int, Int)))) {
        todo
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: greedy-first-match
    mustFail: [needs_backtracking_test]
    errorTag: greedy_without_backtracking
  - key: no-flip
    mustFail: [can_reverse_stones_test]
    errorTag: ignores_stone_flip
  - key: no-closure-check
    mustFail: [singleton_that_cant_close_test]
    errorTag: ignores_chain_closure
