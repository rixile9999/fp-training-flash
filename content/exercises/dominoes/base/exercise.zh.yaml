  2: "回溯每次多做一个选择，走不通时就改掉上一个选择。给 `list.any` 传入一个询问“这个选择能否走到底”的函数，它会在得到真值时立刻停下，否则尝试下一个选择。"
  3: "编写 `extend(first, end, remaining)`。当 `remaining` 为空时，检查 `first == end`。否则挑一块含有与 `end` 相同数字的骨牌（包括翻转的情况），用只去掉这一块后的剩余骨牌递归。`selections` 会生成所有“一块骨牌与其余骨牌”的组合。"
  4: |
