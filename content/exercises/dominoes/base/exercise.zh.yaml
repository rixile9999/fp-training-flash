tests:
  singleton_double_test: 两侧数字相同的单块骨牌能构成链
  three_elements_test: 三块骨牌调换顺序后能连成一个环
  cant_be_chained_test: 两端数字对不上时不能构成链
  empty_input_test: 没有骨牌时算作能构成链
  singleton_that_cant_close_test: 两侧数字不同的单块骨牌不能构成链
  can_reverse_stones_test: 可以把骨牌翻转后再连接
  disconnected_loops_test: 两个分开的环不能构成一条链
  needs_backtracking_test: 先选的骨牌走进死胡同时，换另一块骨牌重新尝试
requirements:
  R1: 每块骨牌恰好用一次，相邻骨牌相接的数字相同（骨牌可以翻转）
  R2: 第一块骨牌的外侧数字与最后一块骨牌的外侧数字相同
  R3: 空输入为 True
  R4: 走不通时回退，尝试其他选择
hints:
