kind: implement
format: drill
module: role_playing_game
title: 롤플레잉 게임의 주문 시전
difficulty: 1350
estimatedMinutes: 6
tests:
  - fn: successful_cast_test
    name: 마나가 충분하면 마나를 비용만큼 쓰고 비용의 두 배 피해를 준다
    visibility: public
    requirements: [R1]
  - fn: insufficient_mana_test
    name: 마나가 부족하면 플레이어는 그대로이고 피해는 0이다
    visibility: public
    requirements: [R2]
  - fn: no_mana_pool_costs_health_test
    name: 마나가 None이면 체력이 비용만큼 줄고 피해는 0이다
    visibility: public
    requirements: [R3]
  - fn: exact_mana_test
    name: 남은 마나가 비용과 같으면 주문이 성공하고 마나가 0이 된다
    visibility: hidden
    errorTag: off_by_one
    requirements: [R1]
  - fn: health_not_below_zero_test
    name: 마나 없이 시전해도 체력은 0 아래로 내려가지 않는다
    visibility: hidden
    errorTag: missing_clamp
    requirements: [R3]
  - fn: zero_mana_is_not_no_pool_test
    name: 마나가 Some(0)이면 마나 부족으로 보고 체력을 깎지 않는다
    visibility: hidden
    errorTag: confuses_none_with_zero
    requirements: [R2]
requirements:
  - id: R1
    description: 마나가 충분하면 마나 차감과 피해 발생
  - id: R2
    description: 마나가 부족하면 변화 없음
  - id: R3
    description: 마나가 없으면 체력 차감(0 이상 유지)
hints:
  - level: 1
    kind: question
    text: "마나가 `Some(0)`인 플레이어와 마나가 `None`인 플레이어는 같은 상황인가요? 규칙에서 둘은 어떻게 다르게 취급되나요?"
  - level: 2
    kind: concept
    text: "`case`에서 `Some(mana) if mana >= cost`처럼 패턴과 가드를 함께 쓰면 `Option` 안의 값을 꺼내면서 조건도 검사할 수 있습니다. `int.max(0, x)`는 음수를 0으로 올립니다."
  - level: 3
    kind: approach
    text: "`player.mana`로 `case`를 만들고 세 가지로 나누세요. 마나가 충분한 `Some`, 마나가 부족한 `Some`, 그리고 `None`. 각 가지에서 `#(새 플레이어, 피해)` 튜플을 만듭니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn cast_spell(player: Player, cost: Int) -> #(Player, Int) {
        case player.mana {
          Some(mana) if mana >= cost -> todo
          Some(_) -> #(player, 0)
          None -> todo
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: greater-than
    mustFail: [exact_mana_test]
    errorTag: off_by_one
  - key: no-clamp
    mustFail: [health_not_below_zero_test]
    errorTag: missing_clamp
  - key: zero-as-none
    mustFail: [zero_mana_is_not_no_pool_test]
    errorTag: confuses_none_with_zero
