title: 预测列表模式的结果
hints:
  1: "`case` 从上往下检查模式。四个元素的列表最先匹配哪个模式？"
  2: "`[_, \"Gleam\"]` 只匹配长度为 2 的列表，`[_, \"Gleam\", _]` 只匹配长度为 3 的列表。没有 `..` 时，长度是固定的。"
  3: "把四个输入列表逐个从最上面的模式开始对照，并记住 `list.map` 会原样保持顺序。"
  4: |
    ```gleam
    // ["Lua", "Gleam", "Go", "Elm"] 长度为 4，所以既不匹配 [_, "Gleam"]，也不匹配 [_, "Gleam", _]
    // [first, ..rest]：first = "Lua"，rest = ["Gleam", "Go", "Elm"]
    ["Lua 외 ?", todo, todo, todo]
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
