tests:
  percent_off_test: "percent_off(10) takes 10% off the price"
  percent_off_rounds_down_test: "The result of a percentage discount is rounded down"
  amount_off_test: "amount_off(1000) subtracts 1000 from the price"
  amount_off_never_negative_test: "The result of a fixed-amount discount never goes below 0"
  apply_rules_in_order_test: "Rules are applied in list order"
  apply_rules_order_matters_test: "Changing the order of the rules changes the result"
  apply_rules_empty_test: "With no rules, the price stays the same"
requirements:
  R1: "percent_off builds and returns a percentage discount function"
  R2: "amount_off returns a fixed-amount discount function that never goes below 0"
  R3: "apply_rules applies each rule to the result of the previous one"
hints:
