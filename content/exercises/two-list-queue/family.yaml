# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 리스트 두 개로 만드는 큐
primarySkill: functional-data-structures
secondarySkills: [recursive-algorithms]
contextTags: []
source:
  kind: original
conceptNotes: [gleam-custom-types, gleam-case-patterns, gleam-option-result]
theoryTopics: [amortized-analysis, persistent-data-structures, cost-model-immutable-structures]
rubric:
  - id: R-02
    title: 불변식이 코드에 드러남
    description: front와 back이 각각 무엇을 담는지(꺼낼 순서, 넣은 역순)가 함수마다 일관되게 지켜진다.
  - id: R-06
    title: 뒤집기는 필요할 때 한 번만
    description: back을 뒤집는 일은 front가 비었을 때 한 번만 한다. push나 pop마다 전체를 복사하지 않는다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "list\\.append\\([^)]*,\\s*\\[[^\\]]*\\]\\s*\\)"
      message: 한 원소짜리 리스트를 list.append로 뒤에 붙이면 매번 전체를 복사합니다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
