kind: implement
format: drill
module: digits
title: 자릿수 목록을 정수로 바꾸기
difficulty: 1200
estimatedMinutes: 4
tests:
  - fn: binary_digits_test
    name: 2진수 [1, 0, 1]은 5가 된다
    visibility: public
    requirements: [R1]
  - fn: decimal_digits_test
    name: 10진수 [4, 2]는 42가 된다
    visibility: public
    requirements: [R1]
  - fn: digit_equal_to_base_test
    name: 진법과 같은 자릿수는 InvalidDigit로 알린다
    visibility: public
    requirements: [R2]
  - fn: empty_digits_is_zero_test
    name: 빈 자릿수 목록은 0이다
    visibility: hidden
    errorTag: rejects_empty_input
    requirements: [R1]
  - fn: negative_digit_test
    name: 음수 자릿수는 InvalidDigit로 알린다
    visibility: hidden
    errorTag: missing_range_check
    requirements: [R2]
  - fn: first_invalid_digit_test
    name: 잘못된 자릿수가 여럿이면 가장 앞의 것을 알린다
    visibility: hidden
    errorTag: reports_last_error
    requirements: [R3]
  - fn: base_below_two_test
    name: 진법이 2보다 작으면 자릿수보다 먼저 InvalidBase를 알린다
    visibility: hidden
    errorTag: wrong_check_order
    requirements: [R4]
requirements:
  - id: R1
    description: 높은 자리부터 누적해 정수를 만든다
  - id: R2
    description: 0 이상 base 미만이 아닌 자릿수는 InvalidDigit
  - id: R3
    description: 첫 번째 오류에서 멈춘다
  - id: R4
    description: 진법 검사가 자릿수 검사보다 먼저
hints:
  - level: 1
    kind: question
    text: "[4, 2]를 왼쪽부터 읽을 때, 4까지 읽은 값에서 2를 읽은 뒤의 값은 어떻게 구할 수 있을까요?"
  - level: 2
    kind: concept
    text: "`list.try_fold(list, 초깃값, fn(누적, 원소) -> Result(누적, e))`는 함수가 `Error`를 돌려주면 즉시 멈추고 그 `Error`를 결과로 냅니다."
  - level: 3
    kind: approach
    text: 진법을 먼저 검사하고, 통과하면 자릿수마다 범위를 확인하면서 `누적 * base + 자릿수`로 값을 키우세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      case base < 2 {
        True -> Error(InvalidBase(base))
        False ->
          list.try_fold(digits, 0, fn(total, digit) {
            case todo {
              True -> Ok(todo)
              False -> Error(todo)
            }
          })
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: keeps-last-error
    mustFail: [first_invalid_digit_test]
    errorTag: reports_last_error
  - key: upper-bound-only
    mustFail: [negative_digit_test]
    errorTag: missing_range_check
