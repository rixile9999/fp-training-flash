kind: implement
format: drill
module: zipper
difficulty: 1500
estimatedMinutes: 7
limits: { timeMs: 10000, memoryMb: 256 }
tests:
  - fn: data_is_retained_test
    name: 지퍼로 만들었다가 되돌리면 원래 트리다
    visibility: public
    requirements: [R3]
  - fn: left_right_and_value_test
    name: 왼쪽, 오른쪽으로 내려가 초점의 값을 읽는다
    visibility: public
    requirements: [R1]
  - fn: dead_end_test
    name: 빈 자리(Leaf)에서는 더 내려갈 수 없다
    visibility: public
    errorTag: moves_past_leaf
    requirements: [R1]
  - fn: up_from_root_test
    name: 루트에서 up하면 Error(Nil)을 돌려준다
    visibility: hidden
    errorTag: moves_past_root
    requirements: [R2]
  - fn: tree_from_deep_focus_test
    name: 깊은 초점에서도 전체 트리를 복원한다
    visibility: hidden
    errorTag: returns_subtree_only
    requirements: [R3]
  - fn: left_right_and_up_test
    name: 내려갔다 올라오기를 반복해도 같은 자리로 돌아온다
    visibility: hidden
    errorTag: swaps_siblings_on_up
    requirements: [R1, R2]
  - fn: descend_and_return_test
    name: 두 단계 내려갔다가 두 번 올라오면 루트다
    visibility: hidden
    errorTag: swaps_siblings_on_up
    requirements: [R2]
  - fn: different_paths_to_same_zipper_test
    name: 다른 경로로 같은 자리에 오면 같은 지퍼다
    visibility: hidden
    errorTag: swaps_siblings_on_up
    requirements: [R2]
requirements:
  - id: R1
    description: left, right는 초점을 자식으로 옮기고 경로를 기록한다. Leaf에서는 Error(Nil)
  - id: R2
    description: up은 기록한 경로로 부모 노드를 다시 만든다. 루트에서는 Error(Nil)
  - id: R3
    description: to_tree는 어느 초점에서든 전체 트리를 돌려준다
hints:
  - level: 1
    kind: question
    text: 부모에서 왼쪽 자식으로 내려간 뒤 다시 부모 노드를 만들려면, 왼쪽 자식 말고 무엇 무엇을 알고 있어야 하나요?
  - level: 2
    kind: concept
    text: 지퍼는 "초점이 가리키는 부분 트리"와 "루트에서 초점까지의 경로"를 함께 들고 다닙니다. 경로의 각 단계(crumb)는 방향, 부모의 값, 내려가지 않은 쪽 자식을 담습니다. 가까운 부모가 맨 앞에 오는 리스트로 쌓으면 내려가기와 올라가기가 모두 O(1)입니다.
  - level: 3
    kind: approach
    text: "`left`는 초점이 `Node(v, l, r)`이면 초점을 `l`로 바꾸고 `WentLeft(v, r)`을 경로 앞에 붙입니다. `up`은 경로의 첫 crumb을 꺼내 방향에 맞게 `Node`를 다시 만듭니다. `to_tree`는 `up`이 `Error`가 될 때까지 반복합니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn up(zipper: Zipper(a)) -> Result(Zipper(a), Nil) {
        case zipper.crumbs {
          [] -> Error(Nil)
          [WentLeft(value, right), ..crumbs] ->
            Ok(Zipper(focus: todo, crumbs: crumbs))
          [WentRight(value, left), ..crumbs] -> todo
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: up-swaps-children
    mustFail: [left_right_and_up_test, different_paths_to_same_zipper_test]
    errorTag: swaps_siblings_on_up
  - key: to-tree-focus-only
    mustFail: [tree_from_deep_focus_test]
    errorTag: returns_subtree_only
  - key: right-records-left
    mustFail: [left_right_and_up_test]
    errorTag: wrong_crumb_direction
