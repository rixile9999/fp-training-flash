title: 按评价数统计评价标签
tests:
  tags_of_single_review_test: 把一条评价的标签按逗号拆分，按原来的顺序返回
  counts_across_reviews_test: 对每个标签，统计带有该标签的评价数
  normalizes_spaces_and_case_test: 整理标签首尾的空格和大小写后再计数
  duplicate_tag_in_one_review_counts_once_test: 一条评价中即使同一标签出现多次，也只计为 1
  duplicates_after_normalizing_count_once_test: 整理后变得相同的标签也视为重复
  skips_blank_tags_test: 空标签和空评价不计数
  no_reviews_test: 没有评价时得到空 dict
requirements:
  R1: 标签去掉首尾空白并转成小写后，如果为空则排除
  R2: 一条评价内的重复标签只算一次
  R3: 每个标签对应带有该标签的评价数
hints:
