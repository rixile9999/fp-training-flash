title: Tally review tags by number of reviews
tests:
  tags_of_single_review_test: Splits one review's tags on commas and returns them in their original order
  counts_across_reviews_test: For each tag, counts the number of reviews that have it
  normalizes_spaces_and_case_test: Cleans up leading and trailing spaces and case of tags before counting
  duplicate_tag_in_one_review_counts_once_test: Even if a review has the same tag several times, it counts as 1
  duplicates_after_normalizing_count_once_test: Tags that become the same after cleanup are also treated as duplicates
  skips_blank_tags_test: Empty tags and empty reviews are not counted
  no_reviews_test: With no reviews, the result is an empty dict
requirements:
  R1: Tags are trimmed and lowercased, and left out if they are then empty
  R2: Duplicate tags within one review count only once
  R3: For each tag, the number of reviews that have it
hints:
  1: "In the single review `\"Fast, fast\"`, how many times should `fast` be counted? What do you need to do first before deciding whether something is a duplicate?"
  2: "`list.unique` removes duplicates while keeping the order in which elements first appear. `list.flat_map` makes a list for each element and joins those lists into one."
  3: "Build `tags_of`, which handles one review, as a pipeline in the order split, clean up, filter out empty tags, remove duplicates. Then have `count_tags` join the tags of all reviews and count them into a dict."
  4: |
    ```gleam
    pub fn tags_of(review: String) -> List(String) {
      review
      |> string.split(",")
      |> list.map(todo)
      |> list.filter(todo)
      |> list.unique
    }

    pub fn count_tags(reviews: List(String)) -> Dict(String, Int) {
      reviews
      |> list.flat_map(tags_of)
      |> list.fold(dict.new(), todo)
    }
    ```
  5: "You can now open the full explanation. After viewing it, mastery is checked with a new exercise."
