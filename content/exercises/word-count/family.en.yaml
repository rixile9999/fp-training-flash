title: Count words
rubric:
  R-02:
    title: The pipeline shows the intent
    description: Normalizing, splitting, filtering and counting each show up as one step, and the reading order matches the processing order.
  R-05:
    title: Calculation logic is separated
    description: Rules about a single element, such as cleaning up a word or incrementing a count, are split into small named functions.
  R-09:
    title: No let assert or panic
    description: The possibility of failure is expressed in the types.
    message: let assert or panic was used.
