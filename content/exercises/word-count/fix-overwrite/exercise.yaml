kind: fix
format: drill
module: word_tally
title: 단어 횟수가 늘지 않는 버그 고치기
difficulty: 1150
estimatedMinutes: 4
limits: { timeMs: 10000, memoryMb: 256 }
tests:
  - fn: counts_repeated_word_test
    name: 같은 단어가 세 번 나오면 3으로 센다
    visibility: public
    errorTag: overwrites_existing_key
    requirements: [R1]
  - fn: increment_adds_one_to_existing_test
    name: 이미 있는 단어의 횟수에 1을 더한다
    visibility: public
    errorTag: overwrites_existing_key
    requirements: [R1]
  - fn: increment_new_word_starts_at_one_test
    name: 처음 나온 단어는 1부터 시작하고 다른 단어는 그대로 둔다
    visibility: public
    errorTag: off_by_one
    requirements: [R2]
  - fn: case_insensitive_counts_add_up_test
    name: 대소문자만 다른 단어의 횟수도 합쳐진다
    visibility: hidden
    errorTag: overwrites_existing_key
    requirements: [R1]
  - fn: each_word_once_test
    name: 모든 단어가 한 번씩이면 모두 1이다
    visibility: hidden
    errorTag: resets_accumulator
    requirements: [R2]
  - fn: empty_input_test
    name: 빈 문자열이면 빈 dict다
    visibility: hidden
    errorTag: counts_empty_words
requirements:
  - id: R1
    description: 이미 센 단어는 기존 횟수에 1을 더함
  - id: R2
    description: 새 단어는 1로 추가하고 다른 항목은 유지
hints:
  - level: 1
    kind: question
    text: "`increment`가 이미 `#(\"go\", 2)`가 들어 있는 dict에서 \"go\"를 받으면 지금은 무엇을 돌려주나요?"
  - level: 2
    kind: concept
    text: "`dict.insert`는 키가 있으면 값을 덮어씁니다. 기존 값을 보고 새 값을 정하려면 `dict.upsert`나 `dict.get`이 필요합니다."
  - level: 3
    kind: approach
    text: "`dict.upsert(counts, word, fn(previous) { ... })`에서 `previous`가 `Some(n)`이면 `n + 1`, `None`이면 처음 나온 단어입니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      dict.upsert(counts, word, fn(previous) {
        case previous {
          Some(count) -> todo
          None -> todo
        }
      })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: starts-at-zero
    mustFail: [counts_repeated_word_test, increment_new_word_starts_at_one_test]
    errorTag: off_by_one
  - key: fresh-dict-each-step
    mustFail: [increment_new_word_starts_at_one_test, each_word_once_test]
    errorTag: resets_accumulator
