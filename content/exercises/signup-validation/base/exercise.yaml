kind: implement
format: drill
module: signup
title: 회원가입 폼을 첫 오류에서 멈추며 검증하기
difficulty: 1200
estimatedMinutes: 4
tests:
  - fn: valid_form_test
    name: 모든 검사를 통과하면 비밀번호를 뺀 NewUser를 반환한다
    visibility: public
    requirements: [R1]
  - fn: short_username_test
    name: 아이디가 짧으면 UsernameTooShort를 반환한다
    visibility: public
    requirements: [R2]
  - fn: invalid_email_test
    name: 이메일에 @가 없으면 InvalidEmail을 반환한다
    visibility: hidden
    errorTag: skips_validation_step
    requirements: [R2]
  - fn: short_password_test
    name: 비밀번호가 짧으면 PasswordTooShort를 반환한다
    visibility: hidden
    errorTag: skips_validation_step
    requirements: [R2]
  - fn: underage_test
    name: 만 14세 미만이면 Underage를 반환한다
    visibility: hidden
    errorTag: skips_validation_step
    requirements: [R2]
  - fn: first_error_in_field_order_test
    name: 여러 필드가 틀리면 아이디, 이메일, 비밀번호, 나이 순으로 첫 오류만 반환한다
    visibility: hidden
    errorTag: wrong_check_order
    requirements: [R3]
requirements:
  - id: R1
    description: 검사를 통과한 값으로 NewUser를 만든다
  - id: R2
    description: 네 가지 검사를 모두 적용
  - id: R3
    description: 필드 순서대로 검사하고 첫 오류에서 멈춘다
hints:
  - level: 1
    kind: question
    text: 네 개의 검사 함수는 각각 무엇을 돌려주나요? 성공했을 때 돌려주는 값은 `NewUser`를 만드는 데 어떻게 쓰일 수 있을까요?
  - level: 2
    kind: concept
    text: "`use x <- result.try(r)`는 `r`이 `Ok(x)`이면 다음 줄로 진행하고, `Error(e)`이면 거기서 함수 전체를 `Error(e)`로 끝냅니다. 값이 필요 없으면 `use _ <- ...`로 받습니다."
  - level: 3
    kind: approach
    text: 아이디, 이메일, 비밀번호, 나이 순서로 `use`를 네 줄 쓰고, 마지막 줄에서 꺼낸 값들로 `Ok(NewUser(...))`를 만드세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn validate(form: SignupForm) -> Result(NewUser, SignupError) {
        use username <- result.try(check_username(form.username))
        use email <- result.try(todo)
        use _ <- result.try(todo)
        use age <- result.try(todo)
        todo
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: skips-password
    mustFail: [short_password_test]
    errorTag: skips_validation_step
  - key: age-first
    mustFail: [first_error_in_field_order_test]
    errorTag: wrong_check_order
  - key: password-before-email
    mustFail: [first_error_in_field_order_test]
    errorTag: wrong_check_order
