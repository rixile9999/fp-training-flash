# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 회원가입 폼 검증하기
primarySkill: explicit-failure
secondarySkills: [function-decomposition]
contextTags: [signup, validation]
source:
  kind: original
conceptNotes: [gleam-use-expressions, gleam-option-result, gleam-custom-types]
theoryTopics: [errors-as-values, chaining-results-monads, algebraic-data-types]
rubric:
  - id: R-05
    title: 검증 규칙 재사용
    description: 이미 있는 check_ 함수를 조합하고, 규칙을 다시 구현하지 않는다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
  - id: R-12
    title: 첫 오류와 모든 오류를 목적에 맞게 선택
    description: 뒤 단계가 앞 단계 결과에 의존하면 첫 오류에서 멈추고, 서로 독립인 검사를 사용자에게 한꺼번에 보여 줄 때는 모든 오류를 모은다.
