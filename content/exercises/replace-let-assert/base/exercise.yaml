kind: fix
format: drill
module: setting
title: 설정 한 줄 파서의 let assert 없애기
difficulty: 1150
estimatedMinutes: 4
tests:
  - fn: parses_valid_setting_test
    name: 올바른 줄은 지금처럼 Setting으로 바꾼다
    visibility: public
    requirements: [R1]
  - fn: missing_equals_is_error_test
    name: "=가 없으면 크래시 대신 MissingEquals에 줄 전체를 담는다"
    visibility: public
    errorTag: crashes_on_invalid_input
    requirements: [R2]
  - fn: not_a_number_is_error_test
    name: 값이 정수가 아니면 크래시 대신 NotANumber에 값을 담는다
    visibility: public
    errorTag: crashes_on_invalid_input
    requirements: [R2]
  - fn: negative_number_is_valid_test
    name: 음수 값도 올바른 값이다
    visibility: hidden
    errorTag: rejects_valid_input
    requirements: [R1]
  - fn: empty_value_is_not_a_number_test
    name: 값이 비어 있으면 NotANumber("")이다
    visibility: hidden
    errorTag: swallows_error_with_default
    requirements: [R2]
  - fn: splits_at_first_equals_test
    name: 첫 번째 = 에서만 나누고 나머지는 값으로 본다
    visibility: hidden
    errorTag: wrong_error_variant
    requirements: [R2]
requirements:
  - id: R1
    description: 올바른 입력의 결과는 그대로 유지
  - id: R2
    description: 잘못된 입력은 크래시하지 않고 SettingError 값으로 반환
hints:
  - level: 1
    kind: question
    text: "`parse_setting(\"retries 3\")`을 호출하면 지금 코드는 어떻게 되나요? 반환 타입은 호출하는 쪽에 무엇을 약속하고 있나요?"
  - level: 2
    kind: concept
    text: "`let assert Ok(x) = r`은 `r`이 `Error`이면 프로그램을 멈춥니다. 같은 자리에 `use x <- result.try(r)`를 쓰면 `Error`를 함수의 반환값으로 돌려줍니다. 다만 `r`의 오류 타입이 `SettingError`여야 합니다."
  - level: 3
    kind: approach
    text: "`let assert` 두 줄을 각각 `use ... <- result.try(...)`로 바꾸세요. `string.split_once`와 `int.parse`의 `Error(Nil)`은 `result.replace_error`로 알맞은 `SettingError`로 바꾼 뒤 넘기세요."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      use #(key, value) <- result.try(
        string.split_once(line, "=") |> result.replace_error(todo),
      )
      use number <- result.try(todo)
      Ok(Setting(key, number))
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: unwrap-zero
    mustFail: [not_a_number_is_error_test, empty_value_is_not_a_number_test]
    errorTag: swallows_error_with_default
  - key: line-in-payload
    mustFail: [not_a_number_is_error_test]
    errorTag: wrong_error_payload
  - key: split-all
    mustFail: [splits_at_first_equals_test]
    errorTag: wrong_error_variant
