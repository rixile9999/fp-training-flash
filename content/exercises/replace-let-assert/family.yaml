# Family-level defaults; each variant's exercise.yaml may override any of these.
title: let assert로 죽는 코드를 Result로 바꾸기
primarySkill: explicit-failure
secondarySkills: []
contextTags: [config]
source:
  kind: original
conceptNotes: [gleam-let-assert-panic, gleam-option-result, gleam-use-expressions, gleam-custom-types]
theoryTopics: [total-vs-partial-functions, errors-as-values, chaining-results-monads]
rubric:
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
  - id: R-07
    title: 오류를 삼키지 않음
    description: 크래시를 없애려고 기본값으로 바꾸거나 입력을 버리지 않는다. 무엇이 잘못됐는지 오류 값으로 돌려준다.
  - id: R-11
    title: 중첩 case 대신 use로 연결
    description: 여러 단계의 Result를 use와 result.try로 이어 쓰면 성공 경로가 위에서 아래로 읽힌다.
