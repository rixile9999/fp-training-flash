# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 목록 연산 직접 만들기
primarySkill: recursive-algorithms
secondarySkills: [data-transformation]
contextTags: []
source:
  kind: exercism
  license: "MIT, Copyright (c) 2021 Exercism"
  url: https://github.com/exercism/gleam/tree/main/exercises/practice/list-ops
  upstream: "exercism/gleam exercises/practice/list-ops@34db02e"
conceptNotes: [gleam-recursion, gleam-list-transform, gleam-anonymous-functions]
theoryTopics: [structural-recursion-induction, accumulators-and-tail-recursion, fold-universality, cost-model-immutable-structures]
rubric:
  - id: R-04
    title: 표준 목록 모듈 없이 직접 구현
    description: 이 문제의 목적은 목록 연산을 재귀로 직접 만드는 것이다. `gleam/list`를 가져오지 않는다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "import\\s+gleam/list\\b"
      message: gleam/list를 가져왔습니다. 목록 연산을 재귀로 직접 구현하세요.
  - id: R-06
    title: 누적자를 쓰면 마지막에 한 번 뒤집음
    description: 누적자 앞에 쌓으면 순서가 거꾸로 된다. 반복마다 뒤에 이어 붙이지 말고, 끝에서 한 번만 뒤집는다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
