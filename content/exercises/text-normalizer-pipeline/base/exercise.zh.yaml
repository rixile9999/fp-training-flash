tests:
  strip_punctuation_test: 删除句号、逗号、感叹号和问号
  collapse_spaces_test: 把连续的空格缩减为一个空格
  collapse_spaces_edges_test: 不保留首尾空格
  normalize_test: 同时应用空格整理、转小写和删除标点
  normalize_punctuation_between_spaces_test: 删除空格之间的标点后，空格仍然只有一个
  normalize_trims_tabs_newlines_test: 首尾的制表符和换行符也会去掉
requirements:
  R1: strip_punctuation 只删除四种标点
  R2: collapse_spaces 不留空片段，用一个空格连接
  R3: normalize 按规定顺序组合步骤函数
