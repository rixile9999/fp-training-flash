title: 用商品名生成 URL slug
tests:
  clean_word_test: 把单词转为小写，只保留英文字母和数字
  to_words_test: 把句子变成整理好的单词列表
  to_words_drops_symbol_only_test: 只有符号的单词在整理后会从列表中去掉
  to_words_multiple_spaces_test: 连续空格和首尾空格不会产生空词
  slugify_test: 用连字符连接单词
  short_slug_test: 只从前面取指定数量的单词
  short_slug_skips_symbol_words_test: 只有符号的单词不计入单词数
requirements:
  R1: clean_word 只整理一个单词
  R2: to_words 复用 clean_word 并丢掉空词
  R3: slugify 复用 to_words
  R4: short_slug 从 to_words 的结果中选取单词
hints:
  1: "`\"tea - cup\"` 中的 `\"-\"` 整理之后会变成什么？丢掉空词这件事应该在整理之前还是之后做？"
  2: "在管道中，过滤（`list.filter`）的位置一变，结果就会不同。一个值是否“为空”，只有在产生这个值的步骤结束之后才能知道。"
  3: "先完成 `clean_word`。`to_words` 的顺序是：拆分 → 对每个单词应用 `clean_word` → 丢掉空词。`slugify` 和 `short_slug` 只需使用 `to_words` 的结果。"
  4: |
    ```gleam
    pub fn to_words(text: String) -> List(String) {
      text
      |> string.split(" ")
      |> todo
      |> list.filter(fn(word) { word != "" })
    }

    pub fn short_slug(text: String, max_words: Int) -> String {
      text
      |> to_words
      |> todo
      |> string.join("-")
    }
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
