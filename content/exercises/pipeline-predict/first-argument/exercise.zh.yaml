title: 根据“管道值进入第一个参数”的规则预测结果
hints:
  1: "在 `10 |> int.subtract(3)` 中，10 会放到 `int.subtract` 的第几个参数位置？"
  2: "`a |> f(b)` 等同于 `f(a, b)`。管道左边的值会成为右边函数调用的**第一个**参数。`int.subtract(a, b)` 就是 `a - b`。"
  3: "把所有管道都改写成普通的函数调用，然后从最里层的调用开始计算。"
  4: |
    ```gleam
    int.multiply(int.subtract(10, 3), 2)
    // int.subtract(10, 3) = todo
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
