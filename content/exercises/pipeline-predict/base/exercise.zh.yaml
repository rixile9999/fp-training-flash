title: 预测 filter、map、fold 管道的结果
hints:
  1: "在管道中，值从上到下一步一步地流动。第一步结束后，列表是什么样子？"
  2: "`list.filter` 只保留条件为 `True` 的元素，`list.map` 转换所有元素，`list.fold` 把列表折叠成一个值。"
  3: "把每一步的结果在纸上一行一行写下来。写下中间值之后，下一步只需关注这个值。"
  4: |
    ```gleam
    [1, 2, 3, 4, 5]
    |> list.filter(...)  // [1, 3, 5]
    |> list.map(...)     // todo
    |> list.fold(...)    // todo
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
