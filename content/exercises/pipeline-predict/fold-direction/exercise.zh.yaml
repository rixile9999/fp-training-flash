title: 预测能看出累积方向的 fold 结果
hints:
  1: "在 `list.fold` 的函数里，新元素 `s` 是加在累加器 `acc` 的前面还是后面？"
  2: "`list.index_map` 的索引从 0 开始。`list.fold` 从前往后遍历列表，函数返回的值会成为下一个累加器。"
  3: "先写出 `index_map` 得到的列表，再用表格写出 fold 的累加器在每个元素处如何变化。"
  4: |
    ```gleam
    ["a", "b", "c"]
    |> list.index_map(...)  // ["a", "bb", "ccc"]
    |> list.fold("", ...)
    // acc: "" -> "a" -> todo -> todo
    ```
