# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 주문 한 줄을 레코드로 파싱하기
primarySkill: explicit-failure
secondarySkills: [function-decomposition]
contextTags: [orders, parsing]
source:
  kind: original
conceptNotes: [gleam-use-expressions, gleam-option-result, gleam-custom-types, gleam-strings]
theoryTopics: [errors-as-values, chaining-results-monads, algebraic-data-types]
rubric:
  - id: R-05
    title: 필드별 파싱 함수 분리
    description: 필드 하나를 해석하는 작은 함수를 따로 두면 각 규칙과 오류를 따로 확인할 수 있다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
  - id: R-11
    title: 중첩 case 대신 use로 연결
    description: 여러 단계의 Result를 use와 result.try로 이어 쓰면 성공 경로가 위에서 아래로 읽힌다.
