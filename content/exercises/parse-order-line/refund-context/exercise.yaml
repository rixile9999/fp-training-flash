kind: implement
format: drill
module: refund_request
title: 환불 요청 한 줄 파싱하기
contextTags: [refunds, parsing]
difficulty: 1450
estimatedMinutes: 6
tests:
  - fn: parses_valid_request_test
    name: 올바른 환불 요청을 RefundRequest로 바꾼다
    visibility: public
    requirements: [R1]
  - fn: unknown_reason_test
    name: 알 수 없는 사유는 원래 표기 그대로 UnknownReason에 담는다
    visibility: public
    requirements: [R3]
  - fn: non_numeric_amount_test
    name: 숫자가 아닌 금액은 InvalidAmount이다
    visibility: public
    requirements: [R2]
  - fn: reason_ignores_case_test
    name: 사유는 대소문자를 구분하지 않는다
    visibility: hidden
    errorTag: case_sensitive_comparison
    requirements: [R3]
  - fn: zero_amount_test
    name: 금액 0은 InvalidAmount이다
    visibility: hidden
    errorTag: missing_range_check
    requirements: [R2]
  - fn: amount_at_limit_test
    name: 금액이 정확히 상한 1000000이면 받아들인다
    visibility: hidden
    errorTag: off_by_one
    requirements: [R2]
  - fn: amount_over_limit_test
    name: 상한을 넘는 금액은 InvalidAmount이다
    visibility: hidden
    errorTag: missing_range_check
    requirements: [R2]
  - fn: wrong_field_count_test
    name: 필드가 4개이면 WrongFieldCount(4)이다
    visibility: hidden
    errorTag: ignores_extra_fields
    requirements: [R1]
requirements:
  - id: R1
    description: 콜론으로 나눈 세 필드를 RefundRequest로 해석
  - id: R2
    description: 금액은 1 이상 max_amount 이하 정수
  - id: R3
    description: 사유 문자열을 Reason 생성자로 변환하고, 모르는 사유는 UnknownReason
hints:
  - level: 1
    kind: question
    text: 문자열 `"late"`를 `Late` 같은 생성자로 바꾸는 일도 실패할 수 있을까요? 어떤 경우에 실패하나요?
  - level: 2
    kind: concept
    text: "문자열을 커스텀 타입으로 바꿀 때는 `case`로 알려진 문자열을 하나씩 매칭하고, 나머지(`_`)를 `Error`로 보냅니다. `case`의 가드 `Ok(n) if 조건`으로 파싱과 범위 검사를 한 번에 할 수 있습니다."
  - level: 3
    kind: approach
    text: 필드마다 `Result`를 돌려주는 함수(`parse_order_id`, `parse_amount`, `parse_reason`)를 만들고 `use`와 `result.try`로 연결하세요. 사유는 비교하기 전에 소문자로 바꾸되, 오류에는 원래 필드를 담으세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      fn parse_amount(field: String) -> Result(Int, RefundError) {
        case int.parse(field) {
          Ok(amount) if todo -> Ok(amount)
          _ -> Error(InvalidAmount(field))
        }
      }

      fn parse_reason(field: String) -> Result(Reason, RefundError) {
        case string.lowercase(field) {
          "damaged" -> Ok(Damaged)
          todo
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: case-sensitive-reason
    mustFail: [reason_ignores_case_test]
    errorTag: case_sensitive_comparison
  - key: exclusive-limit
    mustFail: [amount_at_limit_test]
    errorTag: off_by_one
  - key: no-upper-limit
    mustFail: [amount_over_limit_test]
    errorTag: missing_range_check
