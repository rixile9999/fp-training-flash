kind: implement
format: drill
module: order_batch
title: 주문 파일 전체를 파싱하고 실패한 줄 알리기
difficulty: 1500
estimatedMinutes: 6
tests:
  - fn: parses_every_line_test
    name: 모든 줄이 올바르면 OrderLine 목록을 반환한다
    visibility: public
    requirements: [R1]
  - fn: reports_failing_line_number_test
    name: 실패한 줄의 번호(1부터)와 원래 오류를 LineError에 담는다
    visibility: public
    errorTag: off_by_one
    requirements: [R2]
  - fn: skips_blank_lines_test
    name: 공백뿐인 줄과 끝의 빈 줄은 건너뛴다
    visibility: hidden
    errorTag: ignores_blank_lines
    requirements: [R3]
  - fn: empty_text_test
    name: 빈 문자열은 빈 목록이다
    visibility: hidden
    errorTag: ignores_blank_lines
    requirements: [R3]
  - fn: blank_lines_count_in_numbering_test
    name: 건너뛴 빈 줄도 줄 번호에 포함한다
    visibility: hidden
    errorTag: wrong_line_number
    requirements: [R2]
  - fn: first_failing_line_test
    name: 여러 줄이 틀리면 가장 앞의 줄을 알린다
    visibility: hidden
    errorTag: reports_last_error
    requirements: [R2]
  - fn: keeps_line_order_test
    name: 결과는 파일의 줄 순서를 유지한다
    visibility: hidden
    errorTag: reorders_items
    requirements: [R1]
requirements:
  - id: R1
    description: 줄마다 parse_line을 적용해 순서대로 모은다
  - id: R2
    description: 첫 실패 줄의 1부터 센 번호와 ParseError를 LineError로 반환
  - id: R3
    description: 공백뿐인 줄은 건너뛴다
hints:
  - level: 1
    kind: question
    text: 빈 줄을 먼저 걸러 내면, 그 뒤에 매긴 줄 번호는 원래 파일의 줄 번호와 같을까요?
  - level: 2
    kind: concept
    text: "`list.try_map`은 원소마다 `Result`를 돌려주는 함수를 적용해, 모두 `Ok`면 `Ok(목록)`을, 처음 나온 `Error`에서 멈춰 그 `Error`를 반환합니다. `result.map_error`는 오류 값만 바꿉니다."
  - level: 3
    kind: approach
    text: 줄로 나눈 직후 `list.index_map`으로 번호를 붙이고, 그다음에 빈 줄을 걸러 내세요. 마지막으로 `list.try_map`에서 `parse_line`의 오류를 `LineError(번호, 오류)`로 감싸세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      text
      |> string.split("\n")
      |> list.index_map(fn(line, index) { #(todo, line) })
      |> list.filter(todo)
      |> list.try_map(fn(numbered) {
        let #(line_number, line) = numbered
        parse_line(line) |> result.map_error(todo)
      })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: numbers-skip-blanks
    mustFail: [blank_lines_count_in_numbering_test]
    errorTag: wrong_line_number
  - key: zero-based-lines
    mustFail: [reports_failing_line_number_test]
    errorTag: off_by_one
  - key: keeps-blank-lines
    mustFail: [skips_blank_lines_test, empty_text_test]
    errorTag: ignores_blank_lines
