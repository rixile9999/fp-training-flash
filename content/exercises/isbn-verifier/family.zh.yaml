title: 校验 ISBN-10
rubric:
  R-08:
    title: 对所有输入都给出答案的全函数
    description: 无论传入什么字符串，都不会崩溃，而是返回结果。转换失败用 Result 接住并处理。
  R-05:
    title: 把解析与计算分开
    description: 把字符串变成数字列表的解析步骤与求加权和的计算步骤分开，就能分别验证。
  R-09:
    title: 不使用 let assert 和 panic
    description: 用类型来表达可能的失败。
    message: 使用了 let assert 或 panic。
