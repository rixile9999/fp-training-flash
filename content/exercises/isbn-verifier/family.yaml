rubric:
  - id: R-08
    title: 모든 입력에 답하는 전체 함수
    description: 어떤 문자열이 들어와도 멈추지 않고 결과를 돌려준다. 변환 실패는 Result로 받아 처리한다.
  - id: R-05
    title: 파싱과 계산 분리
    description: 문자열을 숫자 목록으로 바꾸는 파싱 단계와 가중합을 구하는 계산 단계를 나누면 각각 따로 검증할 수 있다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
