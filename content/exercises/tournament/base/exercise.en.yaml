tests:
  empty_input_header_only_test: If the input is empty, returns only the header
  parse_line_test: Parses one match line into a Match
  record_win_test: Applies a match result to the records of both teams
  format_row_test: Turns a team name and its record into one row of fixed widths
  typical_input_test: Builds a table in descending order of points from several matches
  loss_credits_away_team_test: A loss is recorded as a win for the away team
  ties_broken_alphabetically_test: If points are equal, teams are in ascending order of name
  many_teams_tied_sorted_by_name_test: Even with many teams, teams with equal points are in ascending order of name
  skips_invalid_lines_test: Blank lines and lines with the wrong format are skipped
requirements:
  R1: parse_line accepts only the "home;away;win|draw|loss" format
  R2: record applies one match to the records of both teams, each from its own point of view
  R3: format_row builds one row with the team name in 30 columns and numbers right-aligned in 2 columns
  R4: tally builds the table in descending order of points, and in ascending order of name on ties
hints:
  1: "Before the input string becomes the table string, what shapes does the data pass through? Write down the type at each step."
  2: "Drop lines that fail to parse with `list.filter_map`, and collect each team's record with `list.fold` and `dict.upsert`. When there are two sort keys, chain them with `order.break_tie`. For padding to width, use `string.pad_end` and `string.pad_start`."
