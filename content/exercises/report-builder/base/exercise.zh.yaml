tests:
  parse_line_valid_test: 正确的行被解析为 Sale
  parse_line_rejects_non_number_test: 金额不是整数时返回 Error
  parse_line_rejects_wrong_field_count_test: 按逗号分割后不是两段时返回 Error
  total_by_category_sums_same_category_test: 把同一类别的金额相加
  total_by_category_sorted_by_name_test: 汇总结果按类别名称升序排列
  total_by_category_many_categories_sorted_test: 即使类别很多，也按名称升序排列
  format_row_test: '把一行变成 "类别: 金额" 形式的字符串'
  build_report_test: 用多行输入生成按类别的报表
  build_report_skips_invalid_lines_test: 错误的行不会出现在报表中
requirements:
  R1: parse_line 只接受“类别,金额”格式
