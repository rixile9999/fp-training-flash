title: 把 DNA 转录为 RNA
rubric:
  R-05:
    title: 分离计算逻辑
    description: 把求单个碱基配对的规则拆成有名字的小函数，就能单独验证。
  R-07:
    title: 不吞掉错误
    description: 不过滤掉错误输入，也不把它换成默认值，而是把第一个错误原样传回调用方。
    message: filter_map 会悄悄丢弃失败的元素。请确认错误输入会作为错误传递出去。
  R-09:
    title: 不使用 let assert 和 panic
    description: 用类型来表达可能的失败。
    message: 使用了 let assert 或 panic。
