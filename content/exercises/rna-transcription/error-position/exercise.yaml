kind: implement
format: drill
module: rna_transcription
title: 잘못된 염기의 위치 알려 주기
difficulty: 1400
estimatedMinutes: 6
tests:
  - fn: valid_strand_test
    name: 올바른 가닥은 RNA로 변환해 Ok로 반환한다
    visibility: public
    requirements: [R1]
  - fn: invalid_first_test
    name: 첫 글자가 잘못되면 위치 0과 그 글자를 알려 준다
    visibility: public
    errorTag: off_by_one
    requirements: [R2]
  - fn: rna_base_in_dna_test
    name: DNA에 없는 U도 잘못된 염기로 위치와 함께 알려 준다
    visibility: public
    requirements: [R2]
  - fn: first_invalid_reported_test
    name: 잘못된 글자가 여러 개면 가장 앞의 것을 알려 준다
    visibility: hidden
    errorTag: reports_last_error
    requirements: [R3]
  - fn: empty_strand_test
    name: 빈 가닥은 Ok("")이다
    visibility: hidden
    errorTag: rejects_empty_input
    requirements: [R1]
requirements:
  - id: R1
    description: 올바른 가닥은 변환 결과를 Ok로 반환
  - id: R2
    description: 잘못된 글자의 0부터 센 위치와 글자를 오류에 담음
  - id: R3
    description: 가장 앞의 오류를 보고
hints:
  - level: 1
    kind: question
    text: 글자 하나를 검사할 때 오류 값을 만들려면 무엇을 알고 있어야 하나요? 글자만으로 충분한가요?
  - level: 2
    kind: concept
    text: "`list.index_map(list, fn(x, i) { ... })`은 원소와 함께 0부터 시작하는 위치를 줍니다. `result.replace_error(r, e)`는 `Error(_)`를 `Error(e)`로 바꿉니다."
  - level: 3
    kind: approach
    text: "글자마다 위치를 붙인 다음 `list.try_map`으로 변환하세요. 변환이 실패하면 그 글자의 위치와 글자로 `InvalidNucleotide`를 만듭니다. `try_map`은 첫 실패에서 멈추므로 가장 앞의 오류가 나옵니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      dna
      |> string.to_graphemes
      |> list.index_map(fn(nucleotide, position) { #(position, nucleotide) })
      |> list.try_map(fn(pair) {
        let #(position, nucleotide) = pair
        complement(nucleotide)
        |> todo
      })
      |> result.map(string.concat)
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: one-based
    mustFail: [invalid_first_test, rna_base_in_dna_test]
    errorTag: off_by_one
  - key: last-invalid
    mustFail: [first_invalid_reported_test]
    errorTag: reports_last_error
