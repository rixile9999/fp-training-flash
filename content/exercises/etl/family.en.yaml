title: Change the format of a score table
rubric:
  R-02:
    title: The pipeline shows the intent
    description: Each step does only one transformation, and the reading order matches the processing order.
  R-05:
    title: Calculation logic is separated
    description: If you split a rule for a single element, such as normalizing a letter, into a small named function, you can verify it separately.
  R-08:
    title: The result does not depend on dict iteration order
    description: The iteration order of a dict is not defined. Sort explicitly when the result needs an order.
  R-09:
    title: No let assert or panic
    description: The possibility of failure is expressed in the types.
    message: let assert or panic was used.
