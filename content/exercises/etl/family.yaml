rubric:
  - id: R-02
    title: 파이프라인이 의도를 드러냄
    description: 각 단계가 한 가지 변환만 하고, 읽는 순서가 처리 순서와 같다.
  - id: R-05
    title: 계산 로직 분리
    description: 글자 정규화처럼 원소 하나에 대한 규칙은 이름 있는 작은 함수로 분리하면 따로 검증할 수 있다.
  - id: R-08
    title: 결과가 dict 순회 순서에 기대지 않음
    description: dict의 순회 순서는 정해져 있지 않다. 순서가 필요한 결과는 명시적으로 정렬한다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
