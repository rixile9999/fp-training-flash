kind: implement
format: drill
module: etl
difficulty: 1250
estimatedMinutes: 5
limits: { timeMs: 10000, memoryMb: 256 }
tests:
  - fn: single_letter_test
    name: 글자 하나를 소문자 키로 옮긴다
    visibility: public
    errorTag: skips_normalization
    requirements: [R1, R2]
  - fn: single_score_with_multiple_letters_test
    name: 한 점수에 묶인 글자마다 항목을 만든다
    visibility: public
    errorTag: keeps_only_first_item
    requirements: [R1]
  - fn: multiple_scores_test
    name: 여러 점수의 글자를 한 dict로 합친다
    visibility: public
    errorTag: resets_accumulator
    requirements: [R1]
  - fn: empty_table_test
    name: 빈 점수표는 빈 dict가 된다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R1]
  - fn: score_without_letters_adds_nothing_test
    name: 글자가 없는 점수는 결과에 아무것도 더하지 않는다
    visibility: hidden
    errorTag: mishandles_empty_group
    requirements: [R1]
  - fn: full_table_test
    name: 전체 점수표의 26글자를 모두 옮긴다
    visibility: hidden
    errorTag: keeps_only_first_item
    requirements: [R1, R2]
requirements:
  - id: R1
    description: 글자마다 점수 항목 하나
  - id: R2
    description: 글자는 소문자로 저장
hints:
  - level: 1
    kind: question
    text: 입력 dict의 항목 하나(점수 하나)는 결과 dict에 몇 개의 항목을 만들어야 하나요?
  - level: 2
    kind: concept
    text: "`dict.fold`는 dict의 항목을 하나씩 받아 누적값을 갱신하고, `list.fold`는 목록 원소를 하나씩 받아 누적값을 갱신합니다. 두 fold를 겹쳐 쓸 수 있습니다."
  - level: 3
    kind: approach
    text: 빈 dict에서 시작해, 바깥 fold는 점수마다, 안쪽 fold는 그 점수의 글자마다 돌면서 `소문자 글자 -> 점수`를 넣으세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      dict.fold(legacy, dict.new(), fn(result, score, letters) {
        list.fold(letters, result, fn(acc, letter) {
          todo
        })
      })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: no-lowercase
    mustFail: [single_letter_test, single_score_with_multiple_letters_test, full_table_test]
    errorTag: skips_normalization
  - key: first-letter-only
    mustFail: [single_score_with_multiple_letters_test, full_table_test]
    errorTag: keeps_only_first_item
  - key: inner-fold-fresh-dict
    mustFail: [multiple_scores_test, full_table_test]
    errorTag: resets_accumulator
