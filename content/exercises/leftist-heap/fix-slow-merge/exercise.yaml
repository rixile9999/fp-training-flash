kind: fix
format: drill
module: heap
title: 레프티스트 힙 고치기 - 넣을수록 느려지는 힙
difficulty: 1500
estimatedMinutes: 5
limits: { timeMs: 10000, memoryMb: 256 }
tests:
  - fn: drains_in_ascending_order_test
    name: 최솟값을 반복해서 꺼내면 오름차순이 된다
    visibility: public
    requirements: [ R2 ]
  - fn: make_moves_taller_child_left_test
    name: 오른쪽 자식의 rank가 더 크면 make가 왼쪽으로 옮긴다
    visibility: public
    errorTag: breaks_leftist_property
    requirements: [ R1 ]
  - fn: ascending_inserts_keep_right_spine_short_test
    name: 1부터 63까지 차례로 넣어도 오른쪽 가지는 6개 이하다
    visibility: public
    errorTag: breaks_leftist_property
    requirements: [ R1, R3 ]
  - fn: make_keeps_taller_child_left_test
    name: 왼쪽 자식의 rank가 더 크면 make가 그대로 둔다
    visibility: hidden
    errorTag: breaks_leftist_property
    requirements: [ R1 ]
  - fn: make_rank_from_shorter_side_test
    name: 새 노드의 rank는 짧은 쪽 자식의 rank + 1이다
    visibility: hidden
    errorTag: wrong_rank
    requirements: [ R1 ]
  - fn: stays_leftist_after_deletes_test
    name: delete_min을 한 뒤에도 모든 노드가 레프티스트 성질을 지킨다
    visibility: hidden
    errorTag: breaks_leftist_property
    requirements: [ R1 ]
requirements:
  - id: R1
    description: 모든 노드에서 rank(left) >= rank(right), rank = rank(right) + 1
  - id: R2
    description: 최소 힙 순서를 지킨다
  - id: R3
    description: merge, insert, delete_min이 O(log n)
hints:
  - level: 1
    kind: question
    text: 0, 1, 2, ...를 차례로 넣을 때 새 값은 매번 어느 가지로 내려가나요? `make`가 만든 노드의 오른쪽 가지 길이는 어떻게
      변하나요?
  - level: 2
    kind: concept
    text: merge는 오른쪽 가지만 따라 내려갑니다. 레프티스트 성질(`rank(left) >= rank(right)`)이 지켜지면 오른쪽
      가지 길이가 O(log n)이지만, 깨지면 O(n)까지 길어집니다.
  - level: 3
    kind: approach
    text: "`merge`, `insert`, `delete_min`은 모두 `make`로 노드를 만듭니다. `make`만 고치세요. 두 자식의
      rank를 비교해 큰 쪽을 왼쪽에 두고, rank는 오른쪽(작은 쪽) 자식의 rank + 1로 정합니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn make(value: Int, a: Heap, b: Heap) -> Heap {
        case rank(a) >= rank(b) {
          True -> Node(rank: todo, value: value, left: a, right: b)
          False -> todo
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: rank-from-left
    mustFail: [make_rank_from_shorter_side_test]
    errorTag: wrong_rank
  - key: always-swap
    mustFail: [ make_keeps_taller_child_left_test, stays_leftist_after_deletes_test ]
    errorTag: breaks_leftist_property
performance:
  module: heap_perf
  sizes: [ 500, 2000, 8000 ]
  maxCostRatio: 4
  referenceCost:
    - 30002
    - 147911
    - 701358
