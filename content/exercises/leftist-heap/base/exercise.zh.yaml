tests:
  make_puts_higher_rank_left_test: make 把 rank 较大的子节点放在左边
  insert_then_find_min_test: 插入多个值后，最小的值位于堆顶
  drains_in_ascending_order_test: 反复取出最小值，得到升序
  make_rank_from_shorter_side_test: 新节点的 rank 是右子节点的 rank + 1
  delete_min_empty_test: 对空堆调用 delete_min 返回 Error(Nil)
  keeps_duplicates_test: 同一个值插入多次后，每一个都能取出
  merge_keeps_all_values_test: 合并两个堆后，两边的值都保留
  stays_leftist_test: 按升序插入 16 个值后，每个节点仍满足左偏性质
requirements:
  R1: 在每个节点上 rank(left) >= rank(right)，且 rank = rank(right) + 1
  R2: merge 和 insert 不丢失值，并保持最小堆顺序
  R3: delete_min 返回去掉最小值后的堆，空堆时返回 Error(Nil)
  R4: merge、insert、delete_min 为 O(log n)
hints:
