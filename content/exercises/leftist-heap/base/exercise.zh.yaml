  2: "左偏堆让右分支保持很短，这样 merge 只沿右分支往下走。rank 就是右分支的长度，所以 rank(right) 是 O(log n)。每次创建节点时都把 rank 较小的一侧放在右边，这个性质就能得到维持。"
  3: "`make` 比较两个子节点的 rank，把较大的放在左边，并把 rank 设为（较小一侧的 rank + 1）。`merge` 保留根较小的那个堆的左子节点不变，把它和“右子节点与另一个堆递归 merge 的结果”一起交给 `make`。`insert` 和 `delete_min` 都只是一次 merge。"
