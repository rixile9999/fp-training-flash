kind: implement
format: drill
module: phone_number
difficulty: 1400
estimatedMinutes: 7
tests:
  - fn: cleans_punctuation_test
    name: 괄호, 공백, 하이픈을 지우고 10자리 숫자를 반환한다
    visibility: public
    requirements: [R1]
  - fn: strips_country_code_test
    name: +1 국가 번호가 붙고 점으로 구분된 번호도 1을 떼고 10자리를 반환한다
    visibility: public
    requirements: [R3]
  - fn: too_few_digits_test
    name: 숫자가 10개보다 적으면 TooFewDigits를 반환한다
    visibility: public
    requirements: [R2]
  - fn: invalid_country_code_test
    name: 11자리인데 1로 시작하지 않으면 InvalidCountryCode를 반환한다
    visibility: public
    requirements: [R3]
  - fn: too_many_digits_test
    name: 숫자가 11개보다 많으면 TooManyDigits를 반환한다
    visibility: hidden
    errorTag: missing_length_check
    requirements: [R2]
  - fn: letters_rejected_test
    name: 영문자가 섞여 있으면 그 글자를 담은 InvalidCharacter를 반환한다
    visibility: hidden
    errorTag: drops_invalid_input
    requirements: [R4]
  - fn: first_invalid_character_test
    name: 허용되지 않은 글자가 여럿이면 가장 앞의 글자를 알려 준다
    visibility: hidden
    errorTag: drops_invalid_input
    requirements: [R4]
  - fn: character_check_before_length_test
    name: 짧은 번호에 잘못된 글자가 있으면 길이 오류보다 글자 오류가 먼저다
    visibility: hidden
    errorTag: wrong_check_order
    requirements: [R4]
requirements:
  - id: R1
    description: 허용된 구분 기호를 지우고 숫자만 남김
  - id: R2
    description: 숫자 개수 검사
  - id: R3
    description: 11자리면 국가 번호 1을 검사하고 제거
  - id: R4
    description: 허용되지 않은 글자를 가장 먼저 검사해 첫 글자를 보고
hints:
  - level: 1
    kind: question
    text: 검사가 세 가지(글자, 길이, 국가 번호)입니다. 입력이 여러 검사에 동시에 걸리면 어떤 오류를 돌려줘야 하나요? 그 순서를 코드에서 어떻게 보장할까요?
  - level: 2
    kind: concept
    text: "`use x <- result.try(단계(입력))`를 쓰면 단계가 `Error`일 때 함수가 바로 그 오류를 반환하고, `Ok(x)`일 때만 다음 줄로 넘어갑니다. 단계를 적은 순서가 곧 검사 순서입니다."
  - level: 3
    kind: approach
    text: "단계를 둘로 나눠 보세요. (1) 구분 기호를 지운 뒤 남은 글자가 모두 숫자인지 확인해 숫자 목록을 돌려주는 함수, (2) 숫자 개수와 국가 번호를 보고 10자리 문자열을 돌려주는 함수. `clean`은 둘을 `use`로 잇습니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn clean(input: String) -> Result(String, PhoneError) {
        use digits <- result.try(extract_digits(input))
        normalize_length(digits)
      }

      fn normalize_length(digits: List(String)) -> Result(String, PhoneError) {
        case list.length(digits), digits {
          n, _ if n < 10 -> Error(TooFewDigits)
          n, _ if n > 11 -> todo
          11, ["1", ..rest] -> todo
          11, _ -> todo
          _, _ -> Ok(string.concat(digits))
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: digits-only
    mustFail: [letters_rejected_test, first_invalid_character_test]
    errorTag: drops_invalid_input
  - key: length-first
    mustFail: [character_check_before_length_test]
    errorTag: wrong_check_order
  - key: no-upper-bound
    mustFail: [too_many_digits_test]
    errorTag: missing_length_check
