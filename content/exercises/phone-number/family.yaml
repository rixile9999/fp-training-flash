# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 전화번호 정리와 검증 오류 타입
primarySkill: explicit-failure
secondarySkills: [function-decomposition]
contextTags: [messaging]
source:
  kind: exercism
  license: "MIT, Copyright (c) 2021 Exercism"
  url: https://github.com/exercism/gleam/tree/main/exercises/practice/phone-number
  upstream: "exercism/gleam exercises/practice/phone-number@34db02e"
conceptNotes: [gleam-custom-types, gleam-option-result, gleam-use-expressions, gleam-strings]
theoryTopics: [errors-as-values, algebraic-data-types, chaining-results-monads]
rubric:
  - id: R-11
    title: 오류 원인을 타입으로 구분함
    description: 실패 이유마다 다른 생성자를 쓰고, 호출한 쪽이 case로 원인을 나눌 수 있다. 오류를 문자열이나 Nil로 뭉개지 않는다.
  - id: R-02
    title: 검사 순서가 코드에 드러남
    description: 검사 단계가 use 또는 result.try로 순서대로 이어져서, 어떤 오류가 먼저 보고되는지 코드를 위에서 아래로 읽으면 알 수 있다.
  - id: R-05
    title: 검사 단계 분리
    description: 문자 검사, 길이 검사, 국가 번호 처리 같은 단계를 이름 있는 작은 함수로 분리하면 따로 검증할 수 있다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
