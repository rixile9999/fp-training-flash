# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 조건으로 거르는 keep과 discard 만들기
primarySkill: data-transformation
secondarySkills: [recursive-algorithms]
contextTags: []
source:
  kind: exercism
  license: "MIT, Copyright (c) 2021 Exercism"
  url: https://github.com/exercism/gleam/tree/main/exercises/practice/strain
  upstream: "exercism/gleam exercises/practice/strain@34db02e"
conceptNotes: [gleam-recursion, gleam-anonymous-functions, gleam-list-transform]
theoryTopics: [higher-order-modularity, accumulators-and-tail-recursion, fold-universality]
rubric:
  - id: R-04
    title: 표준 filter 없이 직접 구현
    description: 이 문제의 목적은 거르기를 재귀로 직접 만드는 것이다. `list.filter`, `list.partition`을 쓰지 않는다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blist\\.(filter|partition|filter_map)\\b"
      message: list.filter 계열 함수를 사용했습니다. 재귀로 직접 구현하세요.
  - id: R-07
    title: 중복 없이 재사용
    description: discard처럼 keep과 조건만 반대인 함수는 새로 재귀를 쓰지 않고 keep과 조건 뒤집기로 만든다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
