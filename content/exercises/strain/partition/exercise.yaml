kind: implement
format: drill
module: sorter
title: 한 번 순회로 둘로 나누는 partition 만들기
source:
  kind: original
difficulty: 1400
estimatedMinutes: 6
limits: { timeMs: 10000, memoryMb: 256 }
tests:
  - fn: empty_list_test
    name: 빈 목록은 빈 목록 두 개로 나뉜다
    visibility: public
    requirements: [R1]
  - fn: splits_even_and_odd_test
    name: 조건이 참인 원소는 왼쪽, 거짓인 원소는 오른쪽에 모인다
    visibility: public
    errorTag: swaps_result_pair
    requirements: [R1]
  - fn: all_match_test
    name: 모든 원소가 조건을 만족하면 오른쪽은 빈 목록이다
    visibility: public
    errorTag: swaps_result_pair
    requirements: [R1]
  - fn: none_match_test
    name: 조건을 만족하는 원소가 없으면 왼쪽은 빈 목록이다
    visibility: hidden
    errorTag: reverses_order
    requirements: [R1]
  - fn: both_sides_keep_order_test
    name: 양쪽 모두 원래 순서를 유지한다
    visibility: hidden
    errorTag: reverses_order
    requirements: [R2]
  - fn: duplicates_are_kept_test
    name: 같은 값이 여러 번 나와도 모두 남긴다
    visibility: hidden
    errorTag: drops_duplicates
    requirements: [R1]
requirements:
  - id: R1
    description: 모든 원소가 정확히 한쪽에 들어감
  - id: R2
    description: 양쪽 모두 원래 순서 유지
hints:
  - level: 1
    kind: question
    text: 목록을 한 번만 훑으면서 결과 두 개를 동시에 만들려면, 재귀 호출 사이에 무엇을 들고 다녀야 할까요?
  - level: 2
    kind: concept
    text: 누적자는 하나일 필요가 없습니다. 보조 함수에 누적자 두 개를 인자로 두면 원소마다 둘 중 하나에만 쌓을 수 있습니다.
  - level: 3
    kind: approach
    text: "보조 함수 `go(items, predicate, kept, rejected)`를 만들고, 목록이 끝나면 두 누적자를 각각 뒤집어 튜플로 돌려주세요."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      case items {
        [] -> #(list.reverse(kept), todo)
        [first, ..rest] ->
          case predicate(first) {
            True -> go(rest, predicate, [first, ..kept], rejected)
            False -> todo
          }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: swapped-pair
    mustFail: [splits_even_and_odd_test, all_match_test]
    errorTag: swaps_result_pair
  - key: rejected-not-reversed
    mustFail: [none_match_test, both_sides_keep_order_test]
    errorTag: reverses_order
