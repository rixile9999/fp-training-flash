  - id: R-02
    title: 파이프라인이 의도를 드러냄
    description: 목록 전체를 한 번 변환하고, 각 원소에서 바꿀지 말지를 case 하나로 결정한다.
  - id: R-05
    title: 계산 로직 분리
    description: 보충 조건이나 한 품목의 갱신은 이름 있는 작은 함수로 분리하면 따로 검증할 수 있다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
