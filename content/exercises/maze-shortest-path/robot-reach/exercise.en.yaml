title: Counting the cells a warehouse robot can reach within n moves
tests:
  zero_steps_counts_start_test: "With a move limit of 0, only the start cell is counted"
  corridor_limit_test: "In a straight corridor, counts cells up to a distance equal to the limit"
  walls_block_test: "Cells that require going around shelves are judged by the detour distance"
  counts_each_cell_once_test: "A cell reached from two directions is still counted once"
  open_floor_uses_shortest_distance_test: "Even on a wide floor, each cell is judged by its minimum number of moves"
  stays_inside_grid_test: "Cells outside the grid are not counted"
  walled_off_area_not_counted_test: "Cells in a closed-off area are not counted, even with a generous limit"
  no_robot_test: "Returns 0 when there is no S"
requirements:
  R1: "Counts the cells reachable in at most max_steps moves, including the start cell"
  R2: "Moves only up, down, left and right, avoiding shelves and the outside of the grid"
  R3: "Each cell is counted only once"
  R4: "0 when there is no S"
hints:
  1: "If you knew the minimum number of moves to each cell, what condition would the cells to count satisfy? In what order should you look at cells to find out those minimum numbers one by one?"
  2: "Breadth-first search takes out the nearest cells first, so the distance attached to a cell when it is taken out is that cell's minimum number of moves. Mark a cell in the visited set when you put it into the queue, so the same cell never enters the queue twice."
  3: "Write a recursive `explore(queue, seen, count)`. Each time you take `#(pos, dist)` out of the queue, increase count by 1, and only when `dist < max_steps` put the unseen neighbors in with `dist + 1`. When the queue is empty, return count."
  4: |
    ```gleam
    fn explore(cells, max_steps, queue, seen, count) -> Int {
      case pop(queue) {
        Error(Nil) -> count
        Ok(#(#(pos, dist), rest)) -> {
          let next = case dist < max_steps {
            True -> todo // open_neighbors that are not in seen
            False -> []
          }
          let seen = list.fold(next, seen, set.insert)
          let queue = todo // push next onto rest as #(p, dist + 1)
          explore(cells, max_steps, queue, seen, count + 1)
        }
      }
    }
    ```
  5: "You can now open the full explanation. After viewing it, mastery is checked with a new exercise."
