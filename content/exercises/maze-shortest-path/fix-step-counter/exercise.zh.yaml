title: 修复最短路径——把取出的格子数当成距离的 bug
tests:
  straight_corridor_test: "在笔直的通道里，答案就是两个格子之间的距离"
  goes_around_walls_test: "求出绕过墙壁的最少移动次数"
  goal_next_to_start_test: "G 紧挨着 S 时，即使先查看了其他格子，也返回 1"
  side_branch_not_counted_test: "查看路径旁边的格子不计入移动次数"
  open_room_test: "求出在没有墙的房间里走到对角另一端的最少移动次数"
  unreachable_goal_test: "被墙挡住无法到达 G 时返回 Error(Nil)"
requirements:
  R1: "求出从 S 到 G 的最少移动次数"
  R2: "无法到达时返回 Error(Nil)"
  R3: "对于格子数 V，在 O(V log V) 内完成"
hints:
  1: "为什么 `\"S..G\"` 能得到正确答案，而 `[\"..\", \"SG\"]` 却得到 2？`steps` 每次加 1 时，数的是什么？"
  2: "在广度优先搜索中，距离不是整个搜索共用的一个值，而是每个格子各不相同的值。一个格子的距离等于发现它的那个格子的距离 + 1。"
  3: "队列里不要只放位置，而要放 `#(位置, 距离)`。取出 G 时返回该项的距离即可。队列的顺序（从后面放入、从前面取出）保持不变。"
  4: |
    ```gleam
    [#(pos, dist), ..], _ if pos == goal -> Ok(dist)
    [#(pos, dist), ..rest], _ -> {
      let next = todo // 不在 seen 中的 open_neighbors
      let seen = list.fold(next, seen, set.insert)
      let back = list.fold(next, back, fn(acc, p) { todo })
      search(cells, goal, rest, back, seen)
    }
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
