rubric:
  - id: R-07
    title: 부분 문제의 답을 표에 저장해 재사용
    description: "\"첫 k개 물건, 무게 한도 w\"의 답을 표에 저장해 두고 다음 물건을 고려할 때 꺼내 쓴다."
  - id: R-10
    title: 이전 표와 새 표를 구분
    description: 물건 하나를 고려할 때는 그 물건을 넣기 전의 표에서만 읽는다. 불변 Dict는 이전 표가 그대로 남아 있어 이 구분이 쉽다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
