title: 装背包（0/1 背包问题）
rubric:
  R-07:
    title: 把子问题的答案存进表里重复使用
    description: "把“前 k 件物品、重量上限 w”的答案存进表中，考虑下一件物品时从中取用。"
  R-10:
    title: 区分旧表与新表
    description: 考虑一件物品时，只从放入这件物品之前的表中读取。不可变 Dict 会原样保留旧表，因此很容易做到这种区分。
  R-09:
    title: 不使用 let assert 和 panic
    description: 用类型来表达可能的失败。
    message: 使用了 let assert 或 panic。
