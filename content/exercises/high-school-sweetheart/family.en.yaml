title: Build an initials heart with pipes
rubric:
  R-02:
    title: The pipeline shows the intent
    description: Each step does only one transformation, and the reading order matches the processing order.
  R-05:
    title: Earlier functions are reused
    description: Later functions are built up by calling the small functions made before them, without rewriting the same rules.
  R-09:
    title: No let assert or panic
    description: The possibility of failure is expressed in the types.
    message: let assert or panic was used.
