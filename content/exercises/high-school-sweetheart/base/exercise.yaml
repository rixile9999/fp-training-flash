kind: implement
format: drill
module: high_school_sweetheart
difficulty: 1150
estimatedMinutes: 6
tests:
  - fn: first_letter_test
    name: 이름의 첫 글자를 돌려준다
    visibility: public
    requirements: [R1]
  - fn: first_letter_keeps_case_test
    name: 첫 글자의 대소문자는 바꾸지 않는다
    visibility: hidden
    errorTag: changes_case_too_early
    requirements: [R1]
  - fn: first_letter_trims_whitespace_test
    name: 앞뒤 공백과 줄바꿈을 무시하고 첫 글자를 찾는다
    visibility: hidden
    errorTag: ignores_surrounding_whitespace
    requirements: [R1]
  - fn: first_letter_empty_test
    name: 빈 문자열이면 빈 문자열을 돌려준다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R1]
  - fn: initial_test
    name: 첫 글자 뒤에 마침표를 붙인다
    visibility: public
    requirements: [R2]
  - fn: initial_uppercases_test
    name: 소문자 이름도 대문자 이니셜이 된다
    visibility: hidden
    errorTag: missing_uppercase
    requirements: [R2]
  - fn: initials_test
    name: 이름과 성의 이니셜을 공백으로 잇는다
    visibility: public
    requirements: [R3]
  - fn: pair_test
    name: 두 사람의 이니셜을 하트 안에 넣는다
    visibility: public
    requirements: [R4]
requirements:
  - id: R1
    description: first_letter는 공백을 걷어낸 첫 글자를 대소문자 그대로 돌려준다
  - id: R2
    description: initial은 first_letter를 재사용해 대문자와 마침표로 만든다
  - id: R3
    description: initials는 initial을 재사용한다
  - id: R4
    description: pair는 initials를 재사용해 하트 문자열을 만든다
hints:
  - level: 1
    kind: question
    text: "`initial`을 만들 때 `first_letter`가 이미 해 주는 일은 무엇이고, 더 해야 하는 일은 무엇일까요?"
  - level: 2
    kind: concept
    text: "`|>`는 왼쪽 값을 오른쪽 함수의 첫 번째 인자로 넘깁니다. `string.first`는 `Result`를 돌려주므로 `result.unwrap`으로 기본값을 줄 수 있습니다."
  - level: 3
    kind: approach
    text: 네 함수를 위에서부터 차례로 만들고, 각 함수는 바로 앞 함수를 파이프라인의 한 단계로 호출하세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn first_letter(name: String) -> String {
        name
        |> string.trim
        |> todo
      }

      pub fn initials(full_name: String) -> String {
        full_name
        |> string.split(" ")
        |> list.map(initial)
        |> todo
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: no-trim
    mustFail: [first_letter_trims_whitespace_test]
    errorTag: ignores_surrounding_whitespace
  - key: uppercase-too-early
    mustFail: [first_letter_keeps_case_test]
    errorTag: changes_case_too_early
