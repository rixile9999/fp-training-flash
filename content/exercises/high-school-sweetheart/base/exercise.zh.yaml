tests:
  first_letter_test: 返回名字的第一个字母
  first_letter_keeps_case_test: 不改变第一个字母的大小写
  first_letter_trims_whitespace_test: 忽略首尾的空白和换行，找出第一个字母
  first_letter_empty_test: 空字符串返回空字符串
  initial_test: 在第一个字母后面加上句点
  initial_uppercases_test: 小写的名字也得到大写首字母
  initials_test: 用空格连接名和姓的首字母
  pair_test: 把两个人的首字母放进爱心里
requirements:
  R1: first_letter 去掉空白后按原大小写返回第一个字母
  R2: initial 复用 first_letter，把它变成大写并加上句点
  R3: initials 复用 initial
  R4: pair 复用 initials 生成爱心字符串
hints:
  1: "编写 `initial` 时，`first_letter` 已经替你做了哪些事？还需要再做什么？"
  2: "`|>` 把左边的值作为第一个参数传给右边的函数。`string.first` 返回 `Result`，所以可以用 `result.unwrap` 给它一个默认值。"
  3: "从上到下依次编写四个函数，每个函数都把紧挨在前面的那个函数作为管道中的一步来调用。"
  4: |
    ```gleam
    pub fn first_letter(name: String) -> String {
      name
      |> string.trim
      |> todo
    }

    pub fn initials(full_name: String) -> String {
      full_name
      |> string.split(" ")
      |> list.map(initial)
      |> todo
    }
    ```
  5: "现在可以打开完整讲解。看完讲解后，将用一道新题确认掌握程度。"
