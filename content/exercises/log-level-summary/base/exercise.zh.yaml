tests:
  empty_lines_test: 没有行时返回空字典
  counts_single_level_test: 统计同一级别的行数
  counts_several_levels_test: 多个级别混在一起时按级别分别计数
  normalizes_case_test: 级别大小写不同时也统一成大写合并计数
  skips_malformed_lines_test: 不符合格式的行不计数
  level_without_space_test: 即使级别后面没有紧跟空格，也能读出级别
requirements:
  R1: 把第一个 [ 和第一个 ] 之间的文字当作级别，按级别统计行数
  R2: 级别转换成大写后再计数
  R3: 不以 [ 开头或没有 ] 的行不计数
