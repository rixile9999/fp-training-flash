kind: implement
format: drill
module: nucleotide_count
title: 염기 개수 세기 - 첫 오류 위치 알리기
difficulty: 1500
estimatedMinutes: 7
tests:
  - fn: empty_strand_test
    name: 빈 문자열이면 네 염기가 모두 0개다
    visibility: public
    errorTag: missing_zero_counts
    requirements: [R1]
  - fn: mixed_strand_test
    name: 유효한 문자열에서 염기별 개수를 센다
    visibility: public
    requirements: [R1]
  - fn: reports_letter_and_index_test
    name: 잘못된 글자와 그 위치(0부터)를 Error로 알린다
    visibility: public
    errorTag: off_by_one
    requirements: [R2]
  - fn: reports_first_of_many_test
    name: 잘못된 글자가 여럿이면 가장 앞의 것을 알린다
    visibility: hidden
    errorTag: reports_last_error
    requirements: [R3]
  - fn: invalid_at_start_test
    name: 첫 글자가 잘못되면 위치 0을 알린다
    visibility: hidden
    errorTag: off_by_one
    requirements: [R2]
  - fn: lowercase_is_invalid_test
    name: 소문자 염기도 잘못된 글자로 알린다
    visibility: hidden
    errorTag: accepts_lowercase
    requirements: [R2]
requirements:
  - id: R1
    description: 유효한 입력이면 네 염기의 개수를 모두 담은 딕셔너리
  - id: R2
    description: 잘못된 글자와 0부터 센 위치를 InvalidNucleotide로 반환
  - id: R3
    description: 잘못된 글자가 여럿이면 첫 번째 것을 보고
hints:
  - level: 1
    kind: question
    text: 잘못된 글자가 두 개 있을 때, 두 번째 글자를 볼 필요가 있을까요? 위치를 알려면 각 글자와 함께 무엇을 들고 다녀야 할까요?
  - level: 2
    kind: concept
    text: "`list.index_map`은 각 원소와 0부터 시작하는 위치를 함께 넘겨 줍니다. `list.try_fold`는 처음 `Error`가 나오면 그 자리에서 멈춥니다."
  - level: 3
    kind: approach
    text: 먼저 글자 목록을 `#(글자, 위치)` 쌍의 목록으로 바꾸고, 네 염기를 0으로 채운 딕셔너리에서 시작해 쌍을 하나씩 접어 보세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      dna
      |> string.to_graphemes
      |> list.index_map(fn(letter, index) { #(letter, index) })
      |> list.try_fold(zeros, fn(counts, pair) {
        let #(letter, index) = pair
        case dict.get(counts, letter) {
          Ok(count) -> todo
          Error(Nil) -> todo
        }
      })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: index-from-one
    mustFail: [reports_letter_and_index_test, invalid_at_start_test]
    errorTag: off_by_one
  - key: reports-last
    mustFail: [reports_first_of_many_test]
    errorTag: reports_last_error
