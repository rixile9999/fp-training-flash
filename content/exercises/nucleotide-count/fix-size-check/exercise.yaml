kind: fix
format: drill
module: nucleotide_count
title: 염기 개수 세기 - 크기 검사 버그 고치기
difficulty: 1250
estimatedMinutes: 5
tests:
  - fn: mixed_strand_test
    name: 네 염기가 모두 나오는 문자열의 개수를 센다
    visibility: public
    requirements: [R1]
  - fn: empty_strand_test
    name: 빈 문자열이면 네 염기가 모두 0개다
    visibility: public
    errorTag: missing_zero_counts
    requirements: [R1]
  - fn: invalid_with_few_kinds_test
    name: 염기 종류가 적어도 잘못된 글자가 있으면 Error(Nil)을 반환한다
    visibility: public
    errorTag: drops_invalid_input
    requirements: [R2]
  - fn: missing_kinds_are_zero_test
    name: 나오지 않은 염기는 0개로 들어 있다
    visibility: hidden
    errorTag: missing_zero_counts
    requirements: [R1]
  - fn: invalid_single_letter_test
    name: 잘못된 글자 하나만 있는 문자열은 Error(Nil)을 반환한다
    visibility: hidden
    errorTag: drops_invalid_input
    requirements: [R2]
  - fn: invalid_with_all_kinds_test
    name: 네 염기가 다 있고 잘못된 글자도 있으면 Error(Nil)을 반환한다
    visibility: hidden
    errorTag: drops_invalid_input
    requirements: [R2]
requirements:
  - id: R1
    description: 결과에는 A, C, G, T 네 키가 항상 들어 있다
  - id: R2
    description: A, C, G, T 이외의 글자가 하나라도 있으면 Error(Nil)
hints:
  - level: 1
    kind: question
    text: "`\"AAX\"`를 넣으면 딕셔너리의 크기는 몇이 될까요? 크기가 4 이하라는 사실이 \"모든 글자가 유효하다\"를 보장하나요?"
  - level: 2
    kind: concept
    text: "`list.try_fold`는 누적 도중 `Error`가 나오면 그 자리에서 멈추고 그 `Error`를 반환합니다. 초기값이 결과에 어떤 키가 들어갈지를 정합니다."
  - level: 3
    kind: approach
    text: 개수를 다 센 뒤 간접적으로 검사하지 말고, 글자를 하나씩 셀 때 바로 유효한지 확인하세요. 네 염기를 0으로 채운 딕셔너리에서 시작하면 두 버그가 함께 풀립니다.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      let zeros = dict.from_list([#("A", 0), #("C", 0), #("G", 0), #("T", 0)])
      dna
      |> string.to_graphemes
      |> list.try_fold(zeros, fn(counts, letter) {
        case dict.get(counts, letter) {
          Ok(count) -> todo
          Error(Nil) -> todo
        }
      })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: fill-after-check
    mustFail: [invalid_with_few_kinds_test, invalid_single_letter_test]
    errorTag: drops_invalid_input
  - key: validate-without-zeros
    mustFail: [empty_strand_test, missing_kinds_are_zero_test]
    errorTag: missing_zero_counts
