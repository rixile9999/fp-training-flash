kind: implement
format: drill
module: nucleotide_count
difficulty: 1300
estimatedMinutes: 6
tests:
  - fn: empty_strand_test
    name: 빈 문자열이면 네 염기가 모두 0개다
    visibility: public
    errorTag: missing_zero_counts
    requirements: [R1]
  - fn: single_nucleotide_test
    name: 염기 하나짜리 문자열은 그 염기만 1개이고 나머지는 0개다
    visibility: public
    errorTag: missing_zero_counts
    requirements: [R1, R2]
  - fn: mixed_strand_test
    name: 여러 염기가 섞인 문자열에서 염기별 개수를 센다
    visibility: public
    requirements: [R2]
  - fn: invalid_strand_test
    name: 잘못된 글자가 섞이면 Error(Nil)을 반환한다
    visibility: public
    errorTag: drops_invalid_input
    requirements: [R3]
  - fn: repeated_nucleotide_test
    name: 같은 염기가 반복되면 반복 횟수만큼 센다
    visibility: hidden
    errorTag: overwrites_existing_key
    requirements: [R2]
  - fn: invalid_at_end_test
    name: 마지막 글자 하나만 잘못되어도 Error(Nil)을 반환한다
    visibility: hidden
    errorTag: drops_invalid_input
    requirements: [R3]
  - fn: lowercase_is_invalid_test
    name: 소문자 염기는 잘못된 글자로 본다
    visibility: hidden
    errorTag: accepts_lowercase
    requirements: [R3]
requirements:
  - id: R1
    description: 결과에는 A, C, G, T 네 키가 항상 들어 있다
  - id: R2
    description: 염기별 개수를 정확히 센다
  - id: R3
    description: A, C, G, T 이외의 글자가 하나라도 있으면 Error(Nil)
hints:
  - level: 1
    kind: question
    text: 한 번도 나오지 않은 염기도 결과에 들어 있어야 할까요? 잘못된 글자를 만난 뒤에도 나머지를 계속 셀 필요가 있을까요?
  - level: 2
    kind: concept
    text: "`list.try_fold`는 `list.fold`처럼 값을 누적하다가, 함수가 `Error`를 돌려주는 순간 멈추고 그 `Error`를 결과로 반환합니다."
  - level: 3
    kind: approach
    text: 네 염기를 0으로 채운 딕셔너리에서 시작해 보세요. 글자마다 그 키가 딕셔너리에 있는지 확인하면 유효성 검사와 개수 세기를 한 번에 할 수 있습니다.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      let zeros = dict.from_list([#("A", 0), #("C", 0), #("G", 0), #("T", 0)])
      dna
      |> string.to_graphemes
      |> list.try_fold(zeros, fn(counts, letter) {
        case dict.get(counts, letter) {
          Ok(count) -> todo
          Error(Nil) -> todo
        }
      })
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: skip-invalid
    mustFail: [invalid_strand_test, invalid_at_end_test]
    errorTag: drops_invalid_input
  - key: no-zero-counts
    mustFail: [empty_strand_test, single_nucleotide_test]
    errorTag: missing_zero_counts
  - key: uppercase-input
    mustFail: [lowercase_is_invalid_test]
    errorTag: accepts_lowercase
