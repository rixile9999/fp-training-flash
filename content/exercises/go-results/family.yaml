# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 바둑 규칙을 Result로 이어 붙이기
primarySkill: explicit-failure
secondarySkills: [function-decomposition]
contextTags: [game]
source:
  kind: exercism
  license: "MIT, Copyright (c) 2021 Exercism"
  url: https://github.com/exercism/gleam/tree/main/exercises/concept/go
  upstream: "exercism/gleam exercises/concept/go@34db02e"
conceptNotes: [gleam-option-result, gleam-use-expressions, gleam-record-update]
theoryTopics: [errors-as-values, chaining-results-monads]
rubric:
  - id: R-02
    title: 파이프라인이 의도를 드러냄
    description: 규칙을 적용하는 순서가 코드를 읽는 순서와 같고, 각 단계가 실패할 수 있는지(result.try)와 없는지(result.map)가 구분된다.
  - id: R-07
    title: 오류를 삼키지 않음
    description: Error를 result.unwrap이나 기본값으로 덮어쓰지 않고, 첫 오류를 호출한 쪽까지 그대로 전달한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "result\\.unwrap\\("
      message: result.unwrap으로 오류를 기본값으로 바꿨습니다. 오류를 끝까지 전달하는지 확인하세요.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
