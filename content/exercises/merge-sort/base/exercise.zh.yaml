  2: "分治把问题拆成形状相同的更小问题（split），分别递归求解，再把结果合并（merge）。要让递归结束，必须把无法再拆的大小（0 个、1 个元素）作为基本情况处理。"
  3: "`split` 可以用 `list.length` 和 `list.split` 实现。`merge` 比较两个头元素，先取较小或相等的那个。`sort` 遇到 `[]` 和 `[_]` 时原样返回，否则先拆分、分别排序，再合并。"
