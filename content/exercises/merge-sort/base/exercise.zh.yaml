tests:
  split_even_test: split 把偶数长度的列表分成长度相同的前后两半
  split_odd_test: 长度为奇数时，后一半多一个元素
  merge_test: merge 把两个有序列表按升序合并
  sort_test: sort 把列表按升序排序
  sort_single_test: 只有一个元素的列表原样返回
  sort_duplicates_and_negatives_test: 即使有重复值和负数，也保留全部元素并排序
  sort_large_list_test: 15 万个元素的列表也能在时间限制内排好序
requirements:
  R1: split 分成前 length/2 个元素和其余部分
  R2: merge 合并两个有序列表
  R3: sort 按升序排序，保留所有元素
  R4: O(n log n)
hints:
