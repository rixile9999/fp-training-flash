# Family-level defaults; each variant's exercise.yaml may override any of these.
title: 병합 정렬
primarySkill: recursive-algorithms
secondarySkills: [data-transformation]
contextTags: []
source:
  kind: original
conceptNotes: [gleam-recursion, gleam-case-patterns, gleam-sorting-order]
theoryTopics: [divide-and-conquer, structural-recursion-induction, cost-model-immutable-structures]
rubric:
  - id: R-04
    title: 표준 정렬 함수 없이 직접 구현
    description: 이 문제의 목적은 병합 정렬을 직접 만드는 것이다. `list.sort`를 쓰지 않는다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blist\\.sort\\b"
      message: list.sort를 사용했습니다. 병합 정렬을 직접 구현하세요.
  - id: R-05
    title: 나누기와 합치기를 분리
    description: 목록을 나누는 함수와 정렬된 두 목록을 합치는 함수를 따로 두면 각각을 검증하고 재사용할 수 있다.
  - id: R-09
    title: let assert와 panic을 쓰지 않음
    description: 실패 가능성은 타입으로 표현한다.
    automatedCheck:
      kind: forbid_pattern
      pattern: "\\blet assert\\b|\\bpanic\\b"
      message: let assert 또는 panic을 사용했습니다.
