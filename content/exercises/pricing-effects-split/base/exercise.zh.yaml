  2: "打印输出是改变外部世界的效应。把要打印的字符串作为列表返回，计算就成了纯函数，真正的打印只需在接收这个列表的一个外层函数中进行。"
  3: "不必像原代码那样在一个 `fold` 中同时生成合计和记录。把两者分开计算，每个计算都会变短，也不用操心顺序。在 `render` 中，记住换行符只应放在行与行“之间”。"
