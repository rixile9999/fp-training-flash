tests:
  line_log_test: 生成单个商品行的记录字符串
  quote_total_test: 报价合计是价格乘以数量之和
  quote_log_test: 记录中商品行之后是合计行
  quote_log_order_test: 商品记录遵循输入顺序
  quote_empty_test: 没有商品时也保留合计行
  render_test: 用换行符把记录连接成一个字符串
  render_single_line_test: 只有一行的记录不加换行符
requirements:
  R1: line_log 只返回字符串，不打印输出
  R2: quote 把合计和记录作为值返回
  R3: render 只生成要打印的字符串，不打印输出
hints:
