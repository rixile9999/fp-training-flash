kind: implement
format: drill
module: pricing
difficulty: 1300
estimatedMinutes: 6
tests:
  - fn: line_log_test
    name: 품목 한 줄의 기록 문자열을 만든다
    visibility: public
    requirements: [R1]
  - fn: quote_total_test
    name: 견적 합계는 가격과 수량을 곱한 값의 합이다
    visibility: public
    requirements: [R2]
  - fn: quote_log_test
    name: 기록은 품목 줄 다음에 합계 줄이 온다
    visibility: public
    errorTag: reverses_order
    requirements: [R2]
  - fn: quote_log_order_test
    name: 품목 기록은 입력 순서를 따른다
    visibility: hidden
    errorTag: reverses_order
    requirements: [R2]
  - fn: quote_empty_test
    name: 품목이 없어도 합계 줄은 남는다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R2]
  - fn: render_test
    name: 기록을 줄바꿈으로 이어 한 문자열로 만든다
    visibility: public
    errorTag: trailing_separator
    requirements: [R3]
  - fn: render_single_line_test
    name: 한 줄짜리 기록에는 줄바꿈을 붙이지 않는다
    visibility: hidden
    errorTag: trailing_separator
    requirements: [R3]
requirements:
  - id: R1
    description: line_log는 문자열을 돌려줄 뿐 출력하지 않는다
  - id: R2
    description: quote는 합계와 기록을 값으로 돌려준다
  - id: R3
    description: render는 출력할 문자열을 만들 뿐 출력하지 않는다
hints:
  - level: 1
    kind: question
    text: 기존 `checkout`이 화면에 출력한 내용을 테스트에서 확인하려면 어떻게 해야 할까요? 출력 대신 무엇을 돌려주면 확인이 쉬워질까요?
  - level: 2
    kind: concept
    text: 출력은 바깥 세계를 바꾸는 효과입니다. 출력할 문자열을 목록으로 돌려주면 계산은 순수 함수가 되고, 실제 출력은 그 목록을 받는 바깥 함수 한 곳에서만 하면 됩니다.
  - level: 3
    kind: approach
    text: 합계와 기록을 원래 코드처럼 `fold` 하나에서 함께 만들 필요는 없습니다. 둘을 따로 계산하면 각 계산이 짧아지고 순서를 신경 쓸 일도 줄어듭니다. `render`에서는 줄바꿈이 줄 "사이"에만 들어가야 한다는 점을 기억하세요.
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn quote(items: List(Item)) -> Quote {
        let total =
          items
          |> list.map(fn(item) { item.price * item.quantity })
          |> int.sum
        let lines = list.map(items, line_log)
        Quote(total: total, log: todo)
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: prepend-log
    mustFail: [quote_log_test, quote_log_order_test]
    errorTag: reverses_order
  - key: trailing-newline
    mustFail: [render_test, render_single_line_test]
    errorTag: trailing_separator
