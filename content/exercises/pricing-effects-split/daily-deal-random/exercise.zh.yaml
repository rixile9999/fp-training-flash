title: 把随机选择与折扣计算分开
tests:
  deal_price_test: 特价是打 7 折后的价格
  deal_price_rounds_to_hundreds_test: 特价按 100 韩元向下取整
  apply_deal_test: 只把指定位置的商品改为特价
  apply_deal_first_index_test: 位置 0 是第一个商品
  apply_deal_out_of_range_test: 位置大于等于列表长度时原样返回列表
  apply_deal_negative_index_test: 位置为负数时原样返回列表
requirements:
  R1: deal_price 是只包含折扣规则的纯函数
  R2: apply_deal 以位置作为参数，而不是随机值
hints:
  1: "测试现有的 `pick_daily_deal` 时，为什么无法预先知道结果？要把这个原因移到函数外面，应该接收什么作为参数？"
  2: "生成随机值也是一种效应：每次调用结果都不同。把随机选出的结果（位置）作为参数传入，其余计算就成了纯函数。"
  3: "用 `list.index_map` 同时查看每个商品及其位置，只把位置等于参数的商品用 `deal_price` 改价。超出范围的位置不会等于任何商品的位置，所以不需要单独处理。"
  4: |
    ```gleam
    pub fn apply_deal(products: List(Product), index: Int) -> List(Product) {
      list.index_map(products, fn(product, i) {
        case i == index {
          True -> todo
          False -> product
        }
      })
    }
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
