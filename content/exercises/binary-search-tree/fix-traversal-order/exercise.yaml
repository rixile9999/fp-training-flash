kind: fix
format: drill
module: binary_search_tree
title: 정렬 결과가 틀리는 트리 순회 고치기
difficulty: 1200
estimatedMinutes: 4
tests:
  - fn: sorted_small_test
    name: 값 세 개를 오름차순으로 돌려준다
    visibility: public
    errorTag: wrong_traversal_order
    requirements: [R1]
  - fn: sorted_complex_test
    name: 여러 층의 트리도 오름차순으로 돌려준다
    visibility: public
    errorTag: wrong_traversal_order
    requirements: [R1]
  - fn: sorted_duplicates_test
    name: 같은 값은 개수만큼 모두 남긴다
    visibility: hidden
    errorTag: drops_duplicates
    requirements: [R1]
  - fn: sorted_descending_input_test
    name: 내림차순으로 들어온 값도 오름차순으로 돌려준다
    visibility: hidden
    errorTag: wrong_traversal_order
    requirements: [R1]
  - fn: sorted_empty_test
    name: 빈 목록이면 빈 목록을 돌려준다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R1]
  - fn: to_tree_unchanged_test
    name: to_tree가 만드는 트리 모양은 그대로다
    visibility: hidden
    errorTag: breaks_other_functions
    requirements: [R2]
requirements:
  - id: R1
    description: sorted_data는 오름차순
  - id: R2
    description: to_tree 동작 유지
hints:
  - level: 1
    kind: question
    text: "`to_tree([2, 1, 3])`의 모양을 그려 보세요. 지금 `walk`는 세 노드를 어떤 순서로 방문하나요? 오름차순이 되려면 어떤 순서여야 하나요?"
  - level: 2
    kind: concept
    text: "트리 순회에는 전위(자신, 왼쪽, 오른쪽), 중위(왼쪽, 자신, 오른쪽), 후위(왼쪽, 오른쪽, 자신)가 있습니다. 이진 탐색 트리에서 오름차순을 주는 것은 그중 하나뿐입니다."
  - level: 3
    kind: approach
    text: "`to_tree`는 맞습니다. `walk`에서 자기 값을 결과의 어디에 두는지만 바꾸세요."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      fn walk(tree: Tree) -> List(Int) {
        case tree {
          Empty -> []
          Node(data, left, right) -> list.flatten([todo, todo, todo])
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: postorder
    mustFail: [sorted_small_test, sorted_complex_test]
    errorTag: wrong_traversal_order
  - key: right-first
    mustFail: [sorted_small_test, sorted_complex_test]
    errorTag: wrong_traversal_order
