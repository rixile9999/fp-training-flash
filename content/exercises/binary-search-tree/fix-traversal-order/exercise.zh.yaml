title: 修复排序结果出错的树遍历
tests:
  sorted_small_test: 按升序返回三个值
  sorted_complex_test: 多层的树也按升序返回
  sorted_duplicates_test: 相等的值有几个就保留几个
  sorted_descending_input_test: 以降序传入的值也按升序返回
  sorted_empty_test: 输入空列表时返回空列表
  to_tree_unchanged_test: to_tree 构建的树形状保持不变
requirements:
  R1: sorted_data 为升序
  R2: 保持 to_tree 的行为
hints:
  1: "画出 `to_tree([2, 1, 3])` 的形状。现在的 `walk` 以什么顺序访问这三个节点？要得到升序，应该是什么顺序？"
  2: "树的遍历有前序（自身、左、右）、中序（左、自身、右）和后序（左、右、自身）。在二叉搜索树上能给出升序的只有其中一种。"
  3: "`to_tree` 是对的。只需改变 `walk` 中自身的值放在结果的哪个位置。"
  4: |
    ```gleam
    fn walk(tree: Tree) -> List(Int) {
      case tree {
        Empty -> []
        Node(data, left, right) -> list.flatten([todo, todo, todo])
      }
    }
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
