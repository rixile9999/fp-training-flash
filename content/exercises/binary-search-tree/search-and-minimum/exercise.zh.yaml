title: 二叉搜索树中的查找与最小值
tests:
  contains_found_test: 找到树中存在的值时返回 True
  contains_missing_test: 树中没有该值时返回 False
  contains_in_empty_tree_test: 在空树中找不到任何值
  minimum_test: 最小值是最左侧节点的值
  minimum_of_empty_tree_test: 空树的最小值是 Error(Nil)
  minimum_without_left_child_test: 根节点没有左子节点时，根的值就是最小值
  many_lookups_in_large_tree_test: 在 13 万个节点的树中查找 4 万次，也能在时间限制内完成
requirements:
  R1: contains 判断值是否存在
  R2: minimum 返回最小的值，空树时返回 Error(Nil)
  R3: 每次比较只向一侧子树下降
hints:
  1: "如果要找的值比当前节点的值小，它可能出现在右子树里吗？"
  2: "在二叉搜索树中，左子树的值都小于或等于节点值，右子树的值都更大。所以比较一次就能把搜索范围缩小到一侧，开销与树高成正比。"
  3: "`contains` 按要找的值与节点值的比较结果分成三种情况，只对其中一侧子树递归。对于 `minimum`，想一想最小的值位于树的什么位置，以及用什么模式能知道已经到达了那里。"
  4: |
    ```gleam
    pub fn contains(tree: Tree, value: Int) -> Bool {
      case tree {
        Empty -> False
        Node(data, _, _) if value == data -> True
        Node(data, left, _) if value < data -> todo
        Node(_, _, right) -> todo
      }
    }

    pub fn minimum(tree: Tree) -> Result(Int, Nil) {
      case tree {
        Empty -> Error(Nil)
        Node(data, Empty, _) -> todo
        Node(_, left, _) -> todo
      }
    }
    ```
  5: "现在可以打开完整讲解。看过讲解后，将通过一道新题来确认掌握程度。"
