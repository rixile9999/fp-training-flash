kind: implement
format: drill
module: binary_search_tree
title: 이진 탐색 트리에서 찾기와 최솟값
difficulty: 1400
estimatedMinutes: 5
limits: { timeMs: 6000, memoryMb: 256 }
conceptNotes: [gleam-custom-types, gleam-recursion, gleam-option-result]
theoryTopics: [structural-recursion-induction, cost-model-immutable-structures, total-vs-partial-functions]
tests:
  - fn: contains_found_test
    name: 트리에 있는 값을 찾으면 True를 반환한다
    visibility: public
    requirements: [R1]
  - fn: contains_missing_test
    name: 트리에 없는 값이면 False를 반환한다
    visibility: public
    requirements: [R1]
  - fn: contains_in_empty_tree_test
    name: 빈 트리에서는 어떤 값도 찾지 못한다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R1]
  - fn: minimum_test
    name: 최솟값은 가장 왼쪽 노드의 값이다
    visibility: public
    errorTag: stops_recursion_early
    requirements: [R2]
  - fn: minimum_of_empty_tree_test
    name: 빈 트리의 최솟값은 Error(Nil)이다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R2]
  - fn: minimum_without_left_child_test
    name: 루트에 왼쪽 자식이 없으면 루트 값이 최솟값이다
    visibility: hidden
    errorTag: stops_recursion_early
    requirements: [R2]
  - fn: many_lookups_in_large_tree_test
    name: 노드 13만 개 트리에서 4만 번 찾아도 시간 제한 안에 끝난다
    visibility: hidden
    errorTag: searches_both_subtrees
    requirements: [R3]
requirements:
  - id: R1
    description: contains는 값의 존재 여부
  - id: R2
    description: minimum은 가장 작은 값, 빈 트리면 Error(Nil)
  - id: R3
    description: 비교마다 한쪽 서브트리로만 내려간다
hints:
  - level: 1
    kind: question
    text: 찾는 값이 현재 노드 값보다 작다면, 오른쪽 서브트리에 그 값이 있을 수 있나요?
  - level: 2
    kind: concept
    text: 이진 탐색 트리에서는 왼쪽 서브트리의 값이 모두 노드 값 이하이고 오른쪽은 모두 큽니다. 그래서 비교 한 번으로 탐색할 쪽을 하나로 줄일 수 있고, 비용이 트리 높이에 비례합니다.
  - level: 3
    kind: approach
    text: "`contains`는 찾는 값과 노드 값의 비교 결과로 세 경우를 나누고, 재귀는 한쪽 서브트리에만 하세요. `minimum`은 가장
      작은 값이 트리의 어느 위치에 있는지, 거기에 도착했다는 것을 어떤 패턴으로 알 수 있는지 생각해 보세요."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      pub fn contains(tree: Tree, value: Int) -> Bool {
        case tree {
          Empty -> False
          Node(data, _, _) if value == data -> True
          Node(data, left, _) if value < data -> todo
          Node(_, _, right) -> todo
        }
      }

      pub fn minimum(tree: Tree) -> Result(Int, Nil) {
        case tree {
          Empty -> Error(Nil)
          Node(data, Empty, _) -> todo
          Node(_, left, _) -> todo
        }
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: searches-both-sides
    mustFail: [many_lookups_in_large_tree_test]
    errorTag: searches_both_subtrees
  - key: min-one-level
    mustFail: [minimum_test]
    errorTag: stops_recursion_early
