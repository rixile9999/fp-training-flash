kind: implement
format: drill
module: binary_search_tree
difficulty: 1300
estimatedMinutes: 6
tests:
  - fn: data_is_retained_test
    name: 원소 하나로 만든 트리는 그 값을 가진 노드 하나다
    visibility: public
    requirements: [R1]
  - fn: smaller_goes_left_test
    name: 더 작은 값은 왼쪽 서브트리에 들어간다
    visibility: public
    requirements: [R1]
  - fn: greater_goes_right_test
    name: 더 큰 값은 오른쪽 서브트리에 들어간다
    visibility: public
    requirements: [R1]
  - fn: equal_goes_left_test
    name: 같은 값은 왼쪽 서브트리에 들어간다
    visibility: hidden
    errorTag: equal_goes_right
    requirements: [R1]
  - fn: complex_tree_test
    name: 목록 순서대로 넣어 여러 층의 트리를 만든다
    visibility: hidden
    errorTag: inserts_in_wrong_order
    requirements: [R1, R2]
  - fn: sorted_data_test
    name: sorted_data는 값을 오름차순으로 돌려준다
    visibility: public
    requirements: [R3]
  - fn: sorted_data_keeps_duplicates_test
    name: sorted_data는 같은 값을 개수만큼 모두 남긴다
    visibility: hidden
    errorTag: drops_duplicates
    requirements: [R3]
  - fn: sorted_data_empty_test
    name: 빈 목록이면 sorted_data도 빈 목록이다
    visibility: hidden
    errorTag: ignores_empty_input
    requirements: [R3]
requirements:
  - id: R1
    description: 작거나 같으면 왼쪽, 크면 오른쪽에 삽입
  - id: R2
    description: 목록의 앞 원소부터 차례로 삽입
  - id: R3
    description: sorted_data는 중위 순회로 오름차순 목록
hints:
  - level: 1
    kind: question
    text: 빈 트리에 값을 넣으면 어떤 트리가 되나요? 노드가 있는 트리에 값을 넣을 때는 왼쪽과 오른쪽 중 한쪽만 바뀌나요, 둘 다 바뀌나요?
  - level: 2
    kind: concept
    text: "불변 트리에 값을 넣는다는 것은, 내려간 경로의 노드만 새로 만들고 반대쪽 서브트리는 그대로 공유한 새 트리를 돌려준다는 뜻입니다. 중위 순회(왼쪽, 자신, 오른쪽)는 이진 탐색 트리의 값을 오름차순으로 나열합니다."
  - level: 3
    kind: approach
    text: "`insert(tree, value)`를 따로 만들고 `to_tree`는 목록을 앞에서부터 접으며 `insert`를 호출하세요. `sorted_data`는 트리를 만든 뒤 왼쪽 결과, 자기 값, 오른쪽 결과를 차례로 이어 붙입니다."
  - level: 4
    kind: partial_code
    text: |
      ```gleam
      fn insert(tree: Tree, value: Int) -> Tree {
        case tree {
          Empty -> Node(value, Empty, Empty)
          Node(data, left, right) if value <= data -> todo
          Node(data, left, right) -> todo
        }
      }

      pub fn to_tree(data: List(Int)) -> Tree {
        list.fold(data, Empty, insert)
      }
      ```
  - level: 5
    kind: explanation
    text: 전체 해설을 열 수 있습니다. 해설을 본 뒤의 숙련 확인은 새 문제로 진행합니다.
wrong:
  - key: equal-goes-right
    mustFail: [equal_goes_left_test]
    errorTag: equal_goes_right
  - key: fold-right-insert
    mustFail: [smaller_goes_left_test, complex_tree_test]
    errorTag: inserts_in_wrong_order
  - key: ignores-duplicates
    mustFail: [equal_goes_left_test, sorted_data_keeps_duplicates_test]
    errorTag: drops_duplicates
