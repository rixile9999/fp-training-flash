title: 二叉搜索树
rubric:
  R-01:
    title: 用树的模式体现结构
    description: "用 `case` 区分 `Empty` 和 `Node` 两种情况，只对子树递归。"
  R-05:
    title: 插入与遍历分开
    description: 把插入单个元素的函数和把树展开成列表的函数分开写，就能分别复用、分别验证。
  R-09:
    title: 不使用 let assert 和 panic
    description: 用类型来表达可能的失败。
    message: 使用了 let assert 或 panic。
