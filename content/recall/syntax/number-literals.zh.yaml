title: 整数字面量写法
summary: "整数字面量可以像 `1_000_000` 这样用 `_` 分隔数位，还可以用前缀 `0x`（十六进制）、`0o`（八进制）、`0b`（二进制）。"
recognize:
  prompt: "`0b1010` 的值是？"
  choices: ["`10`", "`1010`", "`\"0b1010\"`", "编译错误"]
  feedback:
    correct: "对。`0b` 是二进制前缀，二进制的 1010 等于 10。"
    choices:
      1: "加了 `0b`，数字按二进制而不是十进制读取。"
      2: 没有引号，所以它是整数字面量，不是字符串。
      3: "`0b`、`0o`、`0x` 都是合法的整数字面量前缀。"
cloze:
  prompt: 在空白处填入数位分隔符，写出 1000。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: "把秒换算成微秒（1 秒 = 1,000,000 微秒）。大数用 `_` 分隔数位。"
  hint: "`1_000_000` 和 `1000000` 是同一个值。"
