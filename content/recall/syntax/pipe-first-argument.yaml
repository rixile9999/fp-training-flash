title: 파이프 |>
topic: pipe
order: 216
summary: "`a |> f(b)`는 `f(a, b)`예요. 파이프는 왼쪽 값을 오른쪽 함수의 첫 번째 인자로 넣습니다."
example: |
  "  hello  "
  |> string.trim
  |> string.uppercase  // -> "HELLO"
imports: [gleam/int, gleam/string]
recognize:
  prompt: "`10 |> int.subtract(3)`과 같은 식은?"
  choices: ["`int.subtract(10, 3)`", "`int.subtract(3, 10)`", "`int.subtract(3)(10)`", "`int.subtract(10)`"]
  answer: 0
  feedback:
    correct: 맞아요. 파이프 값 10이 첫 번째 인자 자리에 들어갑니다.
    choices:
      1: 마지막 자리에 넣는 것은 F#이나 Elm의 파이프예요. Gleam은 첫 번째 자리에 넣습니다.
      2: Gleam 함수는 커링되지 않으므로 이렇게 나눠 부르지 않아요.
      3: 인자가 하나 모자라요. 파이프 값도 인자로 들어갑니다.
cloze:
  prompt: 빈칸을 채워 문자열을 대문자로 바꾸세요.
  code: '"hello" ____ string.uppercase'
  answers: ["|>"]
  expected: '"HELLO"'
predict:
  prompt: 이 식의 값은?
  code: 10 |> int.subtract(3)
  expected: "7"
produce:
  prompt: 문자열의 앞뒤 공백을 지우고, 대문자로 바꾸고, 끝에 `"!"`를 붙이는 함수 본문을 파이프로 이어 쓰세요.
  header: "pub fn shout(s: String) -> String"
  checks: '#(shout("  hi "), shout("ok"), shout(""))'
  expected: '#("HI!", "OK!", "!")'
  mustUse: ["|>"]
  reference: |-
    s
    |> string.trim
    |> string.uppercase
    |> string.append("!")
  hint: "`string.append(앞, 뒤)`에 파이프로 넣으면 파이프 값이 앞쪽이 됩니다."
