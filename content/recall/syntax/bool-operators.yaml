title: 논리 연산자
topic: bool
order: 111
summary: "논리 연산자는 `&&`(그리고), `||`(또는), `!`(부정)입니다. `&&`와 `||`는 결과가 정해지면 오른쪽을 계산하지 않아요."
example: |
  True && !False  // -> True
imports: []
recognize:
  prompt: "'로그인했고 장바구니가 비어 있지 않음'을 Gleam으로 쓰면?"
  choices: ["`logged_in and not empty`", "`logged_in && !empty`", "`logged_in & ~empty`", "`logged_in && not(empty)`"]
  answer: 1
  feedback:
    correct: "맞아요. 그리고는 `&&`, 부정은 `!`입니다."
    choices:
      0: "`and`, `not`은 Python 표기예요. Gleam은 `&&`, `!`를 씁니다."
      2: "`&`, `~`는 Gleam 연산자가 아니에요. 논리곱은 `&&`, 부정은 `!`입니다."
      3: "그냥 부를 수 있는 `not` 함수는 없어요. 부정은 연산자 `!`입니다."
cloze:
  prompt: "빈칸에 '또는' 연산자를 넣으세요."
  code: "False ____ True"
  answers: ["||"]
  expected: "True"
produce:
  prompt: "로그인했고(`logged_in`) 장바구니가 비어 있지 않을 때(`cart_empty`가 아님)만 결제할 수 있습니다."
  header: "pub fn can_checkout(logged_in: Bool, cart_empty: Bool) -> Bool"
  checks: "#(can_checkout(True, False), can_checkout(True, True), can_checkout(False, False))"
  expected: "#(True, False, False)"
  mustUse: ["&&", "!"]
  reference: "logged_in && !cart_empty"
  hint: "`&&`로 잇고 `cart_empty` 앞에 `!`를 붙이세요."
