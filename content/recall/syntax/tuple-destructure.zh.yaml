title: 用 let 解构元组
summary: "`let #(a, b) = pair` 一次性拆开元组，并给每个元素命名。模式中的元素个数必须与元组相同，不需要的元素用 `_` 丢弃。"
recognize:
  prompt: "`let #(x, y) = #(1, 2, 3)` 的结果是？"
  choices: ["`x` 为 1，`y` 为 2，3 被丢弃", "编译错误：模式与元组的元素个数不同", "`y` 变成 `#(2, 3)`", "运行时失败"]
  feedback:
    correct: "对。元组的大小是类型的一部分，元素个数必须一致。"
    choices:
      0: "多出来的元素不会被悄悄丢弃。要丢弃的元素也得用 `_` 占位。"
      2: "元组模式没有列表那样的 `..rest` 剩余写法。"
      3: 大小不同就是类型不同，编译时就会发现。
cloze:
  prompt: 在空白处填入模式，把第一个元素绑定到 `label`。
produce:
  prompt: "接收 `#(商品名, 数量)`，生成 `\"apple x3\"` 这样的字符串。用 `let` 解构元组。"
  hint: "从 `let #(name, qty) = entry` 开始。"
