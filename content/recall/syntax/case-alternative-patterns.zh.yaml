title: 可选模式 |
summary: 在一个分支里用 `|` 列出多个模式，只要其中一个匹配，这个分支就会执行。
recognize:
  prompt: 值是 1、2、3 之一时匹配的分支怎么写？
  choices: ["`1 || 2 || 3 ->`", "`1 | 2 | 3 ->`", "`1, 2, 3 ->`", "`[1, 2, 3] ->`"]
  feedback:
    correct: 对。模式之间用 `|` 隔开，只要有一个匹配就行。
    choices:
      0: "`||` 是 Bool 的“或”运算符，不能用在模式里。"
      2: 逗号用于同时匹配多个值时分隔模式，比如 `case a, b, c`。
      3: 这个模式匹配的是元素恰好为 1、2、3 的列表。
cloze:
  prompt: 填空，把周六和周日归到同一个分支。
produce:
  prompt: 用可选模式写出按种类划分 HTTP 方法的函数体：`"GET"`、`"HEAD"` 是 `"read"`，`"POST"`、`"PUT"`、`"PATCH"`、`"DELETE"` 是 `"write"`，其他是 `"unknown"`。
  hint: 三个分支就够了。匹配区分大小写。
