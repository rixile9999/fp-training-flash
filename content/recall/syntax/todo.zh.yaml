title: todo
summary: "`todo` 标记尚未实现的地方。代码会带着警告通过编译，而一旦运行到这里就会崩溃。"
recognize:
  prompt: 构建仍含有 `todo` 的项目时会怎样？
  choices: ["编译错误，无法运行", "没有警告地通过编译，那个位置变成 `Nil`", "跳过那个分支，执行下一个分支", "带着警告通过编译，运行到那里时崩溃"]
  feedback:
    correct: 对。所以写了一半的代码也能运行，剩下的 `todo` 可以从警告中看到。
    choices:
      0: 这是警告（"Todo found"）而不是错误，所以正在编写的代码也能运行。
      1: 编译器会对剩下的每个 `todo` 发出警告，也不会凭空产生值。
      2: 不会跳过：一运行到那里就崩溃。
cloze:
  prompt: 填空，把三角形分支标记为尚未实现。
produce:
  prompt: 写出计算图形周长的函数体：圆是 `2.0 *. 3.14 *. r`，正方形是 `4.0 *. side`，三角形还没实现，先用 `todo` 留着。
  hint: Float 的运算符是 `*.`。剩下的分支写成 `Triangle(..) -> todo`。
