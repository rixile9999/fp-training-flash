title: 섀도잉은 변경이 아님
topic: let
order: 105
summary: "같은 이름으로 다시 `let`하면 새 바인딩이 이전 것을 가릴 뿐, 값을 바꾸지 않습니다. 이전 값을 붙잡아 둔 코드는 계속 이전 값을 봐요."
example: |
  {
    let x = 1
    let x = x + 1
    x
  }  // -> 2
imports: [gleam/string]
recognize:
  prompt: "`let x = 1` 다음 줄의 `let x = x + 1`은 무엇을 하나요?"
  choices: ["`x`의 값을 2로 바꿉니다", "이름이 같은 새 바인딩 `x`를 만들어 이전 것을 가립니다", "같은 이름을 다시 쓸 수 없어 컴파일 오류입니다", "`x`를 가변 변수로 바꿉니다"]
  answer: 1
  feedback:
    correct: 맞아요. 바인딩은 불변이고, 새 `x`가 이전 `x`를 가릴(shadowing) 뿐입니다.
    choices:
      0: 값이 바뀌는 게 아니에요. 이전 `x`는 1 그대로이고, 이후 코드가 새 `x`를 볼 뿐입니다.
      2: 같은 블록에서도 같은 이름으로 다시 `let`할 수 있어요.
      3: Gleam에는 가변 변수가 없어요. 모든 바인딩은 불변입니다.
cloze:
  prompt: "빈칸을 채워 이전 `n`의 두 배로 `n`을 다시 바인딩하세요."
  code: "{ let n = 10  let n = ____ * 2  n }"
  answers: [n]
  expected: "20"
predict:
  prompt: 이 식의 값은?
  code: |
    {
      let x = 1
      let get = fn() { x }
      let x = 2
      get() + x
    }
  expected: "3"
produce:
  prompt: "이름의 앞뒤 공백을 지우고 소문자로 바꿔 돌려주세요. 같은 이름 `name`을 `let`으로 다시 바인딩하며 한 단계씩 쓰세요."
  header: "pub fn normalize(name: String) -> String"
  checks: '#(normalize("  Ann "), normalize("BOB"), normalize(""))'
  expected: '#("ann", "bob", "")'
  mustUse: [let name]
  reference: |
    let name = string.trim(name)
    let name = string.lowercase(name)
    name
  hint: "`let name = string.trim(name)` 다음에 `let name = string.lowercase(name)`처럼 이어 가세요."
