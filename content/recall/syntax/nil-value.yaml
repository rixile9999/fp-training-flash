title: Nil
topic: nil
order: 128
summary: "`Nil`은 값이 하나뿐인 타입이자 그 값입니다. `io.println`처럼 부수효과만 있는 함수는 `Nil`을 돌려주고, `Error(Nil)`은 '이유 없이 실패'를 뜻해요."
example: |
  list.each([1, 2, 3], fn(x) { x + 1 })  // -> Nil
imports: [gleam/int, gleam/list]
recognize:
  prompt: "`io.println(\"hi\")`가 돌려주는 값은?"
  choices: ["`Nil`", "`\"hi\"`", "`Ok(Nil)`", "값이 없음 (`void`)"]
  answer: 0
  feedback:
    correct: "맞아요. 출력은 부수효과이고, 돌려주는 값은 `Nil`입니다."
    choices:
      1: 출력한 문자열을 돌려주지 않아요. 부수효과만 있는 함수라 `Nil`입니다.
      2: "`io.println`은 실패하지 않으므로 `Result`로 감싸지 않아요."
      3: "Gleam의 모든 함수는 값을 돌려줘요. '아무것도 없음'을 나타내는 값이 `Nil`입니다."
cloze:
  prompt: 빈칸을 채워 실패 이유가 없는 오류를 패턴으로 받으세요.
  code: 'case int.parse("x") { Ok(_) -> "number" Error(____) -> "no details" }'
  answers: [Nil, _]
  expected: '"no details"'
produce:
  prompt: "주문 수량이 1 이상이면 `Ok(수량)`, 아니면 이유 없이 실패를 돌려주세요."
  header: "pub fn valid_qty(qty: Int) -> Result(Int, Nil)"
  checks: "#(valid_qty(3), valid_qty(0), valid_qty(-2))"
  expected: "#(Ok(3), Error(Nil), Error(Nil))"
  mustUse: [Nil]
  reference: |
    case qty >= 1 {
      True -> Ok(qty)
      False -> Error(Nil)
    }
  hint: "실패 쪽은 `Error(Nil)`입니다."
