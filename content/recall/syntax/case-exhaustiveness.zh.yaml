title: 穷尽匹配
summary: '`case` 必须处理所有可能的值。漏掉情况会产生编译错误（"Inexhaustive patterns"），编译器会列出缺少的模式。'
recognize:
  prompt: 用 `case` 匹配 `Result` 时只写了 `Ok(n) -> n` 一个分支，会怎样？
  choices: ["遇到 `Error` 时运行中崩溃", "遇到 `Error` 时返回 `Nil`", "只有警告，仍然能运行", "编译错误"]
  feedback:
    correct: 对。编译器会指出缺少 `Error(_)` 模式，运行前就能改好。
    choices:
      0: 根本到不了运行阶段：漏掉的情况在编译时就会被发现。
      1: Gleam 不会替你填一个空值，所有情况都要自己处理。
      2: 这是错误而不是警告。警告是针对永远匹配不到的分支。
cloze:
  prompt: 填空，让 `case` 覆盖所有情况。
produce:
  prompt: 写出返回信号灯下一种颜色的函数体：红之后是绿，绿之后是黄，黄之后是红。不用 `_`，把每个构造器都写出来。
  hint: 每个构造器写一个分支，就不会漏掉情况。
