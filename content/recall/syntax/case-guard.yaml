title: 가드 if
topic: case
order: 201
summary: 패턴 뒤에 `if 조건`을 붙이면 조건이 참일 때만 그 분기가 맞아요. 가드 안에서는 함수를 호출할 수 없습니다.
example: |
  let temp = -3
  case temp {
    t if t < 0 -> "freezing"
    _ -> "ok"
  }  // -> "freezing"
imports: [gleam/int]
recognize:
  prompt: 다음 중 컴파일되지 않는 분기는?
  choices: ["`x if x > 0 ->`", "`x if x % 2 == 0 ->`", "`s if string.length(s) > 3 ->`", "`#(a, b) if a == b ->`"]
  answer: 2
  feedback:
    correct: 맞아요. 가드에서는 함수를 부를 수 없어요. 미리 `let`으로 계산해 두거나 분기 안에서 다시 `case`를 쓰세요.
    choices:
      0: 비교 연산은 가드에서 쓸 수 있어요.
      1: 산술 연산과 비교는 가드에서 쓸 수 있습니다.
      3: 패턴에서 묶은 변수끼리 비교하는 것도 됩니다.
cloze:
  prompt: 빈칸을 채워 18세 이상만 `"adult"`가 되게 하세요.
  code: |-
    let age = 15
    case age {
      a ____ a >= 18 -> "adult"
      _ -> "minor"
    }
  answers: [if]
  expected: '"minor"'
produce:
  prompt: 주문 수량 문자열을 읽는 함수 본문을 쓰세요. 양의 정수이면 `Ok(수량)`, 0 이하이면 `Error("must be positive")`, 정수가 아니면 `Error("not a number")`입니다. `int.parse`의 결과를 `case`로 나누고 가드를 쓰세요.
  header: "pub fn parse_quantity(s: String) -> Result(Int, String)"
  checks: '#(parse_quantity("3"), parse_quantity("0"), parse_quantity("-2"), parse_quantity("abc"))'
  expected: '#(Ok(3), Error("must be positive"), Error("must be positive"), Error("not a number"))'
  mustUse: [case, if]
  reference: |-
    case int.parse(s) {
      Ok(n) if n > 0 -> Ok(n)
      Ok(_) -> Error("must be positive")
      Error(_) -> Error("not a number")
    }
  hint: "가드가 거짓이면 다음 분기로 넘어가요. `Ok(n) if n > 0` 아래에 나머지 `Ok(_)` 분기를 두세요."
