title: 반복문 대신 재귀
topic: recursion
order: 211
summary: Gleam에는 `for`, `while`, `break`가 없어요. 반복은 함수가 자기 자신을 다시 부르는 재귀나 `list.map`, `list.fold` 같은 `gleam/list` 함수로 합니다.
example: |
  count_items(["a", "b", "c"])  // -> 3
imports: [gleam/list]
definitions: |
  pub fn count_items(xs: List(a)) -> Int {
    case xs {
      [] -> 0
      [_, ..rest] -> 1 + count_items(rest)
    }
  }
recognize:
  prompt: Gleam에서 리스트의 각 원소에 같은 일을 하려면?
  choices: ["`for x in xs { ... }`", "`while` 반복문으로 인덱스를 늘려 가며", "`xs.forEach(...)`", "재귀나 `list.map`, `list.each` 같은 함수"]
  answer: 3
  feedback:
    correct: 맞아요. 반복문이 없으니 재귀나 `gleam/list`의 함수를 씁니다.
    choices:
      0: Gleam에는 `for` 반복문이 없어요.
      1: "`while`도 없고, 리스트에 인덱스로 접근할 수도 없어요."
      2: Gleam에는 메서드가 없어요. 모듈 함수에 리스트를 첫 인자로 넘깁니다.
cloze:
  prompt: 반복문 없이 각 원소에 10을 곱하도록 빈칸을 채우세요.
  code: list.____([1, 2, 3], fn(x) { x * 10 })
  answers: [map]
  expected: "[10, 20, 30]"
produce:
  prompt: 0 이상인 정수의 각 자릿수를 더한 값을 돌려주는 함수 본문을 반복문 없이 재귀로 쓰세요. 예를 들어 123이면 6입니다.
  header: "pub fn digit_sum(n: Int) -> Int"
  checks: "#(digit_sum(123), digit_sum(0), digit_sum(9), digit_sum(1005))"
  expected: "#(6, 0, 9, 6)"
  mustUse: ["digit_sum("]
  reference: |-
    case n < 10 {
      True -> n
      False -> n % 10 + digit_sum(n / 10)
    }
  hint: 한 자리 수(10 미만)는 그대로 돌려줘요. 그렇지 않으면 마지막 자리 `n % 10`에 `digit_sum(n / 10)`을 더합니다.
