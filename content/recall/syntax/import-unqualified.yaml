title: 이름을 골라 가져오기
topic: imports
order: 101
summary: "`import gleam/list.{map}`처럼 `.{...}`로 가져온 함수는 모듈 이름 없이 `map(...)`으로 부릅니다. 이때도 `list.map`은 그대로 쓸 수 있어요."
example: |
  map([1, 2, 3], fn(x) { x * 10 })  // -> [10, 20, 30]
imports: ["gleam/list.{map}"]
recognize:
  prompt: "`import gleam/list.{map}` 다음에 쓸 수 있는 호출은?"
  choices: ["`map(xs, f)`만", "`list.map(xs, f)`만", "`map(xs, f)`와 `list.map(xs, f)` 둘 다", "`List.map(xs, f)`"]
  answer: 2
  feedback:
    correct: 맞아요. `.{map}`은 이름을 하나 더 들여올 뿐이고, 모듈 `list`도 함께 가져옵니다.
    choices:
      0: "`.{map}`을 붙여도 모듈 자체를 가져오므로 `list.map`도 됩니다."
      1: "`.{map}`으로 가져온 이름은 모듈 이름 없이 바로 부를 수 있어요."
      3: 모듈 이름은 소문자 `list`입니다. 대문자로 시작하는 이름은 타입이나 생성자예요.
cloze:
  prompt: "빈칸을 채워 각 원소에 1을 더하세요. (`map`은 한정 없이 가져왔습니다.)"
  code: "____([1, 2], fn(x) { x + 1 })"
  answers: [map, list.map]
  expected: "[2, 3]"
produce:
  prompt: "가격 리스트의 모든 값을 두 배로 만드세요. 한정 없이 가져온 `map`을 쓰세요."
  header: "pub fn double_all(prices: List(Int)) -> List(Int)"
  checks: "#(double_all([1, 2, 3]), double_all([]), double_all([-5]))"
  expected: "#([2, 4, 6], [], [-10])"
  mustUse: [map]
  reference: "map(prices, fn(p) { p * 2 })"
  hint: "`list.` 없이 `map(prices, fn(p) { ... })`라고 쓰면 됩니다."
