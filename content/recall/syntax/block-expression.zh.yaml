title: 代码块是表达式
summary: "代码块 `{ }` 是有值的表达式。经过其中的 `let` 之后，最后一个表达式的值就是代码块的值；块内创建的名字在块外不可见。"
recognize:
  prompt: "`let y = { let a = 2  a * 10 }` 之后，`y` 的值是？"
  choices: ["`20`", "`Nil`", "`2`", "编译错误（代码块不是值）"]
  feedback:
    correct: 对。代码块的值就是最后一个表达式 `a * 10` 的值。
    choices:
      1: 代码块不是语句的集合，而是表达式，返回最后一个表达式的值。
      2: 代码块的值是最后一个表达式的值，而不是第一个绑定。
      3: "在 Gleam 中代码块是有值的表达式，可以放在 `let` 的右边。"
cloze:
  prompt: 在空白处填入最后一个表达式，让总价成为代码块的值。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: "生成一行收据，如 `\"pen: 2200\"`。在 `let total = { ... }` 代码块里先绑定小计（`qty * price`），再加上 10% 的税（整数除法）得到总价。"
  hint: "代码块最后一行 `subtotal + subtotal / 10` 就是 `total` 的值。"
