title: use와 result.try
topic: use
order: 223
summary: "`use x <- result.try(r)`는 `r`이 `Ok(x)`이면 다음 줄로 계속하고, `Error`이면 그 자리에서 그 `Error`를 돌려줘요."
example: |
  {
    use a <- result.try(int.parse("2"))
    use b <- result.try(int.parse("3"))
    Ok(a + b)
  }  // -> Ok(5)
imports: [gleam/int, gleam/result]
definitions: |
  pub fn find_user(id: Int) -> Result(String, String) {
    case id {
      1 -> Ok("ann")
      2 -> Ok("bo")
      _ -> Error("no user")
    }
  }

  pub fn find_email(name: String) -> Result(String, String) {
    case name {
      "ann" -> Ok("ann@example.com")
      _ -> Error("no email")
    }
  }
recognize:
  prompt: "`use x <- result.try(r)`에서 `r`이 `Error(e)`이면?"
  choices: ["`x`에 `Nil`을 넣고 계속한다", "`Error(e)`를 바로 돌려주고 아래 줄은 실행하지 않는다", "프로세스가 크래시한다", "`Ok(Nil)`을 돌려준다"]
  answer: 1
  feedback:
    correct: 맞아요. 첫 `Error`에서 멈추고 그 오류를 그대로 돌려줍니다.
    choices:
      0: "`x`에는 `Ok` 안의 값만 들어와요. `Error`이면 아래 코드는 실행되지 않습니다."
      2: 크래시하는 것은 `let assert`예요. `result.try`는 오류를 값으로 돌려줍니다.
      3: 오류를 버리지 않고 받은 `Error(e)`를 그대로 돌려줘요.
cloze:
  prompt: 빈칸을 채워 파싱 결과를 `a`로 꺼내세요.
  code: |-
    {
      use a ____ result.try(int.parse("2"))
      Ok(a * 10)
    }
  answers: ["<-"]
  expected: Ok(20)
predict:
  prompt: 이 식의 값은?
  code: |-
    {
      use a <- result.try(int.parse("2"))
      use b <- result.try(int.parse("x"))
      Ok(a + b)
    }
  expected: Error(Nil)
produce:
  prompt: 위의 `find_user`와 `find_email`을 이어서 `id`인 사용자의 연락처를 `"이름 <이메일>"` 형태로 `Ok`에 담아 돌려주세요. 어느 단계든 실패하면 그 `Error`를 그대로 돌려줍니다. `use`와 `result.try`로 쓰세요.
  header: "pub fn contact(id: Int) -> Result(String, String)"
  checks: "#(contact(1), contact(2), contact(3))"
  expected: '#(Ok("ann <ann@example.com>"), Error("no email"), Error("no user"))'
  mustUse: [use, "<-", result.try]
  reference: |-
    use name <- result.try(find_user(id))
    use email <- result.try(find_email(name))
    Ok(name <> " <" <> email <> ">")
  hint: 마지막 줄은 `Ok(...)`로 감싸야 해요. 콜백도 `Result`를 돌려주기 때문입니다.
