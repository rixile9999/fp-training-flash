title: 结构相等比较
summary: "`==` 和 `!=` 按结构比较两个同类型的值。列表、元组、记录会一直比较到内部的值。"
recognize:
  prompt: "`#(1, [\"a\"]) == #(1, [\"a\"])` 的值是？"
  choices: ["`True`", "`False`（因为是不同的值）", "编译错误（元组不能比较）", "`Ok(True)`"]
  feedback:
    correct: 对。内部的值全都相同，结构就相同，所以是 `True`。
    choices:
      1: 比较的是结构而不是引用（地址）。内部的值全都相同就是 `True`。
      2: 只要类型相同，元组、列表、记录都可以用 `==` 比较。
      3: "`==` 不会失败，所以直接返回 `Bool`。"
cloze:
  prompt: 在空白处填入相等比较运算符。
produce:
  prompt: "判断一个点是否是原点。不要逐个检查字段，而是直接和 `Point(0, 0)` 整体比较。"
  hint: 记录也可以直接用 `==` 比较。
