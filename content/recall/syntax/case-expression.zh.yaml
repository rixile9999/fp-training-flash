title: case 表达式
summary: "`case` 从上到下依次尝试各个模式，返回第一个匹配分支的值。所有分支的类型必须相同。"
recognize:
  prompt: 如果 `case` 中有多个分支同时匹配，会执行哪一个？
  choices: ["从上往下第一个匹配的分支", "模式最具体的那个分支", "所有匹配的分支", "不会执行：这是编译错误"]
  feedback:
    correct: 对。分支按书写顺序尝试，所以匹配一切的 `_` 要放在最后。
    choices:
      1: Gleam 不比较模式的具体程度，而是从上往下依次尝试。
      2: "`case` 只选一个分支，并返回这一个值。"
      3: 模式重叠是允许的。永远匹配不到的分支只会产生警告。
cloze:
  prompt: 填空，根据 `n` 进行分支。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: 用 `case` 写出把 HTTP 状态码转换成说明文字的函数体：200 是 `"ok"`，404 是 `"not found"`，其他都是 `"unknown"`。
  hint: 其余所有值都由最后一个分支的 `_` 接住。
