title: 字符串前缀模式 <>
summary: 模式 `"前缀" <> rest` 在字符串以该前缀开头时匹配，并把剩余部分绑定到 `rest`。后缀（`rest <> ".txt"`）不能写成模式。
recognize:
  prompt: 能用 `case` 模式检查文件名是否以 `.txt` 结尾吗？
  choices: ["能，写成 `name <> \".txt\" ->`", "能，写成 `\"*.txt\" ->`", "不能。模式只能匹配前缀，所以用 `string.ends_with`", "能，写成 `_ <> \".txt\" ->`"]
  feedback:
    correct: 对。`<>` 模式左边必须是字符串字面量，所以只能匹配前缀。
    choices:
      0: 这是编译错误：`<>` 左边只能是字符串字面量。
      1: 模式里的字符串没有通配符。`"*.txt"` 只匹配字面上完全相同的字符串。
      3: "`<>` 左边也不能是 `_`，只能是字符串字面量。"
cloze:
  prompt: 填空，取出 `"say "` 后面的部分。
produce:
  prompt: 写出函数体：`Authorization` 头的值以 `"Bearer "` 开头时，把后面的令牌用 `Ok` 返回，否则返回 `Error(Nil)`。
  hint: 前缀里要包含空格。匹配区分大小写。
