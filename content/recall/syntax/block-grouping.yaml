title: 계산을 묶을 때는 중괄호
topic: blocks
order: 108
summary: "계산 순서를 묶을 때는 괄호가 아니라 블록 `{ }`을 씁니다. `{ 1 + 2 } * 3`은 9예요."
example: |
  { 1 + 2 } * 3  // -> 9
imports: []
recognize:
  prompt: "`(a + b) * c`를 Gleam으로 쓰면?"
  choices: ["`(a + b) * c`", "`{ a + b } * c`", "`[a + b] * c`", "`a + b * c`"]
  answer: 1
  feedback:
    correct: 맞아요. Gleam에서 식을 묶는 것은 중괄호 블록입니다.
    choices:
      0: "Gleam에서 괄호는 식을 묶지 않아요. 문법 오류가 나고 `{ }`를 쓰라는 힌트가 나옵니다."
      2: "`[a + b]`는 원소 하나짜리 리스트예요. 리스트에 `*`를 쓸 수 없습니다."
      3: "`*`가 먼저 계산돼 `a + b * c`는 `a`에 `b * c`를 더한 값이 됩니다."
cloze:
  prompt: 빈칸을 채워 덧셈을 먼저 계산하게 하세요.
  code: "____ 2 + 3 } * 4"
  answers: ["{"]
  expected: "20"
predict:
  prompt: 이 식의 값은?
  code: "10 - { 2 + 3 } * 2"
  expected: "0"
produce:
  prompt: 두 정수의 평균을 정수 나눗셈으로 구하세요. 덧셈을 먼저 하도록 묶어야 합니다.
  header: "pub fn average(a: Int, b: Int) -> Int"
  checks: "#(average(2, 4), average(3, 4), average(0, 0), average(-3, -5))"
  expected: "#(3, 3, 0, -4)"
  mustUse: ["{"]
  reference: "{ a + b } / 2"
  hint: "`(a + b) / 2` 대신 `{ a + b } / 2`라고 씁니다."
