title: 마지막 식이 반환값
topic: functions
order: 103
summary: "함수는 본문의 마지막 식의 값을 돌려줍니다. Gleam에는 `return`이 없어요."
definitions: |
  pub fn area(width: Int, height: Int) -> Int {
    let size = width * height
    size
  }
example: |
  area(3, 4)  // -> 12
imports: []
recognize:
  prompt: "`fn double(x: Int) -> Int { ... }`의 본문으로 알맞은 것은?"
  choices: ["`return x * 2`", "`x * 2`", "`x * 2;`", "`double = x * 2`"]
  answer: 1
  feedback:
    correct: 맞아요. 마지막 식 `x * 2`의 값이 그대로 반환값입니다.
    choices:
      0: "Gleam에는 `return`이 없어요. `return`이라는 이름을 찾을 수 없다는 컴파일 오류가 납니다."
      2: Gleam은 세미콜론으로 문장을 끝내지 않아요. 세미콜론을 쓰면 문법 오류입니다.
      3: 함수 이름에 값을 대입해 돌려주는 문법은 없어요. 마지막 식이 반환값입니다.
cloze:
  prompt: "블록이 `total`의 값을 돌려주도록 빈칸을 채우세요."
  code: "{ let total = 2 + 3  ____ }"
  answers: [total]
  expected: "5"
produce:
  prompt: "직사각형의 둘레를 구하세요. 가로와 세로의 합을 `let`으로 이름 붙이고, 마지막 식으로 결과를 돌려주세요."
  header: "pub fn perimeter(width: Int, height: Int) -> Int"
  checks: "#(perimeter(3, 4), perimeter(0, 0), perimeter(1, 10))"
  expected: "#(14, 0, 22)"
  mustUse: [let]
  reference: |
    let half = width + height
    half * 2
  hint: "`return` 없이 마지막 줄에 `half * 2`처럼 값만 쓰세요."
