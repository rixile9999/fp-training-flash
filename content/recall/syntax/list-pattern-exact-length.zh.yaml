title: 固定长度的列表模式
summary: 不带 `..` 的列表模式连长度也要匹配。`[x]` 只匹配恰好一个元素的列表，`[a, b]` 只匹配恰好两个元素的列表。
recognize:
  prompt: 哪些列表能匹配模式 `[x]`？
  choices: ["有一个或更多元素的列表", "恰好有一个元素的列表", "所有列表", "空列表"]
  feedback:
    correct: 对。没有 `..` 时，元素个数也必须和模式一致。
    choices:
      0: 要匹配一个或更多元素，得像 `[x, ..]` 这样加上 `..`。
      2: 匹配一切值的是 `_` 或单个变量。
      3: 空列表匹配的是 `[]`。
cloze:
  prompt: 填空，只在恰好有两个元素时相乘。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: 写出按长度描述列表的函数体：空列表返回 `"empty"`，一个元素返回 `"only "` 加上该元素，两个返回 `"pair"`，三个及以上返回 `"many"`。
