title: let assert
topic: assert
order: 226
summary: "`let assert 패턴 = 값`은 실패할 수 있는 패턴으로 값을 꺼내고, 맞지 않으면 프로세스를 크래시시켜요. 예상할 수 있는 실패에는 쓰지 말고 `Result`를 돌려주세요."
example: |
  let assert [first, ..] = [3, 4]
  first  // -> 3
imports: [gleam/int]
recognize:
  prompt: '`let assert Ok(n) = int.parse("abc")`를 실행하면?'
  choices: ["프로세스가 크래시한다", "`n`이 0이 된다", "컴파일 오류가 난다", "함수가 `Error(Nil)`을 돌려준다"]
  answer: 0
  feedback:
    correct: 맞아요. 패턴이 맞지 않으면 그 자리에서 크래시합니다. `as "메시지"`로 이유를 붙일 수 있어요.
    choices:
      1: 기본값을 넣어 주지 않아요. 기본값이 필요하면 `result.unwrap`을 쓰세요.
      2: "`let assert`는 실패할 수 있는 패턴을 허용하므로 컴파일은 됩니다."
      3: "`Error`를 대신 돌려주지 않아요. 그렇게 하려면 `case`나 `result.try`로 처리합니다."
cloze:
  prompt: 빈칸을 채워 첫 원소를 꺼내세요. 리스트가 비어 있지 않다고 확신하는 상황입니다.
  code: |-
    let ____ [first, ..] = [3, 4]
    first
  answers: [assert]
  expected: "3"
produce:
  prompt: 호출하는 쪽이 항상 숫자 문자열만 넘긴다고 보장해요. `let assert`로 `int.parse`의 결과에서 정수를 꺼내 돌려주는 함수 본문을 쓰세요.
  header: "pub fn must_parse(s: String) -> Int"
  checks: '#(must_parse("12"), must_parse("-3"), must_parse("0"))'
  expected: "#(12, -3, 0)"
  mustUse: ["let assert"]
  reference: |-
    let assert Ok(n) = int.parse(s)
    n
