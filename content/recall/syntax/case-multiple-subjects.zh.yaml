title: 用 case 同时匹配多个值
summary: 像 `case a, b { ... }` 这样用逗号列出多个值，每个分支就用逗号分隔的模式同时匹配它们，不需要包成元组。
recognize:
  prompt: "`case a, b { ... }` 的分支模式怎么写？"
  choices: ["`(0, 0) ->`", "`[0, 0] ->`", "`0, 0 ->`", "`0 && 0 ->`"]
  feedback:
    correct: 对。模式按照值的顺序用逗号列出。
    choices:
      0: 在 Gleam 里括号不用来分组。元组写作 `#(0, 0)`，要这样匹配，被匹配的值也得是 `#(a, b)`。
      1: "`[0, 0]` 是恰好有两个元素的列表模式。"
      3: "`&&` 是 Bool 运算符，不能用在模式里。"
cloze:
  prompt: 填空，同时匹配两个余数。
produce:
  prompt: 用 `case n % 3, n % 5` 写出 FizzBuzz 的函数体：15 的倍数返回 `"FizzBuzz"`，3 的倍数返回 `"Fizz"`，5 的倍数返回 `"Buzz"`，其他返回数字的字符串。
  hint: 把 `0, 0` 分支放在最前面。数字用 `int.to_string` 转换。
