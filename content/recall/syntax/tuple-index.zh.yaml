title: 元组与 .0 .1 访问
summary: "元组 `#(a, b)` 存放固定个数的值，各个值的类型可以不同。元素从 0 开始编号，用 `.0`、`.1` 读取。"
recognize:
  prompt: "`let pair = #(\"age\", 42)` 中，取出 `42` 的表达式是？"
  choices: ["`pair.1`", "`pair[1]`", "`pair.2`", "`pair.second`"]
  feedback:
    correct: "对。编号从 0 开始，第二个元素是 `.1`。"
    choices:
      1: "没有下标语法。元组用点加数字读取，如 `.1`。"
      2: "编号从 0 开始。两个元素的元组没有 `.2`，会编译错误。"
      3: 元组元素没有名字。需要具名字段时请定义记录。
cloze:
  prompt: 在空白处填入编号，取出 `True`。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: "在 `#(名字, 分数)` 列表中求分数之和。分数用 `.1` 读取。"
  hint: "在 `list.fold` 的回调里把 `entry.1` 加到累加器上。"
