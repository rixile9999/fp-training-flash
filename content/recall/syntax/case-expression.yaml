title: case 식
topic: case
order: 200
summary: "`case`는 패턴을 위에서부터 차례로 맞춰 보고, 처음 맞는 분기의 값을 돌려주는 식이에요. 모든 분기의 타입이 같아야 합니다."
example: |
  let code = 404
  case code {
    200 -> "ok"
    404 -> "not found"
    _ -> "unknown"
  }  // -> "not found"
recognize:
  prompt: "`case`에서 여러 분기의 패턴이 동시에 맞으면 어느 분기가 실행되나요?"
  choices: ["위에서 처음 맞는 분기", "가장 구체적인 패턴의 분기", "맞는 분기 모두", "컴파일 오류가 나서 실행되지 않는다"]
  answer: 0
  feedback:
    correct: 맞아요. 적힌 순서대로 시도하므로 모든 값과 맞는 `_`는 맨 아래에 둡니다.
    choices:
      1: Gleam은 패턴의 구체성을 따지지 않고 위에서부터 순서대로 시도해요.
      2: "`case`는 분기 하나만 골라 그 값 하나를 돌려주는 식이에요."
      3: 패턴이 겹쳐도 괜찮아요. 절대 맞을 수 없는 분기가 있으면 경고만 나옵니다.
cloze:
  prompt: 빈칸을 채워 `n`에 따라 분기하세요.
  code: |-
    let n = 5
    ____ n {
      0 -> "zero"
      _ -> "other"
    }
  answers: [case]
  expected: '"other"'
predict:
  prompt: 이 식의 값은?
  code: |-
    let n = 3
    case n {
      _ -> "any"
      3 -> "three"
    }
  expected: '"any"'
produce:
  prompt: HTTP 상태 코드를 설명으로 바꾸는 함수 본문을 `case`로 쓰세요. 200은 `"ok"`, 404는 `"not found"`, 그 밖은 `"unknown"`입니다.
  header: "pub fn status_text(code: Int) -> String"
  checks: "#(status_text(200), status_text(404), status_text(500), status_text(0))"
  expected: '#("ok", "not found", "unknown", "unknown")'
  mustUse: [case]
  reference: |-
    case code {
      200 -> "ok"
      404 -> "not found"
      _ -> "unknown"
    }
  hint: 나머지 모든 값은 마지막 분기의 `_`가 받습니다.
