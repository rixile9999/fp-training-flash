title: 비었는지는 길이로 확인하지 않기
topic: lists
order: 25
summary: "`list.length(xs) == 0`은 리스트 전체를 훑습니다(O(n)). 비었는지는 `list.is_empty`, `xs == []`, 또는 `[]` 패턴으로 바로 확인합니다."
example: |
  list.is_empty([])  // -> True
imports: [gleam/list]
recognize:
  prompt: 아주 긴 리스트 `xs`가 비었는지 확인하기에 가장 알맞은 식은?
  choices: ["`list.length(xs) == 0`", "`list.is_empty(xs)`", "`xs.empty?`", "`!xs`"]
  answer: 1
  feedback:
    correct: 맞아요. 첫 칸만 보고 바로 답합니다.
    choices:
      0: "결과는 맞지만 길이를 세려고 원소를 끝까지 훑어서 O(n)이 걸려요."
      2: Gleam에는 메서드 호출이 없습니다.
      3: "`!`는 `Bool`에만 쓸 수 있어요. 빈 리스트를 거짓으로 취급하는 규칙은 없습니다."
cloze:
  prompt: 빈칸을 채워 리스트가 비었는지 확인하세요.
  code: "list.____([])"
  answers: [is_empty]
  expected: "True"
produce:
  prompt: 장바구니에 물건이 하나라도 있으면 `True`를 돌려주세요.
  header: "pub fn has_items(cart: List(String)) -> Bool"
  checks: '#(has_items([]), has_items(["a"]), has_items(["a", "b"]))'
  expected: "#(False, True, True)"
  mustUse: [list.is_empty]
  reference: "!list.is_empty(cart)"
