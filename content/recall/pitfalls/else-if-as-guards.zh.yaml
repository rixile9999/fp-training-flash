title: 守卫从上到下取第一个匹配
summary: "把 `else if` 链改写成 `case` 守卫后，只会执行从上往下第一个匹配的分支。宽泛的条件放在前面会让下面的分支永远执行不到，所以要先写范围窄的条件。"
recognize:
  prompt: "`case 95 { s if s >= 70 -> \"B\"  s if s >= 90 -> \"A\"  _ -> \"C\" }` 的值是？"
  choices: ['`"B"`', '`"A"`', 编译错误（条件重叠）]
  feedback:
    correct: 对。95 先匹配了第一个分支 `s >= 70`，所以结果是 `"B"`。
    choices:
      1: "不是挑最合适的分支，而是取第一个匹配的分支。应该把 `s >= 90` 移到上面。"
      2: 守卫条件重叠不会报错，所以顺序错误很难察觉。
cloze:
  prompt: 填入正确的关键字。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: "根据摄氏温度返回水的状态：0 及以下为 `\"solid\"`，100 及以上为 `\"gas\"`，介于两者之间为 `\"liquid\"`。"
