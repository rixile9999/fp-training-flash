title: 뒤에 붙이지 말고 앞에 붙인 뒤 뒤집기
topic: lists
order: 24
summary: "`list.append(acc, [x])`는 매번 리스트 전체를 복사합니다(O(n)). 반복해서 쌓을 땐 `[x, ..acc]`로 앞에 붙이고 마지막에 `list.reverse`를 한 번 합니다."
example: |
  list.fold([1, 2, 3], [], fn(acc, x) { [x * 10, ..acc] })
  |> list.reverse  // -> [10, 20, 30]
imports: [gleam/list]
recognize:
  prompt: fold 안에서 원소를 하나씩 쌓을 때 권장하는 방식은?
  choices: ["`list.append(acc, [x])`", "`[x, ..acc]`로 쌓고 마지막에 `list.reverse`", "`acc <> [x]`", "`[..acc, x]`"]
  answer: 1
  feedback:
    correct: 맞아요. 앞에 붙이기는 O(1)이라 전체가 O(n)으로 끝납니다.
    choices:
      0: "결과는 맞지만 매번 `acc`를 통째로 복사해서 전체가 O(n²)이 됩니다."
      2: "`<>`는 문자열 전용이라 리스트에 쓰면 타입 오류예요."
      3: "`..`는 리스트 앞부분 뒤에만 올 수 있어서 `[..acc, x]`는 문법 오류입니다."
cloze:
  prompt: 빈칸을 채워 0을 리스트 앞에 붙이세요.
  code: "[0, ____[1, 2]]"
  answers: [".."]
  expected: "[0, 1, 2]"
produce:
  prompt: "`list.fold`로 짝수만 원래 순서대로 모으세요. 앞에 붙여 쌓고 마지막에 뒤집습니다."
  header: "pub fn evens(xs: List(Int)) -> List(Int)"
  checks: "#(evens([1, 2, 3, 4]), evens([]), evens([-2, 7, 0]))"
  expected: "#([2, 4], [], [-2, 0])"
  mustUse: [list.fold, "..", list.reverse]
  reference: |
    list.fold(xs, [], fn(acc, x) {
      case x % 2 == 0 {
        True -> [x, ..acc]
        False -> acc
      }
    })
    |> list.reverse
