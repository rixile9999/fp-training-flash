title: "%의 부호는 왼쪽 수를 따름"
topic: int
order: 11
summary: "`%`는 나머지(remainder)라서 결과의 부호가 나눠지는 수를 따릅니다. `-7 % 2`는 `-1`이고, 나누는 수가 양수일 때 항상 0 이상인 값은 `int.modulo`로 구합니다."
example: |
  -7 % 2  // -> -1
imports: [gleam/int]
recognize:
  prompt: "`-7 % 2`의 값은?"
  choices: ["`1`", "`-1`", "`Ok(-1)`"]
  answer: 1
  feedback:
    correct: 맞아요. 나머지의 부호는 왼쪽 수 `-7`을 따릅니다.
    choices:
      0: "Python `%`(floor modulo)의 결과예요. Gleam에서 이 값은 `int.modulo(-7, by: 2)`가 `Ok(1)`로 돌려줍니다."
      2: "`%` 연산자는 `Int`를 바로 돌려줘요. `Result`를 돌려주는 것은 `int.remainder`와 `int.modulo`입니다."
cloze:
  prompt: 빈칸을 채워 0 이상인 나머지를 구하세요.
  code: "int.____(-7, by: 2)"
  answers: [modulo]
  expected: "Ok(1)"
produce:
  prompt: 정수 `n`이 홀수인지 판별하세요. 음수도 맞게 처리해야 합니다.
  header: "pub fn is_odd(n: Int) -> Bool"
  checks: "#(is_odd(3), is_odd(-3), is_odd(0), is_odd(4))"
  expected: "#(True, True, False, False)"
  mustUse: ["%"]
  reference: "n % 2 != 0"
  hint: "`n % 2 == 1`은 음수에서 틀립니다. `-3 % 2`는 `-1`이에요."
