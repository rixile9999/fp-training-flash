title: 전역 내장 함수는 없음
topic: modules
order: 14
summary: "Gleam에는 `len`, `max`, `print`, `str` 같은 전역 내장 함수가 없습니다. 함수는 모두 모듈에 있어서 `list.length`, `int.max`, `io.println`처럼 모듈 이름을 붙여 부릅니다."
example: |
  int.max(3, 8)  // -> 8
imports: [gleam/int, gleam/string]
recognize:
  prompt: "두 정수 `a`, `b` 중 큰 값을 구하는 식은?"
  choices: ["`max(a, b)`", "`int.max(a, b)`", "`a.max(b)`", "`math.max(a, b)`"]
  answer: 1
  feedback:
    correct: 맞아요. 정수용 함수는 `gleam/int` 모듈에 있습니다.
    choices:
      0: "전역 함수 `max`는 없어서 \"Unknown variable\" 오류가 납니다."
      2: Gleam에는 메서드 호출이 없습니다.
      3: "`gleam_stdlib`에는 `math` 모듈이 없어요. 타입별로 `int.max`, `float.max`를 씁니다."
cloze:
  prompt: 빈칸에 모듈 이름을 채우세요.
  code: "____.max(3, 8)"
  answers: [int]
  expected: "8"
produce:
  prompt: 두 문자열 중 더 긴 쪽의 글자 수를 돌려주세요.
  header: "pub fn longest(a: String, b: String) -> Int"
  checks: '#(longest("ab", "abc"), longest("", ""), longest("gleam", "fp"))'
  expected: "#(3, 0, 5)"
  mustUse: [int.max, string.length]
  reference: "int.max(string.length(a), string.length(b))"
