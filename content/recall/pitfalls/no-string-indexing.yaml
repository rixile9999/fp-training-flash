title: 문자열에는 s[0]이 없음
topic: strings
order: 16
summary: "문자열에도 `s[0]` 같은 인덱싱이 없습니다. 첫 글자는 `string.first`(결과는 `Result`)로, i번째 글자는 `string.slice(s, i, 1)`로 꺼내며, 둘 다 글자(그래핌) 단위로 셉니다."
example: |
  string.first("gleam")  // -> Ok("g")
imports: [gleam/string, gleam/list]
recognize:
  prompt: "문자열 `s`의 첫 글자를 꺼내는 식은?"
  choices: ["`s[0]`", "`string.first(s)`", "`s.charAt(0)`", "`string.get(s, 0)`"]
  answer: 1
  feedback:
    correct: 맞아요. 빈 문자열일 수 있어서 `Result(String, Nil)`을 돌려줍니다.
    choices:
      0: "Gleam에는 인덱싱 문법이 없어요."
      2: Gleam에는 메서드 호출이 없습니다.
      3: "`string.get`은 없어요. i번째 글자는 `string.slice(s, i, 1)`로 꺼냅니다."
cloze:
  prompt: 빈칸을 채워 2번 위치(0부터 셈)의 글자를 꺼내세요.
  code: 'string.____("gleam", 2, 1)'
  answers: [slice]
  expected: '"e"'
predict:
  prompt: 이 식의 값은?
  code: 'string.first("👍🏽!")'
  expected: 'Ok("👍🏽")'
produce:
  prompt: "단어가 영어 소문자 모음(a, e, i, o, u)으로 시작하면 `True`를 돌려주세요. 빈 단어는 `False`입니다."
  header: "pub fn starts_with_vowel(word: String) -> Bool"
  checks: '#(starts_with_vowel("apple"), starts_with_vowel("gleam"), starts_with_vowel(""), starts_with_vowel("ok"))'
  expected: "#(True, False, False, True)"
  mustUse: [string.first]
  reference: |
    case string.first(word) {
      Ok(c) -> list.contains(["a", "e", "i", "o", "u"], c)
      Error(Nil) -> False
    }
