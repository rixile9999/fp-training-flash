title: string.replace는 전부 바꿈
topic: strings
order: 19
summary: "`string.replace`는 처음 하나가 아니라 일치하는 부분을 모두 바꿉니다. JavaScript `replace`처럼 첫 번째만 바뀐다고 생각하면 틀려요."
example: |
  string.replace("a-b-c", each: "-", with: "+")  // -> "a+b+c"
imports: [gleam/string]
recognize:
  prompt: "`string.replace(\"1,000,000\", each: \",\", with: \"\")`의 값은?"
  choices: ['`"1000,000"`', '`"1000000"`', '`Ok("1000000")`']
  answer: 1
  feedback:
    correct: 맞아요. 쉼표가 모두 지워집니다.
    choices:
      0: "JavaScript `replace`처럼 첫 번째만 바꾼 결과예요. Gleam은 전부 바꿉니다."
      2: "실패할 일이 없어서 `String`을 바로 돌려줍니다."
cloze:
  prompt: 빈칸을 채워 `-`를 모두 `_`로 바꾸세요.
  code: 'string.____("a-b-c", each: "-", with: "_")'
  answers: [replace]
  expected: '"a_b_c"'
predict:
  prompt: 이 식의 값은?
  code: 'string.replace("aaa", each: "aa", with: "b")'
  expected: '"ba"'
produce:
  prompt: "제목을 소문자로 바꾸고 공백을 모두 `-`로 바꿔 URL용 이름을 만드세요."
  header: "pub fn slugify(title: String) -> String"
  checks: '#(slugify("Hello Gleam World"), slugify(""), slugify("FP"))'
  expected: '#("hello-gleam-world", "", "fp")'
  mustUse: [string.replace]
  reference: 'title |> string.lowercase |> string.replace(each: " ", with: "-")'
