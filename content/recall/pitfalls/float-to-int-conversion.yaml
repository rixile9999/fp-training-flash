title: Float를 Int로 바꾸기
topic: float
order: 3
summary: "`Float`를 `Int`로 바꾸려면 `float.round`(반올림)나 `float.truncate`(소수점 버림)를 씁니다. `float.floor`와 `float.ceiling`은 `Int`가 아니라 `Float`를 돌려줘요."
example: |
  float.round(2.5)  // -> 3
imports: [gleam/float]
recognize:
  prompt: "`2.7`을 `Int` 값 `2`로 바꾸는 식은?"
  choices: ["`int(2.7)`", "`float.truncate(2.7)`", "`float.floor(2.7)`", "`float.round(2.7)`"]
  answer: 1
  feedback:
    correct: 맞아요. `float.truncate`는 소수점 아래를 버린 `Int`를 돌려줍니다.
    choices:
      0: "Python의 `int()` 같은 전역 변환 함수는 없어요."
      2: "`float.floor(2.7)`은 `2.0`, 즉 `Float`예요. `Int`가 필요하면 `float.truncate`나 `float.round`를 씁니다."
      3: "`float.round`는 반올림이라 `3`이 됩니다."
cloze:
  prompt: 빈칸을 채워 소수점 아래를 버린 정수를 구하세요.
  code: "float.____(2.9)"
  answers: [truncate]
  expected: "2"
predict:
  prompt: 이 식의 값은?
  code: "float.round(-2.5)"
  expected: "-3"
produce:
  prompt: 평점(Float)을 가장 가까운 정수 별 개수로 바꾸세요. 소수점 아래가 0.5이면 올립니다.
  header: "pub fn stars(rating: Float) -> Int"
  checks: "#(stars(4.4), stars(4.5), stars(0.0))"
  expected: "#(4, 5, 0)"
  mustUse: [float.round]
  reference: "float.round(rating)"
