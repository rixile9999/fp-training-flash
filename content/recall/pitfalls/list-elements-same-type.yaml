title: 리스트 원소는 모두 같은 타입
topic: lists
order: 29
summary: "리스트의 원소는 모두 같은 타입이어야 합니다. `[\"ann\", 30]`은 타입 오류이니, 서로 다른 타입을 묶을 때는 튜플 `#(\"ann\", 30)`이나 레코드를 씁니다."
example: |
  list.map([#("ann", 30), #("bo", 25)], fn(p) { p.1 })  // -> [30, 25]
imports: [gleam/list, gleam/string]
recognize:
  prompt: "이름(`String`)과 나이(`Int`)를 값 하나로 묶는 식은?"
  choices: ['`["ann", 30]`', '`#("ann", 30)`', '`("ann", 30)`', '`{"ann", 30}`']
  answer: 1
  feedback:
    correct: 맞아요. 튜플은 타입이 서로 다른 값을 정해진 개수만큼 묶습니다.
    choices:
      0: "Python이나 JavaScript와 달리 리스트에 `String`과 `Int`를 섞을 수 없어서 타입 오류예요."
      2: "Python의 튜플 문법이에요. Gleam에서 괄호로는 튜플을 만들 수 없습니다."
      3: "Erlang이나 Elixir의 튜플 문법이에요. Gleam에서 `{ }`는 블록이라 문법 오류입니다."
cloze:
  prompt: 빈칸을 채워 튜플을 만드세요.
  code: '____("ann", 30).1'
  answers: ["#"]
  expected: "30"
produce:
  prompt: "단어마다 `#(단어, 글자 수)` 튜플을 만들어 리스트로 돌려주세요."
  header: "pub fn with_lengths(words: List(String)) -> List(#(String, Int))"
  checks: '#(with_lengths(["ann", "bo"]), with_lengths([]), with_lengths([""]))'
  expected: '#([#("ann", 3), #("bo", 2)], [], [#("", 0)])'
  mustUse: ["#("]
  reference: "list.map(words, fn(w) { #(w, string.length(w)) })"
  hint: "`[w, string.length(w)]`처럼 리스트로 묶으면 타입 오류예요."
