title: 바이트 제한은 string.byte_size로
topic: strings
order: 15
summary: "`string.length`는 바이트가 아니라 글자(그래핌) 수를 셉니다. 저장 칸처럼 바이트로 정한 제한은 UTF-8 바이트 수를 세는 `string.byte_size`로 확인해요."
example: |
  #(string.length("café"), string.byte_size("café"))  // -> #(4, 5)
imports: [gleam/string]
recognize:
  prompt: "`#(string.length(\"café\"), string.byte_size(\"café\"))`의 값은?"
  choices: ["`#(4, 5)`", "`#(5, 5)`", "`#(4, 4)`", "`#(4, 8)`"]
  answer: 0
  feedback:
    correct: 맞아요. `é`는 한 글자지만 UTF-8로는 2바이트라서 바이트 수가 하나 더 많습니다.
    choices:
      1: "`string.length`는 바이트가 아니라 글자를 셉니다. `é`도 한 글자예요."
      2: "`string.byte_size`는 글자가 아니라 UTF-8 바이트를 셉니다. `é`는 2바이트예요."
      3: "글자마다 2바이트인 UTF-16(Java, JavaScript)으로 센 값이에요. Gleam 문자열은 UTF-8입니다."
cloze:
  prompt: 빈칸을 채워 UTF-8 바이트 수를 구하세요.
  code: 'string.____("👍🏽")'
  answers: [byte_size]
  expected: "8"
predict:
  prompt: 이 식의 값은?
  code: 'string.byte_size("日本")'
  expected: "6"
produce:
  prompt: "UTF-8로 최대 `limit`바이트까지 저장할 수 있는 칸에 `text`가 들어가면 `True`를 돌려주세요."
  header: "pub fn fits(text: String, limit: Int) -> Bool"
  checks: '#(fits("abc", 3), fits("café", 4), fits("", 0), fits("日本", 5), fits("日本", 6))'
  expected: "#(True, False, True, False, True)"
  mustUse: [string.byte_size]
  reference: "string.byte_size(text) <= limit"
  hint: "`string.length`로 세면 `\"café\"`가 4라서 4바이트 칸에 잘못 통과합니다."
