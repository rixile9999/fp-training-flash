title: set.from_list
topic: gleam/set
order: 44
summary: "리스트로 집합 `Set`을 만듭니다. 같은 값은 하나로 합쳐지고, 넣은 순서는 기억하지 않습니다."
example: |
  set.from_list([3, 1, 3, 2]) |> set.size  // -> 3
imports: [gleam/list, gleam/set]
signature: "set.from_list(List(a)) -> Set(a)"
frequency: 3
recognize:
  prompt: "`set.from_list([\"a\", \"b\", \"a\"])`에 대해 맞는 것은?"
  choices:
    - 중복이 있으므로 `Error(Nil)`이 된다
    - 원소가 3개인 `Set(String)`이 된다
    - 원소가 2개인 `Set(String)`이 된다
    - "`set.to_list`로 꺼내면 넣은 순서 `[\"a\", \"b\"]`가 보장된다"
  answer: 2
  feedback:
    correct: "맞아요. 두 번 나온 `\"a\"`는 하나로 합쳐집니다."
    choices:
      0: "중복은 오류가 아니에요. 조용히 하나로 합쳐지고 `Result` 없이 `Set`을 돌려줍니다."
      1: 집합은 같은 값을 두 번 담지 않아요. 중복은 하나로 합쳐집니다.
      3: "집합은 순서를 기억하지 않아요. `set.to_list`의 순서에 기대지 마세요."
cloze:
  prompt: 빈칸을 채워 서로 다른 값의 개수를 구하세요.
  code: "set.____([1, 2, 2, 3]) |> set.size"
  answers: [from_list]
  expected: "3"
predict:
  prompt: 이 식의 값은?
  code: 'set.from_list(["a", "A", "a"]) |> set.size'
  expected: "2"
produce:
  prompt: 리스트에 같은 값이 두 번 이상 나오는지 확인하세요.
  header: "pub fn has_duplicates(xs: List(Int)) -> Bool"
  checks: "#(has_duplicates([1, 2, 3]), has_duplicates([1, 2, 1]), has_duplicates([]), has_duplicates([7, 7]))"
  expected: "#(False, True, False, True)"
  mustUse: [set.from_list]
  reference: "set.size(set.from_list(xs)) < list.length(xs)"
  hint: 집합으로 바꾸면 중복이 사라집니다. 집합의 크기와 리스트의 길이를 비교하세요.
