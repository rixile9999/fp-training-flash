title: string.compare
topic: gleam/string
order: 23
summary: "두 문자열을 글자 코드 순으로 비교해 `order.Order`(`Lt`, `Eq`, `Gt`)를 돌려줍니다. 대문자가 소문자보다 앞서고, 숫자도 수가 아니라 글자로 비교합니다."
example: |
  list.sort(["pear", "apple", "fig"], by: string.compare)  // -> ["apple", "fig", "pear"]
imports: [gleam/list, gleam/string]
signature: "string.compare(String, String) -> order.Order"
frequency: 9
recognize:
  prompt: "`string.compare(\"a\", \"B\")`의 값은?"
  choices: ["`Lt`", "`Gt`", "`Eq`", "`True`"]
  answer: 1
  feedback:
    correct: "맞아요. 대문자는 코드가 더 작아서 `\"B\"`가 앞서고, `\"a\"`가 더 큽니다."
    choices:
      0: 사전처럼 대소문자를 무시하지 않아요. 글자 코드로는 대문자 `B`가 소문자 `a`보다 앞섭니다.
      2: "`Eq`는 두 문자열이 완전히 같을 때만이에요. 대소문자를 무시하려면 먼저 `string.lowercase`로 맞추세요."
      3: "`compare`는 `Bool`이 아니라 `Lt`, `Eq`, `Gt` 중 하나를 돌려줘요."
cloze:
  prompt: 빈칸을 채워 문자열을 사전순으로 정렬하세요.
  code: 'list.sort(["b", "c", "a"], by: string.____)'
  answers: [compare]
  expected: '["a", "b", "c"]'
predict:
  prompt: 이 식의 값은?
  code: 'string.compare("10", "9")'
  expected: "Lt"
produce:
  prompt: 단어 리스트를 대소문자 구분 없이 사전순으로 정렬하세요. 단어 자체는 바꾸지 않습니다.
  header: "pub fn sort_words(words: List(String)) -> List(String)"
  checks: '#(sort_words(["banana", "Apple", "cherry"]), sort_words([]), sort_words(["b", "C", "a"]))'
  expected: '#(["Apple", "banana", "cherry"], [], ["a", "b", "C"])'
  mustUse: [string.compare]
  reference: "list.sort(words, fn(a, b) { string.compare(string.lowercase(a), string.lowercase(b)) })"
  hint: "비교 함수 안에서 두 단어를 `string.lowercase`로 바꾼 뒤 비교하세요."
