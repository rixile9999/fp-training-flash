title: list.try_fold
topic: gleam/list
order: 27
summary: "`Result`를 돌려주는 콜백으로 접습니다. 콜백이 `Error`를 돌려주면 그 자리에서 멈춰 그 `Error`가 결과가 되고, 끝까지 가면 `Ok(누적값)`입니다."
example: |
  list.try_fold([1, 2, 3], 0, fn(acc, x) { Ok(acc + x) })  // -> Ok(6)
imports: [gleam/list]
signature: "list.try_fold(over: List(a), from: b, with: fn(b, a) -> Result(b, c)) -> Result(b, c)"
frequency: 8
recognize:
  prompt: "`list.try_fold`의 콜백이 중간에 `Error(e)`를 돌려주면?"
  choices: ["그 원소만 건너뛰고 계속 접는다", "즉시 멈추고 `Error(e)`가 전체 결과가 된다", "끝까지 접은 뒤 마지막 `Error`를 돌려준다", "프로그램이 패닉으로 멈춘다"]
  answer: 1
  feedback:
    correct: 맞아요. 첫 `Error`에서 멈추고, 남은 원소는 보지 않습니다.
    choices:
      0: 실패를 건너뛰는 것은 `list.filter_map` 같은 함수의 동작입니다. `try_fold`는 멈춥니다.
      2: 끝까지 가지 않습니다. 첫 `Error`가 나오면 바로 그 값이 결과입니다.
      3: 오류는 값으로 돌려줄 뿐 패닉이 아닙니다.
cloze:
  prompt: 빈칸을 채워 실패할 수 있는 접기를 하세요.
  code: "list.____([1, 2, 3], 0, fn(acc, x) { Ok(acc + x) })"
  answers: [try_fold]
  expected: "Ok(6)"
predict:
  prompt: 이 식의 값은?
  code: |
    list.try_fold([5, 3, 9], 10, fn(acc, x) {
      case acc - x >= 0 {
        True -> Ok(acc - x)
        False -> Error(acc)
      }
    })
  expected: "Error(2)"
produce:
  prompt: 잔액에서 출금액을 차례로 빼는 함수 본문을 `list.try_fold`로 쓰세요. 잔액보다 큰 출금이 나오면 `Error(Nil)`입니다.
  header: "pub fn withdraw_all(balance: Int, amounts: List(Int)) -> Result(Int, Nil)"
  checks: "#(withdraw_all(100, [30, 50]), withdraw_all(100, [30, 80]), withdraw_all(10, []))"
  expected: "#(Ok(20), Error(Nil), Ok(10))"
  mustUse: [list.try_fold]
  reference: |
    list.try_fold(amounts, balance, fn(left, amount) {
      case amount <= left {
        True -> Ok(left - amount)
        False -> Error(Nil)
      }
    })
  hint: 시작값은 `balance`이고, 콜백은 `Ok(남은 잔액)` 또는 `Error(Nil)`을 돌려줍니다.
