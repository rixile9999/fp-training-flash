title: list.sort
topic: gleam/list
order: 19
summary: 비교 함수(`by:`)를 받아 리스트를 작은 것부터 정렬합니다. 비교 함수는 `Order`(`Lt`, `Eq`, `Gt`)를 돌려주며, 정수는 `int.compare`를 넘깁니다.
example: |
  list.sort([3, 1, 2], by: int.compare)  // -> [1, 2, 3]
imports: [gleam/list, gleam/int, gleam/string]
signature: "list.sort(List(a), by: fn(a, a) -> order.Order) -> List(a)"
frequency: 11
recognize:
  prompt: "정수 리스트 `xs`를 정렬하는 식은?"
  choices: ["`list.sort(xs)`", "`list.sort(xs, by: int.compare)`", "`list.sort(xs, fn(a, b) { a < b })`", "`list.sort(int.compare, xs)`"]
  answer: 1
  feedback:
    correct: 맞아요. 기본 순서가 없으므로 비교 함수를 꼭 넘깁니다.
    choices:
      0: Gleam에는 값의 기본 순서가 없어서 비교 함수를 빼면 컴파일 오류입니다.
      2: 비교 함수는 `Bool`이 아니라 `Order`(`Lt`, `Eq`, `Gt`)를 돌려줘야 합니다.
      3: 정렬할 리스트가 첫 인자이고, 비교 함수가 두 번째입니다.
cloze:
  prompt: 빈칸을 채워 문자열을 사전 순으로 정렬하세요.
  code: 'list.sort(["b", "c", "a"], by: string.____)'
  answers: [compare]
  expected: '["a", "b", "c"]'
predict:
  prompt: 이 식의 값은?
  code: "list.sort([1, 3, 2], fn(a, b) { int.compare(b, a) })"
  expected: "[3, 2, 1]"
produce:
  prompt: 점수를 높은 것부터 정렬하는 함수 본문을 `list.sort`로 쓰세요.
  header: "pub fn ranking(scores: List(Int)) -> List(Int)"
  checks: "#(ranking([70, 95, 3]), ranking([]), ranking([5, 9, 5]))"
  expected: "#([95, 70, 3], [], [9, 5, 5])"
  mustUse: [list.sort]
  reference: "list.sort(scores, fn(a, b) { int.compare(b, a) })"
  hint: "`int.compare(b, a)`처럼 인자를 바꿔 비교하면 내림차순이 됩니다."
