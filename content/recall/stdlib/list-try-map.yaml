title: list.try_map
topic: gleam/list
order: 18
summary: 각 원소에 `Result`를 돌려주는 함수를 적용합니다. 모두 `Ok`이면 `Ok(리스트)`, 하나라도 실패하면 처음 만난 `Error`를 돌려줍니다.
example: |
  list.try_map(["1", "2", "3"], int.parse)  // -> Ok([1, 2, 3])
imports: [gleam/list, gleam/int]
signature: "list.try_map(over: List(a), with: fn(a) -> Result(b, c)) -> Result(List(b), c)"
frequency: 11
recognize:
  prompt: "`list.try_map([\"1\", \"x\", \"3\"], int.parse)`의 값은?"
  choices: ["`Ok([1, 3])`", "`[Ok(1), Error(Nil), Ok(3)]`", "`Error(Nil)`", "`Ok([1, 0, 3])`"]
  answer: 2
  feedback:
    correct: 맞아요. `"x"`에서 `int.parse`가 실패하므로 그 `Error(Nil)`이 전체 결과가 됩니다.
    choices:
      0: 실패한 원소를 건너뛰고 성공한 값만 모으는 것은 `list.filter_map`입니다.
      1: "`Result`의 리스트를 그대로 얻는 것은 `list.map(xs, int.parse)`입니다. `try_map`은 결과를 `Result` 하나로 묶습니다."
      3: 실패를 기본값으로 바꾸지 않습니다. 하나라도 실패하면 전체가 `Error`입니다.
