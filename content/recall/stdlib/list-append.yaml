title: list.append
topic: gleam/list
order: 30
summary: 첫 리스트 뒤에 둘째 리스트를 이어 붙입니다. 두 인자 모두 리스트이고, 첫 리스트 길이만큼 시간이 걸립니다.
example: |
  list.append([1, 2], [3, 4])  // -> [1, 2, 3, 4]
imports: [gleam/list]
signature: "list.append(List(a), List(a)) -> List(a)"
frequency: 7
recognize:
  prompt: "리스트 `xs` 뒤에 리스트 `ys`를 이어 붙이는 식은?"
  choices: ["`xs <> ys`", "`list.append(xs, ys)`", "`xs + ys`", "`[xs, ..ys]`"]
  answer: 1
  feedback:
    correct: 맞아요. `list.append(xs, ys)`는 `xs`의 원소 뒤에 `ys`의 원소를 둡니다.
    choices:
      0: "`<>`는 문자열 전용 연산자입니다."
      2: "`+`는 `Int` 전용입니다. Python처럼 리스트를 `+`로 이을 수 없습니다."
      3: "`[xs, ..ys]`는 `xs` 전체를 원소 하나로 `ys` 앞에 붙이는 문법이라, 여기서는 타입 오류입니다."
cloze:
  prompt: 빈칸을 채워 두 리스트를 이어 붙이세요.
  code: 'list.____(["a"], ["b", "c"])'
  answers: [append]
  expected: '["a", "b", "c"]'
produce:
  prompt: 리스트 끝에 원소 하나를 붙이는 함수 본문을 `list.append`로 쓰세요.
  header: "pub fn push_back(xs: List(Int), x: Int) -> List(Int)"
  checks: "#(push_back([1, 2], 3), push_back([], 9), push_back([5], 5))"
  expected: "#([1, 2, 3], [9], [5, 5])"
  mustUse: [list.append]
  reference: "list.append(xs, [x])"
  hint: 원소 하나도 `[x]`처럼 리스트로 감싸서 넘깁니다.
