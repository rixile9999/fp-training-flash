title: order.break_tie
summary: "只有第一次比较结果是 `Eq` 时，才使用第二次比较的结果。用于“年龄相同再按名字”这类多关键字排序。"
recognize:
  prompt: "`order.break_tie(in: Gt, with: Lt)` 的值是？"
  choices: ["`Gt`", "`Lt`", "`Eq`"]
  feedback:
    correct: 对。第一个结果不是 `Eq`，所以保持 `Gt`。
    choices:
      1: 只有第一次比较为 `Eq` 时才会用到第二次比较。
      2: 两个结果不会相互抵消或合并。第一个结果不是 `Eq` 时，它就是答案。
cloze:
  prompt: 填空，在年龄相同时按名字比较。
produce:
  prompt: "把 `#(名字, 年龄)` 列表按年龄升序排序，年龄相同时按名字升序。"
  hint: "第一个关键字是 `int.compare(a.1, b.1)`，第二个是 `string.compare(a.0, b.0)`。"
