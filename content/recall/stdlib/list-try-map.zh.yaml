title: list.try_map
summary: 对每个元素应用返回 `Result` 的函数。全部成功时得到 `Ok(列表)`，只要有一个失败，就返回遇到的第一个 `Error`。
recognize:
  prompt: "`list.try_map([\"1\", \"x\", \"3\"], int.parse)` 的值是？"
  choices: ["`Ok([1, 3])`", "`[Ok(1), Error(Nil), Ok(3)]`", "`Error(Nil)`", "`Ok([1, 0, 3])`"]
  feedback:
    correct: 对。`int.parse` 在 `"x"` 上失败，这个 `Error(Nil)` 就成了整个结果。
    choices:
      0: 跳过失败的元素、只收集成功值的是 `list.filter_map`。
      1: "原样得到 `Result` 列表的是 `list.map(xs, int.parse)`。`try_map` 会把结果合成一个 `Result`。"
      3: 失败不会被换成默认值。只要有一个失败，整个结果就是 `Error`。
cloze:
  prompt: 填空，把所有字符串转成整数。
predict:
  prompt: 这个表达式的值是？
produce:
  prompt: 用 `list.try_map` 写出函数体：把字符串形式的分数转成整数列表。只要有一个不是整数，就返回 `Error(Nil)`。
  hint: "`int.parse` 本身就是 `String -> Result(Int, Nil)` 的形式。"
