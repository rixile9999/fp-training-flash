title: int.to_float
topic: gleam/int
order: 48
summary: "`Int`를 `Float`로 바꿉니다. Gleam은 `Int`와 `Float`를 섞어 계산할 수 없으므로, 평균처럼 실수 연산이 필요하면 먼저 바꿉니다."
example: |
  int.to_float(7) /. 2.0  // -> 3.5
imports: [gleam/int, gleam/list]
signature: "int.to_float(Int) -> Float"
frequency: 2
recognize:
  prompt: "`n: Int`에 `1.5`를 곱하는 올바른 코드는?"
  choices: ["`n * 1.5`", "`n *. 1.5`", "`int.to_float(n) *. 1.5`", "`float(n) *. 1.5`"]
  answer: 2
  feedback:
    correct: 맞아요. 먼저 `Float`로 바꾼 뒤 `Float` 연산자 `*.`를 씁니다.
    choices:
      0: "`*`는 `Int` 전용이라 `Float`와 섞으면 컴파일 오류예요."
      1: "`*.`는 양쪽이 모두 `Float`여야 해요. `n`은 아직 `Int`입니다."
      3: Python식 변환이에요. Gleam에는 `float` 함수가 없고 `int.to_float`를 씁니다.
cloze:
  prompt: 빈칸을 채워 정수를 실수로 나누세요.
  code: "int.____(7) /. 2.0"
  answers: [to_float]
  expected: "3.5"
produce:
  prompt: 정수 리스트의 평균을 `Float`로 돌려주세요. 빈 리스트면 `0.0`입니다.
  header: "pub fn average(xs: List(Int)) -> Float"
  checks: "#(average([1, 2]), average([]), average([4]), average([-1, 1, 3]))"
  expected: "#(1.5, 0.0, 4.0, 1.0)"
  mustUse: [int.to_float]
  reference: |
    case xs {
      [] -> 0.0
      _ -> int.to_float(int.sum(xs)) /. int.to_float(list.length(xs))
    }
  hint: "합(`int.sum`)과 개수(`list.length`)를 각각 `int.to_float`로 바꾼 뒤 `/.`로 나누세요."
