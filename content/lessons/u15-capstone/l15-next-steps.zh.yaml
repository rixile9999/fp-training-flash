title: 结业与下一步路径
blocks:
  congrats:
    markdown: |-
      你已经走到了这里。从值与不可变性开始，到函数、case、自定义类型、列表、高阶函数、`Result`、`use`、不透明类型和故意崩溃——你已经学会了用 Gleam **思考的方式**。

      最后这节课没有代码。我们来梳理一下学到的东西可以带去哪里，以及接下来的路径。
  paths:
    markdown: |-
      推荐三条路径：

      - **Exercism 的 Gleam 路线**——做小型练习题，并获得导师反馈。是多动手写代码的好地方。
      - **CodeCrafters**——通过“亲手实现 Redis/Git”这样的大型项目培养实战手感。
      - **本平台的训练模式**——评分谜题、SRS 复习和限时模式（Code Storm）全天候开放。你在课程中答错的主题会进入个人重练队列，让你再次遇到它们。

      无论选哪条，关键都是经常做些小东西。
  next-handson:
    prompt: 如果你想“一边获得导师反馈，一边多做些小型练习题”，哪个最合适？
    choices:
      - Exercism 的 Gleam 路线
      - CodeCrafters
      - 已经没有可以练习的地方了
      - 只读 Erlang 官方文档
    feedback:
      correct: 没错！Exercism 采用小型练习题 + 导师评审的模式，最适合“多动手写”。
      choices:
        "1": CodeCrafters 更偏向亲手打造**大型项目**，而不是做小练习。
        "2": 恰恰相反，可去的地方很多——这节课就是那份清单。
        "3": 读文档也不错，但对于“导师反馈 + 练习题”这个条件，Exercism 更合适。
  next-bigproject:
    prompt: 如果你想“从零开始亲手做一个像 Redis 或 Git 那样的东西，培养实战手感”呢？
    choices:
      - CodeCrafters
      - Exercism 的 Gleam 路线
      - 只反复刷本平台的限时模式
      - 没有推荐的路径
    feedback:
      correct: 没错！CodeCrafters 专注于大型项目式学习，让你一步步亲手实现知名软件。
      choices:
        "1": Exercism 以小型练习题为主，和“亲手打造大型项目”的感觉不同。
        "2": 限时模式用于训练快速反应——和实现大型项目的目的不同。
        "3": 这节课正是推荐下一步路径的地方——有地方可去。
  next-training:
    prompt: 如果你想持续复习在课程中常答错的主题（例如 fold 的方向），本平台的什么功能能帮上忙？
    choices:
      - 训练模式——答错的主题会通过个人重练队列和 SRS 复习再次推送给你
      - 只能把所有课程从头再听一遍
      - 答错过一次的题目就再也看不到了
      - 训练模式只有新用户才能使用
    feedback:
      correct: 没错！答错的小练习会连同主题标签一起记录在失败日志里，再通过个性化的重练队列（包括 SRS）回到你面前——让你集中地再次面对薄弱环节。
      choices:
        "1": 不需要全部重听——它的设计就是让你只挑出薄弱的主题来复习。
        "2": 恰恰相反，把答错的题放进队列、让你**再次遇到**，正是核心功能。
        "3": 训练模式在结业后也一直开放——任何人都可以继续使用。
