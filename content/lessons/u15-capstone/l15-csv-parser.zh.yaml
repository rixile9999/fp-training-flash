title: 综合实战 1——单行 CSV 解析器
blocks:
  intro:
    markdown: |-
      终于到了综合实战。我们把目前学过的工具组合成**一个小程序**吧。

      目标：写一个函数，接收像 `"lucy,8"` 这样的一行 CSV，解析成 `Player(name, age)`；失败时返回**带有原因的错误**。要用到的有——自定义类型（U4）、`Result` 与错误类型（U9）、`string.split`/`case` 模式（U3、U5），以及用于组装的 `use`（U10）。

      ```gleam
      import gleam/int
      import gleam/string

      pub type ParseError {
        WrongFieldCount
        BadAge
      }

      pub type Player {
        Player(name: String, age: Int)
      }

      fn parse_age(s: String) -> Result(Int, ParseError) {
        case int.parse(s) {
          Ok(n) -> Ok(n)
          Error(_) -> Error(BadAge)
        }
      }

      fn parse_line(line: String) -> Result(Player, ParseError) {
        case string.split(line, ",") {
          [name, age_str] ->
            case parse_age(age_str) {
              Ok(age) -> Ok(Player(name: name, age: age))
              Error(e) -> Error(e)
            }
          _ -> Error(WrongFieldCount)
        }
      }
      ```

      关键在于，我们**用类型**区分了两条失败路径（字段数量不对、年龄不是数字）。
  parse-happy:
    prompt: 这是合法的输入。`parse_line("lucy,8")` 的值是什么？
    choices:
      - '`Ok(Player(name: "lucy", age: 8))`'
      - '`Player("lucy", 8)`'
      - '`Ok(#("lucy", 8))`'
      - "`Error(BadAge)`"
    feedback:
      correct: 完全正确！`split` 得到两个字段 `["lucy", "8"]`，`parse_age("8")` 是 `Ok(8)`，于是被包装成 `Ok(Player(...))`。
      choices:
        "1": 成功路径总是用 `Ok(...)` **包装**后返回——函数的返回类型是 `Result`。
        "2": 它构造的是我们定义的 `Player` 记录，而不是元组。
        "3": '`"8"` 能顺利解析成数字，所以是成功，而不是 `BadAge`。'
  split-shape:
    markdown: 为什么 `case string.split(line, ",")` 的分支写成 `[name, age_str]`？因为 `string.split` 返回的是**列表**。`"lucy,8"` 会变成 `["lucy", "8"]`——正好 2 个元素。所以 `[name, age_str]` 模式恰好匹配，而其他所有形状都会落到 `_`，变成 `WrongFieldCount`。
  split-result:
    prompt: 这个 `string.split` 的结果是什么？
    choices:
      - '`["lucy", "8"]`'
      - '`#("lucy", "8")`'
      - '`"lucy 8"`'
      - '`["lucy,8"]`'
    feedback:
      correct: 没错！`split` 按分隔符切开，返回一个**字符串列表**——有 2 个元素，所以能匹配 `[name, age_str]` 模式。
      choices:
        "1": 它是列表，不是元组——所以我们用 `[...]` 模式来匹配。
        "2": split 是用来切分的函数——不会把它们拼起来。
        "3": 按分隔符 `,` **切开**后会得到两个元素——不是整体一个。
  parse-fewfields:
    prompt: 字段不够。`parse_line("lucy")` 的值是什么？
    choices:
      - "`Error(WrongFieldCount)`"
      - "`Error(BadAge)`"
      - '`Ok(Player("lucy", 0))`'
      - "`Error(Nil)`"
    feedback:
      correct: 完全正确！`split("lucy", ",")` 是 `["lucy"]`——只有 1 个元素，不匹配 `[name, age_str]`，于是落到 `_` 分支。
      choices:
        "1": 根本到不了解析年龄那一步——在字段数量上就先被拦下了。
        "2": 不会用 0 填补缺失的值——失败就如实报告为失败。
        "3": 关键在于，错误不是含糊的 `Nil`，而是区分成了**有原因的** `WrongFieldCount`。
  parse-badage:
    prompt: 年龄不是数字。`parse_line("lucy,eight")` 的值是什么？
    choices:
      - "`Error(BadAge)`"
      - "`Error(WrongFieldCount)`"
      - '`Ok(Player("lucy", 0))`'
      - '`Ok(Player("lucy", 8))`'
    feedback:
      correct: 没错！字段有 2 个，所以这一关能过，但 `int.parse("eight")` 是 `Error(_)` → `parse_age` 返回 `BadAge`。
      choices:
        "1": 字段数量是 2 个，没问题——卡住的是解析年龄这一步。
        "2": '不会把 `"eight"` 猜成数字填进去——解析失败就如实报告。'
        "3": '`"eight"` 无法解析为整数——不会得到 `8` 这个值。'
  use-assembly:
    markdown: |-
      嵌套的 `case` 看着别扭？把两个步骤拆成各自返回 `Result` 的小函数，就能用 `use`（U10）平铺地组装起来。只要有任何一步是 `Error`，就会**立即短路**（short-circuit），并原样返回那个错误。

      ```gleam
      import gleam/result

      fn parse_line(line: String) -> Result(Player, ParseError) {
        use pair <- result.try(fields(line))
        let #(name, age_str) = pair
        use age <- result.try(parse_age(age_str))
        Ok(Player(name: name, age: age))
      }
      ```

      行为与嵌套 `case` 的版本**完全相同**——只是更好读了。
  use-shortcircuit:
    prompt: 在上面的 `use` 版本中，如果 `fields(line)` 返回 `Error(WrongFieldCount)`，后面的几行会怎样？
    choices:
      - 不会执行，立即返回 `Error(WrongFieldCount)`
      - "`age` 被填成 `0` 后继续执行"
      - 发生运行时崩溃
      - 原样返回最后的 `Ok(Player(...))`
    feedback:
      correct: 没错！`result.try` 在遇到第一个 `Error` 时短路——跳过后面的步骤，那个错误就成为函数的结果。
      choices:
        "1": 不会用默认值填补空缺——`use` 遇到失败就会停下。
        "2": 这是正常的 `Result` 流程，不是崩溃——它把错误**作为值**返回。
        "3": 要走到最后的 `Ok`，每一步都必须是 `Ok`——只要有一步是 `Error` 就到不了。
