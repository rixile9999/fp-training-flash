title: OTP와 actor — 다음 세계 (읽기 전용)
tags:
  - concept:basics
blocks:
  - prose: banner
    markdown: |-
      ⚠️ **이 레슨의 코드는 읽기만 합니다.** gleam_otp의 actor는 Erlang VM 전용이고, 이 플랫폼의 실습 환경에는 gleam_otp가 들어 있지 않아요. 브라우저(JS 타깃)에서도 돌릴 수 없습니다. Gleam 컴파일러는 타깃별 지원을 표현식 단위로 추적하기 때문에, 이런 코드는 JS로 컴파일하면 거부됩니다.

      그래서 이 레슨은 **읽고 이해하는** 레슨입니다 — 출력 예측 대신 개념 문제만 풀어요. "다음 세계"가 어떤 모습인지 미리 엿보는 시간입니다.
  - prose: what-is-actor
    markdown: |-
      지금까지 배운 상태 기계를 떠올려 보세요. `run`은 이벤트 리스트를 **한 번에** 접었습니다. 그런데 실제 서버는 이벤트가 시간에 걸쳐, 여러 곳에서 동시에 들어옵니다.

      **actor**는 그 상태 기계를 "살아 있는 프로세스"로 만든 것입니다. 자기만의 상태를 들고, 메시지를 하나씩 받아 처리하며, 다음 상태를 들고 다음 메시지를 기다립니다. 메시지를 보낼 수는 있어도 그 상태를 **직접 만질 수는 없어요** — 동시성 버그(공유 메모리 경쟁)가 원천 차단됩니다. 우리가 배운 불변성·전이 함수가 그대로 확장된 모습입니다.
  - exercise: actor-why-no-run
    type: choice
    prompt: 이 actor 코드를 JavaScript 타깃(브라우저)으로 컴파일하면 왜 거부될까요?
    choices:
      - gleam_otp는 Erlang VM 전용이고, 컴파일러가 JS 타깃 미지원을 표현식 단위로 추적하기 때문
      - actor 코드에 문법 오류가 있어서
      - 코드가 너무 길어서 브라우저가 멈추기 때문
      - Gleam은 원래 브라우저에서 전혀 실행되지 않기 때문
    answer: 0
    feedback:
      correct: 맞아요! Gleam은 Erlang과 JavaScript 두 타깃으로 컴파일되는데, OTP/actor는 Erlang VM의 기능이라 JS 타깃에선 지원되지 않습니다. 컴파일러가 이를 타깃별로 추적해요.
      choices:
        "1": 문법 문제가 아니라 **타깃(런타임) 차이** 때문입니다 — 코드 자체는 올바릅니다.
        "2": 길이의 문제가 아니에요 — Erlang 전용 기능이라 JS로는 컴파일되지 않습니다.
        "3": Gleam은 JS 타깃으로 브라우저에서도 잘 돕니다. 단지 OTP만 Erlang 전용입니다.
  - exercise: actor-vs-statemachine
    type: choice
    prompt: 우리가 U15-②에서 만든 `next`/`run` 상태 기계와 비교할 때, actor의 핵심 차이는?
    choices:
      - actor는 상태를 들고 살아서 메시지를 하나씩 비동기로 받지만, `run`은 이벤트 리스트를 한 번에 접는다
      - actor는 가변(mutable) 변수를 자유롭게 재할당할 수 있다
      - actor에는 상태 개념이 없다
      - actor는 `case`를 쓸 수 없다
    answer: 0
    feedback:
      correct: 맞아요! actor는 상태 기계를 "살아 있는 프로세스"로 만든 것 — 메시지를 시간에 걸쳐 하나씩 받아 다음 상태로 넘어갑니다. 전이 함수 사고는 그대로예요.
      choices:
        "1": actor도 여전히 불변입니다 — 상태를 재할당하는 게 아니라 다음 상태를 **돌려줍니다**.
        "2": actor의 본질이 바로 상태를 들고 다니는 것입니다 — 상태가 없는 게 아니에요.
        "3": actor 내부의 메시지 처리도 보통 `case`로 분기합니다 — 우리가 배운 그대로예요.
  - exercise: actor-shared-state
    type: choice
    prompt: actor 모델이 동시성 버그를 줄여 주는 이유로 가장 알맞은 것은?
    choices:
      - 다른 프로세스가 actor의 상태를 직접 만지지 못하고 메시지로만 소통해서, 공유 메모리 경쟁이 사라지기 때문
      - actor는 한 번에 하나의 프로그램만 실행되도록 강제하기 때문
      - actor를 쓰면 모든 함수가 자동으로 빨라지기 때문
      - actor는 에러를 절대 일으키지 않기 때문
    answer: 0
    feedback:
      correct: 맞아요! 상태는 actor 안에 갇혀 있고 바깥은 메시지만 보냅니다 — 여러 프로세스가 같은 메모리를 동시에 건드리는 고전적 경쟁 조건이 구조적으로 사라져요. 불변성 + 메시지 패싱의 힘입니다.
      choices:
        "1": 오히려 반대예요 — 여러 actor가 **동시에** 돌면서도 안전한 게 장점입니다.
        "2": actor는 동시성 모델이지 속도 보장 도구가 아니에요 — 빨라진다는 보장은 없습니다.
        "3": actor도 실패할 수 있어요 — OTP는 오히려 "실패하면 감독자가 재시작"하는 철학(U13의 크래시 사고와 연결)입니다.
