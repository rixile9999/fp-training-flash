title: OTP 与 actor——下一个世界（只读）
blocks:
  banner:
    markdown: |-
      ⚠️ **本课的代码只供阅读。** gleam_otp 的 actor 只能在 Erlang VM 上运行，而本平台的练习环境并不包含 gleam_otp。它也无法在浏览器（JS 目标）中运行。Gleam 编译器会以表达式为单位追踪各目标平台的支持情况，所以这类代码在编译到 JS 时会被拒绝。

      因此，本课是一节以**阅读和理解**为主的课——不做输出预测，只做概念题。这是提前窥探“下一个世界”是什么样子的机会。
  what-is-actor:
    markdown: |-
      回想一下我们刚学过的状态机。`run` **一次性**折叠了整个事件列表。但真实的服务器会随着时间推移、从多个地方同时收到事件。

      **actor** 就是把那个状态机变成“活着的进程”。它持有自己的状态，一次接收并处理一条消息，然后带着下一个状态等待下一条消息。你可以给它发消息，却**无法直接触碰**它的状态——并发 bug（共享内存竞争）从源头上就被杜绝了。这正是我们学过的不可变性和转移函数原封不动地扩展开来的样子。
  actor-why-no-run:
    prompt: 为什么把这段 actor 代码编译到 JavaScript 目标（浏览器）时会被拒绝？
    choices:
      - 因为 gleam_otp 只能在 Erlang VM 上运行，而编译器会以表达式为单位，追踪哪些代码在 JS 目标上不受支持
      - 因为 actor 代码里有语法错误
      - 因为代码太长，会让浏览器卡死
      - 因为 Gleam 本来就完全不能在浏览器中运行
    feedback:
      correct: 没错！Gleam 可以编译到 Erlang 和 JavaScript 两个目标，但 OTP/actor 是 Erlang VM 的功能，所以 JS 目标不支持。编译器会按目标平台追踪这一点。
      choices:
        "1": 不是语法问题，而是因为**目标平台（运行时）的差异**——代码本身是正确的。
        "2": 不是长度的问题——它是 Erlang 专属的功能，所以无法编译到 JS。
        "3": Gleam 通过 JS 目标可以在浏览器里正常运行。只是 OTP 专属于 Erlang。
  actor-vs-statemachine:
    prompt: 与我们在 U15-② 中写的 `next`/`run` 状态机相比，actor 的关键区别是什么？
    choices:
      - actor 持有状态、一直活着，异步地一次接收一条消息；而 `run` 是一次性折叠整个事件列表
      - actor 可以随意给可变（mutable）变量重新赋值
      - actor 没有状态的概念
      - actor 不能使用 `case`
    feedback:
      correct: 没错！actor 就是把状态机变成“活着的进程”——随着时间推移一次接收一条消息，并进入下一个状态。转移函数的思路完全不变。
      choices:
        "1": actor 仍然是不可变的——它不是重新给状态赋值，而是**返回**下一个状态。
        "2": 持有状态正是 actor 的本质——并不是没有状态。
        "3": actor 内部处理消息时通常也用 `case` 来分支——和我们学过的完全一样。
  actor-shared-state:
    prompt: actor 模型能减少并发 bug，最恰当的理由是什么？
    choices:
      - 因为其他进程无法直接触碰 actor 的状态，只能通过消息通信，所以共享内存竞争消失了
      - 因为 actor 强制一次只运行一个程序
      - 因为使用 actor 后所有函数都会自动变快
      - 因为 actor 绝不会出错
    feedback:
      correct: 没错！状态被关在 actor 内部，外部只能发送消息——多个进程同时改动同一块内存的经典竞态条件从结构上就消失了。这就是不可变性 + 消息传递的力量。
      choices:
        "1": 恰恰相反——优点在于多个 actor **并发**运行，却依然安全。
        "2": actor 是并发模型，而不是保证速度的工具——并不保证会变快。
        "3": actor 也可能失败——OTP 的理念反而是“失败了就由监督者（supervisor）重启”（与 U13 的崩溃思路相呼应）。
