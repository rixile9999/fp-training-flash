title: 수료와 다음 경로
tags:
  - concept:basics
blocks:
  - prose: congrats
    markdown: |-
      여기까지 왔습니다. 값과 불변성에서 시작해 함수·case·커스텀 타입·리스트·고차 함수·`Result`·`use`·opaque 타입·의도적 크래시까지 — Gleam으로 **생각하는 법**을 익혔어요.

      이 마지막 레슨은 코드가 없습니다. 배운 것을 어디로 가져갈지, 다음 경로를 정리합니다.
  - prose: paths
    markdown: |-
      추천 경로 세 가지:

      - **Exercism Gleam 트랙** — 작은 연습 문제를 멘토 피드백과 함께 풉니다. 손으로 더 많이 써 볼 곳.
      - **CodeCrafters** — "직접 Redis/Git을 만들어 보기" 같은 큰 프로젝트로 실전 감각을 키웁니다.
      - **본 플랫폼 트레이닝 모드** — 레이팅 퍼즐·SRS 복습·타임드(Code Storm)가 상시 운영됩니다. 레슨에서 틀린 테마는 개인 재훈련 큐로 들어가 다시 만나게 됩니다.

      무엇을 고르든, 작은 것을 자주 만드는 것이 핵심입니다.
  - exercise: next-handson
    type: choice
    prompt: '"멘토 피드백을 받으며 작은 연습 문제를 더 풀고 싶다"면 어디가 가장 알맞을까요?'
    choices:
      - Exercism Gleam 트랙
      - CodeCrafters
      - 더 이상 연습할 곳은 없다
      - Erlang 공식 문서만 읽기
    answer: 0
    feedback:
      correct: 맞아요! Exercism은 작은 연습 문제 + 멘토 리뷰 모델이라 "손으로 더 써 보기"에 가장 잘 맞습니다.
      choices:
        "1": CodeCrafters는 작은 연습보다 **큰 프로젝트**를 직접 만드는 쪽에 가깝습니다.
        "2": 오히려 갈 곳이 많아요 — 이 레슨이 그 목록입니다.
        "3": 문서 읽기도 좋지만, "멘토 피드백 + 연습 문제"라는 조건엔 Exercism이 더 맞습니다.
  - exercise: next-bigproject
    type: choice
    prompt: '"Redis나 Git 같은 걸 처음부터 직접 만들어 보며 실전 감각을 키우고 싶다"면?'
    choices:
      - CodeCrafters
      - Exercism Gleam 트랙
      - 본 플랫폼의 타임드 모드만 반복
      - 아무 경로도 추천되지 않는다
    answer: 0
    feedback:
      correct: 맞아요! CodeCrafters는 유명 소프트웨어를 단계적으로 직접 구현하는 큰 프로젝트형 학습에 특화돼 있습니다.
      choices:
        "1": Exercism은 작은 연습 문제 중심이라 "큰 프로젝트 직접 만들기"와는 결이 다릅니다.
        "2": 타임드 모드는 빠른 반사 훈련용이에요 — 큰 프로젝트 구현과는 목적이 다릅니다.
        "3": 이 레슨이 바로 다음 경로를 추천하는 곳입니다 — 갈 곳이 있어요.
  - exercise: next-training
    type: choice
    prompt: "레슨에서 자주 틀린 테마(예: fold 방향)를 꾸준히 복습하고 싶다면, 본 플랫폼에서 무엇이 도와줄까요?"
    choices:
      - 트레이닝 모드 — 틀린 테마가 개인 재훈련 큐와 SRS 복습으로 다시 서빙된다
      - 레슨을 처음부터 전부 다시 듣는 것만이 방법이다
      - 한 번 틀린 문제는 다시 볼 수 없다
      - 트레이닝 모드는 새 사용자만 쓸 수 있다
    answer: 0
    feedback:
      correct: 맞아요! 틀린 마이크로 연습은 테마 태그와 함께 실패 로그로 쌓여 개인화 재훈련 큐(SRS 포함)로 돌아옵니다 — 약한 곳을 집중적으로 다시 만나게 됩니다.
      choices:
        "1": 전체를 다시 들을 필요 없어요 — 약한 테마만 골라 복습하도록 설계돼 있습니다.
        "2": 오히려 틀린 문제를 **다시 만나도록** 큐에 넣는 게 핵심 기능입니다.
        "3": 트레이닝 모드는 수료 후에도 상시 운영됩니다 — 누구나 계속 쓸 수 있어요.
