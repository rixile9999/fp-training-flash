title: 종합 2 — 상태 기계
tags:
  - concept:basics
blocks:
  - prose: intro
    markdown: |-
      두 번째 종합 과제는 **상태 기계(state machine)**입니다. 상태와 이벤트를 각각 variant로 정의하고, `(상태, 이벤트) -> 다음 상태` 전이 함수를 `case`로 적습니다.

      예: 동전을 넣어야 열리는 개찰구.

      ```gleam
      pub type State {
        Locked
        Unlocked
      }

      pub type Event {
        Coin
        Push
      }

      fn next(state: State, event: Event) -> State {
        case state, event {
          Locked, Coin -> Unlocked
          Locked, Push -> Locked
          Unlocked, Coin -> Unlocked
          Unlocked, Push -> Locked
        }
      }
      ```

      `case state, event`로 **두 값을 동시에** 매칭합니다. 상태 2종 × 이벤트 2종 = 가지 4개 — 컴파일러가 빠진 조합이 없는지 검사해 줍니다(exhaustiveness, U4).
  - exercise: next-coin
    type: predict
    prompt: 잠긴 개찰구에 동전을 넣습니다. `next(Locked, Coin)`의 값은?
    code: next(Locked, Coin)
    choices:
      - "`Unlocked`"
      - "`Locked`"
      - "`Coin`"
      - "`Ok(Unlocked)`"
    answer: 0
    feedback:
      correct: 맞아요! `Locked, Coin -> Unlocked` 가지에 매칭됩니다 — 동전이 빗장을 풉니다.
      choices:
        "1": 동전을 넣으면 상태가 바뀝니다 — `Locked`에 머물지 않아요.
        "2": "`next`는 **다음 상태**를 돌려줍니다 — 이벤트(`Coin`)가 아니에요."
        "3": 이 전이 함수는 그냥 `State`를 돌려줍니다 — `Result`로 감싸지 않아요.
  - exercise: next-push-locked
    type: predict
    prompt: 잠긴 개찰구를 그냥 밉니다. `next(Locked, Push)`의 값은?
    code: next(Locked, Push)
    choices:
      - "`Locked`"
      - "`Unlocked`"
      - "`Push`"
      - "`Error(Locked)`"
    answer: 0
    feedback:
      correct: 정확해요! `Locked, Push -> Locked` — 동전 없이 밀면 그대로 잠긴 상태입니다.
      choices:
        "1": 밀기만으로는 안 열려요 — 동전을 넣어야 `Unlocked`가 됩니다.
        "2": 결과는 다음 **상태**예요 — 이벤트가 아닙니다.
        "3": 막힌 것은 정상 전이일 뿐 에러가 아니에요 — 그냥 `Locked`로 남습니다.
  - prose: run-fold
    markdown: |-
      이벤트가 **여러 개**라면? `list.fold`(U8)로 초기 상태에서 시작해 이벤트를 하나씩 먹이면 됩니다 — 누산기가 곧 상태예요.

      ```gleam
      import gleam/list

      fn run(state: State, events: List(Event)) -> State {
        list.fold(events, state, fn(s, e) { next(s, e) })
      }
      ```

      fold의 누산기 타입이 원소 타입과 달라도 된다(U8)는 점이 여기서 빛납니다 — 누산기는 `State`, 원소는 `Event`예요.
  - exercise: run-sequence
    type: predict
    prompt: 잠긴 상태에서 이벤트 4개를 순서대로 처리합니다. `run(Locked, [Coin, Push, Push, Coin])`의 값은?
    code: run(Locked, [Coin, Push, Push, Coin])
    choices:
      - "`Unlocked`"
      - "`Locked`"
      - "`[Unlocked, Locked, Locked, Unlocked]`"
      - "`Coin`"
    answer: 0
    feedback:
      correct: 맞아요! Locked →(Coin) Unlocked →(Push) Locked →(Push) Locked →(Coin) Unlocked. 마지막 상태는 `Unlocked`입니다.
      choices:
        "1": 마지막 이벤트가 `Coin`이라 잠금이 풀려요 — 끝 상태는 `Unlocked`입니다.
        "2": fold는 **마지막 누산기 하나**만 돌려줍니다 — 중간 상태 리스트가 아니에요.
        "3": "`run`은 최종 **상태**를 돌려줍니다 — 이벤트가 아닙니다."
  - exercise: run-push-first
    type: predict
    prompt: 이번엔 밀고 나서 동전. `run(Locked, [Push, Coin])`의 값은?
    code: run(Locked, [Push, Coin])
    choices:
      - "`Unlocked`"
      - "`Locked`"
      - "`Error(Push)`"
      - "`[Locked, Unlocked]`"
    answer: 0
    feedback:
      correct: 정확해요! Locked →(Push) Locked →(Coin) Unlocked. 먼저 민 것은 효과 없이 잠긴 채였다가, 동전으로 풀립니다.
      choices:
        "1": 마지막에 동전을 넣었으니 풀립니다 — `Locked`로 끝나지 않아요.
        "2": 잘못된 순서의 이벤트도 그냥 "상태 유지"로 흡수돼요 — 에러가 아닙니다.
        "3": fold는 중간 과정을 모으지 않고 **최종 상태**만 줍니다.
  - exercise: exhaustiveness
    type: choice
    prompt: 전이 함수에서 `Unlocked, Push -> Locked` 가지를 **삭제하면** 어떻게 될까요?
    choices:
      - 컴파일 에러 — 매칭되지 않는 조합(Unlocked, Push)이 있다고 컴파일러가 막는다
      - 잘 컴파일되고, 그 조합이 오면 런타임에 무시된다
      - 잘 컴파일되고, 그 조합이 오면 자동으로 `Unlocked`가 된다
      - 경고만 뜨고 컴파일은 통과한다
    answer: 0
    feedback:
      correct: 맞아요! `case`는 모든 조합을 빠짐없이 다뤄야 합니다(exhaustiveness). 한 조합을 빼면 컴파일 자체가 거부돼요 — 상태 기계의 구멍을 컴파일 타임에 잡아 줍니다.
      choices:
        "1": Gleam은 "런타임에 무시" 같은 건 없어요 — 빠진 케이스는 컴파일을 막습니다.
        "2": 빠진 가지를 어떤 값으로도 자동 채우지 않습니다 — 직접 다 적어야 해요.
        "3": 누락된 case는 경고가 아니라 **에러**입니다 — 컴파일이 통과하지 않아요.
