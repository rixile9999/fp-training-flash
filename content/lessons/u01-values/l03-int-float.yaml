title: Int와 Float는 남남
tags:
  - concept:ints
  - concept:floats
blocks:
  - prose: intro
    markdown: |-
      Gleam은 정수(`Int`)와 실수(`Float`)를 엄격히 구분합니다. 둘 사이의 **암묵적 변환이 없어요**.

      그래서 Float 연산자에는 점이 붙습니다: `+.`  `-.`  `*.`  `/.`  정수는 `+ - * /`를 그대로 씁니다.
  - exercise: int-div
    type: predict
    prompt: 정수 나눗셈의 결과는? (Gleam의 `/`는 정수끼리면 몫만 남깁니다)
    code: 10 / 3
    choices:
      - "`3.333`"
      - "`3`"
      - "`4`"
      - "`3.0`"
    answer: 1
    feedback:
      correct: 맞아요! 정수 나눗셈은 몫만 남깁니다 — 10 / 3 = 3.
      choices:
        "0": 그건 실수 나눗셈의 결과예요. `/`는 정수끼리면 몫만 줍니다.
        "2": 내림이지 올림이 아니에요. 10 / 3의 몫은 3.
        "3": 결과는 `Int` 값 3이지 `Float` 3.0이 아니에요. 타입이 다릅니다.
  - exercise: float-div
    type: predict
    prompt: 실수 나눗셈의 결과는?
    code: 10.0 /. 4.0
    choices:
      - "`2`"
      - "`2.5`"
      - "`2.0`"
      - 컴파일 에러
    answer: 1
    feedback:
      correct: 정확해요! `/.`는 Float 나눗셈이라 2.5를 줍니다.
      choices:
        "0": 결과는 `Float`예요 — `2`(Int)가 아니라 `2.5`.
        "2": 10.0 /. 4.0 = 2.5입니다. 2.0이 아니에요.
        "3": "`/.`는 올바른 Float 연산자라 정상 컴파일됩니다."
  - prose: no-mixing
    markdown: 정수와 실수를 한 연산에 **섞으면 컴파일되지 않습니다**. Gleam은 조용히 변환하지 않아요 — 변환이 필요하면 `int.to_float` 같은 함수로 명시해야 합니다.
  - exercise: mixed-arith
    type: choice
    prompt: 표현식 `1 + 2.0`을 Gleam이 어떻게 다룰까요?
    choices:
      - "`3.0`"
      - "`3`"
      - 컴파일 에러 (타입 불일치)
      - "`2.0`으로 반올림"
    answer: 2
    feedback:
      correct: 맞아요! `Int`와 `Float`는 섞을 수 없어요. 컴파일러가 타입 불일치(Type mismatch) 에러로 막습니다.
      choices:
        "0": 암묵적 변환이 없어서 3.0이 되지 않아요 — 아예 컴파일이 안 됩니다.
        "1": Int로 변환되지도 않습니다. 타입이 어긋나면 컴파일 에러예요.
        "3": Gleam은 조용히 변환하지 않습니다 — 직접 `int.to_float(1)`을 써야 해요.
  - exercise: fix-float-op
    type: choice
    prompt: '`Float`를 받아 0.5를 더하려는 함수 본문 `x + 0.5`가 컴파일 에러("Use +. instead")를 냅니다. 올바른 수정은?'
    choices:
      - "`x +. 0.5`"
      - "`x + 0.5.0`"
      - "`x .+ 0.5`"
      - "`x + int.to_float(0.5)`"
    answer: 0
    feedback:
      correct: 맞아요! Float 덧셈 연산자는 점이 붙은 `+.`입니다. `x +. 0.5`로 고치면 됩니다.
      choices:
        "1": "`0.5.0` 같은 숫자 표기는 없습니다 — 연산자를 `+.`로 바꿔야 해요."
        "2": "점은 연산자 **뒤**에 붙습니다: `+.` `-.` `*.` `/.` — `.+`는 없는 문법이에요."
        "3": "`0.5`는 이미 `Float`라 변환이 불필요하고, 문제는 연산자(`+` → `+.`)에 있습니다."
