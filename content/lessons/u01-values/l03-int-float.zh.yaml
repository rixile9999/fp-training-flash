title: Int 和 Float 互不相干
blocks:
  intro:
    markdown: |-
      Gleam 严格区分整数（`Int`）和浮点数（`Float`）。两者之间**没有隐式转换**。

      所以 Float 运算符都带一个点：`+.`  `-.`  `*.`  `/.`，整数则直接用 `+ - * /`。
  int-div:
    prompt: 这个整数除法的结果是什么？（Gleam 的 `/` 用于两个整数时只保留商）
    choices:
      - "`3.333`"
      - "`3`"
      - "`4`"
      - "`3.0`"
    feedback:
      correct: 没错！整数除法只保留商——10 / 3 = 3。
      choices:
        "0": 那是浮点数除法的结果。`/` 用于整数时只给出商。
        "2": 是向下取整，不是向上取整。10 / 3 的商是 3。
        "3": 结果是 `Int` 值 3，而不是 `Float` 3.0。它们是不同的类型。
  float-div:
    prompt: 这个浮点数除法的结果是什么？
    choices:
      - "`2`"
      - "`2.5`"
      - "`2.0`"
      - 编译错误
    feedback:
      correct: 完全正确！`/.` 是 Float 除法，所以结果是 2.5。
      choices:
        "0": 结果是 `Float`——是 `2.5`，而不是 `2`（Int）。
        "2": 10.0 /. 4.0 = 2.5，不是 2.0。
        "3": "`/.` 是正确的 Float 运算符，可以正常编译。"
  no-mixing:
    markdown: 整数和浮点数一旦在同一个运算中**混用，就无法编译**。Gleam 不会悄悄帮你转换——需要转换时，必须用 `int.to_float` 这样的函数显式写出来。
  mixed-arith:
    prompt: Gleam 会怎样处理表达式 `1 + 2.0`？
    choices:
      - "`3.0`"
      - "`3`"
      - 编译错误（类型不匹配）
      - 舍入为 `2.0`
    feedback:
      correct: 没错！`Int` 和 `Float` 不能混用。编译器会以类型不匹配（Type mismatch）错误拦下它。
      choices:
        "0": 没有隐式转换，所以不会变成 3.0——根本无法编译。
        "1": 也不会被转换成 Int。类型不匹配就是编译错误。
        "3": Gleam 不会悄悄转换——你必须自己写 `int.to_float(1)`。
  fix-float-op:
    prompt: 某个函数接收一个 `Float` 并想给它加上 0.5，但函数体 `x + 0.5` 报了编译错误（“Use +. instead”）。正确的改法是？
    choices:
      - "`x +. 0.5`"
      - "`x + 0.5.0`"
      - "`x .+ 0.5`"
      - "`x + int.to_float(0.5)`"
    feedback:
      correct: 没错！Float 加法运算符是带点的 `+.`。改成 `x +. 0.5` 就行了。
      choices:
        "1": 不存在 `0.5.0` 这样的数字写法——应该把运算符改成 `+.`。
        "2": 点要加在运算符**后面**：`+.` `-.` `*.` `/.`——`.+` 不是合法语法。
        "3": "`0.5` 本来就是 `Float`，不需要转换；问题出在运算符上（`+` → `+.`）。"
