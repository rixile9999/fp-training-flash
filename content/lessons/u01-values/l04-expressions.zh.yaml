title: 一切皆表达式
blocks:
  intro:
    markdown: |-
      Gleam 中没有“语句（statement）”。`case`、花括号块 `{ ... }`、条件分支，全都是**产生值的表达式**。

      所以在 Gleam 中，不会像其他语言那样“在 if 里给变量赋值”，而是**把整个表达式的结果用 `let` 绑定起来**。
  block-value:
    prompt: 花括号块也是表达式——最后一行的值就是整个块的值。`y` 的值是多少？
    choices:
      - "`5`"
      - "`2`"
      - "`3`"
      - "`Nil`"
    feedback:
      correct: 完全正确！块中最后一个表达式 `a + 3`（=5）就是整个块的值，它被绑定到 `y`。
      choices:
        "1": "`a`（2）只是块中间的值。块的值是**最后一个表达式**。"
        "2": "`3` 只是一个字面量，`a + 3` 计算后得到 5。"
        "3": 块返回最后一个表达式的值——是 5，而不是 `Nil`。
  case-is-expression:
    markdown: "`case` 也是产生值的表达式，所以可以直接用 `let` 绑定它的结果。带守卫（`if ...`）的分支会**从上到下**依次检查，选中第一个为真的分支。"
  grade-85:
    prompt: 在下面的 `grade` 函数中，`grade(85)` 的值是什么？
    choices:
      - '`"A"`'
      - '`"B"`'
      - '`"F"`'
      - "`85`"
    feedback:
      correct: 没错！守卫从上往下检查。`85 >= 90` 为假，跳过；`85 >= 80` 为真，于是选中 "B"。
      choices:
        "0": "`85 >= 90` 为假，所以跳过第一个分支——继续往下走。"
        "2": 不会走到 `_` 分支。`85 >= 80` 为真，在它上面就停下了。
        "3": "`case` 返回的是被选中分支的**结果**，而不是被匹配的输入——是 \"B\"，不是 85。"
  grade-95:
    prompt: 在同一个 `grade` 函数中，`grade(95)` 的值是什么？
    choices:
      - '`"A"`'
      - '`"B"`'
      - '`"F"`'
      - 编译错误
    feedback:
      correct: 完全正确！`95 >= 90` 为真，所以选中第一个分支，结果是 "A"。
      choices:
        "1": 第一个分支 `s if s >= 90` 已经为真，就在那里停下——不会走到 "B"。
        "2": "`_` 是最下面的分支。上面已经匹配成功，所以不会到达它。"
        "3": 可以正常编译——`_` 分支接住了剩下的所有情况，做到了穷尽匹配。
