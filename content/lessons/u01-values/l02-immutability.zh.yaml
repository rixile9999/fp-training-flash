title: 不可变性与 shadowing
blocks:
  intro:
    markdown: |-
      Gleam 中没有“修改”变量这回事。一旦用 `let` 绑定了值，它就永远不会改变——一切都是**不可变的（immutable）**。

      那么“想改变一个值”时该怎么办？不是去修改它，而是**对同一个名字再写一次 `let`**。从那一刻起，指向新值的新绑定会遮蔽之前的绑定——这叫作 **shadowing（遮蔽）**。值本身没有变，只是名字指向了新的东西。
  shadowing-value:
    prompt: 下面的代码执行完后，`x` 的值是多少？
    choices:
      - "`2`"
      - "`11`"
      - "`20`"
      - "`1`"
    feedback:
      correct: 完全正确！1 → (1+1)=2 → (2*10)=20。每一行的 `let` 都用当时的 `x` 计算，并创建一个新绑定。
      choices:
        "0": 你只算到了第二行。第三行的 `x * 10` 也会生效。
        "1": 这不是 `x + 1 * 10`。新的 `x` 是逐行依次绑定的——先变成 2，再乘以 10。
        "3": "`x` 指向最后一个 `let` 的结果——是 20，不是 1。"
  no-mutation:
    markdown: 注意：shadowing 和**重新赋值**不同。像 `let x = ...` 这样每次都重新写 `let` 是合法的；但像 `x = x + 1` 这样不带 `let` 再次赋值，在 Gleam 中根本不存在这种语法，所以无法编译。
  reassign-illegal:
    prompt: 已经用 `let total = 0` 绑定之后，如果下一行写 `total = total + 100`，会怎样？
    choices:
      - "`total` 变成 100"
      - 编译错误——Gleam 没有不带 `let` 的重新赋值
      - 产生一个新的 `total` 绑定
      - 运行时报错
    feedback:
      correct: 没错！Gleam 没有重新赋值运算符。想“更新”一个值，就用新的 `let` 遮蔽旧名字，比如 `let total = total + 100`。
      choices:
        "0": Gleam 里不存在直接修改值的操作——这一行根本无法编译。
        "2": 要创建新绑定，前面必须有 `let`。不带 `let` 的这一行不是合法语法。
        "3": 它在**编译期**就被拦下了，而不是运行时——根本不会运行。
  capture:
    markdown: 不可变性真正的威力在这里显现。当一个名字被函数**捕获**（capture）之后，即使之后对这个名字进行 shadowing，已经捕获的值也不受影响——因为值永远不会改变。
  shadow-capture:
    prompt: 下面代码中的两行依次输出什么？（`f` 会记住它被创建时的 `x`）
    choices:
      - "`11` 和 `11`"
      - "`11` 和 `1`"
      - "`1` 和 `1`"
      - 编译错误
    feedback:
      correct: 完全正确！`f` 捕获的是第一个 `x`（=1）。第三行的 `let x` 只是一个**新绑定**，改变不了 `f` 看到的值。所以输出 11 和 1。
      choices:
        "0": shadowing 不是修改（mutation）。`f` 看到的仍然是最初捕获的 1——第二个输出是 1。
        "2": 第一个输出 `x` 是最后一个 `let` 指向的 11——不是 1。
        "3": 对同一个名字再次 `let`（shadowing）是合法的。被禁止的是不带 `let` 的重新赋值。
