title: use——铺平阶梯的语法糖
blocks:
  intro:
    markdown: |-
      `result.try` 解决了短路问题，但回调里又套着另一个 `try`，缩进还是一路向右加深。Gleam 的 `use` 表达式能把这条链**从上到下平铺**开来。

      ```gleam
      import gleam/result

      pub fn add_ages(a: String, b: String) -> Result(Int, AgeError) {
        use age_a <- result.try(parse_age(a))
        use age_b <- result.try(parse_age(b))
        Ok(age_a + age_b)
      }
      ```

      阶梯消失了，`Error(e) -> Error(e)` 的重复也没有了。`use age_a <- ...` 可以读作：“如果这个 Result 是 Ok，就把里面的值绑定到 `age_a` 并继续往下执行；如果是 Error，就直接短路。”
  addages-ok:
    prompt: '在上面 `use` 版本的 `add_ages` 中，`add_ages("8", "9")` 的值是？'
    choices:
      - '`Ok(17)`'
      - '`17`'
      - '`Ok(8)`'
      - '`Error(NotANumber)`'
    feedback:
      correct: '完全正确！两次解析都是 Ok，于是带着 `age_a` = 8、`age_b` = 9 往下走，最后 `Ok(8 + 9)` = `Ok(17)`。'
      choices:
        "1": '函数的返回类型是 `Result`，所以最后一行也是 `Ok(...)`——是 `Ok(17)`，不是光秃秃的 `17`。'
        "2": '通过两行 `use` 之后才把两者相加——不是只看 `age_a` 的 `Ok(8)`，而是 `Ok(17)`。'
        "3": '两个输入都是正常的数字，不会短路——是 `Ok(17)`，不是 `Error`。'
  shortcircuit:
    markdown: |-
      这是本单元的核心直觉：当 `use` 那一行的 `result.try` 收到 `Error` 时，**它下面的代码根本不会执行**，这个 Error 直接成为函数的返回值。

      在 U3 我们学过“Gleam 没有 early return（提前返回）”。`use` + `result.try` 的短路，正好以**类型安全**的方式（借助 Result 类型）承担了 early return 的角色。
  addages-shortcircuit:
    prompt: '`add_ages("3", "x")` 的值是？（`use` 版本，`"x"` 不是数字）'
    choices:
      - '`Ok(3)`'
      - '`Error(NotANumber)`'
      - '`Ok(0)`'
      - '`Error(Negative)`'
    feedback:
      correct: '答对了！第一行是 `Ok(3)`，于是带着 `age_a` = 3 往下走；但第二行 `use` 里的 `parse_age("x")` 是 `Error(NotANumber)`，在那里短路——下面的 `Ok(...)` 不会执行，返回的就是这个 Error。'
      choices:
        "0": 'use 那一行出现 Error 时，下面的代码不会执行，Error 直接成为函数的返回值。说是没有 early return，其实 Result 链式调用以类型安全的方式承担了这个角色——是 `Error(NotANumber)`，不是 `Ok(3)`。'
        "2": '短路不会造出 `Ok(0)` 这样的默认值，而是原样返回失败的 Error——`Error(NotANumber)`。'
        "3": '`"x"` 不是负数，而是根本不是数字，所以是 `NotANumber`——不是 `Negative`。'
  addages-negative:
    prompt: '`add_ages("-3", "4")` 的值是？（`parse_age` 遇到负数返回 `Error(Negative)`）'
    choices:
      - '`Error(Negative)`'
      - '`Error(NotANumber)`'
      - '`Ok(1)`'
      - '`Ok(-3)`'
    feedback:
      correct: '完全正确！第一个 `parse_age("-3")` 能成功解析出数字，但因为是负数，返回 `Error(Negative)`——在第一行 `use` 就直接短路了。'
      choices:
        "1": '`"-3"` 本身能成功解析为整数（包括符号），只是因为是负数才被判为 `Negative`——不是 `NotANumber`。'
        "2": '第一行就已经短路，根本到不了加法——是 `Error(Negative)`，不是 `Ok(1)`。'
        "3": '短路的结果是 `Error`。而且 `parse_age` 会拒绝负数输入，所以不可能是 `Ok(-3)`。'
  forgot-ok:
    prompt: '用 `use` 全部铺平后，如果最后一行不写 `Ok(age_a + age_b)`，而只写 `age_a + age_b`，会怎样？'
    choices:
      - 能正常运行——Gleam 会自动包上 Ok
      - '类型不匹配（Type mismatch）编译错误——函数的返回类型是 `Result`，最后一个表达式却是 `Int`'
      - 运行时出错
      - '总是返回 `Error`'
    feedback:
      correct: '答对了！即使用 use 全部铺平，函数的返回类型依然是 `Result`。忘记把最后的成功值包成 `Ok`，是 `use-expr` 主题中排名第一的常见错误，编译器会以 Type mismatch 报出来。'
      choices:
        "0": 'Gleam 不会自动帮你包上 `Ok`。返回类型是 `Result(Int, _)`，最后却是 `Int`，类型对不上，就是编译错误。'
        "2": '会在编译期而不是运行时被拦下——类型不匹配，程序根本跑不起来。'
        "3": '不是返回 `Error`，而是根本无法编译——因为类型不匹配。'
