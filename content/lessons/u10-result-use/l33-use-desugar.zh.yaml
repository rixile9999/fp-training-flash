title: use 的真面目——脱糖与局限
blocks:
  intro:
    markdown: |-
      `use` 不是魔法，而是**语法糖（syntactic sugar）**。了解它的真面目，就不会再困惑了。

      ```gleam
      use x <- f(arg)
      其余代码
      ```

      这一行会被精确地展开成下面这样（脱糖，desugaring）：

      ```gleam
      f(arg, fn(x) { 其余代码 })
      ```

      关键在于：**`use` 那一行下面的“全部其余代码”，会整体放进最后一个参数——回调 `fn(x) { ... }`——的函数体中。** 不是一部分，而是全部。
  desugar-equiv:
    prompt: '下面两段代码是同一个函数（一个用 use，一个是脱糖后的形式）。`add("10", "5")` 的值是？'
    code: |-
      // use 版本
      //   use x <- result.try(int.parse(a))
      //   use y <- result.try(int.parse(b))
      //   Ok(x + y)
      // 脱糖版本：
      result.try(int.parse("10"), fn(x) {
        result.try(int.parse("5"), fn(y) {
          Ok(x + y)
        })
      })
    choices:
      - '`Ok(15)`'
      - '`15`'
      - '`Ok(Ok(15))`'
      - '`Error(Nil)`'
    feedback:
      correct: '完全正确！两种形式是完全相同的代码。带着 `x` = 10、`y` = 5 往下走，最后 `Ok(10 + 5)` = `Ok(15)`。'
      choices:
        "1": '最后是 `Ok(x + y)`，所以结果是包装过的——是 `Ok(15)`，不是光秃秃的 `15`。'
        "2": '`try` 直接使用回调返回的 Result（不会双重包装）——是 `Ok(15)`，不是 `Ok(Ok(15))`。'
        "3": '两次解析都成功，不会短路——是 `Ok(15)`。'
  general-sugar:
    markdown: |-
      这里有一个重要的洞见：`use` **并不是** `result.try` 专用的。脱糖规则是“把回调作为最后一个参数传进去”，所以它可以和**任何最后一个参数是函数的函数**一起用（比如 `list.map` 在语法上也行）。不过在非短路流程中使用反而会更难读，所以惯用法是用在 `result.try`/`option` 这类“继续/短路”的场景中。

      注意不要滥用：`use` 只是去掉了缩进，并不改变语义。
  desugar-wrong-pairing:
    prompt: 下面哪一组 `use` 与脱糖形式的对应是**错误**的？
    choices:
      - '`use x <- f(a)` ⟶ `f(a, fn(x) { 其余代码 })`'
      - '`use x <- f(a)` ⟶ `f(fn(x) { 其余代码 }, a)`  （回调是第一个参数）'
      - '`use a, b <- f(x)` ⟶ `f(x, fn(a, b) { 其余代码 })`'
      - '`use <- f(x)` ⟶ `f(x, fn() { 其余代码 })`  （不接收值）'
    feedback:
      correct: '答对了！回调总是作为**最后一个**参数传入。把它放在第一个参数的 (2) 是错误的对应——脱糖规则是“把其余代码作为最后一个参数的回调”。'
      choices:
        "0": '这是正确的对应。`use x <- f(a)` 正好展开成 `f(a, fn(x) { 其余代码 })`。'
        "2": '这也是正确的。箭头左边写几个名字，回调就接收几个参数（`fn(a, b)`）。'
        "3": '这同样是正确的对应。箭头左边为空时，得到的是无参数的回调 `fn() { ... }`。'
  callback-scope:
    prompt: '`use` 那一行下面还有三行代码。其中哪些会进入回调 `fn(x) { ... }` 的函数体？'
    choices:
      - 只有紧接着的下一行
      - '`use` 那一行下面的全部三行'
      - '只有最后的 `Ok(...)` 那一行'
      - 一行都不会进入——use 在那一行就结束了
    feedback:
      correct: '答对了！脱糖的核心就是“全部其余代码”都成为回调的函数体——下面三行全都进入 `fn(x) { ... }`。'
      choices:
        "0": '不只是一行。use 下面的所有代码都会整体成为回调的函数体。'
        "2": '不只是最后一行——use 下面的全部代码都是回调的函数体，中间那几行也一起进去。'
        "3": 'use 并不会在那一行结束——恰恰相反，它把下面的全部代码包进回调里继续执行。'
  use-single-line:
    prompt: '只有一步的 `use` 也遵循同样的规则。`inc("41")` 的值是？'
    choices:
      - '`Ok(42)`'
      - '`42`'
      - '`Ok(Ok(42))`'
      - '`Error(Nil)`'
    feedback:
      correct: '完全正确！`int.parse("41")` = `Ok(41)`，于是 `n` = 41，回调体 `Ok(41 + 1)` = `Ok(42)`。脱糖后就等同于 `result.try(int.parse("41"), fn(n) { Ok(n + 1) })`。'
      choices:
        "1": '函数的返回类型是 `Result`，所以最后也是 `Ok(...)`——是 `Ok(42)`，不是 `42`。'
        "2": '`try` 会展平，所以只有一层包装——是 `Ok(42)`，不是 `Ok(Ok(42))`。'
        "3": '`"41"` 是正常的数字，解析会成功——不会短路，结果是 `Ok(42)`。'
