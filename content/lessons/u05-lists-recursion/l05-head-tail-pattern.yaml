title: "[first, ..rest] — 리스트를 분해하는 패턴"
tags:
  - concept:lists
  - tricky:empty-list-base-case
blocks:
  - prose: intro
    markdown: |-
      리스트를 **만드는** `[head, ..tail]` 문법은, `case`의 **패턴 자리**에서는 리스트를 **분해**하는 데 쓰입니다. 같은 모양이 방향만 반대로 동작해요.

      리스트가 가질 수 있는 모양은 단 두 가지입니다:
      - `[]` — 비어 있다
      - `[first, ..rest]` — 머리 `first` 하나와 나머지 `rest`(리스트)로 나뉜다

      이 두 패턴이 리스트의 모든 경우를 빠짐없이 덮습니다.
  - exercise: head-bind
    type: predict
    prompt: "`[first, ..rest]` 패턴에서 `first`에는 머리 원소가 묶입니다. `first_or_zero([10, 20, 30])`의 값은?"
    code: |-
      fn first_or_zero(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [first, ..rest] -> first
        }
      }

      // first_or_zero([10, 20, 30]) 은?
    choices:
      - "`10`"
      - "`30`"
      - "`0`"
      - "`[20, 30]`"
    answer: 0
    feedback:
      correct: 맞아요! `first`에는 리스트의 **머리**(맨 앞 원소)인 10이 묶입니다.
      choices:
        "1": "`first`는 **맨 앞** 원소예요 — 마지막 30이 아니라 10입니다."
        "2": 0은 빈 리스트(`[]`)일 때의 결과예요 — 입력은 비어 있지 않습니다.
        "3": "`[20, 30]`은 `rest`(꼬리)예요 — 이 함수는 `first`를 돌려줍니다."
  - exercise: rest-bind
    type: predict
    prompt: 같은 패턴에서 `rest`에는 머리를 뺀 나머지 리스트가 묶입니다. `drop_first([10, 20, 30])`의 값은?
    code: |-
      fn drop_first(xs: List(Int)) -> List(Int) {
        case xs {
          [] -> []
          [first, ..rest] -> rest
        }
      }

      // drop_first([10, 20, 30]) 은?
    choices:
      - "`[20, 30]`"
      - "`[10, 20, 30]`"
      - "`10`"
      - "`[10]`"
    answer: 0
    feedback:
      correct: 정확해요! `rest`는 머리 10을 뺀 나머지 — `[20, 30]`입니다.
      choices:
        "1": "`rest`는 머리를 **뺀** 부분이에요 — 10이 빠져 `[20, 30]`이 됩니다."
        "2": "`10`은 `first`(머리)예요 — 이 함수는 `rest`(꼬리 리스트)를 돌려줍니다."
        "3": "`rest`엔 20과 30이 모두 들어가요 — `[10]`이 아니라 `[20, 30]`입니다."
  - prose: two-cases
    markdown: |-
      두 패턴 `[]` 와 `[first, ..rest]` 는 리스트의 **모든 경우**를 덮습니다. 그래서 `case`로 리스트를 다룰 때 이 둘만 있으면 exhaustiveness(빠짐없음) 검사를 통과해요.

      핵심은 `[first, ..rest]` 가 리스트를 **한 겹 벗긴다**는 점입니다 — 머리 하나를 떼어내고, 더 짧은 `rest`를 남깁니다. 이 "한 겹씩 줄어드는" 성질이 다음 레슨의 재귀를 가능하게 합니다.
  - exercise: list-shapes
    type: choice
    prompt: Gleam에서 리스트가 가질 수 있는 모양(패턴)을 모두 고른다면?
    choices:
      - "`[]` 와 `[first, ..rest]` 두 가지"
      - "`[]` 한 가지뿐"
      - "`[first, ..rest]` 한 가지뿐"
      - 원소 개수마다 따로따로 — `[a]`, `[a, b]`, `[a, b, c]` ...
    answer: 0
    feedback:
      correct: 맞아요! 리스트는 "비었다(`[]`)" 또는 "머리 하나 + 나머지(`[first, ..rest]`)" 두 모양뿐이라, 이 둘이 모든 경우를 덮습니다.
      choices:
        "1": 비어 있지 않은 리스트(`[1, 2]` 등)도 있어요 — `[first, ..rest]` 패턴이 더 필요합니다.
        "2": 빈 리스트 `[]`도 가능해요 — 그 경우를 빠뜨리면 exhaustiveness 검사를 통과 못 합니다.
        "3": 길이별로 나눌 필요가 없어요 — `[first, ..rest]` 하나가 길이 1 이상을 **모두** 덮습니다.
  - exercise: rebuild
    type: predict
    prompt: 분해한 머리와 꼬리를 다시 붙이면 원래대로 돌아옵니다. `[1, ..[2, 3]]`의 값은?
    code: "[1, ..[2, 3]]"
    choices:
      - "`[1, 2, 3]`"
      - "`[[1], 2, 3]`"
      - "`[1, [2, 3]]`"
      - "`[2, 3, 1]`"
    answer: 0
    feedback:
      correct: 맞아요! 머리 1과 꼬리 `[2, 3]`을 합쳐 `[1, 2, 3]` — 분해의 반대 방향입니다.
      choices:
        "1": 머리는 중첩되지 않아요 — 1이 그냥 맨 앞 원소로 들어가 `[1, 2, 3]`이 됩니다.
        "2": 꼬리 `[2, 3]`은 통째로 한 원소가 되지 않아요 — 펼쳐져 `[1, 2, 3]`이 됩니다.
        "3": "`..`는 **앞**에 붙입니다 — 1이 맨 앞이라 `[1, 2, 3]`이에요."
