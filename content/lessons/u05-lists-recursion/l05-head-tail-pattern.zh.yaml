title: "[first, ..rest]——拆分列表的模式"
blocks:
  intro:
    markdown: |-
      用来**构建**列表的 `[head, ..tail]` 语法，在 `case` 的**模式位置**上则用来**拆分**列表。同样的形状，只是方向相反。

      列表只可能有两种形状：
      - `[]`——为空
      - `[first, ..rest]`——拆成一个头部 `first` 和剩余部分 `rest`（一个列表）

      这两个模式毫无遗漏地覆盖了列表的所有情况。
  head-bind:
    prompt: "在 `[first, ..rest]` 模式中，`first` 绑定的是头部元素。`first_or_zero([10, 20, 30])` 的值是？"
    code: |-
      fn first_or_zero(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [first, ..rest] -> first
        }
      }

      // first_or_zero([10, 20, 30]) 的值是？
    choices:
      - "`10`"
      - "`30`"
      - "`0`"
      - "`[20, 30]`"
    feedback:
      correct: 没错！`first` 绑定的是列表的**头部**（最前面的元素），也就是 10。
      choices:
        "1": "`first` 是**最前面**的元素——是 10，而不是最后的 30。"
        "2": 0 是空列表（`[]`）时的结果——输入不是空的。
        "3": "`[20, 30]` 是 `rest`（尾部）——这个函数返回的是 `first`。"
  rest-bind:
    prompt: 在同一个模式中，`rest` 绑定的是去掉头部后剩下的列表。`drop_first([10, 20, 30])` 的值是？
    code: |-
      fn drop_first(xs: List(Int)) -> List(Int) {
        case xs {
          [] -> []
          [first, ..rest] -> rest
        }
      }

      // drop_first([10, 20, 30]) 的值是？
    choices:
      - "`[20, 30]`"
      - "`[10, 20, 30]`"
      - "`10`"
      - "`[10]`"
    feedback:
      correct: 完全正确！`rest` 是去掉头部 10 之后剩下的部分——`[20, 30]`。
      choices:
        "1": "`rest` 是**去掉**头部的部分——10 被去掉，得到 `[20, 30]`。"
        "2": "`10` 是 `first`（头部）——这个函数返回的是 `rest`（尾部列表）。"
        "3": "`rest` 里同时有 20 和 30——是 `[20, 30]`，而不是 `[10]`。"
  two-cases:
    markdown: |-
      `[]` 和 `[first, ..rest]` 这两个模式覆盖了列表的**所有情况**。所以用 `case` 处理列表时，只要有这两个分支就能通过穷尽性（exhaustiveness）检查。

      关键在于 `[first, ..rest]` 会把列表**剥掉一层**——取下一个头部，留下更短的 `rest`。正是这种“每次缩短一层”的性质，让下一课的递归成为可能。
  list-shapes:
    prompt: 如果要列出 Gleam 中列表可能具有的所有形状（模式），正确的是？
    choices:
      - "`[]` 和 `[first, ..rest]` 两种"
      - "只有 `[]` 一种"
      - "只有 `[first, ..rest]` 一种"
      - 每种元素个数各一种——`[a]`、`[a, b]`、`[a, b, c]` ...
    feedback:
      correct: 没错！列表只有“空（`[]`）”或“一个头部 + 剩余部分（`[first, ..rest]`）”两种形状，所以这两个模式覆盖了所有情况。
      choices:
        "1": 还有非空列表（`[1, 2]` 等）——还需要 `[first, ..rest]` 模式。
        "2": 空列表 `[]` 也是可能的——漏掉这种情况就无法通过穷尽性检查。
        "3": 不需要按长度区分——一个 `[first, ..rest]` 就覆盖了长度为 1 及以上的**所有**情况。
  rebuild:
    prompt: 把拆开的头部和尾部重新拼起来，就会恢复原样。`[1, ..[2, 3]]` 的值是？
    choices:
      - "`[1, 2, 3]`"
      - "`[[1], 2, 3]`"
      - "`[1, [2, 3]]`"
      - "`[2, 3, 1]`"
    feedback:
      correct: 没错！把头部 1 和尾部 `[2, 3]` 合起来就是 `[1, 2, 3]`——与拆分方向相反。
      choices:
        "1": 头部不会嵌套——1 直接作为最前面的元素，得到 `[1, 2, 3]`。
        "2": 尾部 `[2, 3]` 不会整个变成一个元素——它会展开成 `[1, 2, 3]`。
        "3": "`..` 是添加到**前面**——1 在最前面，所以是 `[1, 2, 3]`。"
