title: "첫 재귀: 길이 세기와 합"
tags:
  - concept:recursion
  - concept:lists
blocks:
  - prose: intro
    markdown: |-
      Gleam에는 `for`도 `while`도 **없습니다**. 그럼 리스트를 어떻게 훑을까요? 답은 **재귀**입니다: 머리 하나를 처리하고, **꼬리에 대해 자기 자신을 다시 부릅니다**.

      모든 재귀는 두 가지 질문으로 설계합니다:
      1. 가장 작은 입력(빈 리스트)이면 답이 뭔가? — **종료 조건(base case)**
      2. 머리 하나를 처리하고 나면, 남은 문제는 뭔가? — **재귀 단계**
  - prose: length-example
    markdown: |-
      리스트의 길이를 세는 함수를 봅시다:

      ```gleam
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }
      ```

      빈 리스트의 길이는 0(종료 조건). 비어 있지 않으면 머리 하나(`+1`)에 **나머지의 길이**를 더합니다. 머리 값 자체는 안 쓰니 `_`로 받았어요.
  - exercise: length-3
    type: predict
    prompt: 위 `length` 함수에서 `length([10, 20, 30])`의 값은?
    code: |-
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }

      // length([10, 20, 30]) 은?
    choices:
      - "`3`"
      - "`60`"
      - "`0`"
      - "`30`"
    answer: 0
    feedback:
      correct: 맞아요! 1 + (1 + (1 + 0)) = 3. 머리를 하나씩 떼며 +1을 쌓고, 빈 리스트에서 0으로 마무리됩니다.
      choices:
        "1": 이 함수는 원소를 **세는** 거예요 — 더하는(10+20+30) 게 아니라 개수 3을 셉니다.
        "2": 0은 빈 리스트일 때예요 — 원소가 3개라 결과는 3입니다.
        "3": 마지막 원소(30)가 아니라 **개수**를 돌려줘요 — 3입니다.
  - exercise: length-empty
    type: predict
    prompt: 같은 `length` 함수에서 `length([])`의 값은? (종료 조건이 곧 답의 씨앗입니다)
    code: |-
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }

      // length([]) 은?
    choices:
      - "`0`"
      - "`1`"
      - "`Nil`"
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 정확해요! 빈 리스트는 첫 가지 `[] -> 0`에 바로 걸립니다 — 종료 조건이 0을 돌려줘요.
      choices:
        "1": 빈 리스트엔 원소가 없어요 — 길이는 1이 아니라 0입니다.
        "2": "`[] -> 0` 가지가 `Int` 0을 돌려줍니다 — `Nil`이 아니에요."
        "3": 정상 컴파일됩니다 — `[]`와 `[_, ..rest]`가 모든 경우를 덮어요.
  - prose: total-example
    markdown: |-
      같은 뼈대로 **합**도 구합니다. 이번엔 머리 값을 써야 하니 이름(`first`)으로 받습니다:

      ```gleam
      pub fn total(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [first, ..rest] -> first + total(rest)
        }
      }
      ```

      빈 리스트의 합은 0(종료 조건). 비어 있지 않으면 **머리 값** + **나머지의 합**입니다. `length`와 거의 같고, `1` 자리에 `first`만 들어갔어요.
  - exercise: total-sum
    type: predict
    prompt: 위 `total` 함수에서 `total([2, 3, 5])`의 값은?
    code: |-
      pub fn total(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [first, ..rest] -> first + total(rest)
        }
      }

      // total([2, 3, 5]) 은?
    choices:
      - "`10`"
      - "`3`"
      - "`0`"
      - "`5`"
    answer: 0
    feedback:
      correct: 맞아요! 2 + (3 + (5 + 0)) = 10. 머리 값을 차례로 더하고 빈 리스트에서 0으로 닫힙니다.
      choices:
        "1": 이건 합을 구하는 함수예요 — 개수(3)가 아니라 합 2+3+5 = 10입니다.
        "2": 0은 빈 리스트일 때의 종료값이에요 — 원소들의 합은 10입니다.
        "3": 마지막 원소(5)만이 아니라 **전부** 더해요 — 10입니다.
