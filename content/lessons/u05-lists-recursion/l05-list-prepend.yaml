title: List(a)와 prepend
tags:
  - concept:lists
blocks:
  - prose: intro
    markdown: |-
      리스트는 같은 타입의 값을 **순서대로** 담는 자료구조입니다. `[1, 2, 3]`은 `List(Int)`, `["a", "b"]`는 `List(String)`이에요. 한 리스트 안의 원소는 **모두 같은 타입**이어야 합니다.

      빈 리스트는 `[]`입니다. 이 작은 빈 리스트가 나중에 재귀의 **출발점**이 되니 눈여겨봐 두세요.
  - exercise: list-homogeneous
    type: choice
    prompt: 다음 중 Gleam에서 올바른 리스트는?
    choices:
      - '`[1, "a", True]`'
      - "`[1, 2, 3]`"
      - "`{1, 2, 3}`"
      - "`(1, 2, 3)`"
    answer: 1
    feedback:
      correct: 맞아요! 리스트의 모든 원소는 같은 타입이어야 합니다 — `[1, 2, 3]`은 전부 `Int`라 `List(Int)`예요.
      choices:
        "0": 타입이 섞였어요 — `Int`, `String`, `Bool`을 한 리스트에 담을 수 없습니다. 모두 같은 타입이어야 해요.
        "2": "`{...}`는 리스트 문법이 아니에요 — 리스트는 대괄호 `[...]`를 씁니다."
        "3": "`(...)`는 튜플 문법이에요. 리스트는 `[...]`입니다."
  - prose: prepend
    markdown: |-
      리스트 **앞**에 원소 하나를 붙이는 것을 prepend라고 합니다. `[head, ..tail]` 문법으로, 기존 리스트(tail) 앞에 새 원소(head)를 얹어 **새 리스트**를 만들어요.

      `let xs = [1, 2, 3]` 일 때 `[0, ..xs]` 는 `[0, 1, 2, 3]` 입니다. 중요한 점: `xs`는 바뀌지 않습니다 — 앞 유닛에서 배운 불변성 그대로, 새 리스트가 만들어질 뿐이에요. prepend는 기존 리스트를 그대로 재사용하므로 매우 빠릅니다(O(1)).
  - exercise: prepend-front
    type: predict
    prompt: "`xs`가 `[1, 2, 3]`일 때, `[0, ..xs]`의 값은?"
    code: |-
      let xs = [1, 2, 3]
      let ys = [0, ..xs]
      // ys 는?
    choices:
      - "`[0, 1, 2, 3]`"
      - "`[1, 2, 3, 0]`"
      - "`[0, [1, 2, 3]]`"
      - "`[1, 2, 3]`"
    answer: 0
    feedback:
      correct: 정확해요! `..`는 새 원소를 **앞(head)**에 붙입니다 — `[0, 1, 2, 3]`.
      choices:
        "1": prepend는 **앞**에 붙여요 — 뒤가 아니라 0이 맨 앞에 옵니다.
        "2": 중첩되지 않아요 — `..`는 tail을 펼쳐 평평한 `[0, 1, 2, 3]`을 만듭니다.
        "3": "`ys`는 새 리스트예요 — 0이 붙어 `[0, 1, 2, 3]`이 됩니다(`xs` 자체는 그대로지만)."
  - exercise: prepend-two
    type: predict
    prompt: "`xs`가 `[3]`일 때, `[1, 2, ..xs]`의 값은?"
    code: |-
      let xs = [3]
      let ys = [1, 2, ..xs]
      // ys 는?
    choices:
      - "`[1, 2, 3]`"
      - "`[3, 1, 2]`"
      - "`[1, 2, [3]]`"
      - "`[1, 2]`"
    answer: 0
    feedback:
      correct: 맞아요! 앞쪽에 1, 2를 차례로 얹어 `[1, 2, 3]`이 됩니다 — `..` 뒤의 tail이 그대로 이어져요.
      choices:
        "1": 앞에 적은 `1, 2`가 먼저 오고, tail `[3]`이 뒤에 붙어 `[1, 2, 3]`이에요.
        "2": tail은 통째로 한 원소가 되지 않아요 — 펼쳐져서 평평한 `[1, 2, 3]`이 됩니다.
        "3": tail `[3]`의 원소도 포함돼요 — `[1, 2]`가 아니라 `[1, 2, 3]`입니다.
