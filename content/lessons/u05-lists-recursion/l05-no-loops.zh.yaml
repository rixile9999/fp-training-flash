title: 没有索引的世界——没有循环
blocks:
  intro:
    markdown: |-
      Gleam 没有其他语言里 `for (i = 0; i < n; i++)` 或 `xs[i]` 这样的**索引访问**。列表是“头部 + 尾部”的结构，所以不能直接取第 i 个元素，而是**从前往后一层一层**地剥开。

      因此，“对每个元素做点什么”也要用递归来表达：变换头部，把它加到结果的前面，再对尾部递归。
  map-example:
    markdown: |-
      来看一个把每个元素都乘以 2 的函数——不用循环，只用递归：

      ```gleam
      pub fn double_all(xs: List(Int)) -> List(Int) {
        case xs {
          [] -> []
          [first, ..rest] -> [first * 2, ..double_all(rest)]
        }
      }
      ```

      空列表得到空列表（终止条件）。不为空时，用 `* 2` 变换头部，再**把它 prepend 到变换剩余部分所得的结果前面**。这和 `length`/`total` 是完全相同的骨架。
  double-all:
    prompt: 在上面的 `double_all` 函数中，`double_all([1, 2, 3])` 的值是？
    code: |-
      pub fn double_all(xs: List(Int)) -> List(Int) {
        case xs {
          [] -> []
          [first, ..rest] -> [first * 2, ..double_all(rest)]
        }
      }

      // double_all([1, 2, 3]) 的值是？
    choices:
      - "`[2, 4, 6]`"
      - "`[1, 2, 3]`"
      - "`[6, 4, 2]`"
      - "`12`"
    feedback:
      correct: 没错！一路向下，把每个头部乘以 2 后加到前面，得到 `[2, 4, 6]`——顺序保持不变。
      choices:
        "1": 变换是生效的——不是原样不变，而是每个元素都乘以 2，得到 `[2, 4, 6]`。
        "2": 顺序不会反转——变换后的头部被加到**前面**，所以保持原来的顺序 `[2, 4, 6]`。
        "3": 这个函数返回的不是总和（2+4+6），而是变换后的**列表**——`[2, 4, 6]`。
  no-for-while:
    prompt: 在 Gleam 中，要遍历列表的所有元素，该用什么？
    choices:
      - 递归——处理头部，再对尾部调用自身
      - "`for` 循环"
      - "`while` 循环"
      - "用 `xs[i]` 从 0 开始递增索引来访问"
    feedback:
      correct: 没错！Gleam 没有 `for`/`while`，重复操作用递归来表达——处理头部，再对更短的尾部调用自身。
      choices:
        "1": Gleam 没有 `for` 循环——重复操作用递归（或下一个单元的 `list` 函数）来完成。
        "2": Gleam 也没有 `while` 循环——改用带终止条件的递归。
        "3": 没有 `xs[i]` 这样的索引访问——列表通过头部/尾部一层一层剥开来处理。
  prepend-vs-append:
    prompt: 关于在列表前面添加（prepend，`[x, ..xs]`）和在后面添加（append）的开销，正确的是？
    choices:
      - prepend 是 O(1)，很快；而要添加到后面就得走到列表末尾，开销更大
      - 两者都同样是 O(1)
      - prepend 开销更大——必须移动所有元素
      - 列表可以通过索引在任意位置以 O(1) 插入
    feedback:
      correct: 完全正确！在头部添加的 prepend 会把已有列表原样复用为尾部，所以是 O(1)。因此用递归构建结果时，通常采用**从前面 prepend** 的模式。
      choices:
        "1": 添加到后面需要一直遍历到末尾，所以比 prepend 开销更大——两者并不相同。
        "2": 正好相反——prepend 是 O(1)，最便宜（复用尾部）。
        "3": 列表没有按索引任意插入的操作——由于头部/尾部的结构，在前端操作才便宜。
