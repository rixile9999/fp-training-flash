title: List(a) 与 prepend
blocks:
  intro:
    markdown: |-
      列表是**按顺序**存放同一类型值的数据结构。`[1, 2, 3]` 是 `List(Int)`，`["a", "b"]` 是 `List(String)`。同一个列表中的元素必须**全部是同一类型**。

      空列表是 `[]`。请留意这个小小的空列表——它之后会成为递归的**起点**。
  list-homogeneous:
    prompt: 下面哪一个是 Gleam 中合法的列表？
    choices:
      - '`[1, "a", True]`'
      - "`[1, 2, 3]`"
      - "`{1, 2, 3}`"
      - "`(1, 2, 3)`"
    feedback:
      correct: 没错！列表的所有元素必须是同一类型——`[1, 2, 3]` 全是 `Int`，所以是 `List(Int)`。
      choices:
        "0": 类型混在一起了——不能把 `Int`、`String`、`Bool` 放进同一个列表。它们必须是同一类型。
        "2": "`{...}` 不是列表语法——列表用方括号 `[...]`。"
        "3": "`(...)` 是元组语法。列表是 `[...]`。"
  prepend:
    markdown: |-
      在列表**前面**添加一个元素，叫作 prepend。用 `[head, ..tail]` 语法，把新元素（head）放到已有列表（tail）的前面，得到一个**新列表**。

      当 `let xs = [1, 2, 3]` 时，`[0, ..xs]` 是 `[0, 1, 2, 3]`。重点是：`xs` 不会改变——正如上一个单元学到的不可变性，只是创建了一个新列表而已。prepend 会原样复用已有的列表，所以非常快（O(1)）。
  prepend-front:
    prompt: "当 `xs` 是 `[1, 2, 3]` 时，`[0, ..xs]` 的值是？"
    code: |-
      let xs = [1, 2, 3]
      let ys = [0, ..xs]
      // ys 是？
    choices:
      - "`[0, 1, 2, 3]`"
      - "`[1, 2, 3, 0]`"
      - "`[0, [1, 2, 3]]`"
      - "`[1, 2, 3]`"
    feedback:
      correct: 完全正确！`..` 会把新元素添加到**前面（head）**——`[0, 1, 2, 3]`。
      choices:
        "1": prepend 是添加到**前面**——0 排在最前面，而不是最后面。
        "2": 不会嵌套——`..` 会把 tail 展开，得到扁平的 `[0, 1, 2, 3]`。
        "3": "`ys` 是新列表——加上 0 之后变成 `[0, 1, 2, 3]`（尽管 `xs` 本身保持不变）。"
  prepend-two:
    prompt: "当 `xs` 是 `[3]` 时，`[1, 2, ..xs]` 的值是？"
    code: |-
      let xs = [3]
      let ys = [1, 2, ..xs]
      // ys 是？
    choices:
      - "`[1, 2, 3]`"
      - "`[3, 1, 2]`"
      - "`[1, 2, [3]]`"
      - "`[1, 2]`"
    feedback:
      correct: 没错！在前面依次放上 1、2，得到 `[1, 2, 3]`——`..` 后面的 tail 原样接在后面。
      choices:
        "1": 写在前面的 `1, 2` 先出现，tail `[3]` 接在后面，所以是 `[1, 2, 3]`。
        "2": tail 不会整个变成一个元素——它会展开成扁平的 `[1, 2, 3]`。
        "3": tail `[3]` 里的元素也包含在内——是 `[1, 2, 3]`，而不是 `[1, 2]`。
