title: 终止条件——递归的生命线
blocks:
  intro:
    markdown: |-
      递归要想结束，**每次调用都必须让问题变小**，最终到达终止条件。无限递归的三大原因是：
      1. **漏掉空列表的情况**——没有 `[]` 分支
      2. **用相同的参数再次调用**——`f(xs)` 又调用 `f(xs)`（问题没有变小）
      3. **参数没有减小**——传入的仍然是 `n`（应该是 `n - 1`）

      幸运的是，(1) 会被编译器拦下——没有 `[]` 模式就会报 Inexhaustive 错误，编译器会**强制你思考**终止条件。
  countdown-example:
    markdown: |-
      不只是列表，也可以对数字递归。`countdown` 会构建一个从 n 到 1 的列表：

      ```gleam
      pub fn countdown(n: Int) -> List(Int) {
        case n {
          0 -> []
          _ -> [n, ..countdown(n - 1)]
        }
      }
      ```

      终止条件是 `0 -> []`。递归步骤把 `n` 加到前面，再用 **`n - 1`**（变小的值）调用自身。每次调用 n 都减 1，最终到达 0 并停下。
  countdown-3:
    prompt: 在上面的 `countdown` 函数中，`countdown(3)` 的值是？
    code: |-
      pub fn countdown(n: Int) -> List(Int) {
        case n {
          0 -> []
          _ -> [n, ..countdown(n - 1)]
        }
      }

      // countdown(3) 的值是？
    choices:
      - "`[3, 2, 1]`"
      - "`[1, 2, 3]`"
      - "`[3, 2, 1, 0]`"
      - "`[]`"
    feedback:
      correct: 没错！把 3 加到 `countdown(2)` 的前面，再把 2 加到它前面……在 `0 -> []` 处停下，得到 `[3, 2, 1]`。
      choices:
        "1": 因为是 prepend，较大的数会加在**前面**——顺序是 `[3, 2, 1]`。
        "2": 终止条件 `0 -> []` 返回的是空列表，**不包含** 0——结果里没有 0。
        "3": "`[]` 是 `countdown(0)` 的结果——`countdown(3)` 包含 3 个元素。"
  same-arg-infinite:
    prompt: 在列表求和函数中，把递归分支写成了 `first + total(xs)`，而不是 `first + total(rest)`。会发生什么？
    choices:
      - "`total(xs)` 不断用**同一个**列表调用自身，永远不会结束（无限递归）"
      - 正常运行，返回同样的和
      - 出现编译错误
      - 和被算成 2 倍
    feedback:
      correct: 没错！`xs` 不会变小，所以永远到达不了终止条件（`[]`）。运行后不会结束，会触发时间限制。请传入 `rest`，让问题变小。
      choices:
        "1": 不能正常运行——`xs` 不会变小，到达不了 `[]`，会无限重复下去。
        "2": 语法没错，所以**能够编译**——问题是运行时不会结束（运行时的无限循环）。
        "3": 它在得出值之前根本停不下来——不是变成 2 倍，而是根本得不到结果。
  missing-base-case:
    prompt: 如果递归函数漏掉了 `[] -> ...` 这个终止条件分支，Gleam 会怎么反应？
    choices:
      - 编译错误（Inexhaustive patterns）——提示你漏掉了 `[]` 的情况
      - 悄悄通过编译，运行时陷入无限递归
      - 遇到空列表时自动返回 0
      - 只给出警告，正常编译
    feedback:
      correct: 完全正确！`case` 必须覆盖所有情况，所以缺少 `[]` 分支时，编译器会用 Inexhaustive patterns 错误拦下——强制你思考终止条件。
      choices:
        "1": 不会悄悄放过——漏掉 `[]` 时，在**编译阶段**就会被发现。
        "2": Gleam 不会帮你补上默认值——漏掉的模式就是编译错误。
        "3": 不只是警告，而是**错误**——只要有漏掉的模式，编译本身就会失败。
  sum-to-good:
    prompt: 这是参数每次调用都会减小的正确递归。`sum_to(4)` 的值是？
    code: |-
      pub fn sum_to(n: Int) -> Int {
        case n {
          0 -> 0
          _ -> n + sum_to(n - 1)
        }
      }

      // sum_to(4) 的值是？
    choices:
      - "`10`"
      - "`4`"
      - "`0`"
      - 不会结束（无限递归）
    feedback:
      correct: 没错！4 + 3 + 2 + 1 + 0 = 10。每次调用都以 `n - 1` 减小，到达 0 后安全停下。
      choices:
        "1": 不是原样返回输入（4），而是从 4 到 1 的和——10。
        "2": 0 只是终止值，结果是一路往下累加的和——10。
        "3": "每次都以 `n - 1` 减小，所以会结束——无限递归是像 `sum_to(n)` 这样不减小参数的情况。"
