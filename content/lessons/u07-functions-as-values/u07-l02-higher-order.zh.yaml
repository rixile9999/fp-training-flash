title: 高阶函数——接收函数的函数
blocks:
  intro:
    markdown: |-
      既然函数是值，那么也可以写出**以函数为参数**的函数。接收函数或返回函数的函数，叫作**高阶函数（higher-order function）**。

      函数类型写作 `fn(输入类型) -> 输出类型`。例如，“接收 Int 并返回 Int 的函数”就是 `fn(Int) -> Int`。

      ```gleam
      fn apply(f: fn(Int) -> Int, x: Int) -> Int {
        f(x)
      }

      apply(fn(n) { n * 2 }, 5)  // 10
      ```

      `apply` 的第一个参数接收一个*函数*，第二个参数接收一个值，然后把这个函数应用到这个值上。
  apply-fn:
    prompt: '把翻倍函数和 5 传给上面的 `apply` 会怎样？`apply(fn(n) { n * 2 }, 5)` 的值是多少？'
    code: |-
      fn apply(f: fn(Int) -> Int, x: Int) -> Int {
        f(x)
      }

      // apply(fn(n) { n * 2 }, 5) 是多少？
    choices:
      - '`10`'
      - '`5`'
      - '`7`'
      - '`25`'
    feedback:
      correct: '完全正确！`apply` 把收到的函数 `fn(n) { n * 2 }` 应用到 5 上——5 * 2 = 10。'
      choices:
        "1": '`apply` 会应用收到的函数——不会让 5 保持原样，而是把它翻倍。'
        "2": '`n * 2` 是乘法，所以是 5 * 2 = 10——不是 5 + 2。'
        "3": '`n * 2` 是 5 * 2 = 10，不是 5 * 5 = 25。'
  list-map:
    markdown: |-
      高阶函数真正的威力体现在列表上。`list.map(列表, 函数)` 会**对列表的每个元素应用函数**，生成一个新列表——它是对 U5 中手写递归的抽象。

      ```gleam
      import gleam/list

      list.map([1, 2, 3], fn(x) { x * 2 })  // [2, 4, 6]
      ```

      匿名函数 `fn(x) { x * 2 }` 被应用到每个元素上，把它们翻倍。
  map-double:
    prompt: '这个 `list.map` 的结果是？'
    choices:
      - '`[2, 4, 6]`'
      - '`[1, 2, 3]`'
      - '`6`'
      - '`[1, 4, 9]`'
    feedback:
      correct: '没错！对每个元素应用 `x * 2`，得到 [2, 4, 6]。'
      choices:
        "1": '函数会应用到每个元素上——它们会被翻倍，而不是保持原样。'
        "2": '`map` 不做合并，而是把每个元素一一转换并返回一个*列表*——结果不是 6，而是 [2, 4, 6]。'
        "3": '`x * 2` 是翻倍（不是平方 `x * x`）——所以是 [2, 4, 6]。'
  filter-even:
    prompt: '`list.filter(列表, 判断函数)` 只保留判断结果为 `True` 的元素。这个结果是？'
    choices:
      - '`[2, 4]`'
      - '`[1, 3]`'
      - '`[1, 2, 3, 4]`'
      - '`[True, False, True, False]`'
    feedback:
      correct: '完全正确！只有使 `x % 2 == 0`（偶数）为真的 2 和 4 被保留下来。'
      choices:
        "1": '保留的是条件为*真*的元素——偶数（2、4）留下，奇数被过滤掉。'
        "2": '`filter` 只挑出符合条件的元素——不会全部保留。'
        "3": '`filter` 返回的是*元素本身*，而不是 Bool 列表——[2, 4]。'
  fn-type:
    prompt: '“接收 Int 并返回 Bool 的函数”的类型写法，正确的是？'
    choices:
      - '`fn(Int) -> Bool`'
      - '`fn(Bool) -> Int`'
      - '`Int -> Bool`'
      - '`fn Int Bool`'
    feedback:
      correct: '没错！函数类型是 `fn(输入) -> 输出`——输入 `Int`，输出 `Bool`。'
      choices:
        "1": '输入和输出颠倒了——Int 是输入，Bool 是输出。'
        "2": '函数类型也需要 `fn(...)` 和括号——只写 `Int -> Bool` 不行。'
        "3": '用 `->` 连接输入和输出，输入要用括号括起来——`fn(Int) -> Bool`。'
