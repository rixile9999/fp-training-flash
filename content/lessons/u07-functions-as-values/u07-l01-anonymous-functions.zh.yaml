title: 匿名函数与函数值
blocks:
  intro:
    markdown: |-
      到目前为止，我们都是像 `pub fn 名字(...) { ... }` 这样**给函数起个名字**来定义它。但在 Gleam 中，函数本身就是一个**值**——就像整数或字符串一样，可以存进变量，也可以传给其他函数。

      没有名字、当场创建的函数叫作**匿名函数**，写作 `fn(参数) { 函数体 }`。它和普通函数完全一样，唯一的区别是只有 `fn`，没有名字。

      ```gleam
      let double = fn(x) { x * 2 }
      double(21)  // 42
      ```

      我们创建了 `fn(x) { x * 2 }` 这个值，并用 `let` 把它绑定到名字 `double` 上。之后就可以像普通函数一样调用它，比如 `double(21)`。
  anon-bind-call:
    prompt: '下面代码中 `double(21)` 的值是多少？'
    code: |-
      let double = fn(x) { x * 2 }

      // double(21) 是多少？
    choices:
      - '`42`'
      - '`21`'
      - '`2`'
      - '编译错误'
    feedback:
      correct: '完全正确！`fn(x) { x * 2 }` 是把输入翻倍的函数。`double(21)` 就是 21 * 2 = 42。'
      choices:
        "1": '不是原样返回输入，而是应用了 `x * 2`——21 * 2 = 42。'
        "2": '`2` 只是乘数，返回值是 `x * 2` = 42。'
        "3": '用 `let` 绑定匿名函数再调用是完全合法的——函数也是值，所以能存进变量。'
  anon-vs-named:
    markdown: |-
      有名字的函数和匿名函数本质上是一回事。`pub fn double(x: Int) -> Int { x * 2 }` 和把 `fn(x) { x * 2 }` 绑定到名字 `double` 上，本质上是一样的。

      匿名函数也可以写上参数类型和返回类型（`fn(x: Int) -> Int { x * 2 }`），但写短小的函数时，通常会省略它们，交给编译器去推断。
  anon-immediate:
    prompt: '匿名函数也可以在创建后立刻调用。这个表达式的值是多少？'
    choices:
      - '`7`'
      - '`12`'
      - '`34`'
      - '编译错误'
    feedback:
      correct: '没错！创建 `fn(a, b) { a + b }` 后立刻用 `(3, 4)` 调用，结果是 3 + 4 = 7。'
      choices:
        "1": '`+` 是加法，不是乘法——3 + 4 = 7。'
        "2": '两个参数是相加，而不是当作文字拼接——3 + 4 = 7。'
        "3": '创建后立刻用 `(3, 4)` 调用是合法的——只是直接应用了这个函数值。'
  anon-syntax:
    prompt: '创建没有名字的匿名函数，正确的语法是？'
    choices:
      - '`fn(x) { x * 2 }`'
      - '`fn double(x) { x * 2 }`'
      - '`lambda x: x * 2`'
      - '`(x) => x * 2`'
    feedback:
      correct: '没错！匿名函数写作 `fn(参数) { 函数体 }`——`fn` 后面不写名字，直接跟括号。'
      choices:
        "1": '`fn double(...)` 是有名字的定义——匿名函数没有名字。'
        "2": '`lambda` 不是 Gleam 语法。匿名函数同样使用关键字 `fn`。'
        "3": 'Gleam 没有 `=>` 箭头语法——函数体要用 `{ }` 包起来。'
