title: 函数捕获 f(_, x)
blocks:
  intro:
    markdown: |-
      像 `list.map([1, 2, 3], fn(x) { add(10, x) })` 这样，我们经常需要“只空出一个参数的函数”。Gleam 为此提供了简短的**函数捕获**语法：在调用中需要填入的位置放一个 `_`（下划线）即可。

      ```gleam
      add(10, _)
      // 是 fn(b) { add(10, b) } 的简写
      ```

      空位 `_` 恰好只有**一个**。`add(10, _)` 就成了“第一个参数固定为 10、只接收第二个参数的新函数”。
  capture-map-add:
    prompt: '把捕获传给 `list.map`，结果是？'
    choices:
      - '`[11, 12, 13]`'
      - '`[10, 20, 30]`'
      - '`[11, 22, 33]`'
      - '`[1, 2, 3]`'
    feedback:
      correct: '完全正确！`add(10, _)` 是“加 10 的函数”，所以每个元素都加上 10，得到 [11, 12, 13]。'
      choices:
        "1": '是*加上* 10，不是*乘以* 10——1+10、2+10、3+10 = [11, 12, 13]。'
        "2": '`_` 每次只接收一个元素——不是把元素乘以 10，而是加上 10。'
        "3": '`add(10, _)` 会应用到每个元素上——每个都加了 10，而不是保持原样。'
  blank-position:
    markdown: |-
      空位的**位置**决定了空出的是哪个参数。这正是捕获的关键。

      `string.append(第一个, 第二个)` 会把第二个接在第一个后面。
      - `string.append(_, "!")` 会在每个值的*后面*加上 `!`（值在第一个位置）。
      - `string.append("!", _)` 会在每个值的*前面*加上 `!`（值在第二个位置）。

      U2 中提到的“管道只能用于第一个参数”这一限制，可以用捕获来解决——因为空位也可以放在第二、第三个位置。
  capture-append-suffix:
    prompt: '把这个捕获传给 `list.map`，结果是？'
    choices:
      - '`["a!", "b!"]`'
      - '`["!a", "!b"]`'
      - '`["a", "b"]`'
      - '`["ab!"]`'
    feedback:
      correct: '没错！`append(_, "!")` 的空位在第一个位置，所以 `!` 被加在每个元素的*后面*——["a!", "b!"]。'
      choices:
        "1": '空位的位置很重要。`append(_, "!")` 中值在*前面*，所以 `!` 加在后面——要加在前面，得用 `append("!", _)`。'
        "2": '捕获得到的函数会应用到每个元素上——它们不会保持原样。'
        "3": '`map` 会把每个元素一一转换——不会把它们合并成一个。'
  vs-currying:
    markdown: |-
      如果你熟悉其他语言，很容易把捕获和“柯里化（currying）”混淆。**Gleam 没有自动柯里化。** 不会像 Haskell 那样，只写 `add 10` 就发生部分应用。

      在 Gleam 中，只有*显式*地放置空位 `_` 时才会发生部分应用。必须写出空位，即 `add(10, _)`，它才会变成 `fn(b) { add(10, b) }`。所以 `add(10, _)` 的类型是 `fn(Int) -> Int`，意思是“还有一个参数空着”。
  capture-type:
    prompt: '已知 `add(a: Int, b: Int) -> Int`，捕获 `add(10, _)` 的类型是？'
    choices:
      - '`fn(Int) -> Int`'
      - '`Int`'
      - '`fn(Int, Int) -> Int`'
      - '`fn() -> Int`'
    feedback:
      correct: '没错！还剩一个空位，所以它是再接收一个参数（Int）并返回 Int 的函数——`fn(Int) -> Int`。'
      choices:
        "1": '捕获是还没完成调用的*函数值*——它是函数，而不是结果 Int。'
        "2": '第一个参数已经填成了 10——只剩一个空位，所以是 `fn(Int) -> Int`。'
        "3": '有一个空位 `_`，所以要接收一个参数——不是 `fn() -> Int`。'
