title: 栈会增长的递归与栈不会增长的递归
blocks:
  intro:
    markdown: |-
      再来看看 U5 中写过的递归。`1 + length(rest)` 在 `length(rest)` **返回之后**还有事要做（`1 +`）。这件“稍后要做的事”必须记在某个地方，所以每多一层调用，就会多堆一个**栈帧**。

      ```gleam
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }
      ```

      列表越长，栈帧也堆得越深。在 JavaScript 目标平台上，输入非常长时栈可能会溢出；在 Erlang（BEAM）上不会溢出，但会占用与输入长度成正比的内存。
  length-still-works:
    prompt: 值本身是正确的。`length([10, 20, 30, 40])` 的值是？
    code: |-
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }

      // length([10, 20, 30, 40]) 的值是？
    choices:
      - "`3`"
      - "`4`"
      - "`100`"
      - "`0`"
    feedback:
      correct: 没错！有四个元素，`1 +` 累积了四次，所以是 4。结果是对的，但在这个过程中栈增长了四层。
      choices:
        "0": 有几个元素就数几次——四个，所以是 4。3 是漏数了一个。
        "2": 不是把值相加，而是数*个数*——是长度 4，而不是总和 100。
        "3": 0 是空列表时的终止值。这里有四个元素。
  what-is-tail:
    markdown: |-
      关键的区别在于：“递归调用是不是这个分支的**最后一个动作**？”

      - `1 + length(rest)`——调用结束后还剩 `1 +` → **不是尾调用**（栈会增长）
      - `count_loop(rest, acc + 1)`——调用本身就是最后一步 → **尾调用**（栈不会增长）

      当递归调用是最后一个动作时，Gleam 会把它编译成**跳转**（尾调用优化，TCO）。它不会堆积新的栈帧，而是复用同一个栈帧。
  which-is-tail:
    prompt: 下面哪个分支是**尾调用**（递归调用是最后一个动作）？
    choices:
      - "`[first, ..rest] -> first + sum(rest)`"
      - "`[_, ..rest] -> 1 + length(rest)`"
      - "`[first, ..rest] -> sum_loop(rest, acc + first)`"
      - "`[first, ..rest] -> { let n = go(rest) n * 2 }`"
    feedback:
      correct: 没错！`sum_loop(rest, acc + first)` 的调用本身就是这个分支的结果——调用*之后*没有要做的事，所以是尾调用，会被优化成跳转。
      choices:
        "0": 递归结果上还剩 `first +`——调用之后还剩加法，就不是尾调用。
        "1": 递归结果上还剩 `1 +`——最后一个动作是加法，所以不是尾调用。
        "3": 它把递归结果存进 `n`，再计算 `n * 2`——调用之后还剩乘法，所以不是尾调用。
  why-tco:
    prompt: 让递归调用成为“最后一个动作”有什么好处？
    choices:
      - 结果值会改变
      - 不再堆积栈帧，而是以跳转的方式循环，即使输入很长，栈也不会溢出
      - 编译会变快
      - 会自动把递归转换成 for 循环
    feedback:
      correct: 没错！调用之后没有要做的事时，Gleam 会把它编译成跳转——不会堆积栈帧，所以输入再长也安全。
      choices:
        "0": 值保持不变——不同的只是*如何*计算同一个答案（栈 vs 跳转）。
        "2": 与编译速度无关——重点是运行时栈不会增长。
        "3": Gleam 没有 for 循环——尾调用本身就成了以跳转方式进行的循环。
