title: 스택이 자라는 재귀, 자라지 않는 재귀
tags:
  - concept:tail-call-optimisation
blocks:
  - prose: intro
    markdown: |-
      U5에서 쓴 재귀를 다시 봅시다. `1 + length(rest)`는 `length(rest)`가 **돌아온 뒤에** 할 일(`1 +`)이 남아 있습니다. 그 "나중에 할 일"을 어딘가 적어둬야 하므로, 호출 한 겹마다 **스택 프레임**이 하나씩 쌓입니다.

      ```gleam
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }
      ```

      리스트가 길어지면 프레임도 그만큼 깊이 쌓입니다. JavaScript 타깃에서는 아주 긴 입력에서 스택이 넘칠 수 있고, Erlang(BEAM)에서는 넘치지 않는 대신 입력 길이에 비례해 메모리를 씁니다.
  - exercise: length-still-works
    type: predict
    prompt: 값 자체는 올바릅니다. `length([10, 20, 30, 40])`의 값은?
    code: |-
      pub fn length(xs: List(Int)) -> Int {
        case xs {
          [] -> 0
          [_, ..rest] -> 1 + length(rest)
        }
      }

      // length([10, 20, 30, 40]) 은?
    choices:
      - "`3`"
      - "`4`"
      - "`100`"
      - "`0`"
    answer: 1
    feedback:
      correct: 맞아요! 원소가 넷이라 `1 +`이 네 번 쌓여 4입니다. 결과는 맞지만, 그 과정에서 스택이 네 겹 자랐습니다.
      choices:
        "0": 원소 개수만큼 셉니다 — 넷이라 4예요. 3은 하나를 빠뜨린 거예요.
        "2": 값을 더하는 게 아니라 *개수*를 셉니다 — 합 100이 아니라 길이 4.
        "3": 0은 빈 리스트일 때의 종료값이에요. 여기엔 원소가 넷 있습니다.
  - prose: what-is-tail
    markdown: |-
      핵심 구분은 "재귀 호출이 그 가지의 **마지막 동작**인가"입니다.

      - `1 + length(rest)` — 호출이 끝나고 `1 +`이 더 남음 → **꼬리 호출 아님** (스택이 자람)
      - `count_loop(rest, acc + 1)` — 호출 그 자체가 마지막 → **꼬리 호출** (스택이 안 자람)

      재귀 호출이 마지막 동작이면 Gleam은 그것을 **점프**로 컴파일합니다(꼬리 호출 최적화, TCO). 새 프레임을 쌓는 대신 같은 프레임을 재활용하는 거예요.
  - exercise: which-is-tail
    type: choice
    prompt: 다음 가지 중 **꼬리 호출**(재귀 호출이 마지막 동작)인 것은?
    choices:
      - "`[first, ..rest] -> first + sum(rest)`"
      - "`[_, ..rest] -> 1 + length(rest)`"
      - "`[first, ..rest] -> sum_loop(rest, acc + first)`"
      - "`[first, ..rest] -> { let n = go(rest) n * 2 }`"
    answer: 2
    feedback:
      correct: 맞아요! `sum_loop(rest, acc + first)`는 호출이 곧 그 가지의 결과예요 — 호출 *뒤에* 할 일이 없으니 꼬리 호출이고, 점프로 최적화됩니다.
      choices:
        "0": 재귀 결과에 `first +`이 더 남아요 — 호출 뒤에 덧셈이 남으면 꼬리 호출이 아닙니다.
        "1": 재귀 결과에 `1 +`이 더 남아요 — 마지막 동작이 덧셈이라 꼬리 호출이 아닙니다.
        "3": 재귀 결과를 `n`에 담아 `n * 2`를 더 합니다 — 호출 뒤에 곱셈이 남아 꼬리 호출이 아니에요.
  - exercise: why-tco
    type: choice
    prompt: 재귀 호출을 "마지막 동작"으로 만들면 좋은 점은?
    choices:
      - 결과 값이 달라진다
      - 스택 프레임을 쌓지 않고 점프로 도는 꼴이 되어 긴 입력에도 스택이 넘치지 않는다
      - 컴파일이 빨라진다
      - 재귀를 for 루프로 자동 변환해 준다
    answer: 1
    feedback:
      correct: 맞아요! 호출 뒤에 할 일이 없으면 Gleam이 점프로 컴파일합니다 — 프레임이 안 쌓이니 입력이 아무리 길어도 안전해요.
      choices:
        "0": 값은 그대로예요 — 같은 답을 *어떻게* 계산하느냐(스택 vs 점프)가 다를 뿐입니다.
        "2": 컴파일 속도와는 무관해요 — 핵심은 실행 시 스택이 자라지 않는다는 점입니다.
        "3": Gleam에는 for 루프가 없어요 — 꼬리 호출 자체가 점프로 도는 반복이 됩니다.
