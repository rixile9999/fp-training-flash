title: 管道优先风格及其局限
blocks:
  intro:
    markdown: |-
      Gleam 标准库在设计时就考虑了“方便用管道”，很多函数都把要转换的**数据作为第一个参数**。所以 `string.trim`、`string.uppercase`、`string.replace`、`string.append` 都能自然地用在管道中。

      `string.replace(字符串, 要查找的, 替换成)` 也是字符串作为第一个参数，所以很适合管道。
  replace-pipe:
    prompt: 这个表达式的值是什么？（`string.replace` 会在第一个参数的字符串中，把第二个参数替换成第三个参数）
    choices:
      - '`"a b c"`'
      - '`"a-b-c"`'
      - '`"abc"`'
      - '`"- -"`'
    feedback:
      correct: 没错！把 "a-b-c" 中所有的 "-" 替换成 " "，得到 "a b c"。
      choices:
        "1": replace 生效了，所以不会保持原样——每个 "-" 都变成了空格。
        "2": "\"-\" 被替换成空格 \" \"，而不是空字符串。"
        "3": 字母 a、b、c 保持不变，只有分隔符被替换。
  limits:
    markdown: |-
      管道优先风格也有局限。管道只能把左边的值放进**第一个**参数。如果沿管道传下去的值需要放在第二个、第三个参数的位置，光靠管道是做不到的。

      这时要用函数捕获（`f(固定值, _)`）或匿名函数，这些会在后面的单元中学习。现在只要记住这个局限：“管道只能用于第一个参数”。
  pipe-limit:
    prompt: 关于管道 `|>` 的局限，哪个说法是正确的？
    choices:
      - 左边的值永远只能放进第一个参数
      - 一次最多只能连接两个
      - 不能用于 Int
      - 只有函数恰好接收一个参数时才能使用
    feedback:
      correct: 没错！管道只会把左边的值放进第一个参数。要放到其他位置，就需要函数捕获。
      choices:
        "1": 连接的数量没有限制——想接多少个都可以。
        "2": 与类型无关——任何值都可以用管道传递。
        "3": 有多个参数也没问题——把其余参数写在调用里就行（例如 `f(_)` 这种形式）。
  non-first-arg:
    prompt: 如果沿管道传下去的值需要放在函数**第二个**参数的位置，该怎么办？
    choices:
      - 光靠管道就够了
      - 需要用函数捕获 `f(固定值, _)` 或匿名函数
      - 做不到，所以不能使用那个函数
      - 会自动调整参数顺序
    feedback:
      correct: 完全正确！管道只能用于第一个参数，其他位置要用函数捕获或匿名函数来处理。
      choices:
        "0": 管道只会放进第一个参数——对第二个位置来说不够用。
        "2": 可以使用——用函数捕获或匿名函数把位置对上就行。
        "3": Gleam 不会自动调整参数顺序。
