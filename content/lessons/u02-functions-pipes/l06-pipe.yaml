title: 파이프 |>
tags:
  - concept:pipe-operator
  - concept:strings
blocks:
  - prose: intro
    markdown: |-
      `|>`(파이프) 연산자는 왼쪽 값을 오른쪽 함수의 **첫 번째 인자**로 넣어줍니다.

      `x |> f`  는  `f(x)`  와 같고,
      `x |> f(y)`  는  `f(x, y)`  와 같습니다. (왼쪽 값이 맨 앞 자리에 들어갑니다!)

      데이터가 왼쪽에서 오른쪽으로, 변환되는 순서대로 흐르는 것이 핵심입니다.
  - exercise: trim-upper
    type: predict
    prompt: 이 파이프 체인의 값은?
    code: |-
      "  lucy "
      |> string.trim
      |> string.uppercase
    choices:
      - '`"LUCY"`'
      - '`"  LUCY "`'
      - '`"lucy"`'
      - '`"  lucy "`'
    answer: 0
    feedback:
      correct: 맞아요! 먼저 trim으로 공백을 없애 "lucy", 그 다음 uppercase로 "LUCY".
      choices:
        "1": trim이 양 끝 공백을 먼저 제거해요. 공백이 남지 않습니다.
        "2": uppercase가 대문자로 바꿔요 — 소문자로 남지 않습니다.
        "3": 두 변환 모두 적용됩니다 — trim과 uppercase를 거칩니다.
  - prose: first-arg
    markdown: |-
      파이프가 값을 **첫 번째 인자**에 넣는다는 점이 가장 헷갈리는 부분입니다.

      `string.append(첫째, 둘째)`는 `첫째` 뒤에 `둘째`를 이어붙입니다.
      그래서 `"LUCY" |> string.append("!")` 는 `string.append("LUCY", "!")` 가 되어 `"LUCY!"`가 됩니다 — `"LUCY"`가 첫 인자, `"!"`가 둘째 인자입니다.
  - exercise: append-pipe
    type: predict
    prompt: 이 표현식의 값은?
    code: '"LUCY" |> string.append("!")'
    choices:
      - '`"LUCY!"`'
      - '`"!LUCY"`'
      - '`"LUCY"`'
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 정확해요! 파이프가 "LUCY"를 첫 인자에 넣어 string.append("LUCY", "!") → "LUCY!".
      choices:
        "1": 파이프는 왼쪽 값을 **첫째** 인자에 넣어요. `append("LUCY", "!")`라서 `!`가 뒤에 붙습니다.
        "2": '`"!"`가 인자로 더해지므로 그대로가 아니라 "LUCY!"가 됩니다.'
        "3": 올바른 파이프 호출이라 컴파일됩니다.
  - exercise: pipe-meaning
    type: choice
    prompt: "`x |> f(y)` 는 무엇과 같은가요?"
    choices:
      - "`f(y, x)`"
      - "`f(x, y)`"
      - "`f(x)(y)`"
      - "`x(f, y)`"
    answer: 1
    feedback:
      correct: 맞아요! 파이프는 왼쪽 값 x를 첫 인자로 넣어 `f(x, y)`가 됩니다.
      choices:
        "0": x는 **첫째** 인자로 들어가요 — `f(x, y)`이지 `f(y, x)`가 아닙니다.
        "2": Gleam엔 커링이 없어요 — `f(x)(y)` 형태가 아닙니다.
        "3": f가 함수이고 x가 그 첫 인자입니다 — x가 f를 호출하지 않아요.
