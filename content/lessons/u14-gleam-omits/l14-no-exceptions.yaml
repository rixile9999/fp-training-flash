title: 예외·뮤테이션·매크로 — 결핍의 일관성
tags:
  - concept:basics
blocks:
  - prose: intro
    markdown: '마지막으로 한꺼번에 정리합니다. Gleam이 빼버린 나머지 셋 — **예외**, **뮤테이션**, **매크로** — 도 같은 철학에서 나옵니다: "숨은 제어 흐름과 숨은 상태를 없애 코드를 읽는 그대로 믿게 한다."'
  - prose: no-exceptions
    markdown: |-
      **예외가 없습니다.** 실패할 수 있는 연산은 던지는 대신 **Result로 돌려줍니다**. 0으로 나누기조차 크래시가 아니라 `Error`예요:

      ```gleam
      int.divide(10, 0)  // Error(Nil)
      int.divide(10, 2)  // Ok(5)
      ```

      실패가 타입에 드러나니, 호출부는 `case`나 `use`로 *반드시* 다뤄야 합니다 — 잊고 지나칠 수가 없죠.
  - exercise: div-zero-result
    type: predict
    prompt: 0으로 나누면 예외가 던져질까요? 이 식의 값은?
    code: int.divide(10, 0)
    choices:
      - "`Error(Nil)`"
      - 런타임 예외(크래시)
      - "`0`"
      - "`Ok(0)`"
    answer: 0
    feedback:
      correct: 맞아요! Gleam엔 예외가 없어 0으로 나누기도 `Error(Nil)`을 돌려줍니다 — 던지지 않아요.
      choices:
        "1": 예외 자체가 없습니다 — 실패는 던지는 게 아니라 `Error` 값으로 *반환*돼요.
        "2": 그냥 `0`이 아니라 `Result`로 감싼 `Error(Nil)`입니다 — 실패가 타입에 드러나요.
        "3": 0 나누기는 성공이 아니라 실패라 `Ok`가 아니라 `Error(Nil)`이에요.
  - prose: no-mutation
    markdown: '**뮤테이션이 없습니다.** 값은 결코 제자리에서 바뀌지 않아요. 리스트에 원소를 "추가"해도 원본은 그대로고 *새* 리스트가 생깁니다 — 내부적으로는 **구조 공유(structural sharing)** 불변 데이터라 비싸지 않아요.'
  - exercise: append-no-mutate
    type: predict
    prompt: "`ys`를 만든 뒤 원본 `xs`를 출력하면?"
    code: |-
      let xs = [1, 2, 3]
      let ys = list.append(xs, [4])
      xs
    choices:
      - "`[1, 2, 3]`"
      - "`[1, 2, 3, 4]`"
      - "`[4, 1, 2, 3]`"
      - "`[4]`"
    answer: 0
    feedback:
      correct: 정확해요! `append`는 *새* 리스트(`ys`)를 만들 뿐, 원본 `xs`는 절대 바뀌지 않습니다 — 여전히 [1, 2, 3].
      choices:
        "1": 그건 새로 만들어진 `ys`예요. 원본 `xs`는 뮤테이션이 없어 그대로 [1, 2, 3]입니다.
        "2": "`append`는 뒤에 붙이고, 게다가 원본을 바꾸지도 않아요 — `xs`는 [1, 2, 3]."
        "3": "`xs`에서 사라지는 원소는 없습니다 — 불변이라 처음 모습 그대로예요."
  - prose: no-macros
    markdown: |-
      **매크로도 (아직) 없습니다.** FAQ는 매크로에 단호히 닫혀 있진 않지만 — **가독성과 컴파일 속도를 해치지 않을 때에만** 열려 있다고 말합니다. 코드가 "보이는 그대로"이길 바라는 같은 원칙이죠.

      결국 없는 것들의 목록 — 타입 클래스, 커링, 게으름, 예외, 뮤테이션, 매크로 — 은 제각각이 아니라 **하나의 일관된 선택**입니다.
  - exercise: consistency
    type: choice
    prompt: 이 유닛이 다룬 "없는 것들"을 관통하는 한 가지 일관된 동기는?
    choices:
      - 숨은 제어 흐름·상태·디스패치를 없애 코드를 읽는 그대로 믿게 한다
      - 다른 언어와 문법을 똑같이 맞추려고
      - 컴파일러 구현이 어려워서 미뤄둔 것뿐
      - 함수형이 아니라 객체지향을 지향하기 때문
    answer: 0
    feedback:
      correct: 맞아요! 타입 클래스(숨은 디스패치)·예외(숨은 제어 흐름)·뮤테이션(숨은 상태)을 모두 빼서, 코드가 보이는 그대로 동작하게 만든 일관된 선택입니다.
      choices:
        "1": 오히려 다른 언어의 관습을 의도적으로 *덜어낸* 쪽입니다 — 똑같이 맞추려는 게 아니에요.
        "2": 구현 난이도가 아니라 설계 철학에 따른 선택이에요 — FAQ가 그 이유를 분명히 밝힙니다.
        "3": Gleam은 함수형 언어입니다 — 이 선택들은 함수형 철학을 *강화*하는 쪽이에요.
