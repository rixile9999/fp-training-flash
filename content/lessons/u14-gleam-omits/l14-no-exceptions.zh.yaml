title: 异常、可变状态、宏——“没有”的一致性
blocks:
  intro:
    markdown: "最后，我们把剩下的一并梳理一下。Gleam 去掉的其余三样东西——**异常**、**可变状态**（mutation）和**宏**——也出自同一个理念：“消除隐藏的控制流和隐藏的状态，让你读到的就是代码实际做的。”"
  no-exceptions:
    markdown: |-
      **没有异常。** 可能失败的操作不会抛出异常，而是**返回 Result**。就连除以 0 也不会崩溃，而是得到一个 `Error`：

      ```gleam
      int.divide(10, 0)  // Error(Nil)
      int.divide(10, 2)  // Ok(5)
      ```

      失败体现在类型上，所以调用方*必须*用 `case` 或 `use` 来处理——不可能忘掉它直接略过。
  div-zero-result:
    prompt: 除以 0 会抛出异常吗？这个表达式的值是什么？
    choices:
      - "`Error(Nil)`"
      - 运行时异常（崩溃）
      - "`0`"
      - "`Ok(0)`"
    feedback:
      correct: 没错！Gleam 没有异常，所以除以 0 也只是返回 `Error(Nil)`——不会抛出。
      choices:
        "1": 根本就没有异常——失败不是被抛出，而是作为 `Error` 值被*返回*。
        "2": 不是单纯的 `0`，而是用 `Result` 包起来的 `Error(Nil)`——失败体现在类型上。
        "3": 除以 0 是失败而不是成功，所以是 `Error(Nil)`，而不是 `Ok`。
  no-mutation:
    markdown: "**没有可变状态。** 值永远不会被原地修改。即使往列表里“添加”元素，原列表也保持不变，而是生成一个*新*列表——其内部是带**结构共享**（structural sharing）的不可变数据，所以开销并不大。"
  append-no-mutate:
    prompt: 创建 `ys` 之后，输出原来的 `xs` 会得到什么？
    choices:
      - "`[1, 2, 3]`"
      - "`[1, 2, 3, 4]`"
      - "`[4, 1, 2, 3]`"
      - "`[4]`"
    feedback:
      correct: 完全正确！`append` 只是创建了一个*新*列表（`ys`），原来的 `xs` 绝不会被改变——仍然是 [1, 2, 3]。
      choices:
        "1": 那是新创建的 `ys`。没有可变状态，原来的 `xs` 依然是 [1, 2, 3]。
        "2": "`append` 是加在末尾的，而且它也不会修改原列表——`xs` 是 [1, 2, 3]。"
        "3": "`xs` 中没有任何元素消失——它是不可变的，保持最初的样子。"
  no-macros:
    markdown: |-
      **（目前）也没有宏。** FAQ 并没有坚决拒绝宏——但它表示，只有在**不损害可读性和编译速度**的前提下才会考虑。这和希望代码“所见即所得”是同一个原则。

      归根结底，这份“没有”的清单——类型类、柯里化、惰性、异常、可变状态、宏——并不是零散的，而是**一个一致的选择**。
  consistency:
    prompt: 贯穿本单元所讲的这些“没有的东西”的，是哪一个一致的动机？
    choices:
      - 消除隐藏的控制流、状态和分派，让你读到的就是代码实际做的
      - 为了和其他语言的语法完全一致
      - 只是因为编译器难以实现而推迟了
      - 因为它追求面向对象而不是函数式
    feedback:
      correct: 没错！去掉类型类（隐藏的分派）、异常（隐藏的控制流）和可变状态（隐藏的状态），都是为了让代码按它看起来的样子运行——这是一个一致的选择。
      choices:
        "1": 恰恰相反，它是有意*去掉*其他语言的惯例——并不是要和它们保持一致。
        "2": 这是由设计理念决定的选择，而不是因为实现难度——FAQ 清楚地说明了理由。
        "3": Gleam 是函数式语言——这些选择是在*强化*函数式理念。
