title: 타입 클래스가 없는 이유
tags:
  - concept:basics
blocks:
  - prose: intro
    markdown: |-
      Haskell에서 왔다면 가장 먼저 허전한 것이 **타입 클래스**입니다. `Ord`, `Eq`, `Show` 같은 "이 타입은 비교할 수 있다"는 약속이 Gleam엔 없어요.

      공식 FAQ는 그 이유를 셋으로 듭니다 — **혼란스러운 에러 메시지**, **느려지는 컴파일 시간**, 그리고 디스패치에 따르는 **런타임 비용**. Gleam은 이 셋을 피하려고 타입 클래스를 아예 넣지 않았습니다.
  - prose: instead
    markdown: |-
      그 대신 Gleam이 주는 것은 단순합니다: **필요한 동작을 함수로 명시해서 넘긴다**.

      예를 들어 정렬에는 "숨은 `Ord` 인스턴스"가 없습니다. `list.sort`는 비교 함수를 **인자로 직접** 받아요:

      ```gleam
      list.sort([3, 1, 2], by: int.compare)
      ```

      무엇으로 비교할지가 코드에 그대로 드러나죠 — 마법도, 암묵적 디스패치도 없습니다.
  - exercise: sort-explicit
    type: predict
    prompt: 비교 함수를 직접 넘기는 이 정렬의 결과는?
    code: "list.sort([3, 1, 2], by: int.compare)"
    choices:
      - "`[1, 2, 3]`"
      - "`[3, 2, 1]`"
      - "`[3, 1, 2]`"
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 맞아요! `int.compare`를 오름차순 비교자로 넘겼으니 [1, 2, 3]입니다. 숨은 `Ord`가 아니라 명시한 함수가 순서를 정해요.
      choices:
        "1": "`int.compare`는 오름차순입니다. 내림차순은 `fn(a, b) { int.compare(b, a) }` 같이 직접 뒤집어 넘겨야 해요."
        "2": "`sort`는 정렬된 새 리스트를 돌려줍니다 — 원본 순서가 그대로 나오지 않아요."
        "3": "`by:`로 비교 함수를 넘겼으니 정상 컴파일됩니다 — 타입 클래스가 없어도 정렬은 함수 전달로 됩니다."
  - prose: describe
    markdown: '"이 타입을 글로 표현하는 법"(Haskell의 `Show`)도 마찬가지예요. 타입마다 알아서 호출되는 인스턴스 대신, **변환 함수를 직접 건네줍니다**. 아래 `describe_all`은 어떤 타입이든 `to_text` 함수만 받으면 동작하는, 타입 클래스의 명시적 대체물입니다.'
  - exercise: describe-pass
    type: predict
    prompt: 함수를 직접 넘겨 각 원소를 글로 바꾸는 코드입니다. 결과는?
    code: |-
      fn describe_all(xs, to_text) {
        list.map(xs, to_text)
      }
      fn coin_text(heads) {
        case heads { True -> "앞"  False -> "뒤" }
      }

      describe_all([True, False, True], coin_text)
    choices:
      - '`["앞", "뒤", "앞"]`'
      - '`["뒤", "앞", "뒤"]`'
      - "`[True, False, True]`"
      - 컴파일 에러 (Show 인스턴스 없음)
    answer: 0
    feedback:
      correct: 정확해요! `coin_text`를 명시적으로 넘겨 각 Bool을 글자로 바꿨습니다 — ["앞", "뒤", "앞"]. 이것이 타입 클래스 없이 동작을 주입하는 방식이에요.
      choices:
        "1": '`True`가 "앞", `False`가 "뒤"입니다 — 첫 원소 `True`는 "앞"으로 시작해요.'
        "2": "`to_text`가 각 원소를 String으로 바꾸므로 결과는 Bool 리스트가 아니라 문자열 리스트예요."
        "3": Gleam엔 `Show` 자체가 없지만, 변환 함수를 **인자로** 넘겼으니 전혀 문제없이 컴파일됩니다.
  - exercise: why-no-typeclass
    type: choice
    prompt: 공식 FAQ가 드는, Gleam에 타입 클래스가 없는 이유로 거리가 먼 것은?
    choices:
      - 혼란스러운 컴파일 에러 메시지를 피하려고
      - 컴파일 시간을 짧게 유지하려고
      - 디스패치의 런타임 비용을 피하려고
      - 타입 추론을 아예 포기했기 때문에
    answer: 3
    feedback:
      correct: 맞아요! Gleam은 타입 추론을 잘 합니다 — 타입 클래스를 뺀 이유는 에러 메시지·컴파일 시간·런타임 비용 세 가지예요.
      choices:
        "0": 이건 실제 이유 중 하나예요. 타입 클래스는 종종 난해한 에러를 낳습니다.
        "1": 이것도 실제 이유입니다 — 인스턴스 해석은 컴파일을 느리게 만들 수 있어요.
        "2": 이것도 맞는 이유예요 — 동적 디스패치엔 런타임 비용이 따릅니다.
