title: 为什么没有柯里化，以及捕获
blocks:
  intro:
    markdown: |-
      在 Haskell 里，`add 10` 会变成“接收一个参数的函数”——这是自动**柯里化**（currying）。Gleam 没有这个。

      在 Gleam 中，`add(10)` 不是函数，而是一个**参数不足的编译错误**。相当于调用一个有两个参数位置的函数，却只填了一个。
  map-missing-arg:
    prompt: 把双参数函数 `add` 只填一个参数就传给 `list.map`，会怎样？
    choices:
      - "`[11, 12]`"
      - 编译错误（参数个数不匹配）
      - "`[10, 10]`"
      - "`[1, 2]`"
    feedback:
      correct: 没错！`add(10)` 是少了一个参数的调用，所以无法编译。Gleam 没有自动柯里化。
      choices:
        "0": 在 Haskell 里是这样。Gleam 没有自动柯里化，请用 `add(10, _)` 明确写出空位。
        "2": "`add(10)` 产生不了任何值，在编译阶段就被拦下了——根本不会运行。"
        "3": "并不是 `add` 没被应用，而是这个调用本身就是编译错误，所以也不会原样输出 [1, 2]。"
  capture:
    markdown: |-
      如果你*确实*想要部分应用呢？那就用**捕获**（capture）来明确表达意图。

      `add(10, _)` 是“只空出一个位置的调用”，是 `fn(b) { add(10, b) }` 的简写。空位 `_` 恰好只能有一个。

      关键的设计意图：失误（漏写参数）和意图（部分应用）**在语法上被区分开**。`add(10)` 是失误，`add(10, _)` 是有意为之。
  capture-map:
    prompt: 这段用捕获明确写出空位的代码，结果是什么？
    choices:
      - "`[11, 12]`"
      - 编译错误
      - "`[10, 20]`"
      - "`[1, 2]`"
    feedback:
      correct: 完全正确！`add(10, _)` 就是 `fn(b) { add(10, b) }`，给每个元素加 10，得到 [11, 12]。
      choices:
        "1": 这次用 `_` 写明了空位，所以没问题——不是参数不足。
        "2": 是*加* 10，不是乘：1+10=11，2+10=12。
        "3": 捕获会应用到每个元素上，所以不会原样输出——结果是 [11, 12]。
  hole-position-prose:
    markdown: 空位的**位置**决定了空出的是哪个参数。即使是同一个函数，`_` 放在哪里，结果也会不同。
  hole-position:
    prompt: 你想在每个字符串*后面*加上 `!`。这个捕获的结果是什么？
    choices:
      - '`["a!", "b!"]`'
      - '`["!a", "!b"]`'
      - '`["a", "b"]`'
      - 编译错误
    feedback:
      correct: 没错！`append(_, "!")` 空出的是第一个参数（元素），所以 "!" 加在每个元素*后面*——["a!", "b!"]。
      choices:
        "1": 那是 `string.append("!", _)` 的结果。空位的位置决定了空出的是哪个参数。
        "2": '`append` 确实会加上 "!"，所以不会原样输出。'
        "3": "用一个 `_` 空出第一个参数，这是合法的捕获，能正常编译。"
  capture-type:
    prompt: "`add` 的类型是 `fn(Int, Int) -> Int` 时，捕获 `add(10, _)` 的类型是什么？"
    choices:
      - "`fn(Int) -> Int`"
      - "`Int`"
      - "`fn(Int, Int) -> Int`"
      - "`fn() -> Int`"
    feedback:
      correct: 没错！空出了一个位置，所以它是接收剩下那个参数的函数：`fn(Int) -> Int`。
      choices:
        "1": 捕获产生的是*函数*而不是值——还得填上空位才能得到结果。
        "2": 接收两个参数的是 `add` 本身。捕获已经填好了一个位置，只剩一个。
        "3": 有一个空位，所以接收一个参数——不是 `fn() -> Int`。
