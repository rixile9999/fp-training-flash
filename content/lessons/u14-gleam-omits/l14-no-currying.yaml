title: 커링이 없는 이유와 캡처
tags:
  - concept:basics
  - tricky:capture-vs-currying
blocks:
  - prose: intro
    markdown: |-
      Haskell이라면 `add 10`이 "한 인자를 받는 함수"가 됩니다 — 자동 **커링**이죠. Gleam엔 그게 없습니다.

      Gleam에서 `add(10)`은 함수가 아니라 **인자 부족 컴파일 에러**예요. 두 자리짜리 함수를 한 자리만 채워 부른 셈이니까요.
  - exercise: map-missing-arg
    type: predict
    prompt: 두 인자 함수 `add`를 한 자리만 채워 `list.map`에 넘기면?
    code: |-
      fn add(a, b) { a + b }

      list.map([1, 2], add(10))
    choices:
      - "`[11, 12]`"
      - 컴파일 에러 (인자 개수 불일치)
      - "`[10, 10]`"
      - "`[1, 2]`"
    answer: 1
    feedback:
      correct: 맞아요! `add(10)`은 인자가 하나 모자란 호출이라 컴파일되지 않습니다. Gleam엔 자동 커링이 없어요.
      choices:
        "0": Haskell이라면 맞습니다. Gleam은 자동 커링이 없으니 `add(10, _)`로 빈자리를 명시하세요.
        "2": "`add(10)`은 값을 만들지 못하고 컴파일 단계에서 막힙니다 — 실행 자체가 안 돼요."
        "3": "`add`가 적용되지 못한 게 아니라 호출이 컴파일 에러라, [1, 2]가 그대로 나오지도 않아요."
  - prose: capture
    markdown: |-
      부분 적용이 *정말* 하고 싶다면? **캡처**로 의도를 명시합니다.

      `add(10, _)`는 "한 자리만 비워둔 호출"로, `fn(b) { add(10, b) }`의 단축이에요. 빈칸 `_`는 정확히 한 개.

      핵심 설계 의도: 실수(인자 빠뜨림)와 의도(부분 적용)가 **문법으로 구분**됩니다. `add(10)`은 실수, `add(10, _)`는 의도.
  - exercise: capture-map
    type: predict
    prompt: 캡처로 빈자리를 명시한 이 코드의 결과는?
    code: |-
      fn add(a, b) { a + b }

      list.map([1, 2], add(10, _))
    choices:
      - "`[11, 12]`"
      - 컴파일 에러
      - "`[10, 20]`"
      - "`[1, 2]`"
    answer: 0
    feedback:
      correct: 정확해요! `add(10, _)`는 `fn(b) { add(10, b) }`라, 각 원소에 10을 더해 [11, 12]가 됩니다.
      choices:
        "1": 이번엔 `_`로 빈자리를 채웠으니 정상입니다 — 인자 부족이 아니에요.
        "2": 10을 *더합니다*. 곱하는 게 아니라 1+10=11, 2+10=12예요.
        "3": 캡처가 각 원소에 적용되므로 원본 그대로 나오지 않아요 — [11, 12]입니다.
  - prose: hole-position-prose
    markdown: 빈칸의 **위치**가 어느 인자를 비울지 정합니다. 같은 함수라도 `_`를 어디 두느냐로 결과가 달라져요.
  - exercise: hole-position
    type: predict
    prompt: 각 문자열 *뒤에* `!`를 붙이려 합니다. 이 캡처의 결과는?
    code: list.map(["a", "b"], string.append(_, "!"))
    choices:
      - '`["a!", "b!"]`'
      - '`["!a", "!b"]`'
      - '`["a", "b"]`'
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 맞아요! `append(_, "!")`는 첫 인자(원소)를 비워, 각 원소 *뒤에* "!"를 붙입니다 — ["a!", "b!"].
      choices:
        "1": 그건 `string.append("!", _)`의 결과예요. 빈칸 위치가 어느 인자가 비는지를 정합니다.
        "2": '`append`가 "!"를 실제로 붙이므로 원본 그대로 나오지 않아요.'
        "3": "`_` 한 개로 첫 인자를 비운 올바른 캡처라 정상 컴파일됩니다."
  - exercise: capture-type
    type: choice
    prompt: "`add`가 `fn(Int, Int) -> Int`일 때, 캡처 `add(10, _)`의 타입은?"
    choices:
      - "`fn(Int) -> Int`"
      - "`Int`"
      - "`fn(Int, Int) -> Int`"
      - "`fn() -> Int`"
    answer: 0
    feedback:
      correct: 맞아요! 한 자리를 비웠으니 남은 인자 하나를 받는 함수, `fn(Int) -> Int`입니다.
      choices:
        "1": 캡처는 값이 아니라 *함수*를 만듭니다 — 아직 빈자리를 채워야 결과가 나와요.
        "2": 두 자리를 다 받는 건 `add` 자신이에요. 캡처는 한 자리를 이미 채웠으니 하나만 남습니다.
        "3": 빈칸이 하나 있으니 인자 하나를 받습니다 — `fn() -> Int`가 아니에요.
