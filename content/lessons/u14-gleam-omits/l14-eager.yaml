title: 게으름이 없다 — eager 평가
tags:
  - concept:basics
blocks:
  - prose: intro
    markdown: |-
      Haskell은 게으릅니다(lazy) — 값은 *필요할 때* 계산되죠. Gleam은 반대로 **eager**입니다: 함수에 넘긴 인자는 호출이 *시작되기 전에* 모두 계산됩니다.

      그래서 무한 시퀀스 같은 게으른 구조는 언어가 아니라 라이브러리(`gleam_yielder`, stdlib 아님)의 몫이에요.
  - prose: eager-arg
    markdown: |-
      이게 왜 중요할까요? "조건이 거짓이면 비싼 계산을 건너뛰겠지"라는 lazy식 기대가 Gleam에선 통하지 않기 때문입니다.

      `bool.guard(when:, return:, otherwise:)`를 봅시다. `when`이 `False`라 `return` 값이 *버려질* 상황이어도, `return:` 자리에 직접 쓴 식은 **호출 전에 이미 계산**됩니다.
  - exercise: eager-side-effect
    type: predict
    prompt: "`when: False`라 `return` 값은 버려집니다. 그런데 `계산됨`이 출력될까요? (`expensive()`는 `계산됨`을 출력하고 값을 돌려줍니다)"
    code: |-
      fn expensive() {
        io.println("계산됨")
        "결과"
      }

      bool.guard(when: False, return: expensive(), otherwise: fn() { "기본" })
    choices:
      - "`계산됨`이 출력된다 (eager)"
      - 아무것도 출력되지 않는다 (lazy)
      - "`기본`이 출력된다"
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 맞아요! Gleam은 eager라, `return:` 자리의 `expensive()`가 호출 전에 이미 실행됩니다 — 값이 버려져도 부수효과(`계산됨` 출력)는 일어나요.
      choices:
        "1": 그건 lazy 언어의 동작입니다. Gleam은 인자를 호출 전에 모두 계산해요 — `계산됨`이 찍힙니다.
        "2": '`expensive()`는 `계산됨`을 출력하지 `기본`을 출력하지 않습니다. `"기본"`은 `otherwise` 쪽 값이에요.'
        "3": "`bool.guard`에 올바른 인자를 넘겼으니 정상 컴파일됩니다 — 문제는 평가 시점이에요."
  - prose: thunk
    markdown: |-
      그럼 지연이 정말 필요할 땐? **익명 함수로 감싸 넘깁니다**(U7의 `fn() { ... }`). 함수 *값*은 만들어질 뿐 호출되기 전엔 실행되지 않으니까요 — 이게 게으름의 수동 대체재입니다.

      `bool.lazy_guard`는 양쪽을 `fn() -> a` 썽크(thunk)로 받아, 실제로 고른 쪽만 호출합니다.
  - exercise: thunk-defers
    type: predict
    prompt: "이번엔 `expensive`를 `fn() { ... }`로 감싸 `lazy_guard`에 넘깁니다. `when: False`일 때 이 식의 값과 출력은?"
    code: |-
      fn expensive() {
        io.println("계산됨")
        "결과"
      }

      bool.lazy_guard(
        when: False,
        return: fn() { expensive() },
        otherwise: fn() { "기본" },
      )
    choices:
      - 값은 `"기본"`, 출력은 없음 (expensive 썽크는 호출 안 됨)
      - "`계산됨` 그리고 `기본`"
      - "`계산됨`"
      - 값은 `"결과"` (return 썽크가 호출됨)
    answer: 0
    feedback:
      correct: "정확해요! 썽크로 감쌌으니 `return` 쪽은 호출되지 않고, `when: False`라 `otherwise`가 골라져 `기본`만 나옵니다."
      choices:
        "1": "`return` 썽크는 호출조차 안 되므로 `계산됨`은 찍히지 않아요 — `기본`만 출력됩니다."
        "2": "`fn()`으로 감쌌으니 `expensive`는 실행되지 않습니다 — 이게 지연의 핵심이에요."
        "3": '`when: False`이면 `otherwise` 썽크가 골라집니다. `return` 쪽은 호출되지 않으니 값은 `"기본"`이에요.'
  - exercise: lazy-where
    type: choice
    prompt: Gleam에서 무한 시퀀스 같은 "게으른 구조"는 어디에 있나요?
    choices:
      - 언어에 내장돼 있다
      - stdlib의 `gleam/lazy` 모듈
      - 별도 라이브러리 `gleam_yielder` (stdlib 아님)
      - "`Int`처럼 기본 타입이다"
    answer: 2
    feedback:
      correct: 맞아요! 게으른 시퀀스는 언어가 아니라 별도 라이브러리 `gleam_yielder`의 영역입니다 — 표준 라이브러리에도 들어있지 않아요.
      choices:
        "0": Gleam 언어 자체는 eager뿐입니다 — 게으름은 내장돼 있지 않아요.
        "1": "`gleam/lazy` 같은 stdlib 모듈은 없습니다. 게으름은 외부 라이브러리예요."
        "3": 게으른 시퀀스는 기본 타입이 아니라 라이브러리가 제공하는 자료구조입니다.
