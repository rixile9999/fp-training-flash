title: record와 labelled fields
tags:
  - concept:custom-types
  - concept:labelled-fields
blocks:
  - prose: intro
    markdown: |-
      variant가 데이터를 **담을** 수도 있습니다. 괄호 안에 `이름: 타입` 꼴의 **필드**를 적으면, 여러 값을 하나로 묶은 **record**가 됩니다.

      ```gleam
      pub type Player {
        Player(name: String, score: Int, level: Int)
      }
      ```

      타입 이름과 같은 `Player`가 값을 만드는 생성자예요. 만들 때는 `Player(name: "lucy", score: 10, level: 1)`처럼 **라벨**과 함께 적습니다. 만든 뒤 한 필드만 꺼낼 땐 `p.score`처럼 점으로 접근합니다.
  - exercise: field-access
    type: predict
    prompt: 아래 코드에서 `p.score`의 값은?
    code: |-
      pub type Player {
        Player(name: String, score: Int, level: Int)
      }

      let p = Player(name: "lucy", score: 10, level: 1)
      // p.score 은?
    choices:
      - "`10`"
      - "`1`"
      - '`"lucy"`'
      - "`Player`"
    answer: 0
    feedback:
      correct: 맞아요! `p.score`는 `score` 필드 값인 10을 그대로 꺼냅니다.
      choices:
        "1": "`1`은 `level` 필드예요. `.score`는 score 자리를 봅니다."
        "2": '"lucy"는 `name` 필드예요. `.score`가 가리키는 건 10입니다.'
        "3": "`p.score`는 record 전체가 아니라 한 필드(10)만 꺼냅니다."
  - prose: labelled-order
    markdown: '필드에 **라벨**이 붙어 있으면 생성할 때 순서를 바꿔 적어도 됩니다 — 라벨이 어느 필드인지 말해주니까요. `Player(level: 1, name: "lucy", score: 10)`도 정의 순서대로 쓴 것과 똑같은 값을 만듭니다. 라벨은 "세 번째 인자가 대체 뭐였지?" 하는 혼란을 없애줍니다.'
  - exercise: labelled-reorder
    type: predict
    prompt: 라벨 순서를 바꿔 적은 코드입니다. `p.name`의 값은?
    code: |-
      pub type Player {
        Player(name: String, score: Int, level: Int)
      }

      let p = Player(level: 1, name: "lucy", score: 10)
      // p.name 은?
    choices:
      - '`"lucy"`'
      - "`1`"
      - "`10`"
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 정확해요! 라벨로 적었으니 순서는 상관없습니다 — `name`은 여전히 "lucy".
      choices:
        "1": '`1`은 `level` 값이에요. 라벨 `name:`이 가리키는 건 "lucy"입니다.'
        "2": '`10`은 `score` 값이에요. `.name`은 "lucy"를 봅니다.'
        "3": 라벨을 붙이면 순서를 바꿔도 정상 컴파일됩니다 — 라벨이 자리를 알려줘요.
  - prose: destructure
    markdown: "record는 `case`나 `let`에서 **분해(destructure)**할 수도 있습니다. 패턴 자리에 `Point(x: x, y: y)`처럼 적으면 각 필드를 이름에 한 번에 묶습니다. 필요 없는 필드는 `_`로 버리면 돼요."
  - exercise: destructure-x
    type: predict
    prompt: record를 분해하는 코드입니다. 출력은?
    code: |-
      pub type Point {
        Point(x: Int, y: Int)
      }

      let p = Point(x: 3, y: 7)
      case p {
        Point(x: x, y: _) -> echo x
      }
    choices:
      - "`3`"
      - "`7`"
      - "`10`"
      - "`Point(3, 7)`"
    answer: 0
    feedback:
      correct: "맞아요! `Point(x: x, y: _)`가 `x` 필드(3)를 이름 `x`에 묶고, `y`는 `_`로 버립니다."
      choices:
        "1": "`7`은 `y` 필드예요 — 하지만 `_`로 버려서 쓰지 않았어요. 묶은 건 `x`(3)."
        "2": 두 필드를 더하지 않아요 — 분해는 각 필드를 따로 이름에 묶을 뿐입니다.
        "3": 분해 패턴은 record 전체가 아니라 꺼낸 필드 값(3)을 이름에 묶습니다.
  - exercise: labelled-why
    type: choice
    prompt: record에 labelled fields(필드 라벨)를 쓰면 좋은 점으로 가장 옳은 것은?
    choices:
      - 성능이 빨라진다
      - 생성·분해 시 각 값이 어떤 필드인지 이름으로 분명해진다
      - 필드 개수를 무제한으로 만들 수 있다
      - 타입 표기를 생략할 수 있다
    answer: 1
    feedback:
      correct: 맞아요! 라벨은 `Player("lucy", 10, 1)`의 "세 번째 1이 대체 뭐였지?"를 없애줍니다 — 이름으로 의미가 분명해져요.
      choices:
        "0": 라벨은 가독성을 위한 것이지 성능과는 무관해요 — 같은 값을 만듭니다.
        "2": 필드 개수는 라벨과 무관해요. 라벨이 하는 일은 각 자리에 이름을 붙이는 것입니다.
        "3": 필드 타입 표기는 그대로 필요해요 — 라벨은 타입을 대신하지 않습니다.
