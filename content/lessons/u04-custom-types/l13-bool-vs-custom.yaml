title: Bool 대신 커스텀 타입
tags:
  - concept:custom-types
blocks:
  - prose: intro
    markdown: |-
      상태가 둘뿐일 땐 `Bool`을 쓰고 싶어집니다 — `is_admin: Bool`처럼요. 하지만 상태가 셋 이상으로 늘어나면 `Bool`로는 표현이 안 됩니다. 게다가 `True`/`False`는 "무엇이 참인지"를 코드에서 읽을 수 없어요(이른바 *boolean blindness*).

      그래서 Gleam에서는 **의미 있는 이름의 variant**를 즐겨 만듭니다.

      ```gleam
      pub type Access {
        Guest
        Member
        Admin
      }
      ```

      `Admin`은 그 자체로 의미가 분명하고, 나중에 `Moderator`를 끼워 넣어도 컴파일러가 고칠 곳을 다 짚어줍니다.
  - exercise: why-custom
    type: choice
    prompt: "권한을 `is_admin: Bool` 대신 커스텀 타입 `Access { Guest Member Admin }`로 표현하면 좋은 이유로 옳은 것은?"
    choices:
      - Bool보다 항상 빠르다
      - 상태가 셋 이상이어도 표현되고, 각 상태의 의미가 이름으로 드러난다
      - "`case`를 쓸 필요가 없어진다"
      - 메모리를 덜 쓴다
    answer: 1
    feedback:
      correct: 맞아요! `Bool` 두 값으로는 셋 이상을 못 담고, `True`/`False`는 의미를 숨깁니다. variant는 의미와 확장성을 모두 줍니다.
      choices:
        "0": 속도가 목적이 아니에요 — 표현력과 의미의 명확함이 핵심입니다.
        "2": 오히려 `case`로 각 variant를 다루게 되고, exhaustiveness 안전망까지 얻습니다.
        "3": 메모리 절약이 목적이 아니라, '불가능한 상태를 막고 의미를 드러내는' 것이 목적입니다.
  - exercise: can-delete-member
    type: predict
    prompt: 권한별 삭제 가능 여부입니다. `can_delete(Member)`의 값은?
    code: |-
      pub type Access {
        Guest
        Member
        Admin
      }

      pub fn can_delete(a: Access) -> Bool {
        case a {
          Admin -> True
          Member -> False
          Guest -> False
        }
      }

      // can_delete(Member) 은?
    choices:
      - "`True`"
      - "`False`"
      - "`Member`"
      - 컴파일 에러
    answer: 1
    feedback:
      correct: 맞아요! `Member` 가지는 `False`를 돌려줍니다 — 회원은 삭제 권한이 없네요.
      choices:
        "0": "`True`는 `Admin`일 때예요. 입력은 `Member`라 `False`입니다."
        "2": "`case`는 입력 variant가 아니라 가지의 결과(`Bool`)를 돌려줍니다."
        "3": 세 variant를 모두 다뤄 exhaustive하니 정상 컴파일됩니다.
  - prose: states-as-type
    markdown: |-
      boolean blindness가 특히 아픈 곳은 "진행 중" 같은 중간 상태입니다. 연결 상태를 `is_connected: Bool`로 두면 "연결 중"을 표현할 자리가 없어요. variant면 깔끔합니다:

      ```gleam
      pub type Connection {
        Connecting
        Connected
        Disconnected
      }
      ```
  - exercise: connection-message
    type: predict
    prompt: 연결 상태별 메시지입니다. `message(Connected)`의 값은?
    code: |-
      pub type Connection {
        Connecting
        Connected
        Disconnected
      }

      pub fn message(c: Connection) -> String {
        case c {
          Connecting -> "연결 중..."
          Connected -> "연결됨"
          Disconnected -> "끊김"
        }
      }

      // message(Connected) 은?
    choices:
      - '`"연결 중..."`'
      - '`"연결됨"`'
      - '`"끊김"`'
      - "`Connected`"
    answer: 1
    feedback:
      correct: 정확해요! `Connected` 가지에 맞아 "연결됨"이 됩니다 — `Bool`이었다면 이 세 상태를 못 담았을 거예요.
      choices:
        "0": '"연결 중..."은 `Connecting` 가지예요 — 입력은 `Connected`입니다.'
        "2": '"끊김"은 `Disconnected` 가지예요 — `Connected`가 아니에요.'
        "3": "`case`는 입력 variant가 아니라 맞은 가지의 결과(문자열)를 돌려줍니다."
  - exercise: boolean-blindness
    type: choice
    prompt: "함수 시그니처 `fn render(loading: Bool, error: Bool) -> ...`의 문제로 가장 옳은 것은?"
    choices:
      - Bool은 함수 인자로 쓸 수 없다
      - "`(True, True)`처럼 모순된 '불가능한 상태'가 타입상 허용되고, 의미가 이름에 드러나지 않는다"
      - 인자가 두 개라서 느리다
      - Bool은 `case`에 못 쓴다
    answer: 1
    feedback:
      correct: 맞아요! 로딩이면서 동시에 에러인 `(True, True)`는 말이 안 되는데도 타입이 막지 못합니다 — 상태 하나를 variant 타입으로 묶으면 불가능한 조합을 아예 없앨 수 있어요.
      choices:
        "0": "`Bool`은 인자로 잘 쓰입니다 — 문제는 여러 `Bool`이 모순 상태를 허용한다는 점이에요."
        "2": 인자 개수와 속도는 무관해요 — 핵심은 불가능한 상태를 타입이 못 막는다는 점입니다.
        "3": "`Bool`도 `case True/False`로 잘 다룰 수 있어요 — 그게 문제가 아닙니다."
