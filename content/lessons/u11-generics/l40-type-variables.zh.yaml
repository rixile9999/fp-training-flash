title: 类型变量——任意的某一种
blocks:
  intro:
    markdown: |-
      到目前为止，类型总是像 `Int`、`String` 这样以**大写字母**开头。但如果在函数签名里看到 `a`、`b` 这样的**小写**名字，那就是**类型变量（type variable）**。

      类型变量是一个约定：“它可以是任意类型，但相同的字母必须是相同的类型。”具体填入哪个类型，由编译器在**调用的那一刻**通过推断来决定。
  pair-map:
    markdown: |-
      看看下面的 `pair_map`。它接收一个两个元素类型相同（`a`）的元组，对每个元素应用 `f`，生成一个新元组。

      ```gleam
      pub fn pair_map(pair: #(a, a), f: fn(a) -> b) -> #(b, b) {
        let #(x, y) = pair
        #(f(x), f(y))
      }
      ```

      `a` 是输入元素的类型，`b` 是 `f` 返回的类型。两者可以不同——只要*相同的字母*对应相同的类型就行。
  pair-map-to-string:
    prompt: '`int.to_string` 接收 `Int`，返回 `String`。这次调用的值是？'
    choices:
      - '`#("1", "2")`'
      - '`#(1, 2)`'
      - '`#("1, 2")`'
      - 编译错误
    feedback:
      correct: '完全正确！这里 `a = Int`，`b = String`。对每个元素应用 `int.to_string`，得到 `#("1", "2")`。'
      choices:
        "1": '`f` 会转换每个元素——不会原样得到 `#(1, 2)`。'
        "2": '结果是一个**元组**，而不是一个字符串——每个元素分别转换后，仍各占一个位置。'
        "3": '两个都是 `Int`，遵守了 `#(a, a)` 的约定，所以能正常编译。'
  pair-map-double:
    prompt: 这次用匿名函数把每个元素翻倍。这次调用的值是？
    choices:
      - '`#(6, 8)`'
      - '`#(3, 4)`'
      - '`#(7)`'
      - '`#(3, 4, 6, 8)`'
    feedback:
      correct: '答对了！这里 `a = Int`，`b = Int`。3*2=6，4*2=8，所以是 `#(6, 8)`。'
      choices:
        "1": '`f` 会作用于每个元素，值会改变——原值不会原样保留。'
        "2": '不是把两个元素相加，而是分别转换，保持**元组的两个位置**。'
        "3": '元素个数不会增加——输出和输入形状相同，是 `#(b, b)`，也就是两个位置。'
  same-letter-rule:
    prompt: '`pair: #(a, a)` 这个类型标注**约定**的是什么？'
    choices:
      - 元组的两个元素必须是同一类型
      - '元组的两个元素必须都是 `Int`'
      - 元组的两个元素可以是不同类型
      - '元组必须恰好有 `a` 个元素'
    feedback:
      correct: '答对了！同一个字母 `a` 用了两次，所以两个元素被绑定为*相同*的类型。像 `#(1, "x")` 这样混用就会产生编译错误。'
      choices:
        "1": '`a` 可以是*任意*类型——并不固定为 `Int`。只要两者相同就行。'
        "2": '要允许不同类型，就得用不同字母，比如 `#(a, b)`。`#(a, a)` 强制两者相同。'
        "3": '`a` 是指代*类型*的名字，而不是数量——与元组有几个位置无关。'
