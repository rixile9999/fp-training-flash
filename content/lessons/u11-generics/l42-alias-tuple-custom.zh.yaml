title: type alias，以及元组与自定义类型
blocks:
  intro:
    markdown: |-
      每次都写一长串类型太麻烦时，可以用 **type alias（类型别名）**给它起个简短的别名。

      ```gleam
      pub type Pair =
        #(String, Int)
      ```

      注意：别名*不会创建新类型*。`Pair` 只是 `#(String, Int)` 的**另一个名字**，两者完全兼容。这和自定义类型（`pub type Box(a) { Box(...) }`）会*创建*新类型是不同的。
  alias-use:
    prompt: |-
      `make` 返回 `Pair`（也就是 `#(String, Int)`）。下面的输出是什么？

      ```gleam
      pub type Pair = #(String, Int)
      pub fn make() -> Pair { #("score", 100) }
      ```
    choices:
      - '`"score=100"`'
      - '`"score"`'
      - '`"100"`'
      - 编译错误
    feedback:
      correct: '答对了！`Pair` 就是 `#(String, Int)`，所以像元组一样用 `.0`/`.1` 访问——"score" <> "=" <> "100"。'
      choices:
        "1": '不只用了 `.0`，还拼接了 `.1`——结果是 "score=100"。'
        "2": '`.0`（"score"）也会一起拼接——不会只得到 "100"。'
        "3": '别名不是新类型，而就是元组本身，所以 `.0`/`.1` 访问可以正常工作。'
  tuple-access:
    markdown: '元组的元素按位置取出：第一个是 `.0`，第二个是 `.1`。区分它们靠的是**顺序**而不是名字。所以元组有个缺点：“轻便，但代码里看不出每个位置代表什么。”'
  tuple-index:
    prompt: 取出元组的第二个元素会得到什么？
    choices:
      - '`30`'
      - '`"lucy"`'
      - '`#("lucy", 30)`'
      - '`1`'
    feedback:
      correct: '完全正确！`.1` 是**第二个**元素（从 0 开始数），所以是 30。'
      choices:
        "1": '第一个（"lucy"）是 `.0`，不是 `.1`——索引从 0 开始数。'
        "2": '`.1` 只取出*一个位置*，而不是整个元组——是 30。'
        "3": '`.1` 是索引写法，并不是返回这个数字本身——取出的是第二个元素 30。'
  custom-access:
    markdown: |-
      相反，自定义记录的每个位置都有**名字**。`User(name: "lucy", age: 30)` 的第二个位置不是用 `.1`，而是用 `.age` 取出。

      ```gleam
      pub type User {
        User(name: String, age: Int)
      }
      ```

      如果只有两三个元素、含义一目了然，用元组就够了；但当位置变多，或者你开始疑惑“这个位置是什么意思？”时，惯用做法是升级为**带名字的自定义类型**。
  record-field:
    prompt: 用带名字的字段访问会得到什么？
    choices:
      - '`"lucy"`'
      - '`30`'
      - '`"name"`'
      - '`User(...)`'
    feedback:
      correct: '答对了！`.name` 字段指向 "lucy"——你是按*名字*而不是按位置（`.0`）取出的。'
      choices:
        "1": '30 是 `.age`，不是 `.name`——要看字段名。'
        "2": '`.name` 返回的是该字段的*值*（"lucy"），而不是字段的*名字*。'
        "3": '只取出 `name` 这一个位置，而不是*整个记录值*——是 "lucy"。'
  tuple-vs-custom:
    prompt: 下面哪种情况更适合用**自定义类型**（而不是元组）？
    choices:
      - 有 5 个字段，并且想在代码里明确每个字段的含义时
      - 临时把两个值绑在一起，马上又解构时
      - 像坐标 `#(x, y)` 这样含义一目了然的两个值时
      - 函数需要一个临时组合，一次返回两个值时
    feedback:
      correct: 答对了！位置越多、含义越重要，带名字的字段（自定义类型）越能让代码自己说明自己。
      choices:
        "1": 临时绑在一起、马上又拆开的轻量组合，用元组更方便。
        "2": '像 `x, y` 这样一目了然的两个值，用元组也完全读得懂。'
        "3": 临时的返回组合正是元组的典型用法——没多大必要专门创建新类型。
