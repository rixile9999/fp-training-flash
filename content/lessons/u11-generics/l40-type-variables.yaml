title: 타입 변수 — 아무거나 한 가지
tags:
  - concept:generics
blocks:
  - prose: intro
    markdown: |-
      지금까지 타입은 `Int`, `String`처럼 늘 **대문자**로 시작했습니다. 그런데 함수 시그니처에 `a`, `b`처럼 **소문자** 이름이 보이면 그건 **타입 변수(type variable)**입니다.

      타입 변수는 "아무 타입이나 될 수 있지만, 같은 글자끼리는 반드시 같은 타입"이라는 약속이에요. 어떤 구체 타입이 들어갈지는 **호출하는 순간** 컴파일러가 추론으로 정합니다.
  - prose: pair-map
    markdown: |-
      아래 `pair_map`을 보세요. 두 원소가 같은 타입(`a`)인 튜플을 받아, 각 원소에 `f`를 적용해 새 튜플을 만듭니다.

      ```gleam
      pub fn pair_map(pair: #(a, a), f: fn(a) -> b) -> #(b, b) {
        let #(x, y) = pair
        #(f(x), f(y))
      }
      ```

      `a`는 입력 원소의 타입, `b`는 `f`가 돌려주는 타입입니다. 둘이 달라도 됩니다 — 단지 *같은 글자끼리만* 같으면 돼요.
  - exercise: pair-map-to-string
    type: predict
    prompt: "`int.to_string`은 `Int`를 받아 `String`을 돌려줍니다. 이 호출의 값은?"
    code: pair_map(#(1, 2), int.to_string)
    choices:
      - '`#("1", "2")`'
      - "`#(1, 2)`"
      - '`#("1, 2")`'
      - 컴파일 에러
    answer: 0
    feedback:
      correct: 정확해요! `a = Int`, `b = String`으로 채워집니다. 각 원소에 `int.to_string`이 적용돼 `#("1", "2")`.
      choices:
        "1": "`f`가 각 원소를 변환합니다 — 원본 그대로(`#(1, 2)`)가 나오지 않아요."
        "2": 결과는 문자열 하나가 아니라 **튜플**입니다 — 원소가 각각 변환돼 두 칸으로 남아요.
        "3": "`Int`와 `Int`라 `#(a, a)` 약속을 지키므로 정상 컴파일됩니다."
  - exercise: pair-map-double
    type: predict
    prompt: 이번엔 익명 함수로 각 원소를 2배 합니다. 이 호출의 값은?
    code: pair_map(#(3, 4), fn(n) { n * 2 })
    choices:
      - "`#(6, 8)`"
      - "`#(3, 4)`"
      - "`#(7)`"
      - "`#(3, 4, 6, 8)`"
    answer: 0
    feedback:
      correct: 맞아요! 여기선 `a = Int`, `b = Int`입니다. 3*2=6, 4*2=8이라 `#(6, 8)`.
      choices:
        "1": "`f`가 각 원소에 적용돼 값이 바뀝니다 — 원본이 그대로 남지 않아요."
        "2": 두 원소를 더하는 게 아니라, 각각 따로 변환해 **튜플 두 칸**을 유지합니다.
        "3": 원소가 늘어나지 않아요 — 입력과 같은 모양 `#(b, b)`, 즉 두 칸입니다.
  - exercise: same-letter-rule
    type: choice
    prompt: "`pair: #(a, a)`라는 타입 표기가 **약속하는** 것은 무엇일까요?"
    choices:
      - 튜플의 두 원소는 서로 같은 타입이어야 한다
      - 튜플의 두 원소는 반드시 `Int`여야 한다
      - 튜플의 두 원소는 서로 달라도 된다
      - 튜플은 원소가 정확히 `a`개여야 한다
    answer: 0
    feedback:
      correct: 맞아요! 같은 글자 `a`가 두 번 쓰였으니, 두 원소는 *같은* 타입으로 묶입니다. `#(1, "x")`처럼 섞으면 컴파일 에러예요.
      choices:
        "1": "`a`는 *아무* 타입이나 될 수 있어요 — `Int`로 고정된 게 아닙니다. 단지 둘이 같기만 하면 돼요."
        "2": 다른 타입을 허용하려면 `#(a, b)`처럼 글자를 달리 써야 해요. `#(a, a)`는 같음을 강제합니다.
        "3": "`a`는 개수가 아니라 *타입*을 가리키는 이름입니다 — 튜플 칸 수와는 무관해요."
