title: 你写过的递归有名字——map
blocks:
  intro:
    markdown: |-
      回想一下你在 U5~U6 中手写的递归。处理列表的头部、再对尾部调用自身的那种模式——其实**早就有名字了**。

      把每个元素**一一转换**、生成同样长度的新列表的递归，正是 `list.map`。

      ```gleam
      import gleam/list

      list.map([1, 2, 3], fn(x) { x * 2 })
      // == [2, 4, 6]
      ```

      `list.map(列表, 转换函数)`——转换函数接收一个元素，返回一个新元素。元素个数保持不变。
  map-double:
    prompt: '这个 `list.map` 的结果是？'
    choices:
      - '`[2, 4, 6]`'
      - '`[1, 2, 3]`'
      - '`12`'
      - '`[1, 4, 9]`'
    feedback:
      correct: '没错！转换函数 `x * 2` 被一一应用到每个元素上，得到 `[2, 4, 6]`。'
      choices:
        "1": '转换函数会应用到所有元素上——它们会被翻倍，而不是保持原样。'
        "2": 'map 不会把列表合并起来。它返回一个长度相同的**列表**——而不是单个值。'
        "3": '`x * 2` 是翻倍，不是平方。`[1, 4, 9]` 是 `x * x` 的结果。'
  shape-changes:
    markdown: |-
      map 还可以**改变元素的类型**。转换函数的返回类型，就是新列表的元素类型。对 `List(Int)` 用 `int.to_string` 做 map，就得到 `List(String)`——长度不变，只是形态变了。

      ```gleam
      import gleam/int
      import gleam/list

      list.map([1, 2, 3], int.to_string)
      // == ["1", "2", "3"]
      ```

      注意，U7 中学到的函数值可以直接传进去——`int.to_string` 不需要再用匿名函数包一层。
  map-to-string:
    prompt: '这个 `list.map` 的结果是？'
    choices:
      - '`["1", "2", "3"]`'
      - '`[1, 2, 3]`'
      - '`"123"`'
      - '`["123"]`'
    feedback:
      correct: '完全正确！每个 `Int` 都经 `int.to_string` 转换，得到 `List(String)` 类型的 `["1", "2", "3"]`。'
      choices:
        "1": '类型变了——变成了 `String`，而不是 `Int`。注意看选项有没有引号。'
        "2": 'map 不会把元素拼接起来——它返回的是每个元素分别转换后的**列表**。'
        "3": '元素不会合并成一个——3 个元素各自被转换，仍然是 3 个。'
  map-uppercase:
    prompt: '这个 `list.map` 直接传入了函数值。结果是？'
    choices:
      - '`["A", "B", "C"]`'
      - '`["a", "b", "c"]`'
      - '`"ABC"`'
      - '`["abc"]`'
    feedback:
      correct: '没错！对每个字符串应用 `string.uppercase`，得到 `["A", "B", "C"]`——不必用匿名函数包装，直接传入了函数值。'
      choices:
        "1": '转换被应用了——它们会变成大写，而不是保持小写。'
        "2": 'map 不会合并元素。它返回长度相同的列表。'
        "3": '3 个元素各自被转换，仍然是 3 个——不会合并成一个。'
  map-meaning:
    prompt: '用一句话描述 `list.map`，最准确的是？'
    choices:
      - '把每个元素一一转换，生成**同样长度**的新列表'
      - '只挑出符合条件的元素，生成**更短**的列表'
      - '把列表折叠成**单个值**'
      - '把列表元素的顺序反转'
    feedback:
      correct: '没错！map 的核心是“一一转换，长度不变”。它和过滤（filter）、折叠（fold）的作用不同。'
      choices:
        "1": '那是 `filter`。map 不会过滤元素，而是全部转换——长度保持不变。'
        "2": '那是 `fold`。map 的结果不是单个值，而是**列表**。'
        "3": '反转顺序是 `list.reverse`——map 会保持顺序。'
