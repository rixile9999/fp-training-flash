title: filter — 골라내기
tags:
  - concept:lists
blocks:
  - prose: intro
    markdown: |-
      map이 "모든 원소를 변환"이라면, `list.filter`는 "**조건에 맞는 원소만 남기기**"입니다.

      넘기는 함수는 원소 하나를 받아 `Bool`을 돌려주는 **술어(predicate)**입니다. `True`면 남기고, `False`면 버립니다. 원소 자체는 바뀌지 않고, **개수만 줄어들 수 있어요**.

      ```gleam
      import gleam/list

      list.filter([1, 2, 3, 4, 5], fn(x) { x > 2 })
      // == [3, 4, 5]
      ```
  - exercise: filter-gt2
    type: predict
    prompt: 이 `list.filter`의 결과는? (술어가 `True`인 원소만 남김)
    code: list.filter([1, 2, 3, 4, 5], fn(x) { x > 2 })
    choices:
      - "`[3, 4, 5]`"
      - "`[1, 2]`"
      - "`[True, True, True]`"
      - "`3`"
    answer: 0
    feedback:
      correct: 맞아요! `x > 2`가 참인 원소(3, 4, 5)만 남고 나머지는 버려집니다.
      choices:
        "1": 술어가 `True`인 원소를 **남깁니다** — `False`인 것을 남기는 게 아니에요. `x > 2`가 참인 건 3, 4, 5입니다.
        "2": filter는 술어의 결과(`Bool`)가 아니라 **원래 원소**를 남깁니다 — `[3, 4, 5]`.
        "3": filter는 값 하나가 아니라 걸러진 **리스트**를 돌려줍니다.
  - prose: predicate
    markdown: |-
      술어는 반드시 `Bool`을 돌려줘야 합니다. 짝수만 거르고 싶다면 `int.is_even`처럼 `Bool`을 주는 함수를 쓰거나, `fn(x) { x % 2 == 0 }`처럼 직접 비교식을 씁니다. (`%`는 나머지 연산자라 `x % 2 == 0`이면 짝수예요.)

      ```gleam
      import gleam/int
      import gleam/list

      list.filter([1, 2, 3, 4, 5], int.is_even)
      // == [2, 4]
      ```
  - exercise: filter-even
    type: predict
    prompt: 함수 값을 그대로 넘긴 `list.filter`입니다. 결과는?
    code: list.filter([1, 2, 3, 4, 5], int.is_even)
    choices:
      - "`[2, 4]`"
      - "`[1, 3, 5]`"
      - "`[2, 4, 6]`"
      - "`2`"
    answer: 0
    feedback:
      correct: 정확해요! `int.is_even`이 `True`인 원소, 즉 짝수 2와 4만 남습니다.
      choices:
        "1": "`is_even`이 참인 것(짝수)을 남깁니다 — 홀수가 아니라 `[2, 4]`예요."
        "2": 리스트에 없던 6이 생길 수는 없어요. filter는 원소를 추가하지 않습니다.
        "3": filter는 개수(값 하나)가 아니라 걸러진 **리스트**를 돌려줍니다.
  - exercise: filter-then-length
    type: predict
    prompt: filter 결과를 length로 센 값은?
    code: |-
      [1, 2, 3, 4, 5, 6]
      |> list.filter(fn(x) { x % 2 == 0 })
      |> list.length
    choices:
      - "`3`"
      - "`2`"
      - "`6`"
      - "`[2, 4, 6]`"
    answer: 0
    feedback:
      correct: 맞아요! 짝수는 2, 4, 6 — 세 개라 `list.length`가 `3`을 줍니다.
      choices:
        "1": 1~6 사이 짝수는 2, 4, 6으로 셋이에요 — 둘이 아닙니다.
        "2": 6은 원본 길이예요. filter가 짝수만 남긴 뒤 길이를 셉니다.
        "3": 마지막 `list.length`가 리스트를 **개수**로 바꿔요 — 리스트가 아니라 `3`입니다.
  - exercise: filter-vs-map
    type: choice
    prompt: map과 filter의 가장 큰 차이는?
    choices:
      - filter는 결과 길이가 줄 수 있고, map은 길이가 항상 같다
      - filter는 길이가 같고, map은 길이가 줄 수 있다
      - 둘 다 항상 값 하나를 돌려준다
      - 둘 다 술어(`Bool` 반환 함수)를 받는다
    answer: 0
    feedback:
      correct: 맞아요! filter는 거르므로 길이가 줄 수 있고(또는 같고), map은 1:1 변환이라 길이가 보존됩니다.
      choices:
        "1": 반대로 설명했어요 — 길이가 변할 수 있는 건 filter, 보존하는 건 map입니다.
        "2": 둘 다 **리스트**를 돌려줍니다. 값 하나로 접는 건 fold예요.
        "3": 술어(`Bool` 반환)를 받는 건 filter뿐이에요. map의 함수는 어떤 타입이든 돌려줄 수 있습니다.
