title: 选择工具——map、filter 还是 fold
blocks:
  intro:
    markdown: |-
      现在把三者放在一起，梳理一下**什么时候用哪个**。判断标准只有一个：**结果的形态**。

      - 每个元素被**一一转换**，长度不变 → `list.map`
      - **按条件挑选**，长度可能变短 → `list.filter`
      - 列表被**折叠成单个值（或其他形态）** → `list.fold`

      用管道运算符把三者串起来，就构成了一条小小的数据管道。

      ```gleam
      import gleam/list

      pub fn process(xs: List(Int)) -> Int {
        xs
        |> list.filter(fn(x) { x % 2 == 0 })
        |> list.map(fn(x) { x * x })
        |> list.fold(0, fn(acc, x) { acc + x })
      }
      // process([1, 2, 3, 4]) == 20
      ```
  pipeline-process:
    prompt: '在上面的 `process` 管道中，`process([1, 2, 3, 4])` 的值是多少？（只留偶数 → 平方 → 求和）'
    choices:
      - '`20`'
      - '`30`'
      - '`[4, 16]`'
      - '`6`'
    feedback:
      correct: '没错！偶数 [2, 4] → 平方 [4, 16] → 求和 20。filter、map、fold 依次改变数据的形态。'
      choices:
        "1": '30 是把 1 到 4 全部平方后相加的值（1+4+9+16）。要先**只保留偶数**。'
        "2": '最后的 fold 把列表折叠成单个值——`[4, 16]` 是 fold 之前的状态。'
        "3": '6 是原列表 [1,2,3,4] 中偶数的和（2+4）。中间还有一步**平方**。'
  by-return-type:
    markdown: |-
      卡住的时候，先想想**结果类型**。结果是 `List` 的话，就用 map 或 filter；结果是单个值（`Int`、`String`、`Bool`）的话，就应该以 fold 收尾。“统计个数”“找最大值”“求和”，都是把列表折叠成**单个值**——也就是 fold（或它的特化形式）。
  choose-count-evens:
    prompt: '“统计列表中偶数的**个数**”，最合适的做法是？'
    choices:
      - '先用 `filter` 只保留偶数，再用 `length` 计数（或用 fold 累计）'
      - '只用 `map` 就能完成'
      - '只用 `filter` 就能得到个数'
      - '不用任何工具，用 `<>` 拼接'
    feedback:
      correct: '没错！结果是单个 `Int`，所以最后必须折叠——可以先 filter 出偶数再用 length 计数，也可以直接用 fold 计数。'
      choices:
        "1": 'map 保持长度并返回**列表**。要得到个数这样的单个值，需要一个折叠的步骤。'
        "2": 'filter 返回的是过滤后的**列表**——要得到个数（`Int`），还需要再用 length 或 fold 处理一步。'
        "3": '`<>` 是字符串拼接——和计数毫无关系。'
  choose-uppercase:
    prompt: '这是用适合“把每个单词转成大写”的工具得到的结果。值是？'
    choices:
      - '`["HI", "BYE"]`'
      - '`"HIBYE"`'
      - '`["hi", "bye"]`'
      - '`2`'
    feedback:
      correct: '没错！每个元素一一转换且长度不变，所以答案是 map——结果是 `["HI", "BYE"]`。'
      choices:
        "1": 'map 不会合并元素——它返回每个元素分别转换后的**列表**。要合并，需要用 fold。'
        "2": '转换被应用了——它们会变成大写，而不是保持小写。'
        "3": '个数（单个值）是 fold/length 的结果。“转大写”是一一转换，所以用 map，得到的是**列表**。'
  choose-max:
    prompt: '用 fold 实现了“找出列表的**最大值**”。结果是？'
    choices:
      - '`9`'
      - '`[3, 7, 2, 9, 4]`'
      - '`25`'
      - '`3`'
    feedback:
      correct: '没错！找最大值就是把列表折叠成单个值，所以适合用 fold——累加器中不断保留更大的值，最终得到 `9`。'
      choices:
        "1": 'fold 把列表折叠成单个值——结果是最大值 `9`，不是列表。'
        "2": '25 是所有元素之和（3+7+2+9+4）。但回调是 `int.max`，它不做加法，只保留较大的一方，所以结果是最大值 `9`。'
        "3": '3 是第一个元素。fold 会遍历所有元素，留下最大的 9。'
