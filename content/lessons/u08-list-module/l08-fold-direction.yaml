title: fold 방향과 누산기
tags:
  - concept:lists
  - tricky:fold-arg-order
blocks:
  - prose: intro
    markdown: |-
      `list.fold`는 **왼쪽부터** 접습니다. 그리고 콜백은 `fn(acc, item)` — **누산기가 첫 번째**입니다. 이 두 사실이 합쳐지면 초보자가 가장 자주 미끄러지는 지점이 만들어져요.

      각 원소를 누산기 **앞에 붙이며**(prepend) 접으면 어떻게 될까요?

      ```gleam
      import gleam/list

      list.fold([1, 2, 3], [], fn(acc, x) { [x, ..acc] })
      // 1을 []앞에 → [1], 2를 앞에 → [2, 1], 3을 앞에 → [3, 2, 1]
      ```
  - exercise: fold-prepend
    type: predict
    prompt: 각 원소를 누산기 앞에 붙이는 fold입니다. 결과는?
    code: list.fold([1, 2, 3], [], fn(acc, x) { [x, ..acc] })
    choices:
      - "`[3, 2, 1]`"
      - "`[1, 2, 3]`"
      - "`[3]`"
      - "`6`"
    answer: 0
    feedback:
      correct: "맞아요! 왼쪽부터: 1이 먼저 깔리고 그 앞에 2, 3이 쌓여 `[3, 2, 1]`로 뒤집힙니다 — U6의 accumulate 패턴과 똑같은 현상이에요."
      choices:
        "1": fold는 왼쪽부터라 1이 가장 깊이 깔립니다. 순서를 보존하려면 `list.fold_right`나 fold 후 `list.reverse`가 필요해요.
        "2": 원소가 하나만 남지 않아요 — 셋 다 누산기에 쌓입니다.
        "3": 여기 콜백은 더하지 않고 리스트에 prepend해요 — 결과는 합 6이 아니라 리스트 `[3, 2, 1]`입니다.
  - prose: fold-right
    markdown: |-
      순서를 보존하고 싶다면 **오른쪽부터** 접는 `list.fold_right`를 씁니다. 콜백 모양은 똑같이 `fn(acc, item)`이지만, 원소를 **뒤에서부터** 누산기에 합칩니다.

      ```gleam
      import gleam/list

      list.fold_right([1, 2, 3], [], fn(acc, x) { [x, ..acc] })
      // 3을 []앞에 → [3], 2를 앞에 → [2, 3], 1을 앞에 → [1, 2, 3]
      ```

      즉 prepend로 쌓되 뒤에서부터 처리하니 원래 순서가 그대로 복원됩니다.
  - exercise: fold-right-prepend
    type: predict
    prompt: "같은 prepend 콜백을 `list.fold_right`로 쓰면? "
    code: list.fold_right([1, 2, 3], [], fn(acc, x) { [x, ..acc] })
    choices:
      - "`[1, 2, 3]`"
      - "`[3, 2, 1]`"
      - "`[3]`"
      - "`6`"
    answer: 0
    feedback:
      correct: 정확해요! 오른쪽부터 접으니 3이 먼저 깔리고 그 앞에 2, 1이 붙어 원래 순서 `[1, 2, 3]`이 복원됩니다.
      choices:
        "1": 그건 왼쪽부터 접는 `list.fold`의 결과예요. `fold_right`는 순서를 보존합니다.
        "2": 원소가 하나만 남지 않아요 — 셋 다 쌓입니다.
        "3": 이 콜백은 더하지 않고 prepend해요 — 결과는 리스트 `[1, 2, 3]`입니다.
  - prose: arg-order-trap
    markdown: |-
      더 미묘한 함정: 콜백 인자 순서를 **거꾸로** 써 버리는 것입니다. Gleam의 fold 콜백은 `fn(acc, item)`이지만, 다른 언어(예: Haskell의 `foldr`)에 익숙하면 무심코 `fn(item, acc)`로 씁니다.

      문자열을 누산기에 이어붙이는 fold를 봅시다 — `acc <> x`는 "지금까지 모은 것 뒤에 현재 원소"라는 뜻입니다. 왼쪽부터 접으니 순서가 그대로 보존돼요.

      ```gleam
      import gleam/list

      list.fold(["1", "2", "3"], "", fn(acc, x) { acc <> x })
      // == "123"
      ```
  - exercise: fold-string-concat
    type: predict
    prompt: 문자열을 이어붙이는 fold입니다. 콜백은 `acc <> x` (누산기 뒤에 원소). 결과는?
    code: list.fold(["1", "2", "3"], "", fn(acc, x) { acc <> x })
    choices:
      - '`"123"`'
      - '`"321"`'
      - '`""`'
      - "`6`"
    answer: 0
    feedback:
      correct: 맞아요! 왼쪽부터 `"" <> "1" <> "2" <> "3"` 순으로 이어붙여 `"123"`이 됩니다 — `acc`가 앞, 원소가 뒤라 순서가 보존돼요.
      choices:
        "1": '`"321"`은 콜백을 `x <> acc`로 거꾸로 썼을 때 나오는 결과예요. 여기선 `acc <> x`라 순서가 보존됩니다.'
        "2": '`""`는 초기값일 뿐, 원소들이 차례로 이어붙습니다.'
        "3": 여기 콜백은 더하지 않고 문자열을 `<>`로 이어붙여요 — 결과는 숫자가 아니라 `"123"`입니다.
  - exercise: fold-arg-order-mcq
    type: choice
    prompt: '`list.fold(["1", "2", "3"], "", f)`로 `"321"`을 만들려면 콜백 `f`를 어떻게 써야 할까요?'
    choices:
      - "`fn(acc, x) { x <> acc }` — 원소를 누산기 앞에 붙인다"
      - "`fn(acc, x) { acc <> x }` — 누산기 뒤에 원소"
      - '`fn(acc, x) { acc <> "-" <> x }` — 사이에 -를 끼운다'
      - "`list.fold_right`를 쓰면 자동으로 뒤집힌다"
    answer: 0
    feedback:
      correct: 맞아요! 콜백 인자 순서는 그대로 `fn(acc, x)`로 두고, 본문에서 `x <> acc`로 원소를 앞에 붙이면 왼쪽 fold가 `"321"`을 만듭니다.
      choices:
        "1": '`acc <> x`는 순서를 보존해 `"123"`을 만들어요 — 뒤집으려면 본문을 `x <> acc`로 바꿔야 합니다.'
        "2": 이건 원소 사이에 -를 넣어 `"-1-2-3"`을 만들어요 — `"321"`이 아닙니다.
        "3": '`fold_right`에 `acc <> x`를 쓰면 `"321"`이 되긴 하지만 "자동으로"가 아니에요 — 방향이 바뀌어 그런 거고, 같은 `list.fold`로도 본문만 바꿔 만들 수 있습니다.'
