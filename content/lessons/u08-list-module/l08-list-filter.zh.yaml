title: filter——挑选元素
blocks:
  intro:
    markdown: |-
      如果说 map 是“转换所有元素”，那么 `list.filter` 就是“**只保留符合条件的元素**”。

      传入的函数是一个**谓词（predicate）**：接收一个元素，返回 `Bool`。`True` 就保留，`False` 就丢弃。元素本身不会改变，**只是个数可能变少**。

      ```gleam
      import gleam/list

      list.filter([1, 2, 3, 4, 5], fn(x) { x > 2 })
      // == [3, 4, 5]
      ```
  filter-gt2:
    prompt: '这个 `list.filter` 的结果是？（只保留谓词为 `True` 的元素）'
    choices:
      - '`[3, 4, 5]`'
      - '`[1, 2]`'
      - '`[True, True, True]`'
      - '`3`'
    feedback:
      correct: '没错！只有使 `x > 2` 为真的元素（3、4、5）被保留，其余都被丢弃。'
      choices:
        "1": '谓词为 `True` 的元素会被**保留**——不是保留 `False` 的那些。使 `x > 2` 为真的是 3、4、5。'
        "2": 'filter 保留的是**原来的元素**，而不是谓词的结果（`Bool`）——`[3, 4, 5]`。'
        "3": 'filter 返回的是过滤后的**列表**，而不是单个值。'
  predicate:
    markdown: |-
      谓词必须返回 `Bool`。如果只想保留偶数，可以使用像 `int.is_even` 这样返回 `Bool` 的函数，或者直接写比较表达式，比如 `fn(x) { x % 2 == 0 }`。（`%` 是取余运算符，`x % 2 == 0` 就表示偶数。）

      ```gleam
      import gleam/int
      import gleam/list

      list.filter([1, 2, 3, 4, 5], int.is_even)
      // == [2, 4]
      ```
  filter-even:
    prompt: '这个 `list.filter` 直接传入了函数值。结果是？'
    choices:
      - '`[2, 4]`'
      - '`[1, 3, 5]`'
      - '`[2, 4, 6]`'
      - '`2`'
    feedback:
      correct: '完全正确！只保留 `int.is_even` 为 `True` 的元素，也就是偶数 2 和 4。'
      choices:
        "1": '保留的是 `is_even` 为真的元素（偶数）——是 `[2, 4]`，不是奇数。'
        "2": '列表里本来没有的 6 不可能出现。filter 不会添加元素。'
        "3": 'filter 返回的是过滤后的**列表**，而不是个数（单个值）。'
  filter-then-length:
    prompt: '用 length 统计 filter 的结果，得到的值是？'
    choices:
      - '`3`'
      - '`2`'
      - '`6`'
      - '`[2, 4, 6]`'
    feedback:
      correct: '没错！偶数是 2、4、6——共三个，所以 `list.length` 返回 `3`。'
      choices:
        "1": '1 到 6 之间的偶数是 2、4、6，共三个——不是两个。'
        "2": '6 是原列表的长度。filter 先只保留偶数，然后才统计长度。'
        "3": '最后的 `list.length` 把列表变成了**个数**——结果是 `3`，而不是列表。'
  filter-vs-map:
    prompt: 'map 和 filter 最大的区别是？'
    choices:
      - 'filter 的结果长度可能变短，而 map 的长度始终不变'
      - 'filter 的长度不变，而 map 的长度可能变短'
      - '两者都总是返回单个值'
      - '两者都接收谓词（返回 `Bool` 的函数）'
    feedback:
      correct: '没错！filter 会过滤元素，所以长度可能变短（或不变）；map 是一一转换，所以长度保持不变。'
      choices:
        "1": '说反了——长度可能改变的是 filter，保持长度不变的是 map。'
        "2": '两者都返回**列表**。折叠成单个值的是 fold。'
        "3": '只有 filter 接收谓词（返回 `Bool`）。map 的函数可以返回任意类型。'
