title: fold 的方向与累加器
blocks:
  intro:
    markdown: |-
      `list.fold` 是**从左边**开始折叠的。而且它的回调是 `fn(acc, item)`——**累加器排在第一个**。这两个事实结合在一起，就成了初学者最容易出错的地方。

      如果在折叠时把每个元素**加到累加器前面**（prepend），会发生什么？

      ```gleam
      import gleam/list

      list.fold([1, 2, 3], [], fn(acc, x) { [x, ..acc] })
      // 1 放到 [] 前面 → [1]，2 放到前面 → [2, 1]，3 放到前面 → [3, 2, 1]
      ```
  fold-prepend:
    prompt: '这个 fold 把每个元素加到累加器前面。结果是？'
    choices:
      - '`[3, 2, 1]`'
      - '`[1, 2, 3]`'
      - '`[3]`'
      - '`6`'
    feedback:
      correct: '没错！从左边开始：1 先垫在最底下，然后 2、3 依次叠在它前面，于是反转成 `[3, 2, 1]`——和 U6 中 accumulate 模式的现象完全一样。'
      choices:
        "1": 'fold 从左边开始，所以 1 被压在最底下。要保持顺序，需要用 `list.fold_right`，或者在 fold 之后再 `list.reverse`。'
        "2": '不会只剩一个元素——三个元素都会叠进累加器。'
        "3": '这里的回调不是相加，而是 prepend 到列表上——结果是列表 `[3, 2, 1]`，而不是总和 6。'
  fold-right:
    markdown: |-
      如果想保持顺序，就用**从右边**折叠的 `list.fold_right`。回调形式同样是 `fn(acc, item)`，但它**从后往前**把元素合并进累加器。

      ```gleam
      import gleam/list

      list.fold_right([1, 2, 3], [], fn(acc, x) { [x, ..acc] })
      // 3 放到 [] 前面 → [3]，2 放到前面 → [2, 3]，1 放到前面 → [1, 2, 3]
      ```

      也就是说，同样用 prepend 叠加，但从后往前处理，所以原来的顺序被完整还原。
  fold-right-prepend:
    prompt: '同样的 prepend 回调，换成 `list.fold_right` 会怎样？'
    choices:
      - '`[1, 2, 3]`'
      - '`[3, 2, 1]`'
      - '`[3]`'
      - '`6`'
    feedback:
      correct: '完全正确！从右边折叠，3 先垫在最底下，2、1 依次加到它前面，还原出原来的顺序 `[1, 2, 3]`。'
      choices:
        "1": '那是从左边折叠的 `list.fold` 的结果。`fold_right` 会保持顺序。'
        "2": '不会只剩一个元素——三个都会叠上去。'
        "3": '这个回调不是相加，而是 prepend——结果是列表 `[1, 2, 3]`。'
  arg-order-trap:
    markdown: |-
      还有一个更隐蔽的陷阱：把回调的参数顺序写**反**。Gleam 的 fold 回调是 `fn(acc, item)`，但如果你习惯了其他语言（比如 Haskell 的 `foldr`），可能会顺手写成 `fn(item, acc)`。

      来看一个把字符串拼接到累加器上的 fold——`acc <> x` 的意思是“在目前收集到的内容后面接上当前元素”。由于是从左边折叠，顺序会原样保持。

      ```gleam
      import gleam/list

      list.fold(["1", "2", "3"], "", fn(acc, x) { acc <> x })
      // == "123"
      ```
  fold-string-concat:
    prompt: '这是拼接字符串的 fold。回调是 `acc <> x`（元素接在累加器后面）。结果是？'
    choices:
      - '`"123"`'
      - '`"321"`'
      - '`""`'
      - '`6`'
    feedback:
      correct: '没错！从左边开始，按 `"" <> "1" <> "2" <> "3"` 的顺序拼接，得到 `"123"`——`acc` 在前、元素在后，所以顺序得以保持。'
      choices:
        "1": '`"321"` 是把回调反写成 `x <> acc` 时才会得到的结果。这里是 `acc <> x`，所以顺序保持不变。'
        "2": '`""` 只是初始值，元素会依次拼接上去。'
        "3": '这里的回调不是相加，而是用 `<>` 拼接字符串——结果是 `"123"`，不是数字。'
  fold-arg-order-mcq:
    prompt: '要用 `list.fold(["1", "2", "3"], "", f)` 得到 `"321"`，回调 `f` 应该怎么写？'
    choices:
      - '`fn(acc, x) { x <> acc }`——把元素接在累加器前面'
      - '`fn(acc, x) { acc <> x }`——元素接在累加器后面'
      - '`fn(acc, x) { acc <> "-" <> x }`——在中间插入 -'
      - '使用 `list.fold_right` 就会自动反转'
    feedback:
      correct: '没错！回调的参数顺序保持 `fn(acc, x)` 不变，在函数体中用 `x <> acc` 把元素接到前面，左折叠就能得到 `"321"`。'
      choices:
        "1": '`acc <> x` 会保持顺序，得到 `"123"`——要反转，得把函数体改成 `x <> acc`。'
        "2": '这会在元素之间插入 -，得到 `"-1-2-3"`——不是 `"321"`。'
        "3": '对 `fold_right` 使用 `acc <> x` 确实会得到 `"321"`，但这并不是“自动”的——是因为方向变了；而且用同一个 `list.fold`，只改函数体也能做到。'
