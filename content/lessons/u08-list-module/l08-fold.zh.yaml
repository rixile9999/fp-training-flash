title: fold——万能的折叠
blocks:
  intro:
    markdown: |-
      map 和 filter 接收列表、返回列表。可如果想把列表**折叠成单个值**呢？比如求和、求积、计数、拼接字符串。这就是 `list.fold`。

      `list.fold(列表, 初始值, fn(acc, item) { ... })`——从**初始累加器**（acc）开始，把元素逐个合并进累加器。你在 U6 中手写的 `sum_loop` 正是一个 fold。

      ```gleam
      import gleam/list

      list.fold([1, 2, 3, 4], 0, fn(acc, x) { acc + x })
      // == 10
      ```

      重要：回调的**第一个参数是累加器（acc）**，第二个是当前元素。
  fold-sum:
    prompt: '这个 `list.fold` 的结果是？'
    choices:
      - '`10`'
      - '`0`'
      - '`[1, 2, 3, 4]`'
      - '`4`'
    feedback:
      correct: '没错！从 0 开始，依次加上 1、2、3、4，得到 `10`。'
      choices:
        "1": '0 是**初始累加器**。元素会在它的基础上逐个加上去。'
        "2": 'fold 会把列表**折叠**成单个值——结果是 `10`，不是列表。'
        "3": '4 只是最后一个元素（或元素个数），结果是总和 `10`。'
  any-shape:
    markdown: |-
      fold 的初始值和累加器类型**可以与元素类型不同**。所以说 fold 是“万能”的——求积（初始值 1）、计数（初始值 0，回调中写 `acc + 1`）、拼接字符串（初始值 `""`），全都可以用 fold 表达。

      ```gleam
      import gleam/list

      // 求积：初始值 1
      list.fold([1, 2, 3, 4], 1, fn(acc, x) { acc * x })
      // == 24
      ```
  fold-product:
    prompt: '这是求积的 `list.fold`。结果是？'
    choices:
      - '`24`'
      - '`10`'
      - '`1`'
      - '`0`'
    feedback:
      correct: '完全正确！从初始值 1 开始累乘 1*1*2*3*4 = 24。'
      choices:
        "1": '10 是**加法** fold 的结果。这里用 `acc * x` 做乘法。'
        "2": '1 是初始累加器——把元素逐个乘上去会得到 24。'
        "3": '如果乘法的初始值设为 0，结果就全是 0 了，但这里从 1 开始——结果是 24。'
  fold-count:
    prompt: '这是统计元素个数的 fold。回调不使用元素的值，只做 `acc + 1`。结果是？'
    choices:
      - '`3`'
      - '`60`'
      - '`30`'
      - '`0`'
    feedback:
      correct: '没错！忽略元素的值，每次加 1，所以得到元素个数 `3`。'
      choices:
        "1": '60 是元素的**总和**。这个回调不累加元素的值，只做 `acc + 1`。'
        "2": '30 是最后一个元素。回调不使用元素的值——只负责计数。'
        "3": '0 是初始值——每个元素加 1，得到 3。'
  fold-callback-shape:
    prompt: '在 `list.fold(xs, init, f)` 中，回调 `f` 的正确参数顺序是？'
    choices:
      - '`fn(acc, item)`——累加器在前'
      - '`fn(item, acc)`——元素在前'
      - '`fn(acc)`——一个参数'
      - '`fn(item)`——一个参数'
    feedback:
      correct: '没错！Gleam 标准库中 fold 的回调是 `fn(acc, item)`——累加器排在第一个。下一课我们会看到，这个顺序为什么会成为陷阱。'
      choices:
        "1": '顺序反了。Gleam 把累加器作为**第一个**参数——这可能和其他语言不同。'
        "2": '回调必须**同时**接收累加器和元素——一共两个参数。'
        "3": '只接收元素的话，就无法继续累积——还要同时接收累加器。'
