title: Anatomy of a case Expression
blocks:
  intro:
    markdown: |-
      In Gleam, the heart of branching is `case`. Here is what it looks like:

      ```
      case value_to_check {
        pattern1 -> result1
        pattern2 -> result2
        _ -> remaining_result
      }
      ```

      The patterns are tried one at a time from top to bottom, and the result of the **first branch that matches** becomes the value of the whole `case`. A `case` is not a statement but an **expression**, so it leaves a single value in its place.
  case-basic-3:
    prompt: What is the value of this case expression?
    choices:
      - '"one"'
      - '"two"'
      - '"many"'
      - "3"
    feedback:
      correct: Correct! 3 is neither 1 nor 2, so it falls to the final `_` branch and becomes "many".
      choices:
        "0": 3 is not 1. A case finds the first matching branch starting from the top.
        "1": 3 is not 2 either. It misses both and drops into `_`.
        "3": A case returns the *result* of the matching branch, not the value 3 that was inspected — "many".
    code: |-
      case 3 {
        1 -> "one"
        2 -> "two"
        _ -> "many"
      }
  literal-patterns:
    markdown: |-
      In a pattern position you can write a literal directly (`1`, `"red"`, `True`, and so on). If the inspected value equals that literal, that branch is chosen.

      `_` (the underscore) is a wildcard that **matches any value**. It is usually placed at the bottom to catch "everything else".
  case-string-match:
    prompt: What is the value of `light("green")`?
    choices:
      - '"stop"'
      - '"go"'
      - '"caution"'
      - '"green"'
    feedback:
      correct: Correct! The "green" literal pattern matches, so the result is "go".
      choices:
        "0": '"stop" is the result of the "red" branch. The input is "green".'
        "2": '"green" is already caught by the second branch, so it never reaches `_`.'
        "3": A case returns the result of the matching branch — "go", not the input "green" itself.
    code: |-
      fn light(color: String) -> String {
        case color {
          "red" -> "stop"
          "green" -> "go"
          _ -> "caution"
        }
      }
  bind-name:
    markdown: If you write a **name** instead of `_` in a pattern position, the matched value is bound to that name. You can then use that value in the result expression. `_` means "take it but don't use it", whereas a name means "take it and use it".
  case-bind-var:
    prompt: What is the value of `describe(7)`?
    choices:
      - '"zero"'
      - '"got 0"'
      - '"got 7"'
      - '"other"'
    feedback:
      correct: Exactly! 7 is not 0, so it binds to `other`, and the result expression uses that value.
      choices:
        "0": '"zero" is the result when the input is 0. The input is 7.'
        "1": "`other` is bound to the input 7 — it holds 7, not 0."
        "3": "`other` is just a name holding the value; the literal text does not appear in the result."
