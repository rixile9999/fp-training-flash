title: 守卫、_ 与多选模式
blocks:
  guards:
    markdown: |-
      仅靠模式无法表达“90 分及以上”这样的条件。这时就要用**守卫（guard）**：在模式后面加上 `if 条件`，只有模式匹配、并且条件也为真时，才会选中这个分支。

      ```
      case score {
        s if s >= 90 -> "A"
        s if s >= 80 -> "B"
        _ -> "F"
      }
      ```

      分支按**从上到下**的顺序检查，第一个通过的分支胜出。
  grade-guard:
    prompt: "`grade(85)` 的值是什么？"
    choices:
      - '"A"'
      - '"B"'
      - '"F"'
      - "85"
    feedback:
      correct: 没错！85 小于 90，所以过不了第一个分支；它大于等于 80，于是停在 "B"。
      choices:
        "0": 守卫从上往下检查。`85 >= 90` 为假，所以落到下一个分支。
        "2": 要走到 "F"，两个守卫都必须不通过。而 85 大于等于 80。
        "3": case 返回的是分支的结果（"B"），而不是被检查的数字。
  alternates:
    markdown: 如果几个字面量应该得到同一个结果，可以像 `1 | 2 | 3 ->` 这样用**多选模式**（alternate pattern）把它们合并到一个分支里。把 `|` 读作“或”——三者中任意一个匹配，就选中这个分支。
  alternate-pattern:
    prompt: "`size(2)` 的值是什么？"
    code: |-
      fn size(n: Int) -> String {
        case n {
          1 | 2 | 3 -> "小"
          _ -> "大"
        }
      }
    choices:
      - '"小"'
      - '"大"'
      - "2"
      - '"1 | 2 | 3"'
    feedback:
      correct: 没错！2 是 `1 | 2 | 3` 中的一个，所以落入 "小" 分支。
      choices:
        "1": "\"大\" 是 1、2、3 都不匹配时的结果。而 2 包含在其中。"
        "2": case 返回的不是被检查的值，而是匹配分支的结果——"小"。
        "3": "`1 | 2 | 3` 是模式，不是输出的字符串。"
  order-trap:
    markdown: 分支的顺序**是有意义的**。`_` 能匹配所有值，所以如果把 `_` 放在最上面，它下面的分支就永远不会被执行到（死代码）。这种情况下 Gleam 编译器会给出“Unreachable pattern”警告——要养成连警告也认真看的习惯。
  reversed-guard-order:
    prompt: 这段代码把分支顺序倒了过来，把 `_ -> "F"` 放在了最上面。`grade(95)` 的值是什么？
    choices:
      - '"A"'
      - '"B"'
      - '"F"'
      - 编译错误
    feedback:
      correct: 没错！`_` 在最上面，所以包括 95 在内的所有值都在第一个分支得到 "F"。下面两个分支是死代码（会产生警告）。
      choices:
        "0": 95 确实大于等于 90，但在到达那个分支之前，`_` 已经先把所有值都接住了。
        "1": 也到不了 "B" 分支——`_` 在上面拿走了所有值。
        "3": 无法到达的分支只是*警告*，不是错误——可以编译，并且总是得到 "F"。
