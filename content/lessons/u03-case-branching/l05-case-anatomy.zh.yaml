title: 剖析 case 表达式
blocks:
  intro:
    markdown: |-
      在 Gleam 中，分支的核心是 `case`。它长这样：

      ```
      case 要检查的值 {
        模式1 -> 结果1
        模式2 -> 结果2
        _ -> 其余情况的结果
      }
      ```

      从上到下逐个尝试匹配模式，**第一个匹配成功的分支**的结果，就是整个 `case` 的值。`case` 不是语句，而是**表达式**，最终会在它所在的位置留下一个值。
  case-basic-3:
    prompt: 这个 case 表达式的值是什么？
    code: |-
      case 3 {
        1 -> "一"
        2 -> "二"
        _ -> "很多"
      }
    choices:
      - '"一"'
      - '"二"'
      - '"很多"'
      - "3"
    feedback:
      correct: 没错！3 既不是 1 也不是 2，所以落到最后的 `_` 分支，结果是 "很多"。
      choices:
        "0": 3 不是 1。case 会从上往下找第一个匹配的分支。
        "1": 3 也不是 2。两个都没匹配上，于是落到 `_`。
        "3": case 返回的不是被检查的值 3，而是匹配分支的*结果*——"很多"。
  literal-patterns:
    markdown: |-
      在模式的位置上可以直接写字面量（`1`、`"red"`、`True` 等）。被检查的值等于这个字面量时，就选中这个分支。

      `_`（下划线）是**能匹配任何值**的通配符。通常放在最下面，用来接住“其余所有情况”。
  case-string-match:
    prompt: "`light(\"green\")` 的值是什么？"
    code: |-
      fn light(color: String) -> String {
        case color {
          "red" -> "停"
          "green" -> "行"
          _ -> "注意"
        }
      }
    choices:
      - '"停"'
      - '"行"'
      - '"注意"'
      - '"green"'
    feedback:
      correct: 没错！字面量模式 "green" 匹配成功，结果是 "行"。
      choices:
        "0": "\"停\" 是 \"red\" 分支的结果。输入是 \"green\"。"
        "2": "\"green\" 在第二个分支就已经被匹配，不会一路走到 `_`。"
        "3": case 返回的是匹配分支的结果——是 "行"，而不是输入的 "green" 本身。
  bind-name:
    markdown: 在模式的位置上写一个**名字**而不是 `_`，匹配到的值就会绑定到这个名字上。这样就可以在结果表达式中使用这个值。区别在于：`_` 表示“接收但不使用”，名字表示“接收并使用”。
  case-bind-var:
    prompt: "`describe(7)` 的值是什么？"
    choices:
      - '"zero"'
      - '"got 0"'
      - '"got 7"'
      - '"other"'
    feedback:
      correct: 完全正确！7 不是 0，所以绑定到 `other`，结果表达式中使用的就是这个值。
      choices:
        "0": "\"zero\" 是输入为 0 时的结果。输入是 7。"
        "1": "`other` 绑定的是输入 7——里面是 7，不是 0。"
        "3": "`other` 只是承载值的名字，这几个字母不会出现在结果中。"
