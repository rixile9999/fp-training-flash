title: let assert——“这里一定匹配”
blocks:
  intro:
    markdown: |-
      `let` 的模式**必须覆盖所有情况**。所以 `let [first, ..] = xs` 会导致编译错误——它没有处理列表为空的可能。

      `let assert` 打破了这条规则，允许使用**部分模式**。作为交换，你要做出承诺：“如果此时不是这个形状，那就是我代码里的 bug。”形状匹配就取出值，不匹配就**立即崩溃**。
  let-assert-head:
    prompt: 列表不为空，所以模式能匹配。`first_or_crash([10, 20, 30])` 的值是多少？
    choices:
      - "`10`"
      - "`30`"
      - "`[10, 20, 30]`"
      - 运行时崩溃
    feedback:
      correct: 没错！在 `[first, ..]` 中，`first` 绑定到头部（第一个元素），也就是 10。
      choices:
        "1": "`first` 是**第一个**元素，不是最后一个——是 10。"
        "2": "`first` 只是第一个元素，不是整个列表。"
        "3": 列表不为空，所以模式能匹配——不会崩溃。
  let-assert-ok:
    prompt: "`let assert Ok(n)` 断言值是 `Ok`。`double_ok(Ok(21))` 的值是多少？"
    choices:
      - "`21`"
      - "`42`"
      - "`Ok(42)`"
      - 运行时崩溃
    feedback:
      correct: 完全正确！从 `Ok(21)` 中解出 `n` = 21，返回 21 * 2 = 42。
      choices:
        "0": 取出 `n` 之后还要计算 `n * 2`——结果是 42，不是 21。
        "2": "`let assert Ok(n)` 剥掉外壳，只取出 `n`。结果是 `Int` 类型的 42。"
        "3": 值是 `Ok`，所以断言成立——不会崩溃。
  fails-crash:
    markdown: |-
      那如果形状不匹配呢？像 `first_or_crash([])` 这样传入空列表时，它与 `[first, ..]` 不匹配，于是**立即崩溃**。平台会原样显示捕获到的异常消息（"Pattern match failed..."）。

      这就是 `let assert` 的取舍：你可以方便地取出值，代价是承诺一旦被打破，程序就会停止。
  empty-list-crash:
    prompt: 运行 `first_or_crash([])` 会发生什么？
    choices:
      - 返回 `0`
      - 返回 `Error(Nil)`
      - 因模式不匹配而在运行时崩溃
      - 产生编译错误
    feedback:
      correct: 没错！空列表与 `[first, ..]` 不匹配，断言被打破，程序立即崩溃。
      choices:
        "0": "`let assert` 不会生成默认值——匹配就取出，不匹配就停止。"
        "1": "`let assert` 不返回 `Result`。这里的失败是崩溃，而不是数据。"
        "3": 编译能通过——失败发生在运行时。
  when-justified:
    prompt: 以下哪种情况使用 `let assert` 是**合理**的？（外部输入的失败是数据，违反自己的不变式是 bug。）
    choices:
      - 把用户输入的字符串解析成数字
      - 取出刚在自己代码里构造的 3 元素列表的头部
      - 读取配置文件
      - 解析网络响应
    feedback:
      correct: 没错！你刚构造的 3 元素列表绝不会为空——如果为空，那是你代码里的 bug，而不是数据。
      choices:
        "0": 用户输入是随时可能出错的**数据**——应该用 `Result` 处理。
        "2": 配置文件可能不存在或已损坏，是外部的值——这是可以处理的失败。
        "3": 网络响应来自外部，失败属于正常情况——请用 `Result` 处理。
