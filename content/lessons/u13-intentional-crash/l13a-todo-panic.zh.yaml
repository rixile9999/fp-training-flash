title: todo 与 panic——“还没做”与“绝不该到”
blocks:
  intro:
    markdown: |-
      到目前为止，我们一直把失败当作**数据**来处理——`Option`、`Result`。但有时正确的答案是“根本不该走到这里”。这时用的工具就是 `todo` 和 `panic`。

      `todo` 表示“还没写好”。它能让编译通过，但如果**运行时走到了这里**，程序就会崩溃。`panic` 则是一个断言：“这里绝对不该被走到”。
  todo-fills:
    markdown: |-
      `todo` 的好处在于**让类型先对上，实现留到以后**。你可以先搭好函数骨架，用 `todo` 填充函数体，整个程序照样能编译。之后再把那里换成真正的代码就行。

      下面的 `area` 一开始是 `todo`，现在已经写好了函数体。我们来实际调用一下。
  area-filled:
    prompt: 我们调用了已写好函数体的 `area`。`area(4, 5)` 的值是多少？
    choices:
      - "`9`"
      - "`20`"
      - "`45`"
      - 运行时崩溃（todo）
    feedback:
      correct: 没错！`todo` 已经不在了，函数体是 `w * h`，所以输出 4 * 5 = 20。
      choices:
        "0": 这里是 `*` 而不是 `+`——是 4 * 5，不是 4 + 5。
        "2": 这是 `4` 和 `5` 相乘，而不是拼接在一起。结果是 20。
        "3": "`todo` 已经被换成真正的代码了，不会再走到那里。"
  panic-here:
    markdown: |-
      `panic` 不一样——它表示的不是“未完成”，而是“**不可能**”。在处理完 `case` 中所有有意义的分支之后，你可以在逻辑上绝不会出现的分支上放一个 `panic as "..."`；万一真的走到了，程序会带着这条消息立即停止。

      关键在于：**走不到就什么事也没有**。走正常路径时，它照常返回值。
  panic-not-reached:
    prompt: 只要 `b` 不是 0，就不会走到 `panic` 分支。`safe_div(20, 4)` 的值是多少？
    code: |-
      pub fn safe_div(a: Int, b: Int) -> Int {
        case b {
          0 -> panic as "不能除以 0"
          _ -> a / b
        }
      }

      pub fn main() {
        io.println(int.to_string(safe_div(20, 4)))
      }
    choices:
      - "`5`"
      - "`0`"
      - 运行时崩溃（panic）
      - "`24`"
    feedback:
      correct: 完全正确！4 不是 0，所以走 `_` 分支，计算 20 / 4 = 5。`panic` 没有被走到。
      choices:
        "1": 只有 `b` 为 0 时才会停止。这里是 4，所以正常做除法。
        "2": 走的是正常路径（`b` 不是 0），所以不会崩溃，返回 5。
        "3": "`/` 是除法——是 20 / 4 = 5，不是 20 + 4。"
  todo-vs-panic:
    prompt: 关于 `todo` 和 `panic` 的区别，哪种说法最准确？
    choices:
      - 两者都会产生编译错误
      - "`todo` 表示“还没实现”，`panic` 表示“这里绝不该被走到”"
      - "`todo` 不会崩溃，只有 `panic` 会崩溃"
      - "`panic` 不能附带消息"
    feedback:
      correct: 没错！`todo` = 未完成的标记，`panic` = 对“不可能”的断言。两者的意图不同。
      choices:
        "0": 两者都能通过编译——是在运行时走到那里才会崩溃。
        "2": "`todo` 在运行时走到那里同样会崩溃。区别在于意图。"
        "3": 两者都可以用 `as "消息"` 附上说明。
