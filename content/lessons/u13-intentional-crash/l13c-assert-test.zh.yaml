title: assert 与测试——崩溃才是正确选择的时刻
blocks:
  intro:
    markdown: |-
      `assert`（v1.11+）用来断言一个 **Bool 表达式**。为真时静默通过；为假时程序崩溃，并给出一条*连两边的值都列出来*的详细消息。

      告诉你一个秘密：你在这个平台上做的每道 `write` 题，背后的隐藏评测程序正是用这个 `assert` 写成的。
  assert-passes:
    prompt: 两个 `assert` 都为真，所以都能通过。执行到最后一行时会输出什么？
    choices:
      - "`6`"
      - "`0`"
      - 什么也不输出（崩溃）
      - "`True`"
    feedback:
      correct: 没错！两个断言都为真，顺利通过，最后一行输出 `total([1, 2, 3])` = 6。
      choices:
        "1": 最后一行输出的是 `total([1, 2, 3])`，不是 `total([])`——结果是 6。
        "2": 两个断言都为真，所以不会崩溃——程序会一直执行到最后。
        "3": 输出的是 `total(...)` 的值，而不是比较结果——是 6。
  assert-fails:
    markdown: 如果在 `assert total([]) == 0` 中 `total([])` 不是 0 呢？`assert` 会发现表达式为**假**，并带着“左边是这个值，右边是那个值”的消息崩溃。所以它非常适合用来写测试——能马上告诉你哪里错了。
  assert-on-false:
    prompt: "`assert` 的表达式求值为**假**时会怎样？"
    choices:
      - 返回 `False`
      - 带着包含两边值的消息崩溃
      - 直接继续执行下一行
      - 产生编译错误
    feedback:
      correct: 没错！为假时，它会带着包含左右两边值的详细消息立即崩溃。
      choices:
        "0": "`assert` 不返回值——它是表达式为假时让程序崩溃的工具。"
        "2": 只有为真时才会继续——为假就会停止。
        "3": 编译能通过——真假判断发生在运行时。
  tool-choice:
    prompt: 当函数收到的值是“可能失败的外部输入”时，正确的工具是什么？
    choices:
      - 用 `let assert` 强行取出
      - 用 `panic` 拦住
      - 用 `Result` 把失败当作数据处理
      - 留作 `todo`
    feedback:
      correct: 没错！来自外部的值出现失败属于正常范畴，是**数据**——应该用 `Result` 处理。这个区分就是本单元的全部要点。
      choices:
        "0": 对可以处理的失败使用 `let assert`，即使是正常的失败也会让程序崩溃。
        "1": "`panic` 用于“不可能发生的事”——外部输入失败是完全可能发生的。"
        "3": "`todo` 只是未完成的标记，不是处理失败的工具。"
